name: Desktop installers

# Builds the desktop app's installers on Linux, macOS and Windows and keeps them as workflow
# artifacts, with their sizes in the job summary: AppImage + deb, dmg (+ the zip macOS updates
# from), and on Windows both the NSIS .exe (GitHub releases, updates itself) and the Microsoft
# Store MSIX (the Store signs and updates it; the app never looks), with the update feeds
# (latest*.yml) and blockmaps the apps update from (DECISIONS §109). Unsigned: the signed and notarised macOS build is
# desktop-signed.yml, never run on a pull request (docs/RELEASING.md). It publishes nothing
# itself; publish-release.yml calls it on a release tag and attaches the files to the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 1.1.0-preview.3); empty uses the root package.json version'
        required: false
  workflow_call:
    inputs:
      ref:
        description: 'The ref to build (a release tag)'
        type: string
        required: true
      version:
        description: 'Version to stamp'
        type: string
        required: true
      targets:
        description: 'JSON list of {os, target} to build; empty builds all three'
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/icons/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets || '[{"os":"ubuntu-latest","target":"--linux"},{"os":"macos-latest","target":"--mac"},{"os":"windows-latest","target":"--win"}]') }}
    env:
      COREHUB_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corehub/desktop electron:install
      - run: pnpm build
      - name: Package
        run: pnpm --filter @corehub/desktop package ${{ matrix.target }}
      # The apps update from these feeds (DECISIONS §109): every file a feed names must be a
      # release file, under that very name. A release of an older tag builds none.
      - name: Check the update feed
        if: hashFiles('apps/desktop/src/main/auto-update.ts') != ''
        shell: bash
        run: |
          v="${COREHUB_VERSION:-$(node -p "require('./package.json').version")}"
          case "$RUNNER_OS" in Windows) p=windows ;; macOS) p=macos ;; *) p=linux ;; esac
          # A tag before the Intel Mac app (DECISIONS §152) builds the Apple Silicon one only.
          intel=''
          test -f apps/desktop/scripts/argon2-darwin-x64.mjs || intel='--without=macos-x64'
          cat apps/desktop/release/latest*.yml
          node apps/desktop/scripts/release-assets.mjs check-feeds "${v#v}" apps/desktop/release "$p" $intel
      # The name a person sees is "Core Hub" (1.1.1 shipped `corehub.app` in a `corehub
      # 1.1.1-arm64` DMG window, `corehub.exe`, `/opt/Core Hub/corehub`); the .deb package, the Linux
      # desktop entry and window class keep `corehub`. A release of an older tag
      # (publish-release.yml) still builds the old names, so these run from these changes on.
      - name: Check the app name (macOS)
        if: runner.os == 'macOS' && hashFiles('apps/desktop/src/shared/user-data.ts') != ''
        run: |
          v="${COREHUB_VERSION:-$(node -p "require('./package.json').version")}"; v="${v#v}"
          app=$(ls -d apps/desktop/release/mac*/*.app | head -1)
          echo "bundle: $app"
          test "$(basename "$app")" = "Core Hub.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = "Core Hub"
          dmg=$(ls apps/desktop/release/*.dmg | head -1)
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}')
          echo "DMG window: $mount"
          ls "$mount"
          status=0
          test "$mount" = "/Volumes/Core Hub $v" || status=1
          test -d "$mount/Core Hub.app" || status=1
          hdiutil detach "$mount" >/dev/null
          exit $status
      # Dictation (B11): macOS asks the person with these words, and a signed build records only
      # with the microphone entitlement (assets/entitlements.mac.plist).
      - name: Microphone words (macOS)
        if: runner.os == 'macOS' && hashFiles('apps/desktop/assets/entitlements.mac.plist') != ''
        run: |
          app=$(ls -d apps/desktop/release/mac*/*.app | head -1)
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/ar.lproj/InfoPlist.strings"
          grep -q NSMicrophoneUsageDescription "$app/Contents/Resources/ar.lproj/InfoPlist.strings"
      - name: Check the app name (Linux)
        if: runner.os == 'Linux' && hashFiles('apps/desktop/scripts/installer.nsh') != ''
        run: |
          deb=$(ls apps/desktop/release/*.deb | head -1)
          test "$(dpkg-deb -f "$deb" Package)" = corehub
          dir="$RUNNER_TEMP/deb"
          dpkg-deb -x "$deb" "$dir"
          entry="$dir/usr/share/applications/corehub.desktop"
          cat "$entry"
          grep -qx 'Name=Core Hub' "$entry"
          grep -qx 'Exec="/opt/Core Hub/core-hub" %U' "$entry"
          grep -qx 'StartupWMClass=corehub' "$entry"
          test -x "$dir/opt/Core Hub/core-hub"
          test ! -e "$dir/opt/Core Hub/corehub"
      # A machine with 1.1.1's .deb installed (the public release) takes this one: the old binary
      # and its /usr/bin link go, the new ones come, the menu entry is the same file.
      - name: Upgrade from 1.1.1 (Linux .deb)
        if: runner.os == 'Linux' && hashFiles('apps/desktop/scripts/installer.nsh') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old="$RUNNER_TEMP/old"
          gh release download v1.1.1 --repo "$GITHUB_REPOSITORY" --pattern 'corehub_1.1.1_amd64.deb' --dir "$old"
          sudo apt-get update -qq
          sudo apt-get install -y "$old/corehub_1.1.1_amd64.deb"
          test -x "/opt/Core Hub/corehub"
          ls -l /usr/bin/corehub
          sudo dpkg -i "$(ls "$PWD"/apps/desktop/release/*.deb | head -1)"
          ls -l /usr/bin/core-hub /usr/bin/corehub "/opt/Core Hub" 2>&1 | head -40 || true
          test -x "/opt/Core Hub/core-hub"
          test ! -e "/opt/Core Hub/corehub"
          test "$(readlink -f /usr/bin/core-hub)" = "/opt/Core Hub/core-hub"
          test ! -e /usr/bin/corehub && test ! -L /usr/bin/corehub
          grep -qx 'Exec="/opt/Core Hub/core-hub" %U' /usr/share/applications/corehub.desktop
          sudo dpkg -r corehub
          test ! -e "/opt/Core Hub/core-hub" && test ! -L /usr/bin/core-hub
      - name: Check the app name and upgrade from 1.1.1 (Windows)
        if: runner.os == 'Windows' && hashFiles('apps/desktop/scripts/installer.nsh') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'apps/desktop/release/win-unpacked/Core Hub.exe')) { throw 'win-unpacked has no Core Hub.exe' }
          if (Test-Path 'apps/desktop/release/win-unpacked/corehub.exe') { throw 'win-unpacked still has corehub.exe' }
          $v = if ($env:COREHUB_VERSION) { $env:COREHUB_VERSION } else { node -p "require('./package.json').version" }
          $v = $v -replace '^v', ''
          $exe = Get-ChildItem apps/desktop/release/Core-Hub-Setup-*.exe | Select-Object -First 1
          ./apps/desktop/scripts/nsis-upgrade-smoke.ps1 -Installer $exe.FullName -Version $v
      # On Linux the three smoke journeys also run against the packaged app, embedded hub and all.
      - name: Smoke test the packaged app
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          COREHUB_DESKTOP_SMOKE_EXECUTABLE="$PWD/apps/desktop/release/linux-unpacked/core-hub" \
            xvfb-run -a pnpm --filter @corehub/desktop test:smoke
      # The version every Windows check expects: the stamped one, else the root package.json's.
      # The MSIX steps need this change's packaging; a release of an older tag (v1.1.0, through
      # publish-release.yml) builds its .exe only.
      - name: Version
        if: runner.os == 'Windows' && hashFiles('apps/desktop/scripts/msix-smoke.ps1') != ''
        shell: bash
        run: |
          v="${COREHUB_VERSION:-$(node -p "require('./package.json').version")}"
          echo "PACKAGE_VERSION=${v#v}" | tee -a "$GITHUB_ENV"
      - name: The .exe build checks GitHub for updates
        if: runner.os == 'Windows' && env.PACKAGE_VERSION != ''
        shell: bash
        run: node apps/desktop/scripts/check-windows-package.mjs asar apps/desktop/release/win-unpacked/resources/app.asar github "$PACKAGE_VERSION"
      # The Microsoft Store package: a second packaging run stamped for the Store channel.
      - name: Package the Microsoft Store MSIX
        if: runner.os == 'Windows' && env.PACKAGE_VERSION != ''
        env:
          COREHUB_CHANNEL: store
        run: pnpm --filter @corehub/desktop package --win
      - name: Check the MSIX
        if: runner.os == 'Windows' && env.PACKAGE_VERSION != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem apps/desktop/release/*.msix | Select-Object -First 1
          if (-not $msix) { throw 'no .msix was made' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $dir = Join-Path $env:RUNNER_TEMP 'msix'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($msix.FullName, $dir)
          node apps/desktop/scripts/check-windows-package.mjs msix $dir $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The MSIX installed and started the way Windows runs a Store app: signed here with a
      # throwaway certificate for the same publisher (never kept; the artifact stays unsigned),
      # then local mode starts from a prepared desktop.json and must answer, with its data in a
      # writable folder. Findings: docs/RELEASING.md (Microsoft Store).
      - name: Run the MSIX in local mode
        if: runner.os == 'Windows' && env.PACKAGE_VERSION != ''
        shell: pwsh
        run: ./apps/desktop/scripts/msix-smoke.ps1 -Msix (Get-ChildItem apps/desktop/release/*.msix | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: corehub-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.msix
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/sizes.md
          retention-days: 14
          if-no-files-found: error
      # The Intel app alone, for the Intel Mac job below: a 146 MB download instead of the 570 MB
      # of every Mac file, which download-artifact@v4 once ended without extracting (2026-10-01).
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: corehub-desktop-macOS-x64
          path: apps/desktop/release/*-x64-mac.zip
          retention-days: 3
          if-no-files-found: error

  # The Intel Mac app (DECISIONS §152), built above on an Apple Silicon runner, on an Intel Mac:
  # the three smoke journeys against the packaged x64 app — remote mode, pairing, and local mode,
  # whose embedded hub loads the argon2 compiled for x86_64.
  intel-mac:
    name: Intel Mac (x64 app smoke)
    needs: installers
    if: contains(inputs.targets || '--mac', '--mac')
    runs-on: macos-15-intel
    timeout-minutes: 40
    # `actions: read` lets the GitHub CLI fetch this run's artifact again if the action did not.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # With its scripts: argon2 has no darwin-x64 binary and builds from source here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corehub/contracts build && pnpm --filter @corehub/ui-tokens build && pnpm --filter @corehub/web build
      # The x64 zip, and proof it arrived: on 2026-10-01 download-artifact@v4 (a Node 20 action the
      # runner forces onto Node 24) ended its step after "Starting download", green, with nothing
      # extracted. So the download is checked, and fetched again with the GitHub CLI if missing.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: corehub-desktop-macOS-x64
          path: ${{ runner.temp }}/mac
      - name: The x64 zip is there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ls "$RUNNER_TEMP"/mac/Core-Hub-*-x64-mac.zip > /dev/null 2>&1; then break; fi
            echo "::warning::the x64 zip did not arrive (attempt $attempt); fetching it again"
            rm -rf "$RUNNER_TEMP/mac"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n corehub-desktop-macOS-x64 -D "$RUNNER_TEMP/mac" || sleep 10
          done
          ls -l "$RUNNER_TEMP"/mac/Core-Hub-*-x64-mac.zip
      - name: Unpack the x64 app
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          zip=$(ls "$RUNNER_TEMP"/mac/Core-Hub-*-x64-mac.zip | head -1)
          echo "x64 zip: $(du -h "$zip" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          ditto -x -k "$zip" "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/Core Hub.app"
          file "$app/Contents/MacOS/Core Hub" | tee /dev/stderr | grep -q x86_64
          lipo -archs "$app/Contents/Resources/hub/node_modules/argon2/prebuilds/darwin-x64/argon2.node" | grep -q x86_64
          xattr -cr "$app"
          echo "COREHUB_DESKTOP_SMOKE_EXECUTABLE=$app/Contents/MacOS/Core Hub" >> "$GITHUB_ENV"
      - name: Smoke test the x64 app
        run: pnpm --filter @corehub/desktop test:smoke
