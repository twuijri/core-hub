name: iOS signed build

# A signed App Store archive and .ipa of the iOS app and its share extension (docs/RELEASING.md).
# The Apple Distribution certificate goes into a temporary keychain; the App Store provisioning
# profiles come through the App Store Connect API key, which xcodebuild also uses
# (-allowProvisioningUpdates). Never on a pull request: only when the owner runs it by hand or
# pushes a release tag. TestFlight only when a manual run asks for it; the .ipa becomes a
# workflow artifact only on a tag or when asked (the repository is public).
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload the build to TestFlight'
        type: boolean
        default: false
      keep_artifacts:
        description: 'Keep the signed .ipa as a workflow artifact (anyone can download it)'
        type: boolean
        default: false
      version:
        description: 'Marketing version (e.g. 0.1.0); empty keeps the one in project.yml'
        required: false
  push:
    tags: ['v*']

concurrency:
  group: ios-signed-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TEAM_ID: 58QWJ228ZE
  APP_ID: com.twuijri.corehub
  SHARE_ID: com.twuijri.corehub.share

jobs:
  signed:
    name: Signed archive and export
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Refuse tags that are not on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo '::error::Release tags must point at a commit on main.'
            exit 1
          fi
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile --filter @corehub/contracts
      - name: Generate the Swift client from the contract
        run: pnpm --filter @corehub/contracts generate:native
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Generate the Xcode project from project.yml
        working-directory: apps/ios
        run: xcodegen generate

      # Secrets become files in the runner's temp folder and never reach the log.
      - name: Import the distribution certificate into a temporary keychain
        env:
          IOS_CSC_LINK: ${{ secrets.IOS_CSC_LINK }}
          IOS_CSC_KEY_PASSWORD: ${{ secrets.IOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$IOS_CSC_LINK" || { echo '::error::IOS_CSC_LINK is not set'; exit 1; }
          umask 077
          keychain="$RUNNER_TEMP/corehub-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          printf %s "$IOS_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/corehub-dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/corehub-dist.p12" -k "$keychain" -f pkcs12 \
            -P "$IOS_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcrun
          rm -f "$RUNNER_TEMP/corehub-dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The identity's SHA-1 and name are public (they are in every app it signs).
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m1 -E '"(Apple|iPhone) Distribution' || true)
          test -n "$identity" || { echo '::error::IOS_CSC_LINK holds no Apple Distribution identity'; exit 1; }
          echo "$identity"
          echo "CERT_SHA1=$(echo "$identity" | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$ASC_API_KEY_ID" && test -n "$ASC_API_KEY_P8" || { echo '::error::ASC_API_KEY_ID / ASC_API_KEY_P8 are not set'; exit 1; }
          umask 077
          dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_$ASC_API_KEY_ID.p8"
          # The .p8 as downloaded, or the same base64-encoded.
          if [[ "$ASC_API_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$key"
          else
            printf %s "$ASC_API_KEY_P8" | base64 --decode > "$key"
          fi
          echo "ASC_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$dir" >> "$GITHUB_ENV"
      - name: App Store provisioning profiles (App Store Connect API)
        id: profiles
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          node apps/ios/scripts/asc-profiles.mjs "$CERT_SHA1" "$APP_ID" "$SHARE_ID" > "$RUNNER_TEMP/profiles.txt"
          cat "$RUNNER_TEMP/profiles.txt"
          echo "app=$(grep "^$APP_ID=" "$RUNNER_TEMP/profiles.txt" | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "share=$(grep "^$SHARE_ID=" "$RUNNER_TEMP/profiles.txt" | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - name: Archive
        working-directory: apps/ios
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          MARKETING: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project CoreHub.xcodeproj \
            -scheme CoreHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CoreHub.xcarchive" \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            COREHUB_APP_PROFILE='${{ steps.profiles.outputs.app }}' \
            COREHUB_SHARE_PROFILE='${{ steps.profiles.outputs.share }}' \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            ${MARKETING:+MARKETING_VERSION="$MARKETING"} \
            > build/archive.log 2>&1 || status=$?
          grep -E "error:|warning: .*(sign|profile|entitlement)|\*\* ARCHIVE " build/archive.log | sort -u | head -100 || true
          exit "${status:-0}"
      - name: Export the App Store .ipa
        working-directory: apps/ios
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_ID</key><string>${{ steps.profiles.outputs.app }}</string>
              <key>$SHARE_ID</key><string>${{ steps.profiles.outputs.share }}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CoreHub.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            > build/export.log 2>&1 || status=$?
          grep -E "error:|\*\* EXPORT " build/export.log | sort -u | head -50 || true
          test -z "${status:-}" || exit "$status"
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          echo "IPA=$ipa" >> "$GITHUB_ENV"
      - name: Check the bundle ids, the entitlements and the signature
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ipa-check"
          rm -rf "$work" && mkdir -p "$work" && unzip -q "$IPA" -d "$work"
          app="$work/Payload/CoreHub.app"
          share="$app/PlugIns/CoreHubShare.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "$APP_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$share/Info.plist")" = "$SHARE_ID"
          echo "Version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"))"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Authority)='
          for bundle in "$app" "$share"; do
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | plutil -p - | grep -E 'application-identifier|application-groups|group\.|team-identifier|aps-environment' || true
          done
          # Push (apps/ios/CoreHub/Phone/Push.swift): an App Store build must carry APNs production.
          aps=$(codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -extract aps-environment raw -o - - || true)
          test "$aps" = production || { echo "::error::aps-environment is '${aps}', expected production"; exit 1; }
          echo "Signed .ipa: $(du -h "$IPA" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.keep_artifacts
        with:
          name: corehub-ios-signed
          path: ${{ env.IPA }}
          retention-days: 14
          if-no-files-found: error
      # The logs stay in the job's log, where GitHub masks the secrets; they are never uploaded.
      - name: Tail of the xcodebuild logs
        if: failure()
        run: tail -n 80 apps/ios/build/archive.log apps/ios/build/export.log 2>/dev/null || true
      - name: Remove the keychain, the key and the profiles
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/corehub-dist.p12" "$RUNNER_TEMP/ipa-check" \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
