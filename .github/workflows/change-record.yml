name: Change record

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  record:
    name: PR adds or updates a change record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate docs/changes for this PR (TEAM-RULES §2)
        run: node scripts/check-change-record.mjs --base origin/${{ github.base_ref }}
