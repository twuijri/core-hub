name: Code map

# After every merge into main, rebuild the Graphify map of the code and, when main's committed
# map no longer matches main's code, propose the new one as a single small PR, "Update the code
# map", from the branch bot/code-map. PRs themselves never carry graphify-out/, so merging one
# PR no longer makes every other open PR conflict in the map (docs/harness/knowledge-graph.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest main matters: a later merge cancels the run for an earlier one.
concurrency:
  group: code-map
  cancel-in-progress: true

permissions:
  contents: write # push bot/code-map
  pull-requests: write # open, update or close the bot PR
  actions: write # start ci.yml and change-record.yml on bot/code-map

env:
  BOT_BRANCH: bot/code-map
  GH_REPO: ${{ github.repository }}

jobs:
  update:
    name: Rebuild the code map and propose it
    if: github.repository == 'twuijri/core-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Graphify, at the version the map is built with (docs/harness/knowledge-graph.md)
        run: pip install graphifyy==0.9.66
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `pnpm graph` and `pnpm graph:check` without installing the workspace: the scripts need
      # Node alone. graph:check compares nodes and edges with the map committed in main, leaving
      # out the commit it was built on and the communities, so a merge that changes no code
      # proposes nothing.
      - run: node scripts/graph.mjs
      - name: Does main's committed map still match main's code?
        id: map
        run: |
          if node scripts/graph-check.mjs; then
            echo 'stale=false' >> "$GITHUB_OUTPUT"
          else
            echo 'stale=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the new map on bot/code-map, on top of this main commit
        if: steps.map.outputs.stale == 'true'
        run: |
          git switch --force-create "$BOT_BRANCH"
          git add -- graphify-out
          git -c user.name=twuijri -c user.email=twuijri@gmail.com \
            commit --message 'chore(graph): update code map'
          git push --force origin "HEAD:refs/heads/$BOT_BRANCH"

      # A push or a PR made with GITHUB_TOKEN starts no `pull_request` or `push` workflow, so the
      # required checks would never report on the bot's commit. A workflow_dispatch is allowed:
      # these runs attach check runs with the required names to the head of bot/code-map.
      - name: Run the required checks on bot/code-map
        if: steps.map.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "$BOT_BRANCH"
          gh workflow run change-record.yml --ref "$BOT_BRANCH"

      - name: Open or update the PR "Update the code map"
        if: steps.map.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          body="$RUNNER_TEMP/code-map-pr.md"
          cat > "$body" <<'EOF'
          Generated by the **Code map** workflow (`.github/workflows/code-map.yml`) after a merge into `main`.

          This PR only refreshes `graphify-out/`, the Graphify map of the code, so that it matches `main`. It changes no code and needs no change record.

          - **Safe to merge** once its checks are green. The workflow starts those checks itself on `bot/code-map`, because GitHub does not start `pull_request` checks for a PR opened by a workflow.
          - **No hurry.** Every newer merge into `main` rebuilds the map and force-updates this same PR; if `main`'s map becomes current again, the workflow closes it.
          - Do not push to `bot/code-map` by hand: the next run replaces it.

          Details: `docs/harness/knowledge-graph.md`.
          EOF
          printf '\nBuilt on `main` at %s.\n' "$MAIN_SHA" >> "$body"

          pr=$(gh pr list --head "$BOT_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$body"
            echo "Updated PR #$pr"
          elif ! gh pr create --base main --head "$BOT_BRANCH" --title 'Update the code map' --body-file "$body"; then
            echo "::error::Could not open the PR. If GitHub Actions may not create pull requests here, the owner allows it once: Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests'. The new map is on $BOT_BRANCH meanwhile."
            exit 1
          fi

      - name: Close the PR when main's map is current
        if: steps.map.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$BOT_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment "The code map committed in main is current; nothing left to merge."
          else
            echo 'The code map in main is current and no code-map PR is open.'
          fi
