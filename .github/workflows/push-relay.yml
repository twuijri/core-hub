name: Push relay

# The Core Hub push relay (packages/push-relay, ADR 0024): its tests on every change to it, and
# a deploy that runs only when the owner starts it by hand (Actions → Push relay → Run workflow).
# The deploy needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; the
# token needs Workers Scripts: Edit and D1: Edit on the account, and Workers Routes: Edit on the
# zone of a custom domain if one is used. The APNs/FCM keys are NOT here: they are Worker
# secrets the owner sets once with `wrangler secret put` (packages/push-relay/README.md).

on:
  pull_request:
    paths:
      - 'packages/push-relay/**'
      - '.github/workflows/push-relay.yml'
  push:
    branches: [main]
    paths:
      - 'packages/push-relay/**'
      - '.github/workflows/push-relay.yml'
  workflow_dispatch:
    inputs:
      custom_domain:
        description: 'Custom domain for the relay (a hostname on a zone the token covers). Empty: the repository variable PUSH_RELAY_DOMAIN, else workers.dev only.'
        required: false
        default: ''

concurrency:
  group: push-relay-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Push relay tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corehub/push-relay typecheck
      - run: pnpm --filter @corehub/push-relay test

  deploy:
    name: Deploy the relay to Cloudflare
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: ${{ inputs.custom_domain || vars.PUSH_RELAY_DOMAIN }}
      WRANGLER: npx --yes wrangler@4
    defaults:
      run:
        working-directory: packages/push-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: The secrets are there
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is not set'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is not set'; exit 1; }
      - name: The D1 database (made on the first deploy)
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "corehub-push-relay") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create corehub-push-relay
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "corehub-push-relay") | .uuid')
          fi
          test -n "$id" || { echo '::error::could not find or create the D1 database'; exit 1; }
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$id/" wrangler.toml
      - name: The custom domain, if one is given
        if: env.DOMAIN != ''
        run: |
          [[ "$DOMAIN" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]] || { echo '::error::the domain is not a hostname'; exit 1; }
          # The custom domain only: no second, workers.dev address to guard.
          sed -i 's/^workers_dev = true$/workers_dev = false/' wrangler.toml
          printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$DOMAIN" >> wrangler.toml
      - name: Apply the relay's migrations
        run: $WRANGLER d1 migrations apply corehub-push-relay --remote
      - name: Deploy
        run: $WRANGLER deploy
      - name: Health
        if: env.DOMAIN != ''
        run: |
          sleep 10
          curl -fsS "https://$DOMAIN/v1/health" || echo '::warning::the custom domain did not answer yet (DNS and its certificate can take a few minutes)'
