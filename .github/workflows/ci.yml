name: CI

on:
  push:
    branches: [main, test]
  pull_request:
  # The code-map bot (code-map.yml) starts this on `bot/code-map`: GitHub does not start
  # `pull_request` runs for a PR opened or pushed with GITHUB_TOKEN, and the bot PR needs these
  # checks on its commit to be mergeable (docs/harness/knowledge-graph.md).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REDOCLY_TELEMETRY: 'off'

jobs:
  # "Lint, typecheck, contracts, tests, build" is a required check on main. It is the `gate`
  # job at the end: it passes only when this job and every server test shard passed. The
  # server's unit suite runs in shards of its own because, run inside this job, it alone
  # outgrew the job's time limit (docs/changes/2026-09-25-twuijri-integration.md).
  checks:
    name: Lint, typecheck, contracts, client tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Java for the Kotlin/Swift generators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: One version everywhere (root package.json; docs/RELEASING.md)
        run: pnpm version:check
      - run: pnpm i18n:check
      - run: pnpm nav:check
      - name: Script tests (apps/ios/scripts and scripts/, against fake APIs)
        run: pnpm scripts:test
      - run: pnpm contracts:lint
      - run: pnpm contracts:generate
      - name: Contract generation leaves no uncommitted diff
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            echo '::error::pnpm contracts:generate changed tracked files; commit the result.'
            git diff --cached --stat
            exit 1
          fi
      - run: pnpm contracts:check-clients
      # ADR 0027: nothing people already run may break. Both guards compare with the latest
      # release tag `v*`, which the shallow checkout does not have.
      - name: Release tags for the compatibility guards
        run: git fetch --no-tags --depth=1 origin 'refs/tags/v*:refs/tags/v*'
      - name: No breaking contract change against the latest release (ADR 0027)
        run: pnpm contracts:compat
      - name: No destructive or edited migration against the latest release (ADR 0027)
        run: pnpm migrations:guard
      - run: pnpm typecheck
      - name: Tests of every package but the server (its unit suite runs in `server-tests`)
        run: pnpm -r --workspace-concurrency=1 --if-present --filter '!@corehub/server' test
      - run: pnpm contract:test
      - run: pnpm build
      - name: The built web client is in place for the hub to serve
        run: test -f packages/web/dist/index.html
      - name: The reference client starts from its build output
        run: |
          node packages/cli/dist/bin.js --version
          node packages/cli/dist/bin.js --help >/dev/null
          node packages/cli/dist/bin.js --lang ar help chat >/dev/null
          if node packages/cli/dist/bin.js whoami; then echo '::error::whoami must exit 3 when not signed in'; exit 1; fi

  server-tests:
    name: Server unit tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What `pnpm --filter @corehub/server test` runs, one third of the files per job.
      - run: pnpm --filter @corehub/contracts build
      - run: pnpm --filter @corehub/server exec vitest run --project unit --shard=${{ matrix.shard }}/3

  # ADR 0028: every translation against the room its label has, measured with the Noto fonts of
  # its script (HarfBuzz). The fonts are installed here only: the image and installers carry none.
  i18n-space:
    name: Translations fit their labels (measured widths)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Noto fonts for Latin, Arabic, Hebrew, Thai, Devanagari and CJK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
      - run: pnpm i18n:limits

  # Every real-Hermes suite (`*.real.test.ts`) against the two Hermes releases the hub is proven
  # with (DECISIONS §119, §132; `packages/server/src/modules/agents/catalog/hermes-versions.ts`):
  # the floor, the oldest a person's own Hermes may be, and the release the image pins. Each builds
  # the image at that Hermes (`HERMES_REF`) exactly as a release does, and runs the suites against
  # it — MCP OAuth with a real OAuth 2.1 + MCP server that sends `iss` (the ClickUp report of
  # 2026-09-28, §122) among them. The two suites that run Hermes's CLI from source (kanban, the
  # cron grammar) get a checkout and a venv of the same tag. Required through `gate`.
  hermes-real:
    name: Real Hermes suites (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [floor, pinned]
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The Hermes release of this target
        id: hermes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          node scripts/hermes-watch.mjs current --output "$RUNNER_TEMP/pins"
          if [ "$TARGET" = floor ]; then
            ref=$(sed -n 's/^floor_ref=//p' "$RUNNER_TEMP/pins")
          else
            ref=$(sed -n 's/^tested_ref=//p' "$RUNNER_TEMP/pins")
          fi
          echo "ref=$ref" | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: The image with that Hermes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          build-args: |
            HERMES_REF=${{ steps.hermes.outputs.ref }}
          push: false
          load: true
          tags: core-hub:hermes-${{ matrix.target }}
          cache-from: type=gha,scope=hermes-real-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=hermes-real-${{ matrix.target }}
      - name: Hermes's source and a venv of the same tag (kanban and cron grammar suites)
        env:
          REF: ${{ steps.hermes.outputs.ref }}
        run: |
          set -eu
          uv_version=$(sed -n 's/^ARG UV_VERSION=//p' packages/server/Dockerfile)
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/${uv_version}/uv-installer.sh" | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.12
          uv venv --python 3.12 "$RUNNER_TEMP/hermes/.venv"
          git clone --depth 1 --branch "$REF" https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes/src"
          cd "$RUNNER_TEMP/hermes/src"
          uv pip install --python "$RUNNER_TEMP/hermes/.venv/bin/python" -e ".[cron,mcp]" "aiohttp==3.14.3"
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "core-hub:hermes-${{ matrix.target }}" --version
      - run: pnpm --filter @corehub/contracts build
      - name: Every *.real.test.ts against the image
        env:
          COREHUB_HERMES_IMAGE: core-hub:hermes-${{ matrix.target }}
          HERMES_SRC: ${{ runner.temp }}/hermes/src
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/hermes/.venv/bin:$PATH"
          cd packages/server
          files=$(find src tests -name '*.real.test.ts' | sort)
          pnpm exec vitest run --project unit --maxWorkers=2 $files

  # The model gateway (ADR 0029) with the real pieces: CLIProxyAPI's pinned release (SHA-256
  # checked), the hub's gateway, and the real ACP bridges of Claude Code and Codex from npm, against
  # a local provider that speaks only OpenAI Chat Completions — Claude Code's tool call round-trips
  # through the Anthropic → Chat translation, Codex answers through the Responses path, and no key
  # reaches an agent. No provider account, no secret. Required through `gate`.
  model-gateway-real:
    name: Model gateway with the real CLIProxyAPI, Claude Code and Codex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CLIProxyAPI (pinned, SHA-256 checked)
        run: pnpm cliproxy:fetch
      - run: pnpm --filter @corehub/contracts build
      - name: The real gateway suite
        env:
          COREHUB_REAL_GATEWAY: '1'
          COREHUB_REAL_ACP_DATA: ${{ runner.temp }}/acp-data
        run: pnpm --filter @corehub/server exec vitest run --project unit --maxWorkers=1 src/modules/agents/model-gateway.real.test.ts

  gate:
    name: Lint, typecheck, contracts, tests, build
    needs: [checks, server-tests, i18n-space, hermes-real, model-gateway-real]
    # Always runs, so a failed or cancelled job above fails this required check instead of
    # skipping it (a skipped required check would count as passed).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check, every server test shard, both real-Hermes targets and the real gateway passed
        env:
          CHECKS: ${{ needs.checks.result }}
          SERVER_TESTS: ${{ needs.server-tests.result }}
          I18N_SPACE: ${{ needs.i18n-space.result }}
          HERMES_REAL: ${{ needs.hermes-real.result }}
          GATEWAY_REAL: ${{ needs.model-gateway-real.result }}
        run: |
          echo "checks: $CHECKS, server-tests: $SERVER_TESTS, i18n-space: $I18N_SPACE, hermes-real: $HERMES_REAL, model-gateway-real: $GATEWAY_REAL"
          test "$CHECKS" = success && test "$SERVER_TESTS" = success && test "$I18N_SPACE" = success && test "$HERMES_REAL" = success && test "$GATEWAY_REAL" = success

  web-e2e:
    name: Web smoke journeys (Playwright against the real hub)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corehub/web exec playwright install --with-deps chromium
      # The fonts the UI's stacks name (Noto Sans, Arabic, Thai, CJK — ADR 0028), so the
      # pseudo-locale journeys see what a Linux desktop shows rather than the runner's fallbacks.
      - name: Noto fonts
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
      - run: pnpm build
      - run: pnpm --filter @corehub/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 7
      # ADR 0028: every main screen in each pseudo-locale, at desktop and phone width, pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pseudo-locale-screens
          path: packages/web/test-results/*pseudo-l*/*.png
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: Desktop app smoke (Electron under Xvfb against the real hub)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Xvfb for a headless display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      # pnpm-workspace.yaml keeps electron's ~100 MB download out of every other install.
      - run: pnpm --filter @corehub/desktop electron:install
      - run: pnpm build
      - run: xvfb-run -a pnpm --filter @corehub/desktop test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: apps/desktop/test-results
          retention-days: 7

  map-untouched:
    name: PR leaves graphify-out/ to the code-map bot
    # Only a pull request has a base to compare with; a push or a dispatched run skips it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: graphify-out/ is refreshed after merge, not in PRs (docs/harness/knowledge-graph.md)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" = bot/code-map ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo 'The code-map bot PR: updating graphify-out/ is its whole purpose.'
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- graphify-out/)
          if [ -n "$changed" ]; then
            echo '::error::This PR changes graphify-out/. The code map is refreshed by the code-map bot after each merge into main (PR "Update the code map"); PRs must not carry it.'
            echo "$changed"
            echo 'Put back main'"'"'s copy:  git fetch origin main && git restore --source=origin/main --staged --worktree -- graphify-out && git commit -m "chore: leave the code map to the bot"'
            exit 1
          fi
          echo 'graphify-out/ is untouched.'

  migrations:
    name: db:generate + db:migrate (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Migration is generated from the schema
        run: pnpm db:generate
      - name: Migrate a fresh SQLite database
        run: pnpm db:migrate
        env:
          DATA_DIR: ${{ runner.temp }}/hub-data
      - name: Migrate a fresh PostgreSQL database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://hub:hub@localhost:5432/hub

  docker:
    name: Docker image builds and answers /health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: false
          load: true
          tags: core-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name hub -p 8080:8080 -e HUB_ADMIN_PASSWORD=ci-only-password core-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              echo
              curl -fsS -H 'Accept: text/html' http://127.0.0.1:8080/chat | grep -q 'id="root"'
              exit 0
            fi
            sleep 1
          done
          docker logs hub
          exit 1
      - name: The image is sealed and Hermes still works
        # /app and /opt/hermes are read-only to the hub; Hermes runs, writes its profiles to
        # /data and installs an optional package into /data/hermes-packages (network needed).
        run: node scripts/image-sealed-check.mjs core-hub:ci
