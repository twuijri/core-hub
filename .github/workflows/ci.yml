name: CI

on:
  push:
    branches: [main, test]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REDOCLY_TELEMETRY: 'off'

jobs:
  checks:
    name: Lint, typecheck, contracts, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Java for the Kotlin/Swift generators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm i18n:check
      - run: pnpm nav:check
      - run: pnpm contracts:lint
      - run: pnpm contracts:generate
      - name: Contract generation leaves no uncommitted diff
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            echo '::error::pnpm contracts:generate changed tracked files; commit the result.'
            git diff --cached --stat
            exit 1
          fi
      - run: pnpm contracts:check-clients
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contract:test
      - run: pnpm build
      - name: The built web client is in place for the hub to serve
        run: test -f packages/web/dist/index.html
      - name: The reference client starts from its build output
        run: |
          node packages/cli/dist/bin.js --version
          node packages/cli/dist/bin.js --help >/dev/null
          node packages/cli/dist/bin.js --lang ar help chat >/dev/null
          if node packages/cli/dist/bin.js whoami; then echo '::error::whoami must exit 3 when not signed in'; exit 1; fi

  web-e2e:
    name: Web smoke journeys (Playwright against the real hub)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @majlis/web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter @majlis/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 7

  graph:
    name: Code map is current (Graphify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The PR's own head, not the merge with main: the map in the PR describes that tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Graphify, at the version the map is built with (docs/harness/knowledge-graph.md)
        run: pip install graphifyy==0.9.66
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # `pnpm graph` without installing the workspace: the script needs Node alone.
      - run: node scripts/graph.mjs
      - run: node scripts/graph-check.mjs

  migrations:
    name: db:generate + db:migrate (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Migration is generated from the schema
        run: pnpm db:generate
      - name: Migrate a fresh SQLite database
        run: pnpm db:migrate
        env:
          DATA_DIR: ${{ runner.temp }}/hub-data
      - name: Migrate a fresh PostgreSQL database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://hub:hub@localhost:5432/hub

  docker:
    name: Docker image builds and answers /health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: false
          load: true
          tags: majlis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name hub -p 8080:8080 -e HUB_ADMIN_PASSWORD=ci-only-password majlis:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              echo
              curl -fsS -H 'Accept: text/html' http://127.0.0.1:8080/chat | grep -q 'id="root"'
              exit 0
            fi
            sleep 1
          done
          docker logs hub
          exit 1
