# One-box install of Core Hub. Copy .env.example to .env (nothing in it is required), then:
#   docker compose up -d
#   docker compose logs hub     # prints the first-run setup token once; open the site and paste it
# Upgrades replace only the image; /data (SQLite, keys, Hermes's home, coding agents) lives in
# the named volume. The image bundles Hermes; the hub starts it on 127.0.0.1:8642 inside the
# container (ADR 0008). Model provider keys are added once on the Models screen and the hub
# propagates them to every agent, Hermes included (ADR 0010; docs/DEPLOY.md §3).
services:
  hub:
    image: ghcr.io/twuijri/core-hub:latest
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: core-hub
    restart: unless-stopped
    ports:
      - '${HUB_PORT:-8080}:8080'
    environment:
      DATA_DIR: /data
      PORT: '8080'
      # Unattended installs only (ADR 0011): set HUB_ADMIN_PASSWORD in .env and the hub creates
      # the owner `admin` on first boot instead of asking. Left empty — the normal case — the
      # hub prints a setup token and the owner account is created from the browser.
      HUB_ADMIN_PASSWORD: ${HUB_ADMIN_PASSWORD:-}
      # Optional: shared installs on PostgreSQL instead of the SQLite file under /data.
      # DATABASE_URL: postgres://hub:password@db:5432/hub
    volumes:
      - hub-data:/data
    # A model server on the host (LM Studio, Ollama, LiteLLM) is not on 127.0.0.1 from
    # in here — that is the container. This line gives the container a name for the host
    # machine, which is what the Models screen suggests when you type a loopback address.
    # Docker Desktop resolves the name already; on a Linux host this mapping is what
    # creates it (docs/DEPLOY.md §3b).
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  hub-data:
