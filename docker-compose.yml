# One-box install of Majlis. Copy .env.example to .env, set HUB_ADMIN_PASSWORD, then:
#   docker compose up -d
# Upgrades replace only the image; /data (SQLite, keys, Hermes's home, coding agents) lives in
# the named volume. The image bundles Hermes; the hub starts it on 127.0.0.1:8642 inside the
# container (ADR 0008). Model provider keys are set in Hermes, inside the volume, never here:
#   docker compose exec hub hermes model        (see docs/DEPLOY.md §3)
services:
  hub:
    image: ghcr.io/twuijri/majlis:latest
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: majlis
    restart: unless-stopped
    ports:
      - '${HUB_PORT:-8080}:8080'
    environment:
      DATA_DIR: /data
      PORT: '8080'
      # First boot only: creates the owner account, then ignored.
      HUB_ADMIN_PASSWORD: ${HUB_ADMIN_PASSWORD:?set HUB_ADMIN_PASSWORD in .env}
      # Optional: shared installs on PostgreSQL instead of the SQLite file under /data.
      # DATABASE_URL: postgres://hub:password@db:5432/hub
    volumes:
      - hub-data:/data

volumes:
  hub-data:
