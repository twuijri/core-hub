# XcodeGen spec for the Core Hub iOS app. The .xcodeproj is generated from this file and never
# committed or hand-edited: `xcodegen generate` in apps/ios (README.md).
name: CoreHub
options:
  bundleIdPrefix: com.twuijri.corehub
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    # The root package.json's version (XcodeGen cannot read JSON): `pnpm version:check` fails
    # when the two differ, and `pnpm version:check --write` copies it here (docs/RELEASING.md).
    MARKETING_VERSION: 1.1.1
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The owner's Apple team (docs/RELEASING.md). Xcode signs automatically on a developer's Mac;
    # the signed CI build switches to manual signing with the App Store profiles it fetches.
    DEVELOPMENT_TEAM: 58QWJ228ZE
    CODE_SIGN_STYLE: Automatic
packages:
  # The Swift client generated from packages/contracts (`pnpm contracts:generate`).
  CoreHubClient:
    path: ../../packages/contracts/generated/swift
targets:
  CoreHub:
    type: application
    platform: iOS
    sources:
      - path: CoreHub
    dependencies:
      - package: CoreHubClient
      - target: CoreHubShare
    # The App Group the share extension leaves shared text in (ShareInbox.swift), and push
    # (Phone/Push.swift): APNs production for a Release (App Store, TestFlight) build, the
    # sandbox for a Debug build from Xcode. Both take effect once the app is signed with the
    # owner's team (README.md); the simulator build in CI is not signed.
    entitlements:
      path: CoreHub/CoreHub.entitlements
      properties:
        com.apple.security.application-groups: [group.com.twuijri.corehub]
        aps-environment: $(COREHUB_APS_ENVIRONMENT)
    info:
      path: CoreHub/Info.plist
      properties:
        CFBundleDisplayName: Core Hub
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ar, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # Only the system's HTTPS/TLS — exempt, so App Store Connect never asks for export compliance.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # corehub://pair?hub=…&id=…&code=… — the pairing link the web offers to copy.
        CFBundleURLTypes:
          - CFBundleURLName: com.twuijri.corehub
            CFBundleURLSchemes: [corehub]
        NSCameraUsageDescription: Core Hub uses the camera to scan the pairing code your hub shows on the web, and to take photos you attach to a message.
        NSPhotoLibraryUsageDescription: Core Hub attaches the photos you choose to your messages.
        NSLocalNetworkUsageDescription: Core Hub connects to your hub on your local network.
        # iOS wakes the app now and then to look at the hub's notices (LocalNotices.swift).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.twuijri.corehub.notices]
        NSMicrophoneUsageDescription: Core Hub listens while you dictate a message.
        # An agent may ask where the phone is; Core Hub asks the person first (contract decision §105).
        NSLocationWhenInUseUsageDescription: Core Hub tells an agent where this phone is when the agent asks and you allow it.
        NSSpeechRecognitionUsageDescription: Core Hub turns what you dictate into text.
        # A self-hosted hub is often reached over plain http on a LAN or a VPN address
        # (proposed — owner to confirm; README.md).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twuijri.corehub
        PRODUCT_NAME: CoreHub
        TARGETED_DEVICE_FAMILY: '1,2'
        # CoreHub/Resources/Assets.xcassets/AppIcon: one 1024 px icon with dark and tinted looks,
        # made by scripts/icons/build-icons.mjs from the Core Hub mark (App Store needs it).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          COREHUB_APS_ENVIRONMENT: development
        # Empty unless the signed CI build names the profile (.github/workflows/ios-signed.yml).
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(COREHUB_APP_PROFILE)
          COREHUB_APS_ENVIRONMENT: production
  CoreHubShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CoreHubShare
      # The extension reads the same strings and product name as the app, and writes the
      # inbox the app reads.
      - path: CoreHub/i18n
      - path: CoreHub/Share/ShareInbox.swift
      - path: CoreHub/Generated/Product.swift
    entitlements:
      path: CoreHubShare/CoreHubShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.twuijri.corehub]
    info:
      path: CoreHubShare/Info.plist
      properties:
        CFBundleDisplayName: Core Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              # Pictures, videos and files too (phone parity, B14): they become a new chat's attachments.
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twuijri.corehub.share
        PRODUCT_NAME: CoreHubShare
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(COREHUB_SHARE_PROFILE)
  CoreHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoreHubTests
      # The parity and token tests read the repository's own files, copied at build time
      # (docs/clients/README.md: never a hand-kept second copy).
      - path: ../../docs/clients/navigation.json
        buildPhase: resources
      - path: ../../packages/ui-tokens/tokens.json
        buildPhase: resources
      # The attachment limit the app keeps is the contract's (AttachmentLimitTests).
      - path: ../../packages/contracts/openapi.yaml
        buildPhase: resources
    # Hosted in the app, so CoreHubClient reaches the tests through the host; linking it again
    # would load two copies of every generated type.
    dependencies:
      - target: CoreHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twuijri.corehub.tests
        GENERATE_INFOPLIST_FILE: YES
  # The App Store screenshots (docs/store/apple/README.md): XCUITest against the app signed in to
  # its demo hub (`-UITestDemo YES`, CoreHub/Demo). Run by .github/workflows/ios-screenshots.yml
  # through the CoreHubScreenshots scheme; built, not run, by the CoreHub scheme's tests.
  CoreHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoreHubUITests
    dependencies:
      - target: CoreHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twuijri.corehub.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CoreHub
schemes:
  CoreHub:
    build:
      targets:
        CoreHub: all
        CoreHubTests: [test]
        CoreHubUITests: [test]
    test:
      targets:
        - CoreHubTests
  CoreHubScreenshots:
    build:
      targets:
        CoreHub: all
        CoreHubUITests: [test]
    test:
      config: Debug
      targets:
        - CoreHubUITests
