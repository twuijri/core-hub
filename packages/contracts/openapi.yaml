      tags: [auth]
      summary: Start QR pairing from a signed-in client
      description: |
        Returns a one-time code and the exact JSON to encode in a QR. The phone scans it, then calls
        `claim` with the code. The pairing expires after `ttl_seconds` (default 300, max 900).
