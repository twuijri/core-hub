  # ================================================================== terminal
  /terminal:
    get:
      operationId: terminal.get
      tags: [terminal]
      summary: The web terminal's state and the owner's live terminal sessions
      description: |
        The web terminal is a shell on the hub's host, running as the hub's own user, in
        `DATA_DIR/workspaces/<profile>` (DECISIONS §70). It exists only when the hub runs with
        `COREHUB_WEB_TERMINAL=1`, and only the owner — not an admin, not a member — may use it.
        An admin or a member gets `403 forbidden` (`required_role: owner`); the owner of a hub
        where it is off gets `403 forbidden` with `details.reason: terminal_disabled`. A client
        shows the Terminal entry only on a `200`.

        Sessions are opened, typed into, resized and closed over `/rt/terminal`
        (`events/README.md`). They outlive the socket that opened them, so this list is how a
        reloaded page finds the sessions it can attach to again. A session nobody typed into
        for `idle_timeout_seconds` is closed by the hub; at most `max_sessions` run at once.
        Every start and end is written to the audit log (`terminal.opened`, `terminal.closed`).
      x-scope: global
      x-roles: [owner]
      x-rt-events: []
      responses:
        '200':
          description: The terminal is on and the caller is the owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalStatus'
              example:
                enabled: true
                pty: true
                shell: /bin/bash
                idle_timeout_seconds: 900
                max_sessions: 3
                sessions:
                  - id: 01J8QK3ZR2W7M5N4P6T8V9X0TM
                    profile: default
                    cwd: /data/workspaces/default
                    cols: 120
                    rows: 32
                    attached: false
                    started_at: '2026-09-25T10:00:00Z'
                    last_active_at: '2026-09-25T10:04:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Not the owner (`details.required_role: owner`), or the hub runs without
            `COREHUB_WEB_TERMINAL=1` (`details.reason: terminal_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'الطرفية غير مفعّلة في هذا المركز.'
                code: forbidden
                details:
                  reason: terminal_disabled
webhooks:
  hubEvent:
    post:
      operationId: webhook.hubEvent
      tags: [notify]
      summary: What the hub sends to a webhook (decision §59)
      description: 'One request per event and webhook, as `WebhookPayload`. Any `2xx` answer is delivered; anything else, a redirect, no answer within 10 s, or an address that now resolves somewhere private is a failed attempt, retried `max_retries` times with exponential backoff.'
      parameters:
        - name: X-CoreHub-Signature
          in: header
          required: false
          description: '`sha256=<hex>` — HMAC-SHA256 of the raw body with the webhook secret; absent when the webhook has none.'
          schema:
            type: string
            pattern: '^sha256=[0-9a-f]{64}$'
        - name: X-CoreHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-CoreHub-Delivery
          in: header
          required: true
          description: The delivery id, as `notify.listWebhookDeliveries` lists it.
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
            example:
              id: 01J8QK3ZR2W7M5N4P6T8V9X0EV
              event: task.moved
              profile: work
              occurred_at: '2026-09-25T10:15:04Z'
              content_included: false
              data:
                task:
                  id: 01J8QK3ZR2W7M5N4P6T8V9X0TK
                  status: review
                from: in_progress
                to: review
      responses:
        '200':
          description: Delivered (any `2xx` counts).
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT or app token
      description: |
        `Authorization: Bearer <token>`. A JWT access token identifies a person
        (from `POST /auth/login`); an app token `hub_at_…` identifies a paired
        device or an integration. Socket.IO handshakes pass the same token as
        `auth.token`.
  parameters:
    WorkspaceFilePath:
      name: path
      in: query
      required: false
      description: |
        A path inside the profile's working folder, relative to it, `/`-separated; empty or
        absent is the root. Absolute paths and paths that climb out are refused.
      schema:
        type: string
        maxLength: 4096
        default: ''
      example: notes/plan.md
    Profile:
      name: X-Hub-Profile
      in: header
      required: true
      description: |
        Workspace (profile) slug the request is scoped to. `default` always exists. Owners and
        admins may name any profile; a member only one they were explicitly given. Anything
        else is `404 profile_not_found`; for a member who has been given no profile at all,
        `details.reason` is `no_profile_granted`.
      schema:
        $ref: '#/components/schemas/ProfileSlug'
      example: work
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's `next_cursor`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (1–200, default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated ULID. Replaying the same key within 24 h returns the original response.
      schema:
        $ref: '#/components/schemas/Ulid'
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    SubagentId:
      name: subagent_id
      in: path
      required: true
      description: The agent's own id for the subagent (`Subagent.id`).
      schema:
        type: string
        maxLength: 200
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    WorkflowRunId:
      name: workflow_run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    SeatId:
      name: seat_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    McpServerName:
      name: server_name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,60}$'
    PresetId:
      name: preset_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,60}$'
    PendingWriteKind:
      name: write_kind
      in: path
      required: true
      description: Which of Hermes's review queues the write waits in.
      schema:
        type: string
        enum: [memory, skills]
        example: memory
    PendingWriteId:
      name: write_id
      in: path
      required: true
      description: Hermes's id of a pending write, as `agents.listPendingWrites` lists it.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
        example: 3fa9c21e
    PairingRequestId:
      name: request_id
      in: path
      required: true
      description: Hermes's id of a pending pairing request (16 hex characters), as `agents.listPairing` lists it.
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{16}$'
        example: 3f9a1c0e7b2d4a55
    PairedUserId:
      name: user_id
      in: path
      required: true
      description: The platform's id of an approved sender, as `agents.listPairing` lists it (URL-encoded).
      schema:
        type: string
        minLength: 1
        maxLength: 200
        example: '966500000002@s.whatsapp.net'
    Platform:
      name: platform
      in: path
      required: true
      description: Messaging platform slug (`telegram`, `discord`, `slack`, `whatsapp`, `matrix`, …) as listed by the channels operation.
      schema:
        type: string
        pattern: '^[a-z0-9_]{2,30}$'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language of human-readable `error` messages and generated titles (`ar` or `en`).
      schema:
        type: string
        enum: [ar, en]
        default: en
    ReportDays:
      name: days
      in: query
      required: false
      description: How many calendar days the report covers, today included. Clients offer 7, 30, 90 and 365.
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    ReportProfiles:
      name: profiles
      in: query
      required: false
      description: >-
        `all` covers every profile the caller may enter instead of the one in the header
        (ADR 0016). Absent, the report is the header's profile alone.
      schema:
        type: string
        enum: [all]
    ReportAgent:
      name: agent_id
      in: query
      required: false
      description: Narrows the report to one agent.
      schema:
        $ref: '#/components/schemas/Ulid'
    UtcOffset:
      name: utc_offset_minutes
      in: query
      required: false
      description: >-
        The caller's offset from UTC in minutes (east positive; Riyadh is `180`). Days are
        counted in that calendar. Absent, days are UTC days.
      schema:
        type: integer
        minimum: -720
        maximum: 840
        default: 0
  headers:
    RateLimitLimit:
      description: Requests allowed in the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    RequestId:
      description: Correlation id echoed in logs and in `details.request_id` of `internal` errors.
      schema:
        type: string
  responses:
    UnsupportedMediaType:
      description: The body or the file is not of a kind this operation takes (`unsupported_media_type`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'هذا الملف ليس نصًا يمكن تحريره'
            code: unsupported_media_type
            details:
              reason: binary
    BadRequest:
      description: Malformed request or failed validation (`bad_request`, `validation_failed`, `profile_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'الحقل «title» مطلوب'
            code: validation_failed
            details:
              fields:
                - path: title
                  message: required
    Unauthorized:
      description: Missing, invalid or expired token (`unauthorized`, `token_expired`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'انتهت صلاحية رمز الدخول'
            code: token_expired
    Forbidden:
      description: The principal lacks the role or scope (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'هذا الإجراء للمشرفين فقط'
            code: forbidden
            details:
              required_role: admin
    NotFound:
      description: Unknown id or profile (`not_found`, `profile_not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'الجلسة غير موجودة'
            code: not_found
            details:
              resource: session
              id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
    Conflict:
      description: Duplicate, version mismatch or illegal state transition (`conflict`, `state_invalid`, `already_running`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'لا يمكن نقل المهمة من «done» إلى «in_progress» مباشرة'
            code: state_invalid
            details:
              from: done
              to: in_progress
              allowed: [archived]
    PayloadTooLarge:
      description: The upload exceeds the limit (`payload_too_large`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'حجم الملف يتجاوز الحد المسموح'
            code: payload_too_large
            details:
              max_bytes: 26214400
    AgentUnavailable:
      description: The agent cannot serve the request (`agent_unavailable`, `agent_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'الوكيل Claude Code غير مثبّت على هذا الخادم'
            code: agent_unavailable
            details:
              agent_id: 01J8QK3ZR2W7M5N4P6T8V9X0AG
              status: not_installed
    RateLimited:
      description: Too many requests (`rate_limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'طلبات كثيرة، حاول بعد قليل'
            code: rate_limited
            details:
              retry_after_ms: 4000
    NotImplemented:
      description: Reserved stub of a later phase (`not_implemented`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'هذه الوحدة غير متاحة في هذا الإصدار'
            code: not_implemented
    Internal:
      description: Unexpected server error (`internal`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'حدث خطأ غير متوقع'
            code: internal
            details:
              request_id: req_01J8QK3ZR2W7M5N4P6T8V9X0RQ
    ServiceUnavailable:
      description: A dependency the hub needs for this call is not answering (`service_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'الخدمة غير جاهزة بعد'
            code: service_unavailable
            details:
              reason: hermes_api_unavailable
              message: "Hermes's dashboard API did not become ready in time"
  schemas:
    # ---------------------------------------------------------------- common
    Ulid:
      type: string
      description: 26-character Crockford base32 ULID, sortable by creation time.
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      minLength: 26
      maxLength: 26
      examples: [01J8QK3ZR2W7M5N4P6T8V9X0YA]
    ProfileSlug:
      type: string
      description: Workspace (profile) slug — lowercase letters, digits and dashes.
      pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
      examples: [work]
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC with `Z`.
      examples: ['2026-09-21T10:15:00Z']
    Locale:
      type: string
      enum: [ar, en]
      description: UI language. Content direction is decided per string by the client, never by this value.
    Money:
      type: object
      description: Decimal amount as a string plus ISO-4217 currency.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
        currency:
          type: string
          minLength: 3
          maxLength: 3
      examples:
        - amount: '0.0123'
          currency: USD
    Error:
      type: object
      description: The one error envelope. Clients branch on `code`, show `error` verbatim.
      required: [error, code]
      properties:
        error:
          type: string
          description: Human sentence in the request language (`Accept-Language`).
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          type: object
          description: Code-specific structured details (see `docs/contracts/README.md` §4).
          additionalProperties: true
      examples:
        - error: 'الجلسة غير موجودة'
          code: not_found
          details:
            resource: session
            id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
    ErrorCode:
      type: string
      description: Fixed list. Adding a code is a contract change.
      enum:
        - bad_request
        - validation_failed
        - profile_required
        - unauthorized
        - token_expired
        - forbidden
        - not_found
        - profile_not_found
        - conflict
        - state_invalid
        - already_running
        - payload_too_large
        - unsupported_media_type
        - agent_unavailable
        - agent_error
        - provider_not_configured
        - provider_unauthorized
        - rate_limited
        - internal
        - not_implemented
        - service_unavailable
    Scoped:
      type: object
      description: Fields every row a client can show carries (ARCHITECTURE §Data ownership).
      required: [id, profile, owner_id, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        profile:
          $ref: '#/components/schemas/ProfileSlug'
        owner_id:
          $ref: '#/components/schemas/Ulid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Page:
      type: object
      description: Envelope of every list. `items` is typed per operation.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to fetch the next page; `null` when there is none.
    Avatar:
      type: object
      description: A picture for a person, agent or profile. `generated` avatars are drawn by the client from `seed`.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [image, generated]
        url:
          type: [string, 'null']
          description: Fetchable with the bearer token when `kind = image`.
        seed:
          type: [string, 'null']
          description: Deterministic seed when `kind = generated`.
      examples:
        - kind: generated
          url: null
          seed: work
    AvatarInput:
      type: object
      description: Set an avatar. `image` carries a data URL (≤ 512 KB); `generated` resets to the seed; `null` resets to default.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [image, generated]
        data_url:
          type: string
          description: '`data:image/png;base64,…` when `kind = image`.'
        seed:
          type: string
    LocalizedText:
      type: object
      description: A short text kept in both UI languages (release notes, notices generated by the server).
      required: [ar, en]
      properties:
        ar:
          type: string
        en:
          type: string
      examples:
        - ar: 'إصلاح انقطاع البث عند ضعف الشبكة'
          en: 'Fix streaming drop on weak networks'
    JobAccepted:
      type: object
      description: Body of every `202`. Operations add the ids of resources they created.
      required: [job_id]
      properties:
        job_id:
          $ref: '#/components/schemas/Ulid'
      examples:
        - job_id: 01J8QK3ZR2W7M5N4P6T8V9X0JB
    # ---------------------------------------------------------------- meta
    Health:
      type: object
      required: [ok, server_version, uptime_seconds]
      properties:
        ok:
          type: boolean
        server_version:
          type: string
        uptime_seconds:
          type: integer
    Meta:
      type: object
      required:
        [
          name,
          server_version,
          contract_version,
          api_versions,
          realtime_namespaces,
          locales,
          setup_required,
          setup_open,
          setup_open_until,
        ]
      properties:
        name:
          type: string
          description: Display name the owner set (defaults to "Core Hub").
        server_version:
          type: string
        contract_version:
          type: string
          description: The `info.version` of the OpenAPI document the server implements.
        api_versions:
          type: array
          items:
            type: string
        realtime_namespaces:
          type: array
          items:
            type: string
        locales:
          type: array
          items:
            $ref: '#/components/schemas/Locale'
        setup_required:
          type: boolean
          description: |
            True while the hub has no owner: before first-run setup, and again after
            `COREHUB_RESET_OWNER` disabled the owner (ADR 0019). This is the "needs an owner" bit.
        setup_open:
          type: boolean
          description: |
            True while `auth.completeSetup` needs no token: the hub has no owner and the window
            after this process started (`COREHUB_SETUP_OPEN_MINUTES`) has not ended. False once an
            owner exists, after the window, and always when the window is `0` (token only).
        setup_open_until:
          type: [string, 'null']
          format: date-time
          description: When the open window ends; null whenever `setup_open` is false.
    # ---------------------------------------------------------------- jobs
    JobKind:
      type: string
      enum:
        [
          run,
          install,
          update,
          uninstall,
          restart,
          check_update,
          discover,
          refresh_catalogue,
          worktree,
          webhook_test,
          device_request,
          export,
          schedule_run,
          workflow_run,
          channel_login,
          import,
          plugin_install,
        ]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobProgress:
      type: object
      required: [percent, message]
      properties:
        percent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: '`null` when the work has no measurable progress (a run).'
        message:
          type: [string, 'null']
          description: Human progress line in the requester's language.
    ResourceRef:
      type: object
      description: Reference to the entity a job or event is about.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum:
            [
              agent,
              session,
              run,
              message,
              room,
              seat,
              project,
              task,
              subtask,
              worktree,
              schedule,
              schedule_run,
              workflow,
              workflow_run,
              step,
              provider,
              device,
              device_request,
              webhook,
              approval,
              notice,
              profile,
              attachment,
            ]
        id:
          $ref: '#/components/schemas/Ulid'
    Job:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [kind, status, progress, resource, result, error, started_at, finished_at]
          properties:
            kind:
              $ref: '#/components/schemas/JobKind'
            status:
              $ref: '#/components/schemas/JobStatus'
            progress:
              $ref: '#/components/schemas/JobProgress'
            resource:
              oneOf:
                - $ref: '#/components/schemas/ResourceRef'
                - type: 'null'
              description: The entity the job is about; `null` for work with no single
                subject (a host-wide agent discovery).
            result:
              type: [object, 'null']
              description: >-
                Kind-specific outcome (an install's `version`, an export's `attachment_id`). A
                `channel_login` job also carries its state here while it runs: `{status, qr,
                expires_at}` (`agents.loginChannel`).
              additionalProperties: true
            error:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - type: 'null'
            started_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            finished_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    # ---------------------------------------------------------------- auth
    Role:
      type: string
      enum: [owner, admin, member]
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      required:
        [
          id,
          username,
          display_name,
          role,
          status,
          locale,
          avatar,
          profiles,
          default_profile,
          last_login_at,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        username:
          type: string
          pattern: '^[a-z0-9._-]{2,40}$'
        display_name:
          type: string
          maxLength: 80
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        locale:
          $ref: '#/components/schemas/Locale'
        avatar:
          $ref: '#/components/schemas/Avatar'
        profiles:
          type: array
          description: |
            Slugs the user may enter. Owners and admins enter every profile, so theirs lists all
            of them. A member's is exactly the list an admin gave them — nothing is added
            implicitly, not by a profile created later — and empty means the member may enter no
            profile at all (they can sign in, and every scoped request answers
            `profile_not_found` with `details.reason = no_profile_granted`). With an empty
            list `default_profile` still reads `default`, which that member cannot enter:
            clients decide from `profiles`.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        default_profile:
          $ref: '#/components/schemas/ProfileSlug'
        last_login_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    SetupState:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: |
            `true` while the hub has no user at all, so a client must run first-run setup
            (`auth.completeSetup`) before anyone can sign in. Nothing else is exposed: the
            setup token and the presence of its file are never part of an answer.
    SetupRequest:
      type: object
      required: [username, password]
      properties:
        token:
          type: string
          format: password
          minLength: 8
          maxLength: 256
          description: |
            The token the hub wrote to `<DATA_DIR>/setup-token.txt` and logged on boot. Required
            only once the open window has ended (`Meta.setup_open` is false); ignored inside it.
        username:
          type: string
          pattern: '^[a-z0-9._-]{2,40}$'
          description: The owner's login name.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
          description: Same policy as every other password in `auth` (8 characters or more).
        display_name:
          type: string
          maxLength: 80
        workspace_name:
          type: string
          maxLength: 80
          description: Name of the `default` workspace created with the owner; defaults to "Default".
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT, 15 minutes.
        refresh_token:
          type: [string, 'null']
          description: Rotating; `null` when an app token was renewed instead.
        expires_in:
          type: integer
          description: Seconds until `access_token` expires.
        user:
          $ref: '#/components/schemas/User'
    UserSelfPatch:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        username:
          type: string
          pattern: '^[a-z0-9._-]{2,40}$'
        current_password:
          type: string
          format: password
          description: Required when `username` changes.
        locale:
          $ref: '#/components/schemas/Locale'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
        default_profile:
          $ref: '#/components/schemas/ProfileSlug'
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    UserCreate:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9._-]{2,40}$'
        password:
          type: string
          format: password
          minLength: 8
        display_name:
          type: string
          maxLength: 80
        role:
          type: string
          enum: [admin, member]
        profiles:
          type: array
          description: |
            The profiles a member may enter — an explicit list, never "all". Required with at
            least one slug when `role` is `member` (the server answers `400 validation_failed`
            with `details.field = profiles` otherwise; the rule depends on `role`, so it is
            stated here rather than as `minItems`). Ignored for an admin, who enters every
            profile.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        default_profile:
          $ref: '#/components/schemas/ProfileSlug'
        locale:
          $ref: '#/components/schemas/Locale'
    UserAdminPatch:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        role:
          type: string
          enum: [admin, member]
        status:
          $ref: '#/components/schemas/UserStatus'
        profiles:
          type: array
          description: |
            Replaces the member's explicit list. An empty list withdraws every profile: the
            member can still sign in and enters nothing. Changing `role` from `admin` to
            `member` must carry at least one slug here in the same request (`400
            validation_failed`, `details.field = profiles`, otherwise), because an admin holds
            no list.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        default_profile:
          $ref: '#/components/schemas/ProfileSlug'
        password:
          type: string
          format: password
          minLength: 8
    Preferences:
      type: object
      description: Human-owned settings, global to the user (not per workspace).
      required:
        [
          theme,
          locale,
          text_scale,
          link_target,
          busy_input_mode,
          streaming,
          compact,
          show_reasoning,
          show_tool_calls,
          show_cost,
          inline_diffs,
          sound_on_complete,
          notify_on_complete,
          notify_on_approval,
          reasoning_effort,
          voice,
        ]
      properties:
        theme:
          type: string
          enum: [system, light, dark]
        locale:
          $ref: '#/components/schemas/Locale'
        text_scale:
          type: number
          minimum: 0.85
          maximum: 1.45
        link_target:
          type: string
          enum: [in_app, browser]
        busy_input_mode:
          type: string
          enum: [queue, next, interrupt]
          description: What "send" does while a run is active (maps to `RunCreate.when`).
        streaming:
          type: boolean
        compact:
          type: boolean
        show_reasoning:
          type: boolean
        show_tool_calls:
          type: boolean
        show_cost:
          type: boolean
        inline_diffs:
          type: boolean
        sound_on_complete:
          type: boolean
        notify_on_complete:
          type: boolean
        notify_on_approval:
          type: boolean
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
          description: Default for new sessions; `null` lets the agent decide.
        voice:
          type: object
          required: [input_mode, dictation_language, output_mode, auto_speak]
          properties:
            input_mode:
              type: string
              enum: [device, server]
            dictation_language:
              type: string
              description: '`auto`, `app` (follow the UI locale) or a BCP-47 tag.'
            output_mode:
              type: string
              enum: [device, server]
            auto_speak:
              type: boolean
    Lockout:
      type: object
      required: [ip, kind, failures, locked_until]
      properties:
        ip:
          type: string
        kind:
          type: string
          enum: [password, token, pairing]
        failures:
          type: integer
        locked_until:
          $ref: '#/components/schemas/Timestamp'
    TokenScope:
      type: string
      enum: [read, write, device, admin]
    AppToken:
      type: object
      required: [id, name, scopes, device_id, last_used_at, expires_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/TokenScope'
        device_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AppTokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TokenScope'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    AppTokenCreated:
      allOf:
        - $ref: '#/components/schemas/AppToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Shown exactly once.
    ChannelIdentityPlatform:
      type: string
      enum: [telegram, whatsapp]
    ChannelIdentity:
      type: object
      description: >-
        A messaging account a person proved is theirs (contract decision §79). One hub-wide
        link per account: it acts in every profile the person may enter, and nowhere else.
      required: [id, user_id, platform, sender_id, linked_at, last_used_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        platform:
          $ref: '#/components/schemas/ChannelIdentityPlatform'
        sender_id:
          type: string
          description: >-
            The account as Hermes names the sender: Telegram's numeric user id, WhatsApp's chat
            id (`…@s.whatsapp.net`, or `…@lid` where WhatsApp hides the number).
        linked_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When a message from it last ran with the person's permissions.
    ChannelIdentityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChannelIdentity'
    ChannelLinkCode:
      type: object
      required: [code, command, expires_at]
      properties:
        code:
          type: string
          pattern: '^corehub_[A-Z2-9]{10}$'
        command:
          type: string
          description: What to send the bot, `/start <code>`.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    HubChannelEvent:
      type: object
      required: [event, platform, sender_id]
      properties:
        event:
          type: string
          enum: [turn_started, turn_step, turn_ended, link]
        platform:
          type: string
          pattern: '^[a-z0-9_]{1,40}$'
          description: Hermes's name of the platform (`telegram`, `whatsapp`, …).
        sender_id:
          type: [string, 'null']
          maxLength: 320
          description: The sender as Hermes names it; `null` when the platform named nobody.
        session_id:
          type: [string, 'null']
          maxLength: 200
          description: Hermes's session of the conversation (turn events).
        chat_type:
          type: [string, 'null']
          maxLength: 20
          description: >-
            Hermes's kind of chat (`dm`, `group`, `forum`, …; turn events). A turn anywhere but a
            direct chat acts for nobody (`hub_tools_group_chat`): others steer a group's conversation too.
        code:
          type: [string, 'null']
          maxLength: 200
          description: The `/start` argument (`link` only).
    HubChannelEventResult:
      type: object
      required: [handled, message]
      properties:
        handled:
          type: boolean
          description: "`link` only: the command was the hub's, and the gateway answers `message` instead of passing it on."
        message:
          type: [string, 'null']
    PairingConnection:
      type: string
      enum: [lan, relay]
      description: '`lan` when the device reaches the hub directly; `relay` when it goes through the message relay.'
    PairingCreate:
      type: object
      properties:
        connection:
          $ref: '#/components/schemas/PairingConnection'
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 900
          default: 300
    Pairing:
      type: object
      required: [id, status, code, connection, qr_payload, expires_at, device_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum: [pending, claimed, expired, cancelled]
        code:
          type: string
          description: Human-typeable one-time code.
        connection:
          $ref: '#/components/schemas/PairingConnection'
        qr_payload:
          type: string
          description: 'JSON to encode in the QR: `{ type: "corehub.pairing", hub_url, pairing_id, code, expires_at }`.'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        device_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    PairingClaim:
      type: object
      required: [code, device]
      properties:
        code:
          type: string
        device:
          $ref: '#/components/schemas/DeviceRegistration'
    PairingResult:
      type: object
      required: [app_token, token_id, expires_at, device, user, server]
      properties:
        app_token:
          type: string
        token_id:
          $ref: '#/components/schemas/Ulid'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        device:
          $ref: '#/components/schemas/Device'
        user:
          $ref: '#/components/schemas/User'
        server:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- profiles
    ModelRef:
      type: object
      required: [provider_id, model]
      properties:
        provider_id:
          $ref: '#/components/schemas/Ulid'
        model:
          type: string
    Profile:
      type: object
      required:
        [
          id,
          slug,
          name,
          avatar,
          default_model,
          agent_count,
          session_count,
          owner_id,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        slug:
          $ref: '#/components/schemas/ProfileSlug'
        name:
          type: string
          maxLength: 80
        avatar:
          $ref: '#/components/schemas/Avatar'
        default_model:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        agent_count:
          type: integer
        session_count:
          type: integer
        owner_id:
          $ref: '#/components/schemas/Ulid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ProfileCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          $ref: '#/components/schemas/ProfileSlug'
        name:
          $ref: '#/components/schemas/ProfileName'
        clone_from:
          oneOf:
            - $ref: '#/components/schemas/ProfileSlug'
            - type: 'null'
          description: Copy agent settings, models and defaults from this profile (not sessions).
    ProfilePatch:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/ProfileSlug'
          description: |
            Refused (`409`) for `default`, and for every profile where the hub mirrors Hermes
            (`details.reason = profile_id_fixed`); see `auth.updateProfile`.
        name:
          $ref: '#/components/schemas/ProfileName'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
        default_model:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
    ProfileName:
      type: string
      description: |
        What people call a profile — any language, shown everywhere the profile is named — and
        Hermes's display name for it (decision §44). Trimmed; at most 64 characters, Hermes's
        own limit for a display name. Never the profile's id: that is `slug`.
      minLength: 1
      maxLength: 64
      examples: ['الرئيسي']
    ProfileSettings:
      type: object
      required: [proxy, compression, privacy, appearance]
      properties:
        proxy:
          type: object
          deprecated: true
          description: >-
            Stored by the hub and applied by nothing. The proxy Hermes uses is Hermes's own, per
            profile: `agents.getSettings` / `agents.updateSettings`, section `network` (contract
            decision §58). Kept so an older client still reads a whole object.
          required: [https_proxy, http_proxy, all_proxy, no_proxy]
          properties:
            https_proxy:
              type: [string, 'null']
            http_proxy:
              type: [string, 'null']
            all_proxy:
              type: [string, 'null']
            no_proxy:
              type: [string, 'null']
        compression:
          type: object
          description: |
            Automatic context compression for this profile's conversations (decision §57).
            Where the hub supervises Hermes these are Hermes's own keys in the profile's
            `config.yaml` — `compression.enabled`, `compression.threshold`,
            `compression.target_ratio`, `compression.protect_first_n`,
            `compression.protect_last_n` and `model.context_length` — read from there and
            written there, and Hermes applies them from the next turn on.
          required: [enabled, threshold, target_ratio, protect_first, protect_last, context_length]
          properties:
            enabled:
              type: boolean
            threshold:
              type: number
              minimum: 0
              maximum: 1
              description: |
                Compress once the conversation fills this share of the model's window. Hermes
                raises anything below 0.75 to 0.75 for models whose window is under 512K.
            target_ratio:
              type: number
              minimum: 0
              maximum: 1
              description: Share of the threshold kept word for word as the recent tail (Hermes clamps it to 0.10–0.80).
            protect_first:
              type: integer
              minimum: 0
            protect_last:
              type: integer
              minimum: 0
            context_length:
              type: [integer, 'null']
              minimum: 1024
              description: The model's window in tokens, when the catalogue's is wrong; `null` = what the model reports.
        privacy:
          type: object
          deprecated: true
          description: >-
            Stored by the hub and applied by nothing. Hiding user ids and phone numbers from the
            model is Hermes's own `privacy.redact_pii`, per profile: `agents.updateSettings`,
            section `privacy` — what the Privacy page switches (contract decision §58). Kept so an
            older client still reads a whole object.
          required: [redact_pii]
          properties:
            redact_pii:
              type: boolean
        appearance:
          type: object
          description: The server-side theme shown on the `Theme` screen.
          required: [font_size, text_color, accent_color, background_attachment_id]
          properties:
            font_size:
              type: integer
              minimum: 12
              maximum: 20
            text_color:
              type: [string, 'null']
              pattern: '^#[0-9a-fA-F]{6}$'
            accent_color:
              type: [string, 'null']
              pattern: '^#[0-9a-fA-F]{6}$'
            background_attachment_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
              description: 'An attachment uploaded with `purpose: background`.'
    ProfileSettingsPatch:
      type: object
      description: Any subset of the sections; each section is merge-patched.
      properties:
        proxy:
          type: object
          additionalProperties: true
        compression:
          type: object
          additionalProperties: true
        privacy:
          type: object
          additionalProperties: true
        appearance:
          type: object
          additionalProperties: true
    ProfileSettingsResult:
      type: object
      required: [settings, restart_job_id]
      properties:
        settings:
          $ref: '#/components/schemas/ProfileSettings'
        restart_job_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    ProfileExport:
      type: object
      description: What an export carries besides the profile itself (decision §37).
      properties:
        providers:
          type: boolean
          default: false
          description: >-
            Carry the profile's providers with their keys in the clear
            (`corehub-providers.json`). The client warns before it asks for this.
    ProfileImport:
      type: object
      required: [attachment_id, slug]
      properties:
        attachment_id:
          $ref: '#/components/schemas/Ulid'
          description: 'The archive, uploaded with `purpose: import`.'
        slug:
          $ref: '#/components/schemas/ProfileSlug'
          description: The new profile's id in the hub and in Hermes; must not be taken.
        name:
          $ref: '#/components/schemas/ProfileName'
          description: Display name of the new workspace; the slug when absent.
    # ---------------------------------------------------------------- sessions
    SessionSource:
      type: string
      description: Where a session came from. `channel` sessions carry the platform in `channel`.
      enum: [chat, global_agent, room, task, schedule, workflow, channel, cli, api]
    SessionStatus:
      type: string
      enum: [idle, running, waiting]
      description: '`waiting` means a run is blocked on an approval or question.'
    ReasoningEffort:
      type: string
      enum: [none, minimal, low, medium, high, max]
    Usage:
      type: object
      required: [input_tokens, output_tokens, cost]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    ContextUsage:
      type: object
      required: [used_tokens, window_tokens]
      properties:
        used_tokens:
          type: integer
          minimum: 0
        window_tokens:
          type: [integer, 'null']
          minimum: 1
          description: "`null` when the model's window is unknown."
        estimated:
          type: boolean
          description: |
            `true` when the agent counted `used_tokens` roughly rather than taking it from
            the provider's own report of the last request. Absent is `false`.
    SessionMatch:
      type: object
      description: Present only on search results.
      required: [message_id, snippet]
      properties:
        message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        snippet:
          type: string
    Session:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              agent_id,
              title,
              source,
              origin,
              channel,
              model,
              provider,
              reasoning_effort,
              working_dir,
              pinned,
              archived,
              category_id,
              preview,
              message_count,
              usage,
              context,
              status,
              active_run_id,
              parent_session_id,
              notify,
              last_message_at,
              match,
            ]
          properties:
            agent_id:
              $ref: '#/components/schemas/Ulid'
            title:
              type: [string, 'null']
              maxLength: 200
              description: '`null` until the user or the server names it; clients show "New chat".'
            source:
              $ref: '#/components/schemas/SessionSource'
            origin:
              oneOf:
                - $ref: '#/components/schemas/ResourceRef'
                - type: 'null'
              description: The room, task, schedule or workflow run this session serves.
            channel:
              type: [string, 'null']
              description: Messaging platform slug when `source = channel` (e.g. `telegram`).
            model:
              type: [string, 'null']
            provider:
              type: [string, 'null']
            reasoning_effort:
              oneOf:
                - $ref: '#/components/schemas/ReasoningEffort'
                - type: 'null'
            working_dir:
              type: [string, 'null']
              description: Absolute path on the hub host the agent works in.
            pinned:
              type: boolean
            archived:
              type: boolean
            category_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            preview:
              type: [string, 'null']
              maxLength: 300
            message_count:
              type: integer
              minimum: 0
            usage:
              oneOf:
                - $ref: '#/components/schemas/Usage'
                - type: 'null'
            context:
              oneOf:
                - $ref: '#/components/schemas/ContextUsage'
                - type: 'null'
            status:
              $ref: '#/components/schemas/SessionStatus'
            active_run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            parent_session_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            notify:
              type: boolean
              description: Push a notice to the user's devices when a run in this session finishes.
            last_message_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            match:
              oneOf:
                - $ref: '#/components/schemas/SessionMatch'
                - type: 'null'
    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [runs, pending_approvals]
          properties:
            runs:
              type: array
              description: Active and queued runs, in execution order.
              items:
                $ref: '#/components/schemas/Run'
            pending_approvals:
              type: array
              items:
                $ref: '#/components/schemas/Approval'
    WorkingDir:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          description: The folder's own name, relative to `root`.
        path:
          type: string
          description: Absolute path on the hub; what `SessionCreate.working_dir` carries.
    WorkingDirs:
      type: object
      required: [root, items]
      properties:
        root:
          type: string
          description: |
            The only directory a session may work in, or under. The hub creates it on demand.
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkingDir'
      example:
        root: /var/lib/corehub/workspaces/work
        items:
          - name: corehub
            path: /var/lib/corehub/workspaces/work/corehub
          - name: 01J8QK3ZR2W7M5N4P6T8V9X0YA
            path: /var/lib/corehub/workspaces/work/01J8QK3ZR2W7M5N4P6T8V9X0YA
    SessionCreate:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        title:
          type: [string, 'null']
          maxLength: 200
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        working_dir:
          type: [string, 'null']
        category_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: >-
            A category of this session's profile (`sessions.listCategories`); another
            profile's, or none, is `404` (contract decision §60).
    GlobalAgentOpen:
      type: object
      required: [agent_id]
      description: The agent a first open makes the global agent's conversation with.
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
    SessionPatch:
      type: object
      description: JSON merge-patch; every field optional, `null` clears.
      properties:
        title:
          type: [string, 'null']
          maxLength: 200
          description: |
            A non-empty title is the person's own and the hub never replaces it.
            `null` gives the naming back to the hub: the session is renamed from its
            own first turn, and the new title arrives as `session.updated`
            (contract decision §26).
        pinned:
          type: boolean
        archived:
          type: boolean
        category_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: >-
            Moves the session into a category of its own profile; `null` takes it out. A
            category the profile does not have is `404` (contract decision §60).
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        working_dir:
          type: [string, 'null']
        notify:
          type: boolean
    SessionBulkUpdate:
      type: object
      required: [session_ids, patch]
      properties:
        session_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Ulid'
        patch:
          type: object
          properties:
            pinned:
              type: boolean
            archived:
              type: boolean
            category_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
    SessionForkRequest:
      type: object
      description: |
        Every field is optional and every one of them defaults to the source session's own
        value, so an empty body still means "the same conversation, twice".

        `agent_id` is how a person continues a conversation with a different agent
        (contract decision §26): the transcript is copied, the fork runs on the named agent,
        no run is started, and the original is untouched. Changing only the **model** is not
        a fork — that is `sessions.update`.
      properties:
        at_message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: Copy history up to and including this message; default the whole session.
        title:
          type: [string, 'null']
        agent_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: |
            Run the fork on this agent instead of the source session's. Unknown id -> `404`;
            an agent this hub has not installed -> `422 agent_unavailable`.
        model:
          type: [string, 'null']
          description: Model for the fork; omit to inherit the source session's.
        provider:
          type: [string, 'null']
          description: Provider for the fork; omit to inherit the source session's.
    SessionCompressRequest:
      type: object
      description: Every field is optional; an empty body compresses the whole conversation.
      properties:
        focus:
          type: [string, 'null']
          maxLength: 2000
          description: |
            What the summary should keep in view, in the person's words. Passed to the agent
            as-is (Hermes also reads `here [N]` there: keep the last N turns word for word).
    SessionCompression:
      type: object
      required:
        [status, before_tokens, after_tokens, before_messages, after_messages, context, message]
      properties:
        status:
          type: string
          enum: [compressed, unchanged, skipped]
          description: |
            `compressed`: the history was summarised. `unchanged`: there was too little to
            compress, or the summary would not have been smaller. `skipped`: another
            compression of the same conversation was already running.
        before_tokens:
          type: [integer, 'null']
          minimum: 0
          description: The agent's estimate of the conversation before, when it gives one.
        after_tokens:
          type: [integer, 'null']
          minimum: 0
        before_messages:
          type: [integer, 'null']
          minimum: 0
        after_messages:
          type: [integer, 'null']
          minimum: 0
        context:
          oneOf:
            - $ref: '#/components/schemas/ContextUsage'
            - type: 'null'
          description: The window after compressing; `null` when the agent does not report it.
        message:
          type: [string, 'null']
          description: The agent's own words about what happened, untranslated; `null` when it said nothing.
    RunSteerRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
    RunSteerResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [queued, rejected]
    BulkResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, ok, error]
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              ok:
                type: boolean
              error:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: 'null'
    SessionCategory:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [name, color, position, session_count]
          properties:
            name:
              type: string
              maxLength: 60
            color:
              type: [string, 'null']
              pattern: '^#[0-9a-fA-F]{6}$'
            position:
              type: integer
              minimum: 0
            session_count:
              type: integer
              minimum: 0
    SessionCategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
        position:
          type: integer
          minimum: 0
    # ------------------------------------------------------- channel conversations
    ChannelConversation:
      type: object
      description: |
        A conversation held on a messaging channel, read from Hermes's session store (contract
        decision §61). Not a `Session`: the hub does not own it and cannot write to it.
      required:
        [
          id,
          profile,
          channel,
          title,
          peer_name,
          peer_id,
          chat_type,
          last_message,
          preview,
          message_count,
          started_at,
          last_message_at,
        ]
      properties:
        id:
          type: string
          description: Hermes's session id.
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'
        profile:
          $ref: '#/components/schemas/ProfileSlug'
        channel:
          type: string
          description: >-
            The platform (`telegram`, `whatsapp`, `discord`…). WhatsApp's cloud API is
            `whatsapp` too.
        title:
          type: [string, 'null']
          maxLength: 200
          description: The title Hermes gave the conversation, when it has one.
        peer_name:
          type: [string, 'null']
          maxLength: 200
          description: The other party as the channel names them (the person, or the group).
        peer_id:
          type: [string, 'null']
          maxLength: 200
          description: The other party's id on the channel, when there is no name or beside it.
        chat_type:
          type: [string, 'null']
          description: As the channel says it — `dm`, `group`, `channel`, `thread`.
        last_message:
          oneOf:
            - $ref: '#/components/schemas/ChannelMessagePreview'
            - type: 'null'
          description: >-
            The latest message with text, when the hub has read it; `null` until then
            (`preview` stands in).
        preview:
          type: [string, 'null']
          maxLength: 300
          description: Hermes's own preview — the first thing the person on the channel wrote.
        message_count:
          type: integer
          minimum: 0
        started_at:
          $ref: '#/components/schemas/Timestamp'
        last_message_at:
          $ref: '#/components/schemas/Timestamp'
    ChannelMessagePreview:
      type: object
      required: [role, text]
      properties:
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
          maxLength: 300
    ChannelContinueRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        note:
          type: [string, 'null']
          maxLength: 4000
          description: What the person wants done with it; added to the first message.
    ChannelContinuation:
      type: object
      required: [session, first_message]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        first_message:
          type: array
          minItems: 2
          description: >-
            The chat's first message, for the client to send (`sessions.createRun`) once it
            watches the chat: a `text` block (the summary, and the note) and a `file` block
            (the transcript).
          items:
            $ref: '#/components/schemas/ContentBlock'
    ChannelMessage:
      type: object
      description: One message of a channel conversation, as Hermes keeps it.
      required: [id, role, text, created_at]
      properties:
        id:
          type: string
          description: Hermes's message id, unique within the conversation.
        role:
          type: string
          enum: [user, assistant]
          description: '`user` is the person on the channel; `assistant` is the agent.'
        text:
          type: string
          description: Markdown as the agent wrote it; plain text as the person did. Cut at 20 000 characters.
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ChannelConversationsUnavailable:
      type: object
      description: Why one profile's channel conversations could not be read.
      required: [profile, reason, message]
      properties:
        profile:
          oneOf:
            - $ref: '#/components/schemas/ProfileSlug'
            - type: 'null'
          description: '`null` when the reason holds for every profile (`hermes_not_managed`).'
        reason:
          type: string
          enum: [hermes_not_managed, profile_not_in_hermes, hermes_unreachable]
          description: |
            `hermes_not_managed`: this hub does not supervise Hermes, so it has no way to read
            Hermes's store. `profile_not_in_hermes`: Hermes has no profile for this hub profile.
            `hermes_unreachable`: Hermes's server did not answer or refused; `message` has its words.
        message:
          type: [string, 'null']
          description: Hermes's own words, when it said something.
    # ---------------------------------------------------------------- messages
    Author:
      type: object
      description: Who wrote a message. Agents in rooms are identified by their seat, see `Message.seat_id`.
      required: [kind, id, name, avatar]
      properties:
        kind:
          type: string
          enum: [user, agent, system]
        id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        name:
          type: string
        avatar:
          oneOf:
            - $ref: '#/components/schemas/Avatar'
            - type: 'null'
    ContentBlock:
      description: One block of message content. Attachments are referenced by id; bytes come from `url`.
      oneOf:
        - $ref: '#/components/schemas/TextBlock'
        - $ref: '#/components/schemas/ImageBlock'
        - $ref: '#/components/schemas/FileBlock'
        - $ref: '#/components/schemas/AudioBlock'
        - $ref: '#/components/schemas/LocationBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextBlock'
          image: '#/components/schemas/ImageBlock'
          file: '#/components/schemas/FileBlock'
          audio: '#/components/schemas/AudioBlock'
          location: '#/components/schemas/LocationBlock'
    TextBlock:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
    AttachmentBlockFields:
      type: object
      required: [attachment_id]
      properties:
        attachment_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        mime:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        url:
          type: string
          description: Filled by the server on read; ignored on write.
    ImageBlock:
      allOf:
        - $ref: '#/components/schemas/AttachmentBlockFields'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [image]
    FileBlock:
      allOf:
        - $ref: '#/components/schemas/AttachmentBlockFields'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [file]
    AudioBlock:
      allOf:
        - $ref: '#/components/schemas/AttachmentBlockFields'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [audio]
            duration_ms:
              type: [integer, 'null']
            transcript:
              type: [string, 'null']
              description: Filled when the hub transcribed the note before sending it to the agent.
    LocationBlock:
      type: object
      required: [type, latitude, longitude]
      properties:
        type:
          type: string
          enum: [location]
        latitude:
          type: number
        longitude:
          type: number
        accuracy_m:
          type: [number, 'null']
        captured_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Reasoning:
      type: object
      required: [text, duration_ms]
      properties:
        text:
          type: string
        duration_ms:
          type: [integer, 'null']
    ToolCallStatus:
      type: string
      enum: [running, succeeded, failed, interrupted, awaiting_approval]
    ToolCall:
      type: object
      description: One tool invocation inside an assistant message. Tool output lives here, not in a separate message.
      required:
        [
          id,
          name,
          status,
          preview,
          arguments,
          output,
          output_truncated,
          duration_ms,
          subagent_id,
          started_at,
          finished_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        status:
          $ref: '#/components/schemas/ToolCallStatus'
        preview:
          type: [string, 'null']
          description: One-line summary for the tool card (a command, a path).
        arguments:
          type: [object, 'null']
          additionalProperties: true
        output:
          type: [string, 'null']
          description: Truncated to 16 KB; `output_truncated` says so.
        output_truncated:
          type: boolean
        duration_ms:
          type: [integer, 'null']
        subagent_id:
          type: [string, 'null']
          description: Set when the call was made by a delegated subagent.
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MessageRole:
      type: string
      enum: [user, assistant, system, command]
      description: '`command` is a user message that starts with `/`; there is no `tool` role — tool output lives in `tool_calls`.'
    MessageStatus:
      type: string
      enum: [complete, streaming, failed, interrupted]
    Mention:
      type: object
      required: [kind, seat_id]
      properties:
        kind:
          type: string
          enum: [seat, all]
        seat_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    Handoff:
      type: object
      description: Set on a room message that hands the turn to another seat.
      required: [to_seat_id, chain_id, depth]
      properties:
        to_seat_id:
          $ref: '#/components/schemas/Ulid'
        chain_id:
          $ref: '#/components/schemas/Ulid'
        depth:
          type: integer
          minimum: 1
    Message:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          description: The one message shape for sessions and rooms (see DECISIONS.md).
          required:
            [
              session_id,
              room_id,
              seq,
              role,
              author,
              content,
              reasoning,
              tool_calls,
              run_id,
              status,
              mentions,
              handoff,
              usage,
              reply_to_message_id,
            ]
          properties:
            session_id:
              $ref: '#/components/schemas/Ulid'
            room_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            seat_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
              description: The room seat that wrote an agent message.
            seq:
              type: integer
              minimum: 1
              description: Position in the session; gaps mean deleted messages.
            role:
              $ref: '#/components/schemas/MessageRole'
            author:
              $ref: '#/components/schemas/Author'
            content:
              type: array
              items:
                $ref: '#/components/schemas/ContentBlock'
            reasoning:
              oneOf:
                - $ref: '#/components/schemas/Reasoning'
                - type: 'null'
            tool_calls:
              type: array
              items:
                $ref: '#/components/schemas/ToolCall'
            run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
              description: Stable across the user message, the assistant reply and its tool calls, so clients fold them into one run card.
            status:
              $ref: '#/components/schemas/MessageStatus'
            mentions:
              type: array
              items:
                $ref: '#/components/schemas/Mention'
            handoff:
              oneOf:
                - $ref: '#/components/schemas/Handoff'
                - type: 'null'
            usage:
              oneOf:
                - $ref: '#/components/schemas/Usage'
                - type: 'null'
            reply_to_message_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
    MessagePage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean
          description: Whether messages older than `items[0]` exist.
    # ---------------------------------------------------------------- trajectory
    TrajectoryStepKind:
      type: string
      enum: [input, turn, reasoning, tool, subagent]
      description: |
        `input` is something the person sent; `turn` is the model speaking once (before, between
        or after tool calls); `reasoning` is what the model showed of its thinking in that turn;
        `tool` is one tool call; `subagent` is one delegated subagent from start to end (§56).
    TrajectoryLane:
      type: string
      enum: [input, model, tools, subagents]
      description: >-
        The row of the timeline a step is drawn in. `turn` and `reasoning` share `model`;
        `subagents` holds each subagent and every tool call a subagent made (§56).
    TrajectoryStepStatus:
      type: string
      enum: [running, succeeded, failed, cancelled]
    TrajectoryTiming:
      type: string
      enum: [full, partial, none]
      description: |
        `full` — every turn and tool call carries its times; `partial` — some runs are from before
        the hub recorded model turns, and their turns have no times; `none` — no step can be placed
        on a time axis (an older conversation, or nothing has run yet).
    TrajectoryStep:
      type: object
      required:
        [
          id,
          kind,
          lane,
          exchange,
          run_id,
          message_id,
          status,
          started_at,
          ended_at,
          duration_ms,
          text,
          tool_call_only,
          first_token_ms,
          tool_call,
        ]
      properties:
        id:
          type: string
          description: Stable across reads of the same conversation.
        kind:
          $ref: '#/components/schemas/TrajectoryStepKind'
        lane:
          $ref: '#/components/schemas/TrajectoryLane'
        exchange:
          type: integer
          minimum: 1
          description: 1-based count of the person's inputs up to and including this step's.
        run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        status:
          $ref: '#/components/schemas/TrajectoryStepStatus'
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: '`null` when the hub did not record it (see `Trajectory.timing`).'
        ended_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: '`null` while the step is still running, or when it was not recorded.'
        duration_ms:
          type: [integer, 'null']
          minimum: 0
        text:
          type: [string, 'null']
          description: What the person sent, what the model said in the turn, or its reasoning.
        tool_call_only:
          type: boolean
          description: A turn in which the model said nothing and only called tools.
        first_token_ms:
          type: [integer, 'null']
          minimum: 0
          description: For a turn, how long the model took to send its first word or thought.
        tool_call:
          oneOf:
            - $ref: '#/components/schemas/ToolCall'
            - type: 'null'
          description: The whole call — arguments and result — for a `tool` step.
        model:
          type: [string, 'null']
          description: For a `turn`, the model that spoke in it, when the hub knows it.
        fallback:
          oneOf:
            - $ref: '#/components/schemas/RunFallback'
            - type: 'null'
          description: >-
            On the first `turn` of a run that moved down the fallback chain (decision §54): the
            models that failed before `model` answered. `null` otherwise.
        subagent:
          oneOf:
            - $ref: '#/components/schemas/Subagent'
            - type: 'null'
          description: The subagent of a `subagent` step (§56); absent or `null` otherwise.
    TrajectoryMetrics:
      type: object
      description: |
        Only what the hub recorded. A metric it has no data for is `null` and a client does not
        show it: `cache_hit_pct` needs a provider that reports cache reads, the token counts need
        a provider that reports usage, and the times need runs recorded with their turns.
      required:
        [
          exchanges,
          turns,
          steps,
          tool_calls,
          failed_tool_calls,
          model_ms,
          tool_ms,
          avg_first_token_ms,
          output_tokens_per_second,
          cache_hit_pct,
          input_tokens,
          output_tokens,
        ]
      properties:
        exchanges:
          type: integer
          minimum: 0
        turns:
          type: integer
          minimum: 0
          description: Model turns.
        steps:
          type: integer
          minimum: 0
        tool_calls:
          type: integer
          minimum: 0
        failed_tool_calls:
          type: integer
          minimum: 0
        model_ms:
          type: [integer, 'null']
          minimum: 0
          description: Time the model spent in its timed turns.
        tool_ms:
          type: [integer, 'null']
          minimum: 0
          description: Wall-clock time at least one tool was running (parallel calls count once).
        avg_first_token_ms:
          type: [integer, 'null']
          minimum: 0
          description: Mean time from the start of a turn to the model's first word or thought.
        output_tokens_per_second:
          type: [number, 'null']
          minimum: 0
          description: Output tokens over the model time of the runs that report both.
        cache_hit_pct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Prompt tokens read from the provider's cache, of all prompt tokens.
        input_tokens:
          type: [integer, 'null']
          minimum: 0
        output_tokens:
          type: [integer, 'null']
          minimum: 0
    Trajectory:
      type: object
      required: [session_id, generated_at, live, timing, started_at, ended_at, steps, metrics]
      properties:
        session_id:
          $ref: '#/components/schemas/Ulid'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        live:
          type: boolean
          description: A run of the conversation is still going; its last steps may grow.
        timing:
          $ref: '#/components/schemas/TrajectoryTiming'
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: The earliest time of any timed step; the start of the time axis.
        ended_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: The latest end of any timed step; `null` while a step is still running.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TrajectoryStep'
        metrics:
          $ref: '#/components/schemas/TrajectoryMetrics'
    # ------------------------------------------------------------ subagents (§56)
    SubagentSupport:
      type: string
      enum: [full, observe, none]
      description: |
        What an agent lets a person do with the subagents it delegates to (contract decision
        §56). `full` — see them live, stop one, steer one while it takes guidance, read its
        output (Hermes); `observe` — see them start and end, nothing more (a coding agent whose
        stream names its delegations); `none` — the agent never says it delegated.
    SubagentStatus:
      type: string
      enum: [running, completed, failed, interrupted]
    SubagentTool:
      type: object
      required: [name, preview, at]
      properties:
        name:
          type: string
        preview:
          type: [string, 'null']
          description: The agent's one-line summary of the call, when it gave one.
        at:
          $ref: '#/components/schemas/Timestamp'
    Subagent:
      type: object
      description: |
        One delegated agent of a conversation. `id` is the agent's own (not a ULID). A nested
        subagent names the one that started it in `parent_id`; `depth` is 0 for one the
        conversation's agent started itself.
      required:
        [
          id,
          session_id,
          run_id,
          parent_id,
          depth,
          goal,
          model,
          status,
          started_at,
          finished_at,
          tool_count,
          last_tool,
          accepting_steer,
          summary,
          tools,
        ]
      properties:
        id:
          type: string
          maxLength: 200
        session_id:
          $ref: '#/components/schemas/Ulid'
        run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The run that was going when it started; `null` when none was.
        parent_id:
          type: [string, 'null']
        depth:
          type: integer
          minimum: 0
        goal:
          type: string
          description: What it was asked to do, in the agent's words.
        model:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/SubagentStatus'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        tool_count:
          type: [integer, 'null']
          minimum: 0
          description: Tools it called so far; `null` when the agent does not say (`observe`).
        last_tool:
          type: [string, 'null']
        accepting_steer:
          type: boolean
          description: A note sent now would reach it (`sessions.steerSubagent`).
        summary:
          type: [string, 'null']
          description: Its last words when it finished, or why it failed.
        tools:
          type: array
          maxItems: 50
          description: Its most recent tool calls, oldest first (at most 50).
          items:
            $ref: '#/components/schemas/SubagentTool'
    SubagentList:
      type: object
      required: [support, items]
      properties:
        support:
          $ref: '#/components/schemas/SubagentSupport'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subagent'
    SubagentSteer:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
      example:
        text: 'ركّز على اختبارات الخادم فقط'
    SubagentSteerResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [queued, rejected]
    SubagentTail:
      type: object
      required: [available, text, truncated]
      properties:
        available:
          type: boolean
        text:
          type: string
        truncated:
          type: boolean
          description: Only the end is here; the transcript is longer.
    # ------------------------------------------------------------ background (§56)
    BackgroundKind:
      type: string
      enum: [chat_run, task_run, schedule_run, workflow_run, job, subagent]
    BackgroundStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    BackgroundItem:
      type: object
      description: |
        One piece of work in the Background panel. `id` is `<kind>:<id>` (`run:…`,
        `workflow_run:…`, `job:…`, `subagent:<session_id>:<subagent id>`) and is what
        `background.stop` takes. Where it lives: a run or a subagent in its conversation
        (`session_id`), a task run on its task (`resource.kind = task`), a workflow run on the
        Schedules page (`resource.kind = workflow_run`), a job on its `resource`.
      required:
        [
          id,
          kind,
          job_kind,
          title,
          profile,
          status,
          started_at,
          finished_at,
          stoppable,
          session_id,
          resource,
        ]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/BackgroundKind'
        job_kind:
          oneOf:
            - $ref: '#/components/schemas/JobKind'
            - type: 'null'
          description: The job's kind when `kind = job`.
        title:
          type: string
          description: What it is — a conversation's or task's title, a workflow's name, a
            subagent's goal, a job's progress line.
        profile:
          $ref: '#/components/schemas/ProfileSlug'
        status:
          $ref: '#/components/schemas/BackgroundStatus'
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: '`null` while it waits in a queue.'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        stoppable:
          type: boolean
          description: '`background.stop` would stop it now.'
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        resource:
          oneOf:
            - $ref: '#/components/schemas/ResourceRef'
            - type: 'null'
    BackgroundList:
      type: object
      required: [running, finished]
      properties:
        running:
          type: array
          items:
            $ref: '#/components/schemas/BackgroundItem'
        finished:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BackgroundItem'
    # ---------------------------------------------------------------- session files
    SessionFilePreview:
      type: string
      enum: [html, pdf, image, markdown, code, text, csv, xlsx, docx, pptx, none]
      description: |
        How a client previews the file, decided from its name. `none` is offered for download
        only. `html` is rendered in a sandboxed frame, never in the client's own origin.
    SessionFileSource:
      type: string
      enum: [tool, working_dir, attachment]
      description: |
        Why the file is listed: a tool call named it, it is in the working folder, or it is
        attached to a message (the person's, or one the agent handed back).
    SessionFile:
      type: object
      required:
        [
          key,
          name,
          path,
          attachment_id,
          message_id,
          mime,
          preview,
          size_bytes,
          preview_max_bytes,
          modified_at,
          sources,
          tool_call_ids,
        ]
      properties:
        key:
          type: string
          description: Stable within the conversation — `path:<path>` or `attachment:<id>`.
        name:
          type: string
          description: The file's own name (the last part of its path).
        path:
          type: [string, 'null']
          description: Relative to the working folder, `/`-separated; `null` for an attachment.
        attachment_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The message the attachment is on.
        mime:
          type: string
        preview:
          $ref: '#/components/schemas/SessionFilePreview'
        size_bytes:
          type: integer
          minimum: 0
        preview_max_bytes:
          type: integer
          minimum: 0
          description: The largest file of this kind `sessions.readFile` sends for preview.
        modified_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: The file's last change on disk; `null` for an attachment.
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SessionFileSource'
        tool_call_ids:
          type: array
          description: The tool calls that named this file, oldest first.
          items:
            $ref: '#/components/schemas/Ulid'
    SessionFileList:
      type: object
      required: [working_dir, truncated, items]
      properties:
        working_dir:
          type: [string, 'null']
          description: The folder the paths are relative to; `null` when the session has none.
        truncated:
          type: boolean
          description: The folder held more than the hub lists; the newest are listed.
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionFile'
    # ---------------------------------------------------------------- run changes
    RunFileChangeKind:
      type: string
      enum: [added, modified, deleted, renamed]
      description: What the run did to the file. A rename may also have changed the content.
    RunFileDiffState:
      type: string
      enum: [available, binary, too_large, unavailable]
      description: |
        Whether `sessions.getRunChangeDiff` has lines to show: `available`; `binary` (a file
        that is not text); `too_large` (over the hub's diff cap); `unavailable` (the hub saw the
        file change but kept no copy of what it was before — a large file in a folder that is
        not a git repository, or one the run's start could not read).
    RunFileChange:
      type: object
      required: [path, old_path, change, additions, deletions, binary, diff]
      properties:
        path:
          type: string
          description: |
            Relative to the session's working folder, `/`-separated: where the file is after
            the run, or where it was for a deleted one.
        old_path:
          type: [string, 'null']
          description: Where a renamed file was before the run; `null` otherwise.
        change:
          $ref: '#/components/schemas/RunFileChangeKind'
        additions:
          type: [integer, 'null']
          minimum: 0
          description: Lines added; `null` when the hub cannot count them (binary, or no copy of before).
        deletions:
          type: [integer, 'null']
          minimum: 0
          description: Lines removed; `null` as for `additions`.
        binary:
          type: boolean
        diff:
          $ref: '#/components/schemas/RunFileDiffState'
    RunChanges:
      type: object
      required:
        [
          run_id,
          source,
          complete,
          files_changed,
          additions,
          deletions,
          truncated,
          recorded_at,
          files,
        ]
      properties:
        run_id:
          $ref: '#/components/schemas/Ulid'
        source:
          type: string
          enum: [git, snapshot]
          description: |
            How the hub knew: `git` — the working folder is in a git repository or worktree, and
            the run's start and end were compared as two git trees (untracked files included,
            ignored ones not); `snapshot` — no git, so the folder was read at the start and
            again at the end, with small text files kept to diff against.
        complete:
          type: boolean
          description: |
            The start covered the whole folder. `false` when the folder was larger than the
            hub reads at a run's start: a change to a file it did not read may be missing.
        files_changed:
          type: integer
          minimum: 0
          description: Every file the run changed, including any beyond `files`.
        additions:
          type: integer
          minimum: 0
          description: Lines added over every counted file.
        deletions:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: More files changed than the hub keeps per run; `files` holds the first by path.
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        files:
          type: array
          items:
            $ref: '#/components/schemas/RunFileChange'
    RunChangesList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RunChanges'
    RunFileDiff:
      allOf:
        - $ref: '#/components/schemas/RunFileChange'
        - type: object
          required: [run_id, truncated, text]
          properties:
            run_id:
              $ref: '#/components/schemas/Ulid'
            truncated:
              type: boolean
              description: The recorded diff was cut at a line to stay under the cap.
            text:
              type: [string, 'null']
              description: |
                The unified diff's hunks (from the first `@@` line, three lines of context),
                `null` unless `diff` is `available`. Lines are as the file has them, UTF-8.
    # ---------------------------------------------------------------- runs
    RunFallback:
      type: object
      description: >-
        What a turn went through before the model that answered it (decision §54): each model
        of the chain that failed with an error another model could get past, in the order
        tried, starting with the one that was chosen.
      required: [failed]
      properties:
        failed:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RunFallbackAttempt'
    RunFallbackAttempt:
      type: object
      required: [model, provider, code, error]
      properties:
        model:
          type: string
        provider:
          type: [string, 'null']
          description: The provider's slug, when the hub knows it.
        code:
          oneOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
          description: '`null` when the runtime switched models without saying why.'
        error:
          type: [string, 'null']
          description: The provider's own words, when it sent any.
    RunStatus:
      type: string
      enum: [queued, running, waiting, succeeded, failed, cancelled]
    RunTrigger:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [user, room, task, schedule, workflow, handoff, api]
        id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The user, seat, task, schedule, workflow run or chain that caused the run.
    Run:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          description: One turn of an agent, executed as a job. Every run belongs to a session.
          required:
            [
              session_id,
              room_id,
              seat_id,
              job_id,
              status,
              queue_position,
              trigger,
              input_message_id,
              output_message_id,
              model,
              provider,
              reasoning_effort,
              interrupted,
              error,
              usage,
              started_at,
              finished_at,
            ]
          properties:
            session_id:
              $ref: '#/components/schemas/Ulid'
            room_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            seat_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            job_id:
              $ref: '#/components/schemas/Ulid'
            status:
              $ref: '#/components/schemas/RunStatus'
            queue_position:
              type: [integer, 'null']
              minimum: 1
              description: 1-based position while `queued`.
            trigger:
              $ref: '#/components/schemas/RunTrigger'
            input_message_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            output_message_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            model:
              type: [string, 'null']
            provider:
              type: [string, 'null']
            reasoning_effort:
              oneOf:
                - $ref: '#/components/schemas/ReasoningEffort'
                - type: 'null'
            interrupted:
              type: boolean
            error:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - type: 'null'
            usage:
              oneOf:
                - $ref: '#/components/schemas/Usage'
                - type: 'null'
            fallback:
              oneOf:
                - $ref: '#/components/schemas/RunFallback'
                - type: 'null'
              description: >-
                `null` when the chosen model answered (absent from hubs before decision §54).
                When set, the turn moved down the fallback chain and `model` / `provider` name
                the model that actually answered — or, when the run then failed, the last one
                tried.
            started_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            finished_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    RunCreate:
      type: object
      required: [content]
      properties:
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContentBlock'
        model:
          type: [string, 'null']
          description: One-off override; the session's model is unchanged.
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        when:
          type: string
          enum: [queue, next, interrupt]
          default: queue
          description: What to do if a run is active — append to the queue, jump the queue, or interrupt the active run with this message.
        reply_to_message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    RunAccepted:
      allOf:
        - $ref: '#/components/schemas/JobAccepted'
        - type: object
          required: [run_id, message_id, queue_position]
          properties:
            run_id:
              $ref: '#/components/schemas/Ulid'
            message_id:
              $ref: '#/components/schemas/Ulid'
              description: The stored user message.
            queue_position:
              type: [integer, 'null']
    # ---------------------------------------------------------------- approvals
    ApprovalKind:
      type: string
      enum: [tool_call, memory_write, skill_write, question, plan, workflow_step]
    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, answered, expired, cancelled]
    ApprovalDecision:
      type: string
      enum: [approve_once, approve_session, approve_always, deny]
    Choice:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
        labels:
          description: >-
            The label in both UI languages, when the server has it (an agent's settings form);
            `label` is then the English one, for a client that reads only that.
          $ref: '#/components/schemas/LocalizedText'
    AgentRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
    Approval:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          description: A decision the agent is waiting for — a tool approval, a write approval, a question, a plan, or a workflow step gate.
          required:
            [
              kind,
              status,
              session_id,
              run_id,
              message_id,
              room_id,
              workflow_run_id,
              node_id,
              agent,
              title,
              description,
              command,
              choices,
              allow_always,
              answer_mode,
              response,
              expires_at,
            ]
          properties:
            kind:
              $ref: '#/components/schemas/ApprovalKind'
            status:
              $ref: '#/components/schemas/ApprovalStatus'
            session_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            message_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            room_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            workflow_run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            node_id:
              type: [string, 'null']
            agent:
              $ref: '#/components/schemas/AgentRef'
            title:
              type: string
            description:
              type: [string, 'null']
            command:
              type: [string, 'null']
              description: The exact command or write the agent wants to perform.
            choices:
              type: array
              items:
                $ref: '#/components/schemas/Choice'
            allow_always:
              type: boolean
            answer_mode:
              type: string
              enum: [choice, text, both]
            response:
              oneOf:
                - $ref: '#/components/schemas/ApprovalResponseRecord'
                - type: 'null'
            expires_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    ApprovalResponse:
      type: object
      description: '`decision` for approvals; `answer` (free text or a choice value) for questions; both allowed.'
      properties:
        decision:
          oneOf:
            - $ref: '#/components/schemas/ApprovalDecision'
            - type: 'null'
        answer:
          type: [string, 'null']
          maxLength: 4000
    ApprovalResponseRecord:
      allOf:
        - $ref: '#/components/schemas/ApprovalResponse'
        - type: object
          required: [responded_by, responded_at]
          properties:
            responded_by:
              $ref: '#/components/schemas/Ulid'
            responded_at:
              $ref: '#/components/schemas/Timestamp'
    # ---------------------------------------------------------------- attachments
    AttachmentPurpose:
      type: string
      enum: [message, avatar, task, import, background, skill, release]
      default: message
    Attachment:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [name, mime, size_bytes, kind, url, purpose, width, height, duration_ms, sha256]
          properties:
            name:
              type: string
            mime:
              type: string
            size_bytes:
              type: integer
              minimum: 0
            kind:
              type: string
              enum: [image, audio, video, file]
            url:
              type: string
              description: Path of the bytes; fetch with the bearer header.
            purpose:
              $ref: '#/components/schemas/AttachmentPurpose'
            width:
              type: [integer, 'null']
            height:
              type: [integer, 'null']
            duration_ms:
              type: [integer, 'null']
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
    AttachmentStream:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: A path on this hub; put it in a media element's `src` as it is.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    UploadStart:
      type: object
      required: [name, mime, size_bytes]
      properties:
        name:
          type: string
          maxLength: 255
        mime:
          type: string
        size_bytes:
          type: integer
          minimum: 1
          maximum: 52428800
        purpose:
          $ref: '#/components/schemas/AttachmentPurpose'
    Upload:
      type: object
      required: [id, name, mime, size_bytes, chunk_bytes, next_offset, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        mime:
          type: string
        size_bytes:
          type: integer
        chunk_bytes:
          type: integer
          description: Maximum bytes per `PUT`.
        next_offset:
          type: integer
          minimum: 0
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    # ---------------------------------------------------------------- agents
    AgentKind:
      type: string
      enum: [hermes, acp, harness, builtin]
      description: Which adapter drives the agent (ADR 0002). `builtin` is the hub's own lightweight agent.
    AgentStatus:
      type: string
      enum: [available, not_installed, installing, updating, error, limited, disabled]
    AgentCapability:
      type: string
      enum:
        [
          streaming,
          tools,
          approvals,
          mcp,
          skills,
          memory,
          channels,
          worktrees,
          resume,
          vision,
          audio,
          plugins,
          presets,
          journey,
          jobs,
          tasks,
          compress,
          steer,
          goals,
          plans,
          learn,
          skill_commands,
          config_files,
        ]
      description: |
        What an agent can do. `compress` … `skill_commands` are the composer's `/` commands the
        agent itself carries out (decision §57): `compress` (`sessions.compress`), `steer`
        (`sessions.steerRun`), and `goals`, `plans`, `learn`, `skill_commands` — a message
        that starts with `/goal`, `/plan`, `/learn` or `/skill <name>` is the agent's
        command rather than text for the model. A client offers a command only when the
        session's agent has its capability. `config_files`: the agent has config files of its
        own an admin can edit (`agents.listConfigFiles`, decision §78).
    AgentSection:
      type: string
      description: The rows shown under the agent's card, in order (NAVIGATION §4).
      enum: [jobs, tasks, channels, skills, plugins, presets, mcp, memory, journey, settings]
    AgentInstall:
      type: object
      required:
        [
          source,
          path,
          package,
          command,
          version,
          latest_version,
          update_available,
          pinned_version,
          newer_than_tested,
          auto_update,
          auto_update_supported,
          checked_at,
          error,
        ]
      properties:
        source:
          type: string
          enum: [managed, user_cli, builtin, none]
        path:
          type: [string, 'null']
        package:
          type: [string, 'null']
          description: npm/pip package the hub installs.
        command:
          type: [string, 'null']
        version:
          type: [string, 'null']
        latest_version:
          type: [string, 'null']
          description: >-
            The newest stable version the hub knows of: the registry's answer to the last
            check (every six hours, and `agents.checkUpdate`), never older than
            `pinned_version`. Asked, never installed on its own.
        update_available:
          type: boolean
          description: '`latest_version` is newer than the installed `version`.'
        pinned_version:
          type: [string, 'null']
          description: >-
            The catalog's pin for the package the hub installs — the version the owner
            tested, and the one a fresh install takes. `null` for an agent the hub does not
            install (Hermes, the hub's own agent).
        newer_than_tested:
          type: boolean
          description: >-
            The hub installed this agent and its `version` is past `pinned_version` (an
            update took a newer release). Clients say so: «أحدث من النسخة المختبرة».
        auto_update:
          type: boolean
          description: >-
            Take an available update automatically. Off by default. Taken only while no run
            of the agent is in flight; a run asked for during the update waits for it.
        auto_update_supported:
          type: boolean
        checked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        error:
          type: [string, 'null']
    AgentRuntime:
      type: object
      required: [state, url, error]
      properties:
        state:
          type: string
          enum: [running, stopped, starting, error, not_applicable]
        url:
          type: [string, 'null']
        error:
          type: [string, 'null']
        gateways:
          description: >-
            Hermes only, where the hub runs it: every messaging gateway — the default profile's
            and one per named profile with a channel switched on and linked or an active
            scheduled job. `agents.restart` restarts all of them.
          type: array
          items:
            $ref: '#/components/schemas/MessagingGateway'
    Agent:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              slug,
              name,
              vendor,
              kind,
              avatar,
              status,
              enabled,
              install,
              runtime,
              capabilities,
              sections,
              default_model,
              limited,
              subagents,
            ]
          properties:
            slug:
              type: string
              pattern: '^[a-z0-9-]{2,40}$'
            name:
              type: string
            vendor:
              type: [string, 'null']
            kind:
              $ref: '#/components/schemas/AgentKind'
            avatar:
              $ref: '#/components/schemas/Avatar'
            status:
              $ref: '#/components/schemas/AgentStatus'
            enabled:
              type: boolean
            install:
              $ref: '#/components/schemas/AgentInstall'
            runtime:
              $ref: '#/components/schemas/AgentRuntime'
            capabilities:
              type: array
              items:
                $ref: '#/components/schemas/AgentCapability'
            sections:
              type: array
              items:
                $ref: '#/components/schemas/AgentSection'
            default_model:
              oneOf:
                - $ref: '#/components/schemas/ModelRef'
                - type: 'null'
            limited:
              type: boolean
              description: True for the process harness — the UI marks the agent "limited".
            subagents:
              $ref: '#/components/schemas/SubagentSupport'
    AgentPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        avatar:
          description: >-
            `image` with a PNG or JPEG data URL (at most 512 KB) stores the agent's picture,
            served by `agents.getAvatar`; `generated` or `null` removes it, and the agent is
            drawn from its slug again. A picture that is not one of the two is `400`.
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
        enabled:
          type: boolean
        auto_update:
          type: boolean
        default_model:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
    SettingsField:
      type: object
      required: [key, label, kind, value, options, min, max, hint]
      properties:
        key:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedText'
        kind:
          type: string
          enum: [text, secret, integer, number, toggle, choice, list, json]
        value: {}
        options:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
        min:
          type: [number, 'null']
        max:
          type: [number, 'null']
        hint:
          type: [string, 'null']
        help:
          description: >-
            What the setting does, in both UI languages. Absent or `null` where the adapter has no
            more to say than the label.
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
        default:
          description: >-
            The agent's own default, used while `value` is `null` (nothing written). A `null`
            default means the agent has no value of its own for it (the feature is off). Sending
            `null` for a field puts it back to this default.
        default_text:
          description: >-
            The default in words, where the number alone would mislead (Hermes's turn limit is 500
            in the hub's conversations and none on its channels). Absent or `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
    SettingsSection:
      type: object
      required: [key, title, restart_required, fields]
      properties:
        key:
          type: string
        title:
          $ref: '#/components/schemas/LocalizedText'
        restart_required:
          type: boolean
        applies:
          description: >-
            When a saved value takes effect. `next_message`: from the next message (a turn already
            running finishes on the values it started with); `restart`: after the agent's runtime
            restarts, which saving asks for when the hub runs it (`restart_job_id`). Absent: the
            adapter does not say.
          type: string
          enum: [next_message, restart]
        note:
          description: Where and when the section's values apply, in both UI languages. Absent or `null` when there is nothing to add.
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SettingsField'
    PendingWrite:
      type: object
      description: >-
        One write the agent made to its memory or its skills that waits for review (Hermes's
        `pending/<kind>/<id>.json`). What it would change is shown from the record itself.
      required: [id, kind, action, summary, origin, created_at, target, name, content, old_text]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [memory, skills]
        action:
          type: string
          description: "Hermes's verb: for memory `add`, `replace`, `remove` or `batch`; for skills `create`, `edit`, `patch`, `write_file`, `remove_file` or `delete`."
        summary:
          type: string
          description: Hermes's one-line summary of the write.
        origin:
          type: string
          description: "`foreground` (during a conversation) or `background_review` (Hermes's own review after one)."
        created_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        target:
          type: [string, 'null']
          description: "Memory: `memory` (the agent's notes) or `user` (what it knows about the person). `null` for skills."
        name:
          type: [string, 'null']
          description: Skills only — the skill's name, with the file inside it when the write is to one (`name/file`).
        content:
          type: [string, 'null']
          description: The new text (a memory entry, a skill's `SKILL.md` or file, the replacement of a patch), cut to 20 000 characters; for a memory batch, one line per operation.
        old_text:
          type: [string, 'null']
          description: The text it replaces or removes, when the write says.
    PendingWriteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingWrite'
    PendingWriteApplied:
      type: object
      required: [id, kind, applied]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [memory, skills]
        applied:
          type: boolean
          const: true
    AgentSettings:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SettingsSection'
    AgentSettingsPatch:
      type: object
      required: [section, values]
      properties:
        section:
          type: string
        values:
          type: object
          additionalProperties: true
    AgentSettingsResult:
      type: object
      required: [section, restart_job_id]
      properties:
        section:
          $ref: '#/components/schemas/SettingsSection'
        restart_job_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    ConfigFile:
      type: object
      description: >-
        One of a coding agent's own config files (contract decision §78). The same file for
        every profile: it lives in the home of the user the hub runs as.
      required: [key, label, path, language, exists, size_bytes, revision, updated_at, content]
      properties:
        key:
          type: string
          description: "`instructions` (the agent's own instructions file) or `settings`."
        label:
          $ref: '#/components/schemas/LocalizedText'
        path:
          type: string
          description: >-
            Display path: `~/…` under the home, or `$VARIABLE/…` when the agent's own variable
            (`CLAUDE_CONFIG_DIR`, `CODEX_HOME`, …) moves its folder. Never a hub-internal absolute path.
        language:
          type: string
          enum: [markdown, json, yaml, toml, text]
        exists:
          type: boolean
        size_bytes:
          type: integer
        revision:
          type: [string, 'null']
          description: A hash of the bytes; `null` while the file does not exist.
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        content:
          type: [string, 'null']
          description: The text on `getConfigFile` and `putConfigFile`; `null` in a listing.
    ConfigFileWrite:
      type: object
      required: [content, revision]
      properties:
        content:
          type: string
          maxLength: 1048576
        revision:
          type: [string, 'null']
          description: The revision read, or `null` to create a file that does not exist yet.
    SkillSource:
      type: string
      description: >-
        `builtin`: seeded by the agent from its own bundle (Hermes's `skills/.bundled_manifest`)
        and read-only through the hub; `library`: one of Core Hub's own skills (decision §71),
        installed and kept up to date by the hub until the person edits it; `external`:
        installed from a pack that names itself; `user`: written by a person.
      enum: [builtin, user, external, library]
    Skill:
      type: object
      required: [key, name, description, enabled, pinned, source, use_count, updated_at, content]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        enabled:
          type: boolean
        pinned:
          type: boolean
        source:
          $ref: '#/components/schemas/SkillSource'
        use_count:
          type: integer
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        content:
          type: [string, 'null']
        library:
          type: [string, 'null']
          enum: [current, edited, null]
          description: >-
            For a Core Hub library skill (`source: library`): `current` while every file is as
            the hub wrote it (the hub updates it with each new version), `edited` once the person
            changed one (the hub leaves it alone; `agents.restoreSkill` puts it back). `null`
            for every other skill.
    SkillLibrary:
      type: object
      description: Core Hub's own skill library in one profile (decision §71).
      required: [enabled, available, installed, edited]
      properties:
        enabled:
          type: boolean
          description: On by default; off means the hub neither installs nor updates it here.
        available:
          type: integer
          minimum: 0
          description: How many skills the library ships.
        installed:
          type: integer
          minimum: 0
          description: How many of them this profile has.
        edited:
          type: integer
          minimum: 0
          description: How many of those the person edited (left alone by updates).
    SkillLibraryPatch:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    SkillCategory:
      type: object
      required: [key, name, description, skills]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
    SkillWrite:
      type: object
      required: [content]
      properties:
        category:
          type: string
        content:
          type: string
          maxLength: 262144
    SkillPatch:
      type: object
      properties:
        enabled:
          type: boolean
        pinned:
          type: boolean
    SkillImport:
      type: object
      required: [attachment_ids]
      properties:
        category:
          type: string
          description: >-
            Not used for placement: an imported skill is installed beside the others, and the
            category it lists under is read from the skill itself (the pack it names), as for
            every other skill. Kept optional so an older client's request is still valid.
        attachment_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Ulid'
    McpTool:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
    McpServer:
      type: object
      required: [name, transport, enabled, connected, tools, error, config, updated_at]
      properties:
        name:
          type: string
        transport:
          type: string
          enum: [stdio, http, sse]
        enabled:
          type: boolean
        connected:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpTool'
        error:
          type: [string, 'null']
        config:
          type: object
          description: Stored verbatim; secret-looking values read as `[stored]`.
          additionalProperties: true
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    McpServerWrite:
      type: object
      required: [name, transport, config]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,60}$'
        transport:
          type: string
          enum: [stdio, http, sse]
        enabled:
          type: boolean
          default: true
        config:
          type: object
          additionalProperties: true
    McpServerPatch:
      type: object
      properties:
        transport:
          type: string
          enum: [stdio, http, sse]
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
    McpTestResult:
      type: object
      required: [ok, tools, error, duration_ms]
      properties:
        ok:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpTool'
        error:
          type: [string, 'null']
        duration_ms:
          type: integer
    HubToolGroupId:
      type: string
      description: A group of the hub's own tools (contract decision §67).
      enum: [tasks, schedules, conversations, notifications, workflows, files, devices]
    HubTool:
      type: object
      required: [name, access]
      properties:
        name:
          type: string
          description: The MCP tool name, e.g. `tasks.create` (Hermes shows it as `mcp__corehub__tasks_create`).
        access:
          type: string
          enum: [read, write]
          description: A `write` tool is offered only while its group has `allow_writes`.
    HubToolGroup:
      type: object
      required: [id, enabled, allow_writes, tools]
      properties:
        id:
          $ref: '#/components/schemas/HubToolGroupId'
        enabled:
          type: boolean
        allow_writes:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/HubTool'
    HubToolCall:
      type: object
      required: [id, tool, ok, error_code, user_id, session_id, duration_ms, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        tool:
          type: string
        ok:
          type: boolean
        error_code:
          type: [string, 'null']
          description: The hub's error code when the call was refused or failed.
        user_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The person whose run the call acted for; `null` when no run was live.
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        duration_ms:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/Timestamp'
    HubTools:
      type: object
      required:
        [enabled, available, unavailable_reason, server_name, url, groups, recent_calls, updated_at]
      properties:
        enabled:
          type: boolean
        available:
          type: boolean
          description: Whether the hub has this profile's Hermes home to write the server into.
        unavailable_reason:
          type: [string, 'null']
          enum: [runtime_absent, hermes_profile_absent, null]
        server_name:
          type: string
          description: The block's name in `config.yaml`; `agents.testMcpServer` tests it.
        url:
          type: [string, 'null']
          description: Where Hermes reaches the hub's MCP server.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/HubToolGroup'
        recent_calls:
          type: array
          description: The last calls made in this profile, newest first (at most 20).
          items:
            $ref: '#/components/schemas/HubToolCall'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      example:
        enabled: true
        available: true
        unavailable_reason: null
        server_name: corehub
        url: http://127.0.0.1:8080/api/v1/hub-mcp
        groups:
          - id: tasks
            enabled: true
            allow_writes: true
            tools:
              - name: tasks.list
                access: read
              - name: tasks.create
                access: write
          - id: files
            enabled: true
            allow_writes: false
            tools:
              - name: files.list
                access: read
              - name: files.write
                access: write
        recent_calls:
          - id: 01J9ZS5WQ0C2F9M4XK7T3B8R6N
            tool: tasks.create
            ok: true
            error_code: null
            user_id: 01J9ZRX1QW3M8K2T6B4N5C7D9E
            session_id: 01J9ZS2B6D8F0H2J4K6M8N0P2Q
            duration_ms: 42
            created_at: '2026-09-25T08:00:00Z'
        updated_at: '2026-09-25T07:55:00Z'
    HubToolsPatch:
      type: object
      properties:
        enabled:
          type: boolean
        groups:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                $ref: '#/components/schemas/HubToolGroupId'
              enabled:
                type: boolean
              allow_writes:
                type: boolean
      example:
        enabled: true
        groups:
          - id: tasks
            enabled: true
            allow_writes: true
    JsonRpcMessage:
      type: object
      description: One JSON-RPC 2.0 message, as MCP uses them.
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type: [string, integer, 'null']
        method:
          type: string
        params:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
            data: {}
      additionalProperties: true
    MemoryItem:
      type: object
      required: [id, kind, title, content, tags, revision, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [document, entry]
        title:
          type: string
        content:
          type: [string, 'null']
        tags:
          type: array
          items:
            type: string
        revision:
          type: integer
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MemoryItemWrite:
      type: object
      required: [content]
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
          maxLength: 262144
        tags:
          type: array
          items:
            type: string
        revision:
          type: [integer, 'null']
    Journey:
      type: object
      description: >-
        What the agent has learned in one profile (Hermes's learning graph). `nodes` carry
        Hermes's ids unchanged — a skill's name, or `memory:<memory|profile>:<n>` for a memory,
        where `n` counts the entries of `MEMORY.md` and then of `USER.md` together (so the first
        `USER.md` entry after two `MEMORY.md` ones is `memory:profile:2`) — so a client can name
        them the way Hermes does.
      required: [nodes, edges, clusters]
      properties:
        nodes:
          type: array
          items:
            type: object
            required:
              [
                id,
                label,
                kind,
                category,
                use_count,
                pinned,
                state,
                agent_created,
                memory_source,
                learned_at,
              ]
            properties:
              id:
                type: string
              label:
                type: string
                description: A skill's name; a memory's first line (Hermes cuts it at 80 characters).
              kind:
                type: string
                enum: [skill, memory]
              category:
                type: [string, 'null']
                description: The skill's category (its folder, or its front matter); `memory` for a memory.
              use_count:
                type: integer
                description: How often the agent used the skill (Hermes's count); always 0 for a memory.
              pinned:
                type: boolean
                description: Pinned in Hermes, so its curator leaves the skill alone.
              state:
                type: string
                enum: [active, stale, archived]
                description: Hermes's curator state of the skill; a memory is `active`.
              agent_created:
                type: boolean
                description: The agent wrote this skill itself (Hermes's `created_by = agent`).
              memory_source:
                type: [string, 'null']
                enum: [memory, user, null]
                description: For a memory, the file it is in (`MEMORY.md` or `USER.md`); null for a skill.
              learned_at:
                oneOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
                description: >-
                  Hermes's time for the node: a skill's last use (or its file's time when never
                  recorded), a memory file's time.
        edges:
          type: array
          items:
            type: object
            required: [source, target]
            properties:
              source:
                type: string
              target:
                type: string
        clusters:
          type: array
          description: How many nodes each category has, the largest first.
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer
    AgentPlugin:
      type: object
      description: >-
        One plugin as the agent's runtime lists it. For Hermes, `name`, `version`,
        `description` and `status` are Hermes's own; `provides_tools`, `provides_hooks`,
        `requires_env` and `entries` are empty because Hermes's list does not report them, and
        `configured` is always true for the same reason.
      required:
        [
          key,
          name,
          kind,
          source,
          status,
          version,
          description,
          author,
          configured,
          enabled,
          manageable,
          removable,
          provides_tools,
          provides_hooks,
          requires_env,
          entries,
        ]
      properties:
        key:
          type: string
          description: What the plugin is addressed by (Hermes's plugin name).
        name:
          type: string
        kind:
          type: string
          enum: [standalone, bundled, preset]
        source:
          type: string
          description: >-
            `bundled`: ships with the runtime; `user`: installed into this profile (from the
            catalog, Git, or by hand); `external`: registered by an installed Python package.
          enum: [bundled, user, external]
        status:
          type: string
          description: >-
            Hermes's word for it: `enabled` (on its allow list), `disabled` (on its deny list,
            which wins), `not_enabled` (on neither — Hermes plugins are opt-in, so it does
            not load).
          enum: [enabled, disabled, not_enabled]
        version:
          type: [string, 'null']
        description:
          type: [string, 'null']
        author:
          type: [string, 'null']
        configured:
          type: boolean
        enabled:
          type: boolean
          description: '`status == enabled`.'
        manageable:
          type: boolean
          description: Whether `PATCH` may switch it on or off.
        removable:
          type: boolean
          description: Whether `DELETE` may remove it (installed into the profile, not shipped).
        provides_tools:
          type: array
          items:
            type: string
        provides_hooks:
          type: array
          items:
            type: string
        requires_env:
          type: array
          items:
            type: string
        entries:
          type: array
          description: Sub-entries of preset-style plugins; `enabled` may be `conditional`.
          items:
            type: object
            required: [id, title, enabled]
            properties:
              id:
                type: string
              title:
                type: string
              description:
                type: [string, 'null']
              enabled:
                type: string
                enum: ['true', 'false', conditional]
    AgentPreset:
      type: object
      required: [id, name, description, trust, is_default, broken, content]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        trust:
          type: string
          enum: [system, user]
        is_default:
          type: boolean
        broken:
          type: boolean
        content:
          type: [string, 'null']
    ChannelField:
      type: object
      required: [key, label, kind, target, value, hint]
      properties:
        key:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedText'
        kind:
          type: string
          enum: [text, secret, toggle, list]
        target:
          type: string
          enum: [credentials, configuration]
        value: {}
        hint:
          type: [string, 'null']
    Channel:
      type: object
      required:
        [
          platform,
          label,
          enabled,
          configured,
          exclusive,
          status,
          error,
          restart_needed,
          login,
          link,
          fields,
        ]
      properties:
        platform:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        configured:
          type: boolean
        exclusive:
          type: boolean
          description: One identity may belong to a single workspace.
        status:
          type: string
          enum: [online, offline, error, unknown]
        error:
          type: [string, 'null']
        restart_needed:
          type: boolean
          description: >-
            True when the channel is switched on and linked but the messaging gateway serving the
            profile, although running, started before it and does not serve it: Hermes reads its
            channels only when it starts, so the channel stays `offline` until that gateway
            restarts. A client says so on the channel and offers `agents.restart`. Always false
            where the hub does not run Hermes.
        login:
          type: [string, 'null']
          enum: [qr, token, credentials, null]
          description: >-
            How the platform is linked instead of by fields: `qr` pairs interactively via
            `/login` (WhatsApp), `token` takes a bot token via `/link` (Telegram), `credentials`
            takes the variables `agents.listChannelPlatforms` declares for it via `/link`.
        link:
          description: >-
            For a platform that is linked rather than filled in: WhatsApp (whether this profile
            holds a session and whose, read from the profile's session folder), Telegram
            (whether the profile has a bot token, and which bot) and every platform linked by
            credentials (whether the required ones are in the profile's `.env`, and — where the
            hub asked the platform when it was linked — whose account). Null for a platform the
            hub does not know. For all of them `configured` is `link.linked`.
          oneOf:
            - $ref: '#/components/schemas/ChannelLink'
            - type: 'null'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ChannelField'
    ChannelLink:
      type: object
      required: [linked, account_id, account_name, account_phone, account_username, mode]
      properties:
        linked:
          type: boolean
        account_id:
          type: [string, 'null']
        account_name:
          type: [string, 'null']
        account_phone:
          type: [string, 'null']
          description: Digits only, as WhatsApp names the account. Null for Telegram.
        account_username:
          type: [string, 'null']
          description: >-
            The account's handle as the platform answered when it was linked, without an @:
            Telegram's bot @username (people open it at `https://t.me/<account_username>`), the
            Discord, Slack or Mattermost bot's user name, the Matrix user id, the email address.
            Null for WhatsApp.
        mode:
          description: >-
            WhatsApp only, null for every other platform: how Hermes uses the linked number, read
            from the profile's `WHATSAPP_MODE`. `bot` — a number dedicated to the agent: other
            people message it and a new sender gets a pairing code to approve; the account owner's
            own messages are not taken as requests. `self-chat` — the person's own number: only
            what the account owner writes in their own "Message yourself" chat reaches the agent,
            the agent answers there, and nobody else who messages the number is answered or sent a
            pairing code. With no `WHATSAPP_MODE` Hermes runs `self-chat`, and it reads so; a value
            Hermes does not know reads as null.
          type: [string, 'null']
          enum: [bot, self-chat, null]
    ChannelLoginRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [bot, self-chat]
          default: bot
          description: >-
            How the number being linked will be used (`ChannelLink.mode`). A client asks the
            person; it does not guess from the number.
    ChannelModeWrite:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [bot, self-chat]
    ChannelGateway:
      type: object
      required: [profile, state, applies, error]
      properties:
        profile:
          type: string
          description: Hermes's profile name (`default` for the default profile).
        state:
          type: string
          enum: [running, starting, stopped, error]
          description: >-
            `stopped` in a named profile means no channel there is switched on and linked, so no
            gateway runs for it.
        applies:
          type: string
          enum: [now, on_restart]
        error:
          type: [string, 'null']
    MessagingGateway:
      type: object
      description: >-
        A named profile has one while it has a channel switched on and linked, or an active
        scheduled job of Hermes's own: Hermes fires a profile's jobs only in a gateway scoped
        to that profile.
      required: [profile, state, pid, restarts, started_at, error, channels, scheduled_jobs]
      properties:
        profile:
          type: string
        state:
          type: string
          enum: [running, starting, stopped, error]
        pid:
          type: [integer, 'null']
        restarts:
          type: integer
          minimum: 0
        started_at:
          type: [string, 'null']
          format: date-time
        error:
          type: [string, 'null']
        channels:
          type: array
          items:
            type: string
        scheduled_jobs:
          type: integer
          minimum: 0
          description: Hermes's scheduled jobs in the profile that are neither paused nor finished.
    PairingRequest:
      type: object
      required: [platform, request_id, user_id, user_name, requested_at]
      properties:
        platform:
          type: string
        request_id:
          type: string
        user_id:
          type: string
        user_name:
          type: [string, 'null']
        requested_at:
          type: string
          format: date-time
    PairedSender:
      type: object
      required: [platform, user_id, user_name, approved_at]
      properties:
        platform:
          type: string
        user_id:
          type: string
        user_name:
          type: [string, 'null']
        approved_at:
          type: [string, 'null']
          format: date-time
    PairingList:
      type: object
      required: [pending, approved]
      properties:
        pending:
          type: array
          items:
            $ref: '#/components/schemas/PairingRequest'
        approved:
          type: array
          items:
            $ref: '#/components/schemas/PairedSender'
    ChannelSettings:
      type: object
      required: [platform, options]
      properties:
        platform:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/ChannelSetting'
    ChannelSetting:
      type: object
      required: [key, section, kind, value, default, choices, min, max, shared, source]
      properties:
        key:
          type: string
          description: Stable name of the option; clients key their label and help text on it.
        section:
          type: string
          enum: [access, replies, groups, media, advanced]
        kind:
          type: string
          enum: [toggle, select, number, text, list]
          description: >-
            `toggle` a boolean, `select` one of `choices`, `number` an integer between `min`
            and `max`, `text` a string, `list` an array of strings.
        value:
          description: What the profile sets; null while unset.
        default:
          description: What applies while `value` is null; null when nothing does.
        choices:
          type: [array, 'null']
          items:
            type: string
        min:
          type: [integer, 'null']
        max:
          type: [integer, 'null']
        shared:
          type: boolean
          description: >-
            Kept once for the profile rather than for this channel: changing it changes
            WhatsApp and every other channel of the profile too.
        source:
          type: [string, 'null']
          enum: [config, env, null]
    ChannelSettingsWrite:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          minProperties: 1
          maxProperties: 50
          description: Option key → new value; null removes it so the default applies.
          additionalProperties: {}
    ChannelPlatformList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChannelPlatform'
    ChannelPlatform:
      type: object
      required:
        [
          platform,
          label,
          support,
          login,
          credentials,
          allowed_users_key,
          validates,
          pairs,
          allowlist,
          settings,
          exclusive,
          packages,
          inbound,
          program,
          docs_url,
        ]
      properties:
        platform:
          type: string
          description: Hermes's name for the platform, as `Channel.platform` has it.
        label:
          type: string
          description: The platform's own name (a proper noun, not translated).
        support:
          type: string
          enum: [full, generic]
          description: >-
            `full`: linked with a dialog of its own, checked with the platform, named once
            linked, with its own settings. `generic`: a form of the declared variables, stored
            unchecked.
        login:
          type: string
          enum: [qr, token, credentials]
        credentials:
          type: array
          description: The variables `agents.linkChannel` takes for it, in the order to ask them.
          items:
            $ref: '#/components/schemas/ChannelCredentialField'
        allowed_users_key:
          type: [string, 'null']
          description: The allowlist variable `allowed_users` is written to; null when none.
        validates:
          type: boolean
        pairs:
          type: boolean
          description: >-
            Linking switches pairing on (`unauthorized_dm_behavior: pair`): a stranger who
            messages the agent gets a pairing code to approve in `agents.listPairing`. False where
            Hermes drops strangers (see `allowlist`) and for `generic` platforms, whose strangers
            are left to Hermes's own default.
        allowlist:
          type: boolean
          description: >-
            Hermes answers nobody on this platform until the allowlist names them (a stranger is
            dropped, never offered a code).
        settings:
          type: boolean
          description: '`agents.getChannelSettings` has options for it.'
        exclusive:
          type: boolean
          description: One identity may be linked in one profile only.
        packages:
          type: string
          enum: [image, first_use, none]
          description: >-
            Where Hermes's library for the platform comes from: already in the image, downloaded
            from PyPI the first time its gateway starts, or nothing beyond Hermes itself.
        inbound:
          type: boolean
          description: >-
            It receives messages on a webhook, so it needs an address reachable from the
            internet that the hub's image does not open by itself.
        program:
          type: [string, 'null']
          description: >-
            The name of an outside program Hermes runs for this platform that neither Hermes nor
            the hub's image carries (Raft's `raft`, Buzz's `buzz`): it has to be installed on the
            server before the platform can work. Null when Hermes needs nothing outside itself.
        docs_url:
          type: [string, 'null']
          description: Where the platform's app or bot is made.
    ChannelCredentialField:
      type: object
      required: [key, kind, required]
      properties:
        key:
          type: string
          description: The environment variable Hermes reads.
        kind:
          type: string
          enum: [secret, text, url, email, host, number]
          description: '`secret` is never returned once stored.'
        required:
          type: boolean
    ChannelTokenLink:
      type: object
      additionalProperties: false
      description: >-
        `token` for Telegram; `credentials` for every other platform of
        `agents.listChannelPlatforms`. One of the two is required.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
          writeOnly: true
          description: The bot token @BotFather gave (Telegram). Stored, never returned.
        credentials:
          type: object
          writeOnly: true
          minProperties: 1
          maxProperties: 20
          description: >-
            The platform's credential variables, keyed by the name Hermes reads
            (`ChannelPlatform.credentials[].key`). Stored in the profile's `.env`; the secret
            ones are never returned. An optional one left empty is removed.
          additionalProperties:
            type: string
            maxLength: 4000
        allowed_users:
          type: array
          maxItems: 100
          description: >-
            The people who may message the agent without pairing, as the platform names them
            (Telegram and Discord user ids, Slack member ids, Matrix user ids, email addresses),
            written to the platform's allowlist variable (`TELEGRAM_ALLOWED_USERS`,
            `DISCORD_ALLOWED_USERS`, …). Absent leaves what is set; empty clears it.
          items:
            type: string
            pattern: '^[^,\s]{1,320}$'
    ChannelWrite:
      type: object
      properties:
        enabled:
          type: boolean
        credentials:
          type: object
          additionalProperties:
            type: string
        configuration:
          type: object
          additionalProperties: true
    # ---------------------------------------------------------------- rooms
    SummaryPolicy:
      type: object
      required: [every_turns, model, provider]
      properties:
        every_turns:
          type: integer
          minimum: 0
          description: Re-summarize the room every N turns; 0 disables.
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
    HandoffPolicy:
      type: object
      required: [enabled, max_depth]
      properties:
        enabled:
          type: boolean
        max_depth:
          type: [integer, 'null']
          minimum: 1
          description: '`null` = unlimited.'
    SeatStatus:
      type: string
      enum: [idle, queued, thinking, running, waiting_approval, offline]
    SeatExecutor:
      type: object
      description: Where the seat's agent runs — on the hub or on a linked device (Phase 3).
      required: [kind, device_id]
      properties:
        kind:
          type: string
          enum: [server, device]
        device_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    SeatConfig:
      type: object
      description: The editable part of a seat; also the body of a seat preset.
      required: [agent_id, name]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique per room; `all` is reserved.
        description:
          type: [string, 'null']
          maxLength: 300
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        instructions:
          type: [string, 'null']
          maxLength: 8000
          description: Seat-specific system instructions.
        preset_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
    Seat:
      type: object
      required:
        [
          id,
          room_id,
          agent_id,
          name,
          description,
          avatar,
          model,
          provider,
          reasoning_effort,
          instructions,
          preset_id,
          status,
          executor,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        room_id:
          $ref: '#/components/schemas/Ulid'
        agent_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        description:
          type: [string, 'null']
        avatar:
          $ref: '#/components/schemas/Avatar'
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        instructions:
          type: [string, 'null']
        preset_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        status:
          $ref: '#/components/schemas/SeatStatus'
        executor:
          $ref: '#/components/schemas/SeatExecutor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    SeatWrite:
      $ref: '#/components/schemas/SeatConfig'
    SeatPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: [string, 'null']
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        instructions:
          type: [string, 'null']
        preset_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
    Member:
      type: object
      required: [id, room_id, user_id, name, avatar, role, online, joined_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        room_id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        avatar:
          $ref: '#/components/schemas/Avatar'
        role:
          type: string
          enum: [owner, manager, member]
        online:
          type: boolean
        joined_at:
          $ref: '#/components/schemas/Timestamp'
    Room:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              name,
              working_dir,
              invite_code,
              can_manage,
              can_mention_all,
              member_count,
              total_tokens,
              summary_policy,
              handoff,
              seats,
              last_active_at,
              lead_seat_id,
              archived_at,
            ]
          properties:
            name:
              type: string
              maxLength: 120
            working_dir:
              type: [string, 'null']
            invite_code:
              type: [string, 'null']
              description: Only managers see it; others get `null`.
            can_manage:
              type: boolean
              description: Whether the caller may edit the room.
            can_mention_all:
              type: boolean
              description: Whether a person may address every seat at once with `@all`.
            lead_seat_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
              description: |
                The seat that answers a message that mentions nobody (DECISIONS §69). The first
                seat added becomes the lead; `null` means such a message is only read.
            archived_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
              description: Set while the room is archived; an archived room refuses new messages.
            member_count:
              type: integer
            total_tokens:
              type: integer
            summary_policy:
              $ref: '#/components/schemas/SummaryPolicy'
            handoff:
              $ref: '#/components/schemas/HandoffPolicy'
            seats:
              type: array
              items:
                $ref: '#/components/schemas/Seat'
            last_active_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    RoomMemory:
      type: object
      required: [summary, status, summarized_turn_count, error, updated_at]
      properties:
        summary:
          type: [string, 'null']
        status:
          type: string
          enum: [idle, summarizing, error]
        summarized_turn_count:
          type: integer
        error:
          type: [string, 'null']
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    HandoffChain:
      type: object
      required:
        [
          id,
          room_id,
          from_seat_id,
          to_seat_id,
          status,
          stop_reason,
          depth,
          max_depth,
          continue_used,
          error,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        room_id:
          $ref: '#/components/schemas/Ulid'
        from_seat_id:
          $ref: '#/components/schemas/Ulid'
        to_seat_id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum: [active, stopped, completed, failed]
        stop_reason:
          type: [string, 'null']
          enum: [max_depth, loop_detected, interrupted, error, null]
        depth:
          type: integer
        max_depth:
          type: [integer, 'null']
        continue_used:
          type: boolean
        error:
          type: [string, 'null']
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TypingIndicator:
      type: object
      required: [member_id, name]
      properties:
        member_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
    RoomDetail:
      allOf:
        - $ref: '#/components/schemas/Room'
        - type: object
          required: [members, runs, pending_approvals, handoff_chains, memory, typing]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/Member'
            runs:
              type: array
              description: Active and queued runs across seats.
              items:
                $ref: '#/components/schemas/Run'
            pending_approvals:
              type: array
              items:
                $ref: '#/components/schemas/Approval'
            handoff_chains:
              type: array
              items:
                $ref: '#/components/schemas/HandoffChain'
            memory:
              $ref: '#/components/schemas/RoomMemory'
            typing:
              type: array
              items:
                $ref: '#/components/schemas/TypingIndicator'
    RoomCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        working_dir:
          type: [string, 'null']
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatConfig'
        summary_policy:
          $ref: '#/components/schemas/SummaryPolicy'
        handoff:
          $ref: '#/components/schemas/HandoffPolicy'
        can_mention_all:
          type: boolean
          default: true
    RoomCreated:
      type: object
      required: [room, seat_results]
      properties:
        room:
          $ref: '#/components/schemas/Room'
        seat_results:
          type: array
          items:
            type: object
            required: [id, ok, error]
            properties:
              id:
                oneOf:
                  - $ref: '#/components/schemas/Ulid'
                  - type: 'null'
              ok:
                type: boolean
              error:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: 'null'
    RoomPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        working_dir:
          type: [string, 'null']
        summary_policy:
          $ref: '#/components/schemas/SummaryPolicy'
        handoff:
          $ref: '#/components/schemas/HandoffPolicy'
        can_mention_all:
          type: boolean
        lead_seat_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: A seat of this room, or `null` for no default responder.
        archived:
          type: boolean
          description: Archive (`true`) or bring back (`false`) the room.
    RoomInvite:
      type: object
      required: [invite_code, join_url]
      properties:
        invite_code:
          type: string
        join_url:
          type: string
          format: uri
    RoomInvitePreview:
      type: object
      required: [room_id, profile, name, seat_count, member_count, already_member]
      properties:
        room_id:
          $ref: '#/components/schemas/Ulid'
        profile:
          $ref: '#/components/schemas/ProfileSlug'
        name:
          type: string
        seat_count:
          type: integer
        member_count:
          type: integer
        already_member:
          type: boolean
    RoomMessageCreate:
      type: object
      required: [content]
      properties:
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContentBlock'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Mention'
        reply_to_message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    RoomMessageAccepted:
      type: object
      required: [message_id, runs]
      properties:
        message_id:
          $ref: '#/components/schemas/Ulid'
        runs:
          type: array
          items:
            type: object
            required: [seat_id, run_id, job_id, queue_position]
            properties:
              seat_id:
                $ref: '#/components/schemas/Ulid'
              run_id:
                $ref: '#/components/schemas/Ulid'
              job_id:
                $ref: '#/components/schemas/Ulid'
              queue_position:
                type: [integer, 'null']
    SeatPreset:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [name, agent_id, seat, available, validation_error]
          properties:
            name:
              type: string
            agent_id:
              $ref: '#/components/schemas/Ulid'
            seat:
              $ref: '#/components/schemas/SeatConfig'
            available:
              type: boolean
              description: False when the agent or model it names is no longer usable.
            validation_error:
              type: [string, 'null']
    SeatPresetWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        seat:
          $ref: '#/components/schemas/SeatConfig'
    # ---------------------------------------------------------------- tasks
    ProjectStatus:
      type: string
      enum: [active, paused, archived]
    StatusCounts:
      type: object
      required: [total, by_status]
      properties:
        total:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
    Project:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              name,
              description,
              status,
              color,
              repo_url,
              working_dir,
              default_branch,
              default_agent_id,
              report_room_id,
              auto_dispatch,
              counts,
            ]
          properties:
            name:
              type: string
              maxLength: 120
            description:
              type: [string, 'null']
            status:
              $ref: '#/components/schemas/ProjectStatus'
            color:
              type: [string, 'null']
              pattern: '^#[0-9a-fA-F]{6}$'
            repo_url:
              type: [string, 'null']
            working_dir:
              type: [string, 'null']
              description: >-
                The project's git repository on the hub host: an absolute path inside the profile's
                own folder (`${DATA_DIR}/workspaces/<profile>`, the folder its sessions work in). A
                relative path is taken from that folder when written. When set, starting one of the
                project's tasks makes the task a git worktree of this repository, under
                `${DATA_DIR}/workspaces/<profile>/worktrees/`, and its run works there.
            default_branch:
              type: [string, 'null']
              description: >-
                The branch a task's worktree branches from. When `working_dir` is written without
                it, it becomes the branch checked out in the repository.
            default_agent_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            report_room_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
              description: Room where assigned agents post progress.
            auto_dispatch:
              type: boolean
              description: Assign `ready` tasks automatically (see `/task-dispatches`).
            counts:
              $ref: '#/components/schemas/StatusCounts'
    ProjectWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ProjectStatus'
        color:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
        repo_url:
          type: [string, 'null']
        working_dir:
          type: [string, 'null']
        default_branch:
          type: [string, 'null']
        default_agent_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        report_room_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        auto_dispatch:
          type: boolean
    TaskStatus:
      type: string
      description: The nine columns, in workflow order. `triage` is intake, `running` belongs to the worker.
      enum: [triage, todo, ready, scheduled, running, blocked, review, done, archived]
    TaskPriority:
      type: string
      enum: [low, normal, high, urgent]
    Assignee:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [agent, user]
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
    Worktree:
      type: object
      description: >-
        A task's own git worktree of its project's repository, on a branch named from the task
        (`task/<short id>-<slug of the title>`). Made when the task is started (or by
        `tasks.createWorktree`); removed — the branch kept — when the task is deleted or archived,
        or by `tasks.deleteWorktree`. A removed worktree reads as `null` on the task.
      required: [path, branch, base_branch, status, ahead, behind, changed_files, error, updated_at]
      properties:
        path:
          type: string
        branch:
          type: string
        base_branch:
          type: string
        status:
          type: string
          description: >-
            `creating` while git makes it; `ready`, or `dirty` when it has uncommitted changes;
            `error` when git refused (to make it or to remove it) — `error` then holds git's own
            message. `merged` and `removed` are reserved.
          enum: [creating, ready, dirty, merged, removed, error]
        ahead:
          type: integer
        behind:
          type: integer
        changed_files:
          type: integer
        error:
          type: [string, 'null']
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Task:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              project_id,
              title,
              description,
              status,
              priority,
              tags,
              assignee,
              auto_start,
              position,
              blocked_reason,
              status_reason,
              subtask_counts,
              depends_on,
              worktree,
              session_id,
              last_run,
              attempt_count,
              latest_summary,
              due_at,
              started_at,
              completed_at,
              archived_at,
              attachment_ids,
            ]
          properties:
            project_id:
              $ref: '#/components/schemas/Ulid'
            title:
              type: string
              maxLength: 300
            description:
              type: [string, 'null']
            status:
              $ref: '#/components/schemas/TaskStatus'
            priority:
              $ref: '#/components/schemas/TaskPriority'
            tags:
              type: array
              items:
                type: string
            assignee:
              oneOf:
                - $ref: '#/components/schemas/Assignee'
                - type: 'null'
            auto_start:
              type: boolean
              description: >-
                Start a run on its own as soon as the task is `ready` and given to an agent (created
                so, assigned, moved to `ready`, or switched on while so) — at most
                `COREHUB_TASK_AUTO_START_MAX` (2) runs started this way at once per profile; the rest
                wait their turn, top of the column first. Stopping the task (from the board or the
                chat) switches it off, so a stopped task does not start again by itself. A task that
                cannot start goes to `blocked` with the reason.
            position:
              type: string
              description: Fractional index within the column; the server keeps it, clients never compute it.
            blocked_reason:
              type: [string, 'null']
            status_reason:
              type: [string, 'null']
            subtask_counts:
              type: object
              required: [total, done]
              properties:
                total:
                  type: integer
                done:
                  type: integer
            depends_on:
              type: array
              items:
                $ref: '#/components/schemas/Ulid'
            worktree:
              oneOf:
                - $ref: '#/components/schemas/Worktree'
                - type: 'null'
            session_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
              description: The task session (source `task`) the assignee works in.
            last_run:
              type: object
              required: [id, status, finished_at]
              properties:
                id:
                  oneOf:
                    - $ref: '#/components/schemas/Ulid'
                    - type: 'null'
                status:
                  oneOf:
                    - $ref: '#/components/schemas/RunStatus'
                    - type: 'null'
                finished_at:
                  oneOf:
                    - $ref: '#/components/schemas/Timestamp'
                    - type: 'null'
            attempt_count:
              type: integer
            latest_summary:
              type: [string, 'null']
              description: The assignee's last progress summary.
            due_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            started_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            completed_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            archived_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            attachment_ids:
              type: array
              items:
                $ref: '#/components/schemas/Ulid'
            external:
              description: >-
                Set when this card reflects a card on an agent's own board (today: Hermes's
                kanban). That board owns the card: its title and description are read-only
                here, moves are asked of it first, and it may refuse them.
              oneOf:
                - type: object
                  required: [source, id]
                  properties:
                    source:
                      type: string
                      enum: [hermes]
                    id:
                      type: string
                      maxLength: 64
                      description: The card's id on that board.
                - type: 'null'
    Subtask:
      type: object
      required: [id, task_id, index, title, status, note, blocked_reason, completed_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        task_id:
          $ref: '#/components/schemas/Ulid'
        index:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done, blocked, skipped]
        note:
          type: [string, 'null']
        blocked_reason:
          type: [string, 'null']
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    SubtaskWrite:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        status:
          type: string
          enum: [todo, in_progress, review, done, blocked, skipped]
        note:
          type: [string, 'null']
        blocked_reason:
          type: [string, 'null']
        index:
          type: integer
          minimum: 0
    Comment:
      type: object
      required: [id, task_id, author, content, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        task_id:
          $ref: '#/components/schemas/Ulid'
        author:
          $ref: '#/components/schemas/Author'
        content:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
    Activity:
      type: object
      required: [id, task_id, kind, actor, data, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        task_id:
          $ref: '#/components/schemas/Ulid'
        kind:
          type: string
          enum:
            [
              created,
              moved,
              updated,
              assigned,
              unassigned,
              run_started,
              run_finished,
              comment,
              subtask,
              worktree,
            ]
        actor:
          $ref: '#/components/schemas/Author'
        data:
          type: object
          additionalProperties: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [subtasks, comments, runs]
          properties:
            subtasks:
              type: array
              items:
                $ref: '#/components/schemas/Subtask'
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            runs:
              type: array
              description: Recent runs, newest first (max 20; the rest via the task session).
              items:
                $ref: '#/components/schemas/Run'
    TaskCreate:
      type: object
      required: [title]
      properties:
        project_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: >-
            Omit it and the task lands in the workspace's own project, created on first
            use. A person writing down something to do should not have to invent a
            container for it first.

        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [triage, todo, ready]
          default: triage
        priority:
          $ref: '#/components/schemas/TaskPriority'
        tags:
          type: array
          items:
            type: string
        assignee_agent_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        auto_start:
          type: boolean
          default: false
          description: See `Task.auto_start`.
        due_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        subtasks:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title:
                type: string
        attachment_ids:
          type: array
          items:
            $ref: '#/components/schemas/Ulid'
    TaskPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: [string, 'null']
        priority:
          $ref: '#/components/schemas/TaskPriority'
        tags:
          type: array
          items:
            type: string
        auto_start:
          type: boolean
        due_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        project_id:
          $ref: '#/components/schemas/Ulid'
        attachment_ids:
          type: array
          items:
            $ref: '#/components/schemas/Ulid'
    TaskBulkUpdate:
      type: object
      required: [task_ids, patch]
      properties:
        task_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Ulid'
        patch:
          type: object
          properties:
            archived:
              type: boolean
              description: '`true` moves `done` tasks to `archived`; `false` restores them to `done`.'
            priority:
              $ref: '#/components/schemas/TaskPriority'
            tags:
              type: array
              items:
                type: string
            project_id:
              $ref: '#/components/schemas/Ulid'
    TaskMove:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'
        reason:
          type: [string, 'null']
          description: Required for `blocked`; shown as `blocked_reason` / `status_reason`.
        summary:
          type: [string, 'null']
          description: Optional note for `review` and `done`.
        after_task_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    TaskAssign:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        instructions:
          type: [string, 'null']
          maxLength: 8000
        start:
          type: boolean
          default: false
          description: Open the task session and queue its run now. Without it the task is only assigned, and `TaskAssigned` carries `null` ids.
        profile:
          oneOf:
            - $ref: '#/components/schemas/ProfileSlug'
            - type: 'null'
          description: >-
            Only for a card on Hermes's own kanban (`Task.external.source: hermes`): hand it to
            this workspace's Hermes profile — a workspace is a Hermes profile — and the card
            moves to that workspace. Hermes does the reassignment; a running card has its run
            stopped by Hermes first, so a client asks the person before sending it. `agent_id`
            is the Hermes agent. Ignored for any other card.
    TaskAssigned:
      type: object
      required: [job_id, run_id, session_id, task_id]
      properties:
        job_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        task_id:
          $ref: '#/components/schemas/Ulid'
    DispatchRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          $ref: '#/components/schemas/Ulid'
        max:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        dry_run:
          type: boolean
          default: false
    TaskColumns:
      type: object
      required: [project_id, columns, counts]
      properties:
        project_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The project asked for with `project_id`; `null` for the board of every project.
        columns:
          type: array
          items:
            type: object
            required: [status, count, tasks]
            properties:
              status:
                $ref: '#/components/schemas/TaskStatus'
              count:
                type: integer
              tasks:
                type: array
                description: In `position` order.
                items:
                  $ref: '#/components/schemas/Task'
        counts:
          $ref: '#/components/schemas/StatusCounts'
    # ---------------------------------------------------------------- schedules
    ScheduleTrigger:
      type: object
      description: When to fire. `expression` for `cron` (5 fields), `every_minutes` for `interval`, `run_at` for `once`.
      required: [kind, expression, every_minutes, run_at, timezone]
      properties:
        kind:
          type: string
          enum: [cron, interval, once]
        expression:
          type: [string, 'null']
        every_minutes:
          type: [integer, 'null']
          minimum: 1
        run_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        timezone:
          type: string
          description: IANA zone the expression is evaluated in.
        display:
          type: string
          description: Server-rendered, localized description (read-only).
    ScheduleTarget:
      type: object
      description: What to run — a prompt to an agent, or a workflow.
      required: [kind, agent_id, prompt, model, provider, skills, workflow_id, input]
      properties:
        kind:
          type: string
          enum: [agent_prompt, workflow]
        agent_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        prompt:
          type: [string, 'null']
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        skills:
          type: array
          items:
            type: string
        workflow_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        input:
          type: [string, 'null']
    DeliveryTarget:
      type: object
      description: Where the output goes. `none` keeps it in history only.
      required: [kind, room_id, channel, address]
      properties:
        kind:
          type: string
          enum: [none, notice, room, channel]
        label:
          type: string
          description: Display label (read-only in listings).
        room_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        channel:
          type: [string, 'null']
          description: Messaging platform slug when `kind = channel`.
        address:
          type: [string, 'null']
          description: Chat/channel id on that platform.
    Schedule:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              name,
              trigger,
              target,
              delivery,
              repeat,
              enabled,
              state,
              next_run_at,
              last_run_at,
              last_status,
              last_error,
              last_delivery_error,
              run_if_missed,
              overlap,
            ]
          properties:
            name:
              type: string
              maxLength: 120
            trigger:
              $ref: '#/components/schemas/ScheduleTrigger'
            target:
              $ref: '#/components/schemas/ScheduleTarget'
            delivery:
              $ref: '#/components/schemas/DeliveryTarget'
            repeat:
              type: object
              required: [limit, completed]
              properties:
                limit:
                  type: [integer, 'null']
                  minimum: 1
                  description: '`null` = unlimited.'
                completed:
                  type: integer
            enabled:
              type: boolean
            state:
              type: string
              enum: [scheduled, running, paused, exhausted]
            next_run_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_run_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_status:
              oneOf:
                - $ref: '#/components/schemas/JobStatus'
                - type: 'null'
            last_error:
              type: [string, 'null']
            last_delivery_error:
              type: [string, 'null']
            run_if_missed:
              description: >-
                Whether a time missed while the hub was not running still runs, once, when
                the hub is back within 24 hours of it (DECISIONS §40). `false` skips it and
                records why in the history. A run up to two minutes late is on time and
                runs either way. `null` for a schedule in an agent's own scheduler
                (`external`), which decides this itself.
              type: [boolean, 'null']
            overlap:
              description: >-
                What happens when this schedule's time comes and its previous run is still
                going (DECISIONS §40): `skip` records the time as skipped; `wait` runs it as
                soon as the previous run ends, with at most one time waiting (a further one
                is skipped and recorded); `parallel` starts it alongside, in a session of its
                own; `replace` stops the previous run, then starts. "Run now" always starts
                at once and stops nothing. `null` for a schedule in an agent's own scheduler
                (`external`), which decides this itself.
              oneOf:
                - $ref: '#/components/schemas/ScheduleOverlap'
                - type: 'null'
            external:
              description: >-
                Set when this schedule lives in an agent's own scheduler (today: Hermes's
                cron). That scheduler fires it and is the source of truth: edits are asked
                of it first and it may refuse them, and the next run, last run and state are
                what it reports.
              oneOf:
                - type: object
                  required: [source, id]
                  properties:
                    source:
                      type: string
                      enum: [hermes]
                    id:
                      type: string
                      maxLength: 64
                      description: The job's id in that scheduler.
                - type: 'null'
    ScheduleWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        trigger:
          $ref: '#/components/schemas/ScheduleTrigger'
        target:
          $ref: '#/components/schemas/ScheduleTarget'
        delivery:
          $ref: '#/components/schemas/DeliveryTarget'
        repeat:
          type: object
          properties:
            limit:
              type: [integer, 'null']
              minimum: 1
        enabled:
          type: boolean
        run_if_missed:
          type: boolean
          description: >-
            `Schedule.run_if_missed`; `false` when a new schedule does not say. Refused for a
            schedule in Hermes's scheduler (`409`, `details.reason = hermes_run_options`).
        overlap:
          allOf:
            - $ref: '#/components/schemas/ScheduleOverlap'
          description: >-
            `Schedule.overlap`; `wait` when a new schedule does not say. Refused for a schedule
            in Hermes's scheduler (`409`, `details.reason = hermes_run_options`).
    ScheduleOverlap:
      type: string
      enum: [skip, wait, parallel, replace]
      description: >-
        What a schedule does when its time comes while its previous run is still going. See
        `Schedule.overlap`.
    ScheduleRun:
      type: object
      required:
        [
          id,
          schedule_id,
          job_id,
          run_id,
          session_id,
          workflow_run_id,
          status,
          trigger,
          waiting,
          output_preview,
          output,
          output_size_bytes,
          error,
          delivery_status,
          delivery_error,
          started_at,
          finished_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        schedule_id:
          $ref: '#/components/schemas/Ulid'
        job_id:
          $ref: '#/components/schemas/Ulid'
        run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        workflow_run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        status:
          $ref: '#/components/schemas/JobStatus'
        trigger:
          type: string
          enum: [schedule, manual]
        waiting:
          type: boolean
          description: >-
            `true` while this time waits for the schedule's previous run to end (`overlap:
            wait`); its `status` is `queued`. It starts when that run ends.
        output_preview:
          type: [string, 'null']
        output:
          type: [string, 'null']
          description: Full text; only on the single-run read.
        output_size_bytes:
          type: integer
        error:
          type: [string, 'null']
        delivery_status:
          type: string
          enum: [none, pending, delivered, failed]
        delivery_error:
          type: [string, 'null']
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ScheduleRunAccepted:
      allOf:
        - $ref: '#/components/schemas/JobAccepted'
        - type: object
          required: [schedule_run_id, session_id, run_id, workflow_run_id]
          properties:
            schedule_run_id:
              $ref: '#/components/schemas/Ulid'
            session_id:
              description: The session an `agent_prompt` run talks in; `null` for a workflow or a Hermes schedule.
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            run_id:
              description: The session run of an `agent_prompt` target; `null` otherwise.
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            workflow_run_id:
              description: The workflow run of a `workflow` target; `null` otherwise.
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
    SchedulePreviewRequest:
      type: object
      required: [trigger]
      properties:
        trigger:
          $ref: '#/components/schemas/ScheduleTrigger'
        count:
          type: integer
          minimum: 1
          maximum: 10
          description: How many next times; 3 when not given.
    SchedulePreview:
      type: object
      required: [timezone, next_runs]
      properties:
        timezone:
          type: string
          description: The trigger's zone, the one to show the times in.
        next_runs:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Timestamp'
    # ---------------------------------------------------------------- workflows
    WorkflowNode:
      type: object
      required:
        [
          id,
          kind,
          title,
          agent_id,
          model,
          provider,
          reasoning_effort,
          skills,
          input,
          approval_required,
          position,
        ]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,40}$'
        kind:
          type: string
          enum: [agent, approval, condition, delay, notify]
        title:
          type: string
        agent_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        skills:
          type: array
          items:
            type: string
        input:
          type: [string, 'null']
          description: Prompt template; `{{input}}` and `{{steps.<id>.output}}` are substituted.
        approval_required:
          type: boolean
          description: 'Gate the node behind an approval (`kind: workflow_step`) before it runs.'
        position:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
    WorkflowEdge:
      type: object
      required: [id, from, to, route]
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        route:
          type: string
          enum: [always, success, failure]
    Workflow:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              name,
              description,
              working_dir,
              nodes,
              edges,
              status,
              active_run_id,
              run_count,
              schedule_count,
              limits,
            ]
          properties:
            name:
              type: string
              maxLength: 120
            description:
              type: [string, 'null']
            working_dir:
              type: [string, 'null']
            nodes:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowNode'
            edges:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowEdge'
            status:
              type: string
              enum: [idle, running, waiting, error]
            active_run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            run_count:
              type: integer
            schedule_count:
              type: integer
              description: Enabled schedules targeting this workflow.
            limits:
              $ref: '#/components/schemas/WorkflowLimits'
    WorkflowWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
        working_dir:
          type: [string, 'null']
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
        limits:
          allOf:
            - $ref: '#/components/schemas/WorkflowLimits'
          description: >-
            Replaces the workflow's limits as a whole; a new workflow without it has none. A
            cost limit in a currency other than USD, or not above zero, is `409` with
            `details.reason = limit_invalid` and `details.field`.
    WorkflowStepStatus:
      type: string
      enum:
        [
          pending,
          queued,
          running,
          waiting_approval,
          succeeded,
          failed,
          skipped,
          cancelled,
          rejected,
        ]
    WorkflowStep:
      type: object
      required:
        [
          node_id,
          attempt,
          status,
          session_id,
          run_id,
          approval_id,
          output,
          route,
          error,
          started_at,
          finished_at,
        ]
      properties:
        node_id:
          type: string
        attempt:
          type: integer
        status:
          $ref: '#/components/schemas/WorkflowStepStatus'
        output:
          type: [string, 'null']
          description: >-
            What the step produced, as text — the agent's answer, the notice's words, a
            condition's `true`/`false`, a delay's seconds, an approval's answer — at most
            20 000 characters; `null` while it has not finished or when it produced nothing
            (DECISIONS §52).
        route:
          description: >-
            Which of the step's edges it follows: `success` after a step that succeeded or a
            condition that said yes, `failure` after a failed step or a condition that said
            no (`always` edges follow either); `null` while it has not finished.
          oneOf:
            - type: string
              enum: [success, failure]
            - type: 'null'
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The session where the step's agent worked; its output is that session's last assistant message.
        run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        approval_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        error:
          type: [string, 'null']
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    WorkflowRun:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              workflow_id,
              job_id,
              status,
              trigger,
              input,
              steps,
              error,
              started_at,
              finished_at,
              limits,
              cost,
              stopped_by,
            ]
          properties:
            workflow_id:
              $ref: '#/components/schemas/Ulid'
            job_id:
              $ref: '#/components/schemas/Ulid'
            status:
              type: string
              enum: [queued, running, waiting, succeeded, failed, cancelled]
            trigger:
              $ref: '#/components/schemas/RunTrigger'
            input:
              type: [string, 'null']
            steps:
              type: array
              description: Latest attempt per node, in execution order.
              items:
                $ref: '#/components/schemas/WorkflowStep'
            error:
              type: [string, 'null']
            started_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            finished_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            limits:
              allOf:
                - $ref: '#/components/schemas/WorkflowLimits'
              description: >-
                The limits this run works under: the workflow's when it started, with what the
                run itself asked for (`WorkflowRunRequest.limits`) over them. A rerun from a
                step keeps the limits of the run it repeats.
            cost:
              description: >-
                What the run's agent steps cost so far by the hub's estimate (the per-turn
                estimate of `Usage.cost`, summed); `null` while no turn of it has a price.
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
            stopped_by:
              description: >-
                Which limit ended the run, when one did (DECISIONS §53): `max_duration` or
                `max_cost` stopped it at once, the step working then cancelled;
                `step_timeout` is a step that ran out of time with no `failure` edge to take.
                The run is then `failed` and `error` says the same in words. `null` otherwise.
              oneOf:
                - type: string
                  enum: [max_duration, max_cost, step_timeout]
                - type: 'null'
    WorkflowLimits:
      type: object
      description: >-
        What one run of a workflow may take (DECISIONS §53). Each is `null` for no limit. Time
        a run spends waiting for a person at an approval counts toward none of them.
      required: [max_duration_seconds, max_cost, step_timeout_seconds]
      properties:
        max_duration_seconds:
          type: [integer, 'null']
          minimum: 1
          maximum: 604800
          description: >-
            Time budget: the longest the run may work, in seconds (at most a week). Past it
            the run stops, the step working then cancelled (`stopped_by: max_duration`).
        max_cost:
          description: >-
            Cost budget, in USD: the most the run's agent turns may cost by the hub's
            estimate, the same one a conversation's `Usage.cost` shows. Checked while a step
            works and after it; past it the run stops, the step working then cancelled
            (`stopped_by: max_cost`). A turn whose model has no price counts as nothing.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        step_timeout_seconds:
          type: [integer, 'null']
          minimum: 1
          maximum: 86400
          description: >-
            The longest any one step may work, in seconds (at most a day). A step past it is
            cancelled and fails ("timed out"); its `failure` edges are followed, and with
            none the run stops (`stopped_by: step_timeout`).
      example:
        max_duration_seconds: 1800
        max_cost:
          amount: '2.00'
          currency: USD
        step_timeout_seconds: 600
    WorkflowLimitsOverride:
      type: object
      description: >-
        One run's own limits: a field given replaces the workflow's for this run only, `null`
        lifts it, and a field left out keeps the workflow's.
      properties:
        max_duration_seconds:
          type: [integer, 'null']
          minimum: 1
          maximum: 604800
        max_cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        step_timeout_seconds:
          type: [integer, 'null']
          minimum: 1
          maximum: 86400
    WorkflowRunRequest:
      type: object
      properties:
        input:
          type: [string, 'null']
        start_node_ids:
          type: [array, 'null']
          items:
            type: string
        limits:
          $ref: '#/components/schemas/WorkflowLimitsOverride'
        timeout_ms:
          type: [integer, 'null']
          minimum: 1
          description: >-
            The run's time budget in milliseconds, rounded up to whole seconds — the older
            spelling of `limits.max_duration_seconds`, which wins when both are given.
    WorkflowRunAccepted:
      allOf:
        - $ref: '#/components/schemas/JobAccepted'
        - type: object
          required: [workflow_run_id]
          properties:
            workflow_run_id:
              $ref: '#/components/schemas/Ulid'
    WorkflowImportPreview:
      type: object
      required: [id, name, node_count, edge_count, warnings, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        node_count:
          type: integer
        edge_count:
          type: integer
        warnings:
          type: array
          items:
            type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    WorkflowIssue:
      type: object
      required: [code, node_id, edge_id, detail, message]
      properties:
        code:
          type: string
          description: >-
            Stable reason a client translates. Problems — `node_id_missing`,
            `node_id_duplicate`, `edge_from_unknown`, `edge_to_unknown`,
            `condition_unreadable` (`detail` is the parser's reason, such as
            `condition_operator_missing`), `delay_out_of_range`, `template_root_unknown`,
            `template_step_unknown` (`detail` is the path). Warnings — `workflow_empty`,
            `no_start`, `many_starts` (`detail` is the count), `agent_missing`. A client that
            meets a code it does not know shows `message`.
        node_id:
          type: [string, 'null']
          description: The node it is about; `null` when it is about the whole drawing or an edge.
        edge_id:
          type: [string, 'null']
          description: The edge it is about; `null` otherwise.
        detail:
          type: [string, 'null']
        message:
          type: string
          description: The same thing in English words, as `workflow_invalid` has always said it.
    WorkflowValidation:
      type: object
      required: [valid, problems, warnings]
      properties:
        valid:
          type: boolean
          description: '`true` when `problems` is empty: saving this drawing would be accepted.'
        problems:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowIssue'
    # ---------------------------------------------------------------- models
    ProviderKind:
      type: string
      enum: [llm, stt, tts]
    ModelKind:
      type: string
      enum: [chat, embedding, stt, tts]
    ModelCapability:
      type: string
      description: >-
        `image_output`: the model answers with images — a Images-API model (gpt-image, Imagen,
        FLUX …) or a chat model that draws (`gemini-*-image`). Said by the provider where it says
        it (OpenRouter's output modalities), else read from the model's id (decision §72). Only
        such a model can be the profile's image model.
      enum: [vision, tools, reasoning, audio, streaming, image_output]
    ModelPricing:
      type: object
      required: [input_per_million, output_per_million]
      properties:
        input_per_million:
          $ref: '#/components/schemas/Money'
        output_per_million:
          $ref: '#/components/schemas/Money'
    Model:
      type: object
      required:
        [
          key,
          provider_id,
          provider,
          model,
          alias,
          kind,
          visible,
          custom,
          preview,
          disabled,
          context_window,
          capabilities,
          pricing,
        ]
      properties:
        key:
          type: string
          description: '`<provider slug>/<model>` — the value stored in sessions and seats.'
        provider_id:
          $ref: '#/components/schemas/Ulid'
        provider:
          type: string
        model:
          type: string
        alias:
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/ModelKind'
        visible:
          type: boolean
        custom:
          type: boolean
        preview:
          type: boolean
        disabled:
          type: boolean
        context_window:
          type: [integer, 'null']
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ModelCapability'
        pricing:
          oneOf:
            - $ref: '#/components/schemas/ModelPricing'
            - type: 'null'
    ModelPatch:
      type: object
      properties:
        alias:
          type: [string, 'null']
        visible:
          type: boolean
        context_window:
          type: [integer, 'null']
        custom:
          type: boolean
          description: '`true` registers a model the catalogue does not list.'
    Visibility:
      type: object
      required: [mode, models]
      properties:
        mode:
          type: string
          enum: [all, include]
        models:
          type: array
          items:
            type: string
    Provider:
      description: >-
        A provider the hub added, shared (`scope: all`, `profile` is then `default`, where it
        is stored) or one profile's own (`scope: profile`, `profile` is that profile) —
        decision §37.
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              slug,
              label,
              kind,
              scope,
              builtin,
              enabled,
              api_key,
              base_url,
              api_mode,
              auth,
              catalogue,
              visibility,
              models,
            ]
          properties:
            slug:
              type: string
            label:
              type: string
            kind:
              $ref: '#/components/schemas/ProviderKind'
            scope:
              $ref: '#/components/schemas/ProviderScope'
            builtin:
              type: boolean
            enabled:
              type: boolean
            api_key:
              type: [string, 'null']
              enum: ['[stored]', null]
              description: Never the value.
            base_url:
              type: [string, 'null']
            api_mode:
              type: string
              enum: [native, chat_completions, responses]
            auth:
              type: object
              required: [kind, signed_in]
              description: >-
                `kind` is what the provider *requires*: `none` means no key is required —
                it never means a key is refused. Every provider accepts one (a local proxy
                behind a master key is the common case), so a client always offers the
                field, and a missing key is only ever reported by the endpoint itself.
              properties:
                kind:
                  type: string
                  enum: [api_key, oauth, none]
                signed_in:
                  type: boolean
            catalogue:
              type: object
              required: [status, refreshed_at, error, refreshable]
              properties:
                status:
                  type: string
                  enum: [ready, loading, error, unsupported]
                refreshed_at:
                  oneOf:
                    - $ref: '#/components/schemas/Timestamp'
                    - type: 'null'
                error:
                  type: [string, 'null']
                refreshable:
                  type: boolean
                source:
                  type: [string, 'null']
                  enum: [provider, fallback, null]
                  description: >-
                    Where the model list came from (decision §83, the owner's rule): `provider`
                    is what the provider's own models endpoint returned for this account;
                    `fallback` is a list kept in code — the agent runtime's — used only because
                    the provider could not be asked, and a client says so. `null` before the
                    first list, or for a catalogue older than this field.
                fallback_reason:
                  type: [string, 'null']
                  description: Why the provider could not be asked, when `source` is `fallback`.
            draws_images:
              type: boolean
              description: >-
                The hub can draw with this provider's `image_output` models (decisions §72 and
                §84): a chat provider with a key, one that needs none, or the ChatGPT
                subscription signed in through Hermes. A client offers only these in the Images
                role.
            visibility:
              $ref: '#/components/schemas/Visibility'
            models:
              type: array
              items:
                $ref: '#/components/schemas/Model'
    ProviderPreset:
      type: object
      description: One provider *type* a person can add, with everything the dialog prefills.
      required:
        [
          id,
          label,
          kind,
          api_mode,
          base_url,
          base_url_required,
          key,
          local,
          repeatable,
          keys_url,
          sign_in,
        ]
      properties:
        id:
          type: string
          description: 'The catalogue id, sent back as `ProviderCreate.preset`.'
        label:
          type: string
        kind:
          $ref: '#/components/schemas/ProviderKind'
        api_mode:
          type: string
          enum: [native, chat_completions, responses]
        base_url:
          type: [string, 'null']
          description: What to prefill; `null` when no default could be right (LiteLLM).
        base_url_required:
          type: boolean
          description: Whether the person must supply one before the provider can be added.
        key:
          type: string
          enum: [required, optional]
          description: >-
            `optional` providers are added and used with no key; one may still be typed,
            because a local proxy is often put behind a master key. There is no value that
            means "a key is refused".
        local:
          type: boolean
          description: Runs on the person's own machine or network (loopback warning applies).
        repeatable:
          type: boolean
          description: 'May be added more than once; the person gives each instance its own name.'
        keys_url:
          type: [string, 'null']
        sign_in:
          type: boolean
          description: >-
            The provider is used by signing in to an account rather than with an API key: after
            adding it, `models.startProviderSignIn` shows a code and a link (decision §55).
            Only the providers whose sign-in the agent runtime can complete on the hub's behalf
            say `true`; `key` is then `optional` and a client does not ask for one.
    ProviderHost:
      type: object
      required: [containerized, loopback_alias]
      properties:
        containerized:
          type: boolean
          description: >-
            The hub is running inside a container, so `127.0.0.1` in a base URL is the
            container itself and not the person's machine.
        loopback_alias:
          type: string
          description: 'The host name to suggest instead of loopback (`host.docker.internal`).'
    ProviderProbe:
      type: object
      description: 'Either `preset` or `base_url` must say where to ask; both may be given.'
      properties:
        preset:
          type: [string, 'null']
        base_url:
          type: [string, 'null']
        api_key:
          type: [string, 'null']
          description: 'Sent as typed; never stored by this operation. `null` asks with no key.'
        api_mode:
          type: string
          enum: [native, chat_completions, responses]
        kind:
          $ref: '#/components/schemas/ProviderKind'
    ProviderProbeResult:
      type: object
      required: [ok, message, duration_ms, models]
      properties:
        ok:
          type: boolean
        message:
          type: [string, 'null']
          description: "Why it failed, ending in the endpoint's own words. `null` when it worked."
        duration_ms:
          type: integer
        models:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
    ProviderCreate:
      type: object
      required: [label, kind]
      properties:
        preset:
          type: [string, 'null']
          description: >-
            A `ProviderPreset.id`. With it the slug, protocol, credential family and
            default base URL come from the catalogue and only what the person typed is
            taken from this body. Without it the provider is an OpenAI-compatible endpoint
            described entirely by `base_url` and `api_mode`.
        label:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/ProviderKind'
        base_url:
          type: [string, 'null']
        api_key:
          type: [string, 'null']
        api_mode:
          type: string
          enum: [chat_completions, responses]
          default: chat_completions
        scope:
          $ref: '#/components/schemas/ProviderScope'
    ProviderScope:
      type: string
      enum: [all, profile]
      default: all
      description: >-
        Who a provider is for (decision §37): `all` — every profile (shared, stored under the
        `default` profile); `profile` — only the profile in `X-Hub-Profile`, where it wins over
        a shared provider of the same slug.
    ProviderPatch:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
        enabled:
          type: boolean
        api_key:
          type: [string, 'null']
          description: A value sets the key; `""` or `null` clears it.
        base_url:
          type: [string, 'null']
        api_mode:
          type: string
          enum: [native, chat_completions, responses]
        visibility:
          $ref: '#/components/schemas/Visibility'
    ProviderSignIn:
      type: object
      description: >-
        One sign-in to a provider account by device code (decision §55): the person opens
        `verification_url`, enters `user_code`, and the client polls `models.getProviderSignIn`
        until `status` is no longer `pending`. On `approved` the credential is stored where the
        provider's scope says — the shared provider's in the `default` profile, a profile's own
        provider's in that profile — and the provider's `auth.signed_in` is true.
      required: [id, status, user_code, verification_url, accepts_code, expires_at, error]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum: [pending, approved, denied, expired, failed]
          description: >-
            `denied` — the person declined in the browser; `expired` — the code ran out before
            it was used; `failed` — the sign-in could not finish (`error` says why).
        user_code:
          type: [string, 'null']
        verification_url:
          type: string
        accepts_code:
          type: boolean
          description: Whether the provider hands the user a code to paste back.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        error:
          type: [string, 'null']
          description: Why a `failed` or `denied` sign-in stopped, in the runtime's own words.
    RuntimeReport:
      type: object
      description: >-
        Whether the agent runtime received what this workspace configured. `ready` is
        every check passing; a client shows the failing ones rather than a single word.
      required: [agent, mode, ready, checks]
      properties:
        agent:
          type: string
          description: The runtime these checks are about (`hermes` today).
        mode:
          type: string
          enum: [managed, external, absent]
          description: >-
            `managed` — the hub started it and owns its files; `external` — somebody
            else's process, which the hub reads and never writes; `absent` — none found.
        ready:
          type: boolean
        reloaded_at:
          type: [string, 'null']
          format: date-time
          description: When the hub last recycled the runtime after writing to it.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeCheck'
    RuntimeCheck:
      type: object
      description: One step of propagation, answered from the runtime as it is now.
      required: [id, ok, detail]
      properties:
        id:
          type: string
          enum:
            [runtime_writable, provider_keys, provider_verified, model_selected, gateway_reloaded]
        ok:
          type: boolean
        detail:
          type: [string, 'null']
          description: >-
            A short fact, never a sentence to render on its own: a count, a provider
            slug, a model id. The wording belongs to the client's own catalogue.
    ModelDefaults:
      type: object
      required: [default, fallbacks, auxiliary]
      properties:
        inherited:
          type: array
          description: >-
            The roles whose value is the `default` profile's, because this profile chose
            none (decision §37): `default` for the chat model (with its fallbacks), `image` for
            the image model (decision §72), else an auxiliary task key. Always empty in the
            `default` profile.
          items:
            type: string
        default:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        fallbacks:
          type: array
          description: >-
            Tried in order when the chosen model fails with an error another model could get
            past (decision §54): the provider unavailable (a 5xx, `auth_unavailable`), rate
            limited (429), timed out or unreachable. Never after another 4xx, and never once the
            model has started answering. It follows the chat model: inherited with it, and used
            by every agent of the profile after the model that agent runs on.
          items:
            $ref: '#/components/schemas/ModelRef'
        image:
          description: >-
            The model that draws and edits images for this profile (the Models → Images tab,
            decision §72): a model with `image_output` on one of the profile's chat providers —
            there are no separate image providers. Hermes's `image_generate` tool and the hub's
            image skills both use it. Inherited from the `default` profile like the chat model;
            null when neither chose one.
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        auxiliary:
          type: object
          required: [tasks, assignments]
          properties:
            tasks:
              type: array
              description: Server-defined roles (title generation, summarization, embeddings…).
              items:
                type: object
                required: [key, label]
                properties:
                  key:
                    type: string
                  label:
                    $ref: '#/components/schemas/LocalizedText'
            assignments:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ModelRef'
    ModelDefaultsWrite:
      type: object
      properties:
        default:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        image:
          description: >-
            The profile's image model (decision §72). It must be a model with `image_output` on
            a provider the hub can draw with (`Provider.draws_images`: one it holds the key of,
            one that needs none, or the ChatGPT subscription, §84); `null` goes back to
            inheriting the `default` profile's.
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        fallbacks:
          type: array
          items:
            $ref: '#/components/schemas/ModelRef'
        assignments:
          type: object
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/ModelRef'
              - type: 'null'
    EnsembleMember:
      allOf:
        - $ref: '#/components/schemas/ModelRef'
        - type: object
          properties:
            reasoning_effort:
              oneOf:
                - $ref: '#/components/schemas/ReasoningEffort'
                - type: 'null'
    Ensemble:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [name, enabled, active, members, aggregator, max_tokens]
          properties:
            name:
              type: string
            enabled:
              type: boolean
            active:
              type: boolean
              description: At most one ensemble is active per workspace.
            members:
              type: array
              items:
                $ref: '#/components/schemas/EnsembleMember'
            aggregator:
              $ref: '#/components/schemas/EnsembleMember'
            max_tokens:
              type: [integer, 'null']
    EnsembleWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        enabled:
          type: boolean
        active:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/EnsembleMember'
        aggregator:
          $ref: '#/components/schemas/EnsembleMember'
        max_tokens:
          type: [integer, 'null']
    SpeechProvider:
      type: object
      required: [id, slug, label, kind, configured, api_key, settings]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        slug:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [stt, tts]
        configured:
          type: boolean
        api_key:
          type: [string, 'null']
          enum: ['[stored]', null]
        settings:
          type: object
          required: [model, language, base_url, voice]
          properties:
            model:
              type: [string, 'null']
            language:
              type: [string, 'null']
            base_url:
              type: [string, 'null']
            voice:
              type: [string, 'null']
    SpeechSide:
      type: object
      required: [active_provider_id, ready, reason, providers]
      properties:
        active_provider_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        ready:
          type: boolean
          description: Whether the hub can serve requests now (the phone's "server dictation possible" check).
        reason:
          type: [string, 'null']
        providers:
          type: array
          items:
            $ref: '#/components/schemas/SpeechProvider'
    SpeechSettings:
      type: object
      required: [stt, tts]
      properties:
        stt:
          $ref: '#/components/schemas/SpeechSide'
        tts:
          $ref: '#/components/schemas/SpeechSide'
    SpeechSettingsPatch:
      type: object
      properties:
        stt_provider_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        tts_provider_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        providers:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              api_key:
                type: [string, 'null']
              settings:
                type: object
                additionalProperties: true
    Voice:
      type: object
      required: [id, name, language, gender]
      properties:
        id:
          type: string
        name:
          type: string
        language:
          type: [string, 'null']
        gender:
          type: [string, 'null']
          enum: [female, male, neutral, null]
    Transcription:
      type: object
      required: [text, language, duration_ms, provider_id, model]
      properties:
        text:
          type: string
        language:
          type: [string, 'null']
          description: Detected or requested language.
        duration_ms:
          type: integer
        provider_id:
          $ref: '#/components/schemas/Ulid'
        model:
          type: [string, 'null']
    SpeechRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        language:
          type: [string, 'null']
        voice:
          type: [string, 'null']
          description: Overrides the provider's default voice for this request.
        provider_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    # ---------------------------------------------------------------- devices
    DevicePlatform:
      type: string
      enum: [android, ios, web, macos, windows, linux]
    DeviceKind:
      type: string
      enum: [phone, tablet, computer, browser]
    CapabilityKind:
      type: string
      description: What a device can do for an agent. Unsupported kinds are simply absent.
      enum:
        [
          location,
          camera,
          microphone,
          notifications,
          clipboard,
          screen,
          files,
          apps,
          calendar,
          reminders,
          health,
        ]
    DeviceCapability:
      type: object
      required: [kind, enabled, consent_at]
      properties:
        kind:
          $ref: '#/components/schemas/CapabilityKind'
        enabled:
          type: boolean
        consent_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the person granted the OS permission, if the device reports it.
    DeviceRegistration:
      type: object
      description: How a device describes itself when pairing.
      required: [device_key, name, platform, kind]
      properties:
        device_key:
          type: string
          description: Stable id the device generates once and keeps, so re-pairing updates the same row.
          maxLength: 128
        name:
          type: string
          maxLength: 80
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        kind:
          $ref: '#/components/schemas/DeviceKind'
        brand:
          type: [string, 'null']
        model:
          type: [string, 'null']
        app_version:
          type: [string, 'null']
        os_version:
          type: [string, 'null']
          maxLength: 64
          description: The operating system's version as the device reports it (`18.6`, `15`). Optional; older apps leave it out.
        push_blocker:
          oneOf:
            - $ref: '#/components/schemas/PushBlocker'
            - type: 'null'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityKind'
    PushBlocker:
      type: string
      enum: [none, not_in_build, permission_pending, permission_denied]
      description: |
        Why the device has no push, as the device itself reports it: `none` (nothing on the device
        stops it; the hub may still have no sender), `not_in_build` (this build of the app cannot
        receive push), `permission_pending` (the person has not been asked, or not answered, yet),
        `permission_denied` (notifications are turned off for the app on the device).
    PushStatus:
      type: object
      required: [provider, locale, registered_at]
      properties:
        provider:
          type: string
          enum: [fcm, apns, webpush]
        locale:
          $ref: '#/components/schemas/Locale'
        registered_at:
          $ref: '#/components/schemas/Timestamp'
    PushRegistration:
      type: object
      required: [provider, token]
      properties:
        provider:
          type: string
          enum: [fcm, apns, webpush]
        token:
          type: string
          maxLength: 4096
          description: |
            `fcm`: the FCM registration token. `apns`: the device token as hex. `webpush`: the
            browser's `PushSubscription` as JSON (`{"endpoint": "https://…", "keys": {"p256dh": "…",
            "auth": "…"}}`), subscribed with `devices.getPushConfig`'s `webpush_public_key`.
            Stored encrypted and never returned.
        locale:
          $ref: '#/components/schemas/Locale'
        relay_proof:
          $ref: '#/components/schemas/PushRelayProof'
    Device:
      type: object
      required:
        [
          id,
          user_id,
          device_key,
          name,
          platform,
          kind,
          brand,
          model,
          os_version,
          app_version,
          connection,
          online,
          last_seen_at,
          paired_at,
          app_token_id,
          capabilities,
          push,
          push_blocker,
          this_device,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        device_key:
          type: string
        name:
          type: string
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        kind:
          $ref: '#/components/schemas/DeviceKind'
        brand:
          type: [string, 'null']
        model:
          type: [string, 'null']
          description: The model's marketing name when the device knows it (`iPhone 16 Pro`, `Pixel 9`).
        os_version:
          type: [string, 'null']
          description: The operating system's version the device last reported; null from an app that does not say.
        app_version:
          type: [string, 'null']
        connection:
          $ref: '#/components/schemas/PairingConnection'
        online:
          type: boolean
          description: Has a live `/rt/devices` socket.
        last_seen_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            The device's last authenticated call to the hub, written at most once a minute: any call
            made with its pairing token, or with the sign-in that registered it (`devices.register`).
        paired_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            When the device was last paired (or registered, for one that signed in). Always set by
            this hub; null-able so that an app reading an older hub, which does not send it, still
            decodes the device.
        app_token_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DeviceCapability'
        push:
          oneOf:
            - $ref: '#/components/schemas/PushStatus'
            - type: 'null'
        push_blocker:
          oneOf:
            - $ref: '#/components/schemas/PushBlocker'
            - type: 'null'
          description: What the device last said stops push on it; null when it never said (an older app, a browser).
        this_device:
          type: boolean
        profiles:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ProfileSlug'
          description: |
            The profiles whose agents may ask this device for something (DECISIONS §87). `null`, the
            default, is every profile of the device's person; a list narrows it. Absent from a hub
            older than the field.
        helper:
          oneOf:
            - $ref: '#/components/schemas/DeviceHelper'
            - type: 'null'
          description: What a computer's local helper offers the hub's agents, as the desktop app last reported it; `null` when it never did (a phone, a browser, a helper that is off).
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    DeviceHelper:
      type: object
      description: |
        A computer's local helper as the hub's agents may use it (ADR 0025): the folders the person
        shared, whether opening files and links is allowed, and the programs switched on with the
        profiles each one serves and its tools. Reported by the desktop app itself
        (`devices.update`), again whenever it changes.
      required: [folders, allow_open, programs, reported_at]
      properties:
        folders:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DeviceHelperFolder'
        allow_open:
          type: boolean
        programs:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DeviceProgram'
        reported_at:
          $ref: '#/components/schemas/Timestamp'
    DeviceHelperFolder:
      type: object
      required: [path, write]
      properties:
        path:
          type: string
          maxLength: 1024
          description: Absolute, on the computer.
        write:
          type: boolean
          description: Shared as writable; read only otherwise.
        default:
          type: boolean
          description: The folder the app made for Core Hub's own files (`~/Core Hub`); program output goes there unless the person says otherwise.
    DeviceProgram:
      type: object
      description: |
        A program on the computer the person switched on for some profiles: an MCP server another
        assistant registered (Claude Desktop and its extensions, Claude Code, Codex, Cursor,
        Windsurf), started by the desktop app as its own child and reached only through it.
      required: [id, name, source, profiles, tools]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,47}$'
          description: The app's stable id for it, used in `apps` requests.
        name:
          type: string
          maxLength: 120
        source:
          type: string
          enum: [claude_desktop, claude_desktop_extension, claude_code, codex, cursor, windsurf]
        profiles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProfileSlug'
          description: The profiles whose agents may use it.
        tools:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/DeviceProgramTool'
    DeviceProgramTool:
      type: object
      required: [name, description, input_schema]
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 2000
        input_schema:
          type: object
          additionalProperties: true
    PushProvider:
      type: string
      enum: [webpush, fcm, apns]
    PushConfig:
      type: object
      required: [webpush_public_key, providers]
      properties:
        webpush_public_key:
          type: [string, 'null']
          description: The hub's VAPID public key (uncompressed P-256 point, base64url), or null when Web Push is off.
        providers:
          type: array
          description: Senders that can deliver right now.
          items:
            $ref: '#/components/schemas/PushProvider'
    PushSender:
      type: object
      required: [provider, state, source, missing, details, devices, last_error, last_sent_at]
      properties:
        provider:
          $ref: '#/components/schemas/PushProvider'
        state:
          type: string
          enum: [ready, disabled, not_configured, error]
          description: '`error`: configured, but the credentials could not be read.'
        source:
          type: string
          enum: [generated, environment, settings, relay, none]
          description: |
            Where the credentials come from. Web Push keys are generated by the hub. `relay`: FCM
            or APNs has no credentials on this hub and is delivered through the Core Hub push
            relay (`relay` says how it is doing).
        missing:
          type: array
          description: What still has to be provided (field names of `PushSenderUpdate`).
          items:
            type: string
        details:
          type: object
          description: Non-secret identifiers (project id, client email, key id, team id, bundle id, environment, public key, subject); a secret shows as `[stored]`.
          additionalProperties:
            type: string
        devices:
          type: integer
          minimum: 0
          description: Linked devices registered with this sender.
        last_error:
          type: [string, 'null']
        last_sent_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        relay:
          description: |
            The Core Hub push relay as this sender would use it (`fcm` and `apns` rows; null for
            `webpush`). Present even when local credentials win, so a settings screen can show
            private push and the switch.
          oneOf:
            - $ref: '#/components/schemas/PushRelayStatus'
            - type: 'null'
    PushRelayStatus:
      type: object
      required: [state, enabled, forced_off, private_push, url, hub_id, last_error, checked_at]
      properties:
        state:
          type: string
          enum: [ready, not_registered, unreachable, blocked, rate_limited, off, no_url]
          description: |
            `ready`: registered and the last call worked. `not_registered`: the hub registers itself
            on first need (a phone registering push, or a notice to send). `unreachable`: the last
            call did not reach the relay. `blocked`: the relay's owner blocked this hub.
            `rate_limited`: over the relay's per-minute or per-day limit (it passes). `off`: turned
            off here or by `COREHUB_PUSH_RELAY=off`. `no_url`: this build has no relay address and
            `COREHUB_PUSH_RELAY_URL` is not set.
        enabled:
          type: boolean
          description: The admin's switch (`devices.setPushRelay`).
        forced_off:
          type: boolean
          description: '`COREHUB_PUSH_RELAY=off` is set: the relay is off whatever `enabled` says.'
        private_push:
          type: boolean
          description: Only a generic title and the notice id go through the relay.
        url:
          type: [string, 'null']
          description: The relay's address, or null when there is none.
        hub_id:
          type: [string, 'null']
          description: This hub's id at the relay (not a secret), once registered.
        last_error:
          type: [string, 'null']
        checked_at:
          description: When the hub last heard from the relay.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    PushRelayUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        private_push:
          type: boolean
    PushRelayProof:
      type: object
      description: |
        Optional: the app's proof that it holds this device, which lets the relay move the token
        from another hub to this one (ADR 0024 §Binding). A P-256 key the app made once per install
        signs `corehub-push-bind-v1`, the provider (`apns` or `fcm`), the token and `signed_at`,
        joined by newlines (ECDSA with SHA-256). The hub forwards it to the relay unread; without
        it a token bound to another hub stays there until that hub lets it go or it goes unused
        for 30 days.
      required: [key, signed_at, signature]
      properties:
        key:
          type: string
          maxLength: 100
          description: The raw uncompressed public point (65 bytes), base64url.
        signed_at:
          type: integer
          description: Unix seconds; the relay accepts ten minutes either way.
        signature:
          type: string
          maxLength: 100
          description: The raw `r || s` signature (64 bytes), base64url.
    PushSenderUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        service_account:
          type: string
          description: FCM. The Firebase service-account JSON (write-only).
        key_id:
          type: string
          description: APNs. The key's 10-character id.
        team_id:
          type: string
          description: APNs. The Apple developer team id.
        bundle_id:
          type: string
          description: APNs. The app's bundle id (the `apns-topic`).
        environment:
          type: string
          enum: [production, sandbox]
          description: APNs. `sandbox` for development builds.
        private_key:
          type: string
          description: APNs. The `.p8` key's contents (write-only).
        subject:
          type: string
          description: Web Push. A `mailto:` or `https:` contact a push service may use.
    PushTestResult:
      type: object
      required: [provider, status, error]
      properties:
        provider:
          $ref: '#/components/schemas/PushProvider'
        status:
          type: string
          enum: [sent, failed]
        error:
          type: [string, 'null']
    DevicePatch:
      type: object
      description: |
        A name set here is the person's: registering or pairing the same device again keeps it.
        The other fields are what the device says about itself, sent again at each launch.
      properties:
        name:
          type: string
          maxLength: 80
        brand:
          type: [string, 'null']
          maxLength: 80
        model:
          type: [string, 'null']
          maxLength: 120
        os_version:
          type: [string, 'null']
          maxLength: 64
        app_version:
          type: [string, 'null']
        push_blocker:
          oneOf:
            - $ref: '#/components/schemas/PushBlocker'
            - type: 'null'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DeviceCapability'
        profiles:
          type: [array, 'null']
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProfileSlug'
          description: The device's person only (anyone else, the device itself included, `403`). `null` gives it back to every profile of theirs.
        helper:
          oneOf:
            - $ref: '#/components/schemas/DeviceHelper'
            - type: 'null'
          description: The device itself only (its own token; anyone else `403`). `reported_at` is set by the hub.
    DeviceRequestStatus:
      type: string
      enum: [pending, fulfilled, denied, failed, expired, cancelled]
    DeviceRequest:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              device_id,
              session_id,
              run_id,
              job_id,
              capability,
              purpose,
              params,
              status,
              expires_at,
              result,
              error,
            ]
          properties:
            device_id:
              $ref: '#/components/schemas/Ulid'
            session_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            job_id:
              $ref: '#/components/schemas/Ulid'
            capability:
              $ref: '#/components/schemas/CapabilityKind'
            purpose:
              type: [string, 'null']
              description: Shown to the person in the consent sheet.
            params:
              type: object
              description: |
                Capability-specific. `location` takes `accuracy: coarse | precise`. `files` (a
                computer's helper, ADR 0022/0025) takes `{tool, arguments}` where `tool` is one of
                `list_allowed_folders`, `list_directory`, `read_text_file`, `write_text_file`,
                `open_path`, `open_url` or `send_file` (the device uploads the file with the
                resumable upload in this profile). `apps` takes `{op: call, program, tool,
                arguments}` (one tool call of a program the device shares) or `{op: status,
                call_id}` (how a long call stands).
              additionalProperties: true
            status:
              $ref: '#/components/schemas/DeviceRequestStatus'
            expires_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: [object, 'null']
              description: |
                Capability-specific. `location` returns `latitude, longitude, accuracy_m,
                captured_at`. `files` returns the tool's MCP result `{content, is_error}`, and
                `send_file` `{attachment_id, name, mime, size_bytes, kind}`. `apps` returns
                `{state: done, content, is_error}`, or `{state: running, call_id, progress}` when
                the call is still going after the device's soft deadline (the program keeps
                running; ask again with `op: status`).
              additionalProperties: true
            error:
              oneOf:
                - $ref: '#/components/schemas/DeviceRequestError'
                - type: 'null'
    DeviceRequestError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Fixed list shared by all platforms.
          enum: [permission_denied, unavailable, timeout, cancelled, failed]
        message:
          type: [string, 'null']
    DeviceRequestCreate:
      type: object
      required: [device_id, capability]
      properties:
        device_id:
          $ref: '#/components/schemas/Ulid'
        capability:
          $ref: '#/components/schemas/CapabilityKind'
        purpose:
          type: [string, 'null']
        params:
          type: object
          additionalProperties: true
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
          description: |
            How long the device has to answer. Absent, it depends on the capability (DECISIONS
            §87): `files` 60 s and `apps` 120 s (the person may be asked first), everything else
            30 s.
    DeviceRequestResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [fulfilled, denied, failed]
        result:
          type: [object, 'null']
          additionalProperties: true
        error:
          oneOf:
            - $ref: '#/components/schemas/DeviceRequestError'
            - type: 'null'
    Relay:
      type: object
      required: [enabled, connected, route, relay_url, hub_id, error, connected_at]
      properties:
        enabled:
          type: boolean
        connected:
          type: boolean
        route:
          type: string
          enum: [official, cloudflare]
        relay_url:
          type: [string, 'null']
        hub_id:
          type: [string, 'null']
        error:
          type: [string, 'null']
        connected_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Peer:
      type: object
      required:
        [id, name, url, version, online, inbound_status, outbound_status, last_seen_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        url:
          type: string
        version:
          type: [string, 'null']
        online:
          type: boolean
        inbound_status:
          type: string
          enum: [pending, approved, rejected, blocked]
        outbound_status:
          type: string
          enum: [none, requested, connected, rejected, error]
        last_seen_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    # ---------------------------------------------------------------- notify
    NoticeKind:
      type: string
      enum:
        [
          run_completed,
          approval_requested,
          room_mention,
          task_moved,
          schedule_failed,
          update_available,
          system,
        ]
    Notice:
      type: object
      required: [id, user_id, profile, kind, title, body, resource, read_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        profile:
          oneOf:
            - $ref: '#/components/schemas/ProfileSlug'
            - type: 'null'
        kind:
          $ref: '#/components/schemas/NoticeKind'
        title:
          type: string
        body:
          type: [string, 'null']
        resource:
          oneOf:
            - $ref: '#/components/schemas/ResourceRef'
            - type: 'null'
          description: What to open when tapped.
        read_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    NotifyPreferences:
      type: object
      required: [events, quiet_hours]
      properties:
        events:
          type: object
          description: Keyed by `NoticeKind`; a missing key means both channels on.
          additionalProperties:
            type: object
            required: [in_app, push]
            properties:
              in_app:
                type: boolean
              push:
                type: boolean
        quiet_hours:
          type: object
          required: [enabled, from, to, timezone]
          properties:
            enabled:
              type: boolean
            from:
              type: string
              pattern: '^[0-2][0-9]:[0-5][0-9]$'
            to:
              type: string
              pattern: '^[0-2][0-9]:[0-5][0-9]$'
            timezone:
              type: string
    Webhook:
      type: object
      required:
        [
          id,
          name,
          url,
          events,
          profiles,
          enabled,
          secret,
          include_content,
          allow_private_network,
          max_retries,
          stats,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        profiles:
          type: array
          description: Profiles whose events this webhook receives. Empty means every profile its creator may enter; either way an event from a profile the creator can no longer enter is not sent.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        enabled:
          type: boolean
        secret:
          type: [string, 'null']
          enum: ['[stored]', null]
        include_content:
          type: boolean
          description: Include message text in payloads (off = ids and metadata only; the fields `WebhookEventName` lists are left out).
        allow_private_network:
          type: boolean
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
        stats:
          type: object
          required: [delivered, failed, last_delivery_at, last_error]
          properties:
            delivered:
              type: integer
            failed:
              type: integer
            last_delivery_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_error:
              type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    WebhookDelivery:
      type: object
      required:
        [
          id,
          webhook_id,
          event,
          status,
          attempts,
          response_status,
          error,
          created_at,
          delivered_at,
          next_attempt_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        webhook_id:
          $ref: '#/components/schemas/Ulid'
        event:
          type: string
          description: The event name sent, e.g. `webhook.test`.
        status:
          type: string
          enum: [queued, delivered, failed, dead]
          description: '`queued` = not tried yet. `failed` = the last attempt failed; `next_attempt_at` says when it is tried again, or is null when it will not be (a test delivery, or a webhook switched off or removed). `dead` = the hub gave up after `max_retries` retries (decision §59).'
        attempts:
          type: integer
          minimum: 0
        response_status:
          type: [integer, 'null']
          description: The HTTP status the endpoint answered; null when it could not be reached.
        error:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        delivered_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        next_attempt_at:
          description: When the hub tries this delivery next; null once it is delivered, dead, or will not be retried.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    WebhookEventName:
      type: string
      description: >-
        An event a webhook can subscribe to (decision §59). `x-webhook-events` is the catalogue
        `notify.listWebhookEvents` serves: for each name, the realtime schema its `data` follows
        (`events/<source>/<name>.schema.json`, the envelope's `payload`), its description, and the
        fields of `data` left out unless the webhook says `include_content` (dotted paths).
      enum:
        [
          run.completed,
          run.failed,
          run.cancelled,
          approval.requested,
          approval.resolved,
          task.created,
          task.moved,
          task.assigned,
          schedule_run.completed,
          schedule_run.failed,
          workflow_run.completed,
          workflow_run.failed,
          step.waiting,
          notice.created,
        ]
      x-webhook-events:
        run.completed:
          source: sessions
          description:
            ar: 'انتهى تشغيل وكيل'
            en: An agent run finished
          content: [message]
        run.failed:
          source: sessions
          description:
            ar: 'فشل تشغيل وكيل'
            en: An agent run failed
          content: []
        run.cancelled:
          source: sessions
          description:
            ar: 'أُوقف تشغيل وكيل'
            en: An agent run was stopped
          content: []
        approval.requested:
          source: sessions
          description:
            ar: 'ينتظر وكيل أو سير عمل موافقة'
            en: An agent or a workflow is waiting for an approval
          content:
            [
              approval.title,
              approval.description,
              approval.command,
              approval.choices,
              approval.response,
            ]
        approval.resolved:
          source: sessions
          description:
            ar: 'أُجيب طلب موافقة أو انتهت مهلته'
            en: An approval was answered or expired
          content:
            [
              approval.title,
              approval.description,
              approval.command,
              approval.choices,
              approval.response,
            ]
        task.created:
          source: tasks
          description:
            ar: 'أُضيفت مهمة'
            en: A task was added
          content:
            [
              task.title,
              task.description,
              task.latest_summary,
              task.blocked_reason,
              task.status_reason,
            ]
        task.moved:
          source: tasks
          description:
            ar: 'انتقلت مهمة بين الأعمدة'
            en: A task changed column
          content:
            [
              task.title,
              task.description,
              task.latest_summary,
              task.blocked_reason,
              task.status_reason,
            ]
        task.assigned:
          source: tasks
          description:
            ar: 'أُسندت مهمة'
            en: A task was assigned
          content:
            [
              task.title,
              task.description,
              task.latest_summary,
              task.blocked_reason,
              task.status_reason,
            ]
        schedule_run.completed:
          source: schedules
          description:
            ar: 'انتهى تشغيل جدولة'
            en: A scheduled run finished
          content: [schedule_run.output_preview, schedule_run.output]
        schedule_run.failed:
          source: schedules
          description:
            ar: 'فشل تشغيل جدولة'
            en: A scheduled run failed
          content: [schedule_run.output_preview, schedule_run.output]
        workflow_run.completed:
          source: schedules
          description:
            ar: 'انتهى تشغيل سير عمل'
            en: A workflow run finished
          content: [workflow_run.input]
        workflow_run.failed:
          source: schedules
          description:
            ar: 'فشل تشغيل سير عمل'
            en: A workflow run failed
          content: [workflow_run.input]
        step.waiting:
          source: schedules
          description:
            ar: 'خطوة في سير عمل تنتظر موافقة'
            en: A workflow step is waiting for an approval
          content: []
        notice.created:
          source: devices
          description:
            ar: 'وصل إشعار'
            en: A notification was created
          content: [notice.title, notice.body]
    WebhookPayload:
      type: object
      description: >-
        The JSON body of every delivery (decision §59). Sent as `POST` with
        `X-CoreHub-Signature: sha256=<hex HMAC-SHA256 of the body>` when the webhook has a secret,
        `X-CoreHub-Event: <event>` and `X-CoreHub-Delivery: <delivery id>`. A retry sends the same
        body; a redelivery sends the same body under a new delivery id.
      required: [id, event, profile, occurred_at, content_included, data]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
          description: The event at this webhook. The same on every retry and redelivery, so a receiver can drop a repeat.
        event:
          type: string
          description: A `WebhookEventName`, or `webhook.test` for the test delivery.
        profile:
          oneOf:
            - $ref: '#/components/schemas/ProfileSlug'
            - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        content_included:
          type: boolean
          description: False when the webhook's `include_content` is off and the event's content fields were left out of `data`.
        data:
          type: object
          description: The realtime event's `payload` (`events/<source>/<event>.schema.json`), without the fields `x-webhook-events` lists when `content_included` is false. Empty for `webhook.test`.
      example:
        id: 01J8QK3ZR2W7M5N4P6T8V9X0EV
        event: run.completed
        profile: work
        occurred_at: '2026-09-25T10:15:04Z'
        content_included: false
        data:
          run:
            id: 01J8QK3ZR2W7M5N4P6T8V9X0RN
            session_id: 01J8QK3ZR2W7M5N4P6T8V9X0SE
            status: succeeded
    WebhookWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventName'
        profiles:
          type: array
          description: Profiles whose events this webhook receives; empty means every profile its creator may enter. A profile the caller may not enter is refused (`400`, `details.reason = profile_not_allowed`).
          items:
            $ref: '#/components/schemas/ProfileSlug'
        enabled:
          type: boolean
        secret:
          type: [string, 'null']
        include_content:
          type: boolean
        allow_private_network:
          type: boolean
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
          default: 5
          description: Retries after a failed attempt, with exponential backoff (30 s, 1 min, 2 min, … up to 1 h); then the delivery is `dead`.
    # ---------------------------------------------------------------- updates
    ClientPlatform:
      type: string
      enum: [android, ios, macos, windows, linux]
    ReleaseChannel:
      type: string
      enum: [stable, test]
    Release:
      type: object
      required:
        [
          id,
          platform,
          channel,
          version,
          build,
          notes,
          size_bytes,
          sha256,
          mandatory,
          download_url,
          published_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        channel:
          $ref: '#/components/schemas/ReleaseChannel'
        version:
          type: string
          description: Release segment, e.g. `1.0.3`. Clients compare release then `build`.
        build:
          type: integer
        notes:
          $ref: '#/components/schemas/LocalizedText'
        size_bytes:
          type: integer
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        mandatory:
          type: boolean
        download_url:
          type: string
          description: Path on this hub; never a third-party URL.
        published_at:
          $ref: '#/components/schemas/Timestamp'
    ReleaseCreate:
      type: object
      required: [platform, channel, version, build, notes]
      properties:
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        channel:
          $ref: '#/components/schemas/ReleaseChannel'
        version:
          type: string
        build:
          type: integer
        notes:
          $ref: '#/components/schemas/LocalizedText'
        attachment_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: 'Uploaded with `purpose: release`.'
        source_url:
          type: [string, 'null']
          description: Fetched server-side with the configured source token; the phone never sees it.
        mandatory:
          type: boolean
          default: false
    UpdateCheck:
      type: object
      required: [available, reason, release]
      properties:
        available:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [not_configured, up_to_date, null]
        release:
          oneOf:
            - $ref: '#/components/schemas/Release'
            - type: 'null'
    UpdateSettings:
      type: object
      required: [default_channel, source, auto_publish]
      properties:
        default_channel:
          $ref: '#/components/schemas/ReleaseChannel'
        source:
          type: object
          required: [kind, repo, token]
          properties:
            kind:
              type: string
              enum: [manual, github_release]
            repo:
              type: [string, 'null']
            token:
              type: [string, 'null']
              enum: ['[stored]', null]
        auto_publish:
          type: boolean
          description: Publish new source releases automatically to the `test` channel.
    UpdateSettingsWrite:
      type: object
      properties:
        default_channel:
          $ref: '#/components/schemas/ReleaseChannel'
        source:
          type: object
          properties:
            kind:
              type: string
              enum: [manual, github_release]
            repo:
              type: [string, 'null']
            token:
              type: [string, 'null']
        auto_publish:
          type: boolean
    # ---------------------------------------------------------------- stubs
    KnowledgeItem:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [kind, title, content, date, mood, tags, attachment_ids]
          properties:
            kind:
              type: string
              enum: [journal, note, file]
            title:
              type: [string, 'null']
            content:
              type: [string, 'null']
            date:
              type: [string, 'null']
              format: date
            mood:
              type: [string, 'null']
            tags:
              type: array
              items:
                type: string
            attachment_ids:
              type: array
              items:
                $ref: '#/components/schemas/Ulid'
    WorkspaceFileEntry:
      type: object
      description: |
        One entry of a profile's working folder (`knowledge.listWorkspaceFiles`). `kind: link`
        is a symlink that leads outside the root or nowhere: listed, never opened.
      required: [name, path, kind, link, size_bytes, modified_at, mime, editable]
      properties:
        name:
          type: string
        path:
          type: string
          description: Relative to the root, `/`-separated.
        kind:
          type: string
          enum: [file, directory, link]
        link:
          type: boolean
          description: A symlink (inside the root when `kind` is `file` or `directory`).
        size_bytes:
          type: [integer, 'null']
          minimum: 0
          description: Null for a folder and for a link that cannot be opened.
        modified_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        mime:
          type: [string, 'null']
          description: A guess from the name, for a file; null otherwise.
        editable:
          type: boolean
          description: A file small enough and of a text-like name to open in the editor.
      example:
        name: plan.md
        path: notes/plan.md
        kind: file
        link: false
        size_bytes: 1834
        modified_at: '2026-09-25T08:12:00Z'
        mime: text/markdown
        editable: true
    WorkspaceFileLimits:
      type: object
      description: The caps this hub applies to the profile's working files.
      required: [max_upload_bytes, max_edit_bytes, max_archive_bytes, max_archive_entries]
      properties:
        max_upload_bytes:
          type: integer
        max_edit_bytes:
          type: integer
        max_archive_bytes:
          type: integer
        max_archive_entries:
          type: integer
      example:
        max_upload_bytes: 26214400
        max_edit_bytes: 1048576
        max_archive_bytes: 209715200
        max_archive_entries: 20000
    WorkspaceFolder:
      type: object
      required: [profile, path, entries, truncated, limits]
      properties:
        profile:
          $ref: '#/components/schemas/ProfileSlug'
        path:
          type: string
          description: The folder listed, relative to the root (`''` for the root).
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFileEntry'
        truncated:
          type: boolean
          description: True when the folder holds more than the 5000 entries listed.
        limits:
          $ref: '#/components/schemas/WorkspaceFileLimits'
      example:
        profile: work
        path: notes
        entries:
          - name: drafts
            path: notes/drafts
            kind: directory
            link: false
            size_bytes: null
            modified_at: '2026-09-25T08:00:00Z'
            mime: null
            editable: false
          - name: plan.md
            path: notes/plan.md
            kind: file
            link: false
            size_bytes: 1834
            modified_at: '2026-09-25T08:12:00Z'
            mime: text/markdown
            editable: true
        truncated: false
        limits:
          max_upload_bytes: 26214400
          max_edit_bytes: 1048576
          max_archive_bytes: 209715200
          max_archive_entries: 20000
    WorkspaceText:
      type: object
      required: [path, content, etag, size_bytes, modified_at]
      properties:
        path:
          type: string
        content:
          type: string
        etag:
          type: string
          description: Send it back with the next save; it changes when the bytes do.
        size_bytes:
          type: integer
          minimum: 0
        modified_at:
          $ref: '#/components/schemas/Timestamp'
      example:
        path: notes/plan.md
        content: "# Plan\n"
        etag: '"9f86d081884c7d65"'
        size_bytes: 7
        modified_at: '2026-09-25T08:12:00Z'
    WorkspaceTextWrite:
      type: object
      required: [path, content, etag]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        content:
          type: string
        etag:
          type: [string, 'null']
          description: The `etag` last read; null to create a new file.
      example:
        path: notes/plan.md
        content: "# Plan\n"
        etag: '"9f86d081884c7d65"'
    WorkspacePathBody:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
      example:
        path: reports/2026
    WorkspaceFileTransfer:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: string
          minLength: 1
          maxLength: 4096
        to:
          type: string
          minLength: 1
          maxLength: 4096
      example:
        from: notes/plan.md
        to: notes/plan-v2.md
    AuditReport:
      type: object
      required: [kind, period, generated_at, data]
      properties:
        kind:
          type: string
          enum: [usage, skills]
        period:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          description: Kind-specific (usage totals and breakdowns; the Skills usage body of `audit.getSkillUsage`).
          additionalProperties: true
    TerminalSession:
      type: object
      description: One shell the owner opened from the web terminal. It lives on the hub, not in the page.
      required: [id, profile, cwd, cols, rows, attached, started_at, last_active_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        profile:
          $ref: '#/components/schemas/ProfileSlug'
        cwd:
          type: string
          description: Where the shell started — `DATA_DIR/workspaces/<profile>`.
        cols:
          type: integer
          minimum: 2
          maximum: 500
        rows:
          type: integer
          minimum: 2
          maximum: 200
        attached:
          type: boolean
          description: A socket is showing it right now.
        started_at:
          $ref: '#/components/schemas/Timestamp'
        last_active_at:
          $ref: '#/components/schemas/Timestamp'
          description: The last keystroke, resize or attach. The idle timeout counts from here.
      example:
        id: 01J8QK3ZR2W7M5N4P6T8V9X0TM
        profile: default
        cwd: /data/workspaces/default
        cols: 120
        rows: 32
        attached: true
        started_at: '2026-09-25T10:00:00Z'
        last_active_at: '2026-09-25T10:04:00Z'
    TerminalStatus:
      type: object
      required: [enabled, pty, shell, idle_timeout_seconds, max_sessions, sessions]
      properties:
        enabled:
          type: boolean
          description: Always true in a `200`; a hub without the terminal answers `403`.
        pty:
          type: boolean
          description: |
            True when sessions are real pseudo-terminals. False when the hub fell back to a
            plain shell without one (no line editing, no full-screen programs) because its
            PTY library could not load.
        shell:
          type: string
          description: The shell every session runs.
        idle_timeout_seconds:
          type: integer
          minimum: 60
        max_sessions:
          type: integer
          minimum: 1
        sessions:
          type: array
          description: The owner's live sessions, oldest first.
          items:
            $ref: '#/components/schemas/TerminalSession'
      example:
        enabled: true
        pty: true
        shell: /bin/bash
        idle_timeout_seconds: 900
        max_sessions: 3
        sessions: []
    LivePerformance:
      type: object
      required: [at, interval_seconds, host, hub, processes, profiles, history]
      properties:
        at:
          $ref: '#/components/schemas/Timestamp'
        interval_seconds:
          type: integer
          minimum: 1
          description: How often a client should ask again.
        host:
          type: object
          required:
            [
              platform,
              measured_from,
              cpu_count,
              cpu_percent,
              memory_total_bytes,
              memory_used_bytes,
              load,
            ]
          properties:
            platform:
              type: string
            measured_from:
              type: string
              enum: [proc, os]
              description: '`proc` on Linux; `os` where there is no `/proc` (Hermes processes are then not measured).'
            cpu_count:
              type: integer
              minimum: 0
            cpu_percent:
              type: [number, 'null']
              description: Share of the whole machine since the previous sample, 0–100.
            memory_total_bytes:
              type: integer
              minimum: 0
            memory_used_bytes:
              type: integer
              minimum: 0
            load:
              type: [array, 'null']
              items:
                type: number
              minItems: 3
              maxItems: 3
        hub:
          type: object
          required:
            [
              pid,
              cpu_percent,
              rss_bytes,
              heap_used_bytes,
              event_loop_lag_ms,
              uptime_seconds,
              node_version,
            ]
          properties:
            pid:
              type: integer
            cpu_percent:
              type: [number, 'null']
              description: Of one core, like `top`; above 100 means more than one core.
            rss_bytes:
              type: integer
              minimum: 0
            heap_used_bytes:
              type: integer
              minimum: 0
            event_loop_lag_ms:
              type: [number, 'null']
              description: Mean event-loop delay since the previous sample.
            uptime_seconds:
              type: integer
              minimum: 0
            node_version:
              type: string
        processes:
          type: array
          items:
            $ref: '#/components/schemas/HermesProcess'
        profiles:
          type: array
          items:
            type: object
            required: [profile, active_runs, sessions, sockets]
            properties:
              profile:
                $ref: '#/components/schemas/ProfileSlug'
              active_runs:
                type: integer
                minimum: 0
              sessions:
                type: integer
                minimum: 0
                description: Conversations not archived.
              sockets:
                type: integer
                minimum: 0
        history:
          type: array
          items:
            type: object
            required:
              [
                at,
                host_cpu_percent,
                host_memory_used_bytes,
                hub_cpu_percent,
                hub_rss_bytes,
                event_loop_lag_ms,
                hermes_rss_bytes,
              ]
            properties:
              at:
                $ref: '#/components/schemas/Timestamp'
              host_cpu_percent:
                type: [number, 'null']
              host_memory_used_bytes:
                type: integer
                minimum: 0
              hub_cpu_percent:
                type: [number, 'null']
              hub_rss_bytes:
                type: integer
                minimum: 0
              event_loop_lag_ms:
                type: [number, 'null']
              hermes_rss_bytes:
                type: [integer, 'null']
                description: Every Hermes process together; null when none could be measured.
    HermesProcess:
      type: object
      required: [kind, profile, pid, state, cpu_percent, rss_bytes, uptime_seconds]
      properties:
        kind:
          type: string
          enum: [tui_gateway, dashboard, gateway]
          description: "`tui_gateway` carries every conversation; `dashboard` is `hermes serve`; `gateway` is one profile's messaging gateway."
        profile:
          type: [string, 'null']
          description: The profile a `gateway` serves; null for the processes every profile shares.
        pid:
          type: [integer, 'null']
        state:
          type: string
          description: The supervisor's word for it (`running`, `starting`, `error`, `stopped`, …).
        cpu_percent:
          type: [number, 'null']
          description: Of one core, since the previous sample.
        rss_bytes:
          type: [integer, 'null']
        uptime_seconds:
          type: [integer, 'null']
    LogLine:
      type: object
      required: [seq, at, level, source, profile, message]
      properties:
        seq:
          type: integer
          minimum: 1
          description: Increases with every line the hub keeps, across sources.
        at:
          $ref: '#/components/schemas/Timestamp'
        level:
          type: string
          enum: [error, warn, info, debug]
        source:
          type: string
          enum: [hub, hermes]
        profile:
          type: [string, 'null']
          description: The Hermes profile whose gateway wrote it; `tui` for the TUI gateway; null for the hub.
        message:
          type: string
    LogLinesPage:
      type: object
      required: [lines, last_seq, capacity, sources]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LogLine'
        last_seq:
          type: integer
          minimum: 0
          description: The newest `seq` the hub holds, whether or not it matched; pass it as `after` next time.
        capacity:
          type: integer
          description: How many lines each source keeps.
        sources:
          type: array
          items:
            type: object
            required: [source, profile, lines]
            properties:
              source:
                type: string
                enum: [hub, hermes]
              profile:
                type: [string, 'null']
              lines:
                type: integer
                minimum: 0
    ReportPeriod:
      type: object
      description: The calendar days a report covers, both ends included, in the caller's calendar.
      required: [from, to, days]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
          minimum: 1
    ActiveAgent:
      type: object
      description: An agent active in the period, and whether it reports what it used.
      required: [agent_id, name, reports_usage]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: [string, 'null']
          description: The agent's name, or `null` for an agent since removed.
        reports_usage:
          type: boolean
          description: False when none of its runs in the period reported tokens (coding agents over ACP).
    UsageReport:
      type: object
      required: [period, generated_at, profiles, agents, totals, by_day, by_model, by_agent]
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        profiles:
          type: array
          description: The profiles the report covers.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        agents:
          type: array
          description: Every agent with a run in the period, whatever `agent_id` narrows to.
          items:
            $ref: '#/components/schemas/ActiveAgent'
        totals:
          type: object
          required:
            [
              input_tokens,
              output_tokens,
              cache_read_tokens,
              cache_write_tokens,
              reasoning_tokens,
              total_tokens,
              cache_hit_rate,
              runs,
              unreported_runs,
              conversations,
              conversations_per_day,
              cost,
              cost_source,
            ]
          properties:
            input_tokens:
              type: integer
              description: Input tokens not read from the cache.
            output_tokens:
              type: integer
            cache_read_tokens:
              type: [integer, 'null']
              description: '`null` when no record in the period reported cache reads.'
            cache_write_tokens:
              type: [integer, 'null']
              description: '`null` when no record in the period reported cache writes.'
            reasoning_tokens:
              type: integer
            total_tokens:
              type: integer
              description: Input + output + cache reads + cache writes.
            cache_hit_rate:
              type: [number, 'null']
              minimum: 0
              maximum: 1
              description: Cache reads over all input read (fresh input + cache reads); `null` when cache reads are unknown.
            runs:
              type: integer
              description: Runs started in the period.
            unreported_runs:
              type: integer
              description: Runs in the period that reported no usage (every run of a coding agent over ACP; any run of another agent that ended before reporting).
            conversations:
              type: integer
              description: Conversations with at least one run in the period.
            conversations_per_day:
              type: number
              description: The average, over the period's days, of the conversations active that day.
            cost:
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
              description: The hub's price-based estimate (or the provider's figure); `null` when nothing was priced.
            cost_source:
              type: string
              enum: [provider, estimated, unknown]
        by_day:
          type: array
          items:
            $ref: '#/components/schemas/UsageDay'
        by_model:
          type: array
          description: Most tokens first.
          items:
            $ref: '#/components/schemas/UsageModelShare'
        by_agent:
          type: array
          description: Most tokens first; agents that report no usage last.
          items:
            $ref: '#/components/schemas/UsageAgentShare'
    UsageDay:
      type: object
      required:
        [
          date,
          input_tokens,
          output_tokens,
          cache_read_tokens,
          cache_write_tokens,
          total_tokens,
          runs,
          conversations,
          cost,
        ]
      properties:
        date:
          type: string
          format: date
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
        total_tokens:
          type: integer
        runs:
          type: integer
        conversations:
          type: integer
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    UsageModelShare:
      type: object
      required:
        [
          model,
          input_tokens,
          output_tokens,
          cache_read_tokens,
          cache_write_tokens,
          total_tokens,
          share,
          runs,
          cost,
        ]
      properties:
        model:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
        total_tokens:
          type: integer
        share:
          type: number
          minimum: 0
          maximum: 1
          description: This model's part of all tokens in the report.
        runs:
          type: integer
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    UsageAgentShare:
      type: object
      required:
        [
          agent_id,
          name,
          reports_usage,
          runs,
          conversations,
          input_tokens,
          output_tokens,
          total_tokens,
          share,
          cost,
        ]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: [string, 'null']
        reports_usage:
          type: boolean
        runs:
          type: integer
        conversations:
          type: integer
        input_tokens:
          type: [integer, 'null']
          description: '`null` when the agent reported no usage — not zero.'
        output_tokens:
          type: [integer, 'null']
        total_tokens:
          type: [integer, 'null']
        share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    SkillUsageReport:
      type: object
      required:
        [
          period,
          generated_at,
          profiles,
          counting_since,
          agents,
          totals,
          top_series,
          by_day,
          top_skills,
          never_used,
        ]
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSlug'
        counting_since:
          type: [string, 'null']
          format: date-time
          description: When this hub started recording skill use; earlier use was never recorded.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ActiveAgent'
        totals:
          type: object
          required: [uses, distinct_skills, top_skill, never_used_count]
          properties:
            uses:
              type: integer
            distinct_skills:
              type: integer
            top_skill:
              oneOf:
                - type: object
                  required: [skill, uses]
                  properties:
                    skill:
                      type: string
                    uses:
                      type: integer
                - type: 'null'
            never_used_count:
              type: [integer, 'null']
              description: '`null` when the hub cannot see the installed skills.'
        top_series:
          type: array
          maxItems: 6
          description: The six most used skills of the period, most used first; the series of `by_day`.
          items:
            type: string
        by_day:
          type: array
          items:
            type: object
            required: [date, uses, skills, other]
            properties:
              date:
                type: string
                format: date
              uses:
                type: integer
              skills:
                type: object
                description: Uses that day of each skill in `top_series` (absent means none).
                additionalProperties:
                  type: integer
              other:
                type: integer
                description: Uses that day of every other skill.
        top_skills:
          type: array
          description: Every skill used in the period, most used first.
          items:
            type: object
            required: [skill, uses, share, last_used_at]
            properties:
              skill:
                type: string
              uses:
                type: integer
              share:
                type: number
                minimum: 0
                maximum: 1
              last_used_at:
                $ref: '#/components/schemas/Timestamp'
        never_used:
          type: [array, 'null']
          description: Enabled skills no run loaded in the period, by name; `null` when unknown.
          items:
            type: string
    HubPlugin:
      type: object
      required: [id, slug, name, version, kind, status, url, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        slug:
          type: string
        name:
          type: string
        version:
          type: string
        kind:
          type: string
          enum: [docker, mcp]
        status:
          type: string
          enum: [running, stopped, error]
        url:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
