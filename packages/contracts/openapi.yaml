  /models/speech/transcriptions:
    post:
      operationId: models.transcribe
      tags: [models]
      summary: Transcribe a recording with the active STT provider
      description: >-
        The recording goes to the profile's chosen speech-to-text provider (or the one named
        by `provider_id`) and its words come back; nothing is stored. `400 validation_failed`
        with `details.reason: no_speech` when the take is silent — clients show a friendly
        hint, not an error. `422 agent_unavailable` names why nothing could transcribe it in
        `details.reason`: `no_stt_provider` (none chosen — clients link to Models),
        `provider_disabled`, or the provider's own failure (`unauthorized`, `unreachable`,
        `http_error`, `no_key`, `unsupported`) with its words in `details.detail`. Over
        25 MB is `413` (DECISIONS §63).
      parameters:
        - $ref: '#/components/parameters/Profile'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV/PCM 16 kHz mono preferred; m4a/ogg accepted.
                language:
                  type: string
                  description: BCP-47 hint; omit for auto-detect.
                provider_id:
                  $ref: '#/components/schemas/Ulid'
                duration_ms:
                  type: integer
                  minimum: 0
                  description: >-
                    How long the client recorded. `Transcription.duration_ms` is the
                    provider's own figure when it reports one, else this, else 0.
            encoding:
              audio:
                contentType: audio/*
      x-rt-events: []
      responses:
        '200':
          description: The transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
              example:
                text: 'شغّل اختبارات الخادم وأخبرني بالنتيجة'
                language: ar
                duration_ms: 3200
                provider_id: 01J8QK3ZR2W7M5N4P6T8V9X0PX
                model: whisper-1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/AgentUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
