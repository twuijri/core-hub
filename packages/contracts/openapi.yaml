      responses:
        '200':
          description: The relay's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushRelayStatus'
              example:
                state: ready
                enabled: true
                forced_off: false
                private_push: true
                url: https://push.example.com
                hub_id: hub_Q2hVb3JlSHViUmVsYXkx
                last_error: null
                checked_at: '2026-09-26T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
