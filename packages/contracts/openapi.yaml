  # ---------------------------------------------------------------- attachments
  /attachments:
    post:
      operationId: sessions.uploadAttachment
      tags: [sessions]
      summary: Upload a file in one request (≤ 25 MB)
      description: >-
        For larger files or flaky networks use the resumable `/attachment-uploads` flow. Every
        upload is an attachment of its own, even when the profile already holds the same bytes
        (under this name or another, live or deleted): the bytes are stored once and removed
        with the last attachment that uses them. `409` only when those shared bytes were
        deleted while this upload was arriving; sending it again succeeds.
      parameters:
        - $ref: '#/components/parameters/Profile'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  $ref: '#/components/schemas/AttachmentPurpose'
            encoding:
              file:
                contentType: '*/*'
      x-rt-events: []
      responses:
        '201':
          description: The stored attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
              example:
