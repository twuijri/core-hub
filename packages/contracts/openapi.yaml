      summary: List an agent's skills by category
      description: >-
        The skills in the Hermes home of the profile in `X-Hub-Profile`, read the way Hermes
        reads them: a folder with a `SKILL.md` directly under `skills/` is a skill of its own
        (grouped by the pack its front matter names, or with the person's own skills), and a
        folder without one is a **category** — every skill below it
        (`skills/<category>/<name>/SKILL.md`, where Hermes keeps its built-in skills) lists
        under that category, whose `description` is the category's `DESCRIPTION.md`. A skill
        Hermes seeded from its own bundle (named in `skills/.bundled_manifest`) is `source:
        builtin` and read-only here: it can be read and pinned, not written, switched or
        deleted (`409 conflict`, `details.reason = skill_bundled`). A skill's `key` is its
        folder's name wherever the folder is. Core Hub's own skills (decision §71) live in the
