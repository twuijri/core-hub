    put:
      operationId: agents.setChannelMode
      tags: [agents]
      summary: Change how a linked WhatsApp number is used — a number dedicated to the agent, or the person's own number through "Message yourself" (admin)
      description: >-
        WhatsApp only. Writes `WHATSAPP_MODE` in the profile's `.env` (for `self-chat` the linked
        account's own number is also added to `WHATSAPP_ALLOWED_USERS`, so Hermes treats the
        person writing to themselves as the owner and not as a stranger to pair), with the
        messaging gateway that serves the profile held down while it is written and started again
        afterwards — the default profile's included — so the new mode is live when the answer
        arrives. The phone stays linked. Any other platform answers `409 state_invalid` with
        `details.reason = mode_not_supported`; a profile with no linked WhatsApp answers `409`
        with `details.reason = not_linked`.
      x-roles: [owner, admin]
      x-rt-events: []
      requestBody:
