  /agents/{agent_id}/channels/{platform}/link:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/Platform'
    post:
      operationId: agents.linkChannel
      tags: [agents]
      summary: Link a channel that signs in with a bot token or credentials, in the selected profile (admin)
      description: >-
        `telegram` links by a bot token (a bot the person made with @BotFather; the hub never
        uses Hermes's outside bot-creation service). The hub checks the token's shape
        (`<digits>:<30+ letters, digits, _ or ->`, `400 validation_failed`, `details.reason =
        token_invalid`), then asks Telegram who the bot is (`getMe`): a token Telegram refuses
        is `400 validation_failed` with `details.reason = token_rejected` and Telegram's own
        words in `details.message`; Telegram not answering is `503 service_unavailable`,
        `details.reason = telegram_unreachable`. Every other platform of
        `agents.listChannelPlatforms` links by `credentials`, keyed by the environment variable
        Hermes reads (`DISCORD_BOT_TOKEN`, `SLACK_BOT_TOKEN` and `SLACK_APP_TOKEN`, …). A
        required one missing, or one of the wrong shape, is `400 validation_failed` with
        `details.reason = credentials_invalid` and `details.field` naming it. Where the platform
        has a cheap question to ask (`validates: true` — Discord `/users/@me`, Slack `auth.test`
        and `apps.connections.open`, Matrix `/account/whoami`, Mattermost `/users/me`, Email an
        IMAP and an SMTP sign-in), it is asked before anything is stored: a refusal is `400
        validation_failed`, `details.reason = credentials_rejected`, with `details.field` and the
        platform's own words in `details.message`; no answer is `503 service_unavailable`,
        `details.reason = platform_unreachable`, `details.platform`. The other platforms are
        stored as given, unchecked. An identity already linked in another profile is `409
        conflict`, `details.reason = token_in_use`, `details.profile` — the platforms Hermes lets
        one process hold (Telegram, Discord, Slack, …). Accepted, every value is written to the
        profile's own Hermes `.env` (mode 0600, secrets never returned — `[stored]`),
        `allowed_users` (when sent) to the platform's allowlist variable, and the channel is
        switched on (`platforms.<platform>.enabled: true`); a platform whose strangers Hermes
        answers with a pairing code (`pairs: true`) gets `unauthorized_dm_behavior: pair`, so a
        stranger's request waits in `agents.listPairing`. The gateway serving the profile follows
        as `gateway.applies` says: a named profile's starts or restarts now, the default
        profile's at Hermes's Restart. Linking again replaces the values. A platform the hub does
        not know answers `409 state_invalid`, `details.reason = link_not_supported`; a hub that
        does not supervise Hermes answers `409` with `details.reason = hermes_not_supervised`.
      x-roles: [owner, admin]
      x-rt-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelTokenLink'
            example:
              token: '123456789:AAHdqTcvCH1vGWJxfSeofSAs0K5PALDsaw'
              allowed_users: ['111222333']
      responses:
        '200':
          description: Linked; the channel as it now reads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
              example:
                platform: telegram
                label: telegram
                enabled: true
                configured: true
                exclusive: true
                status: unknown
                error: null
                restart_needed: false
                login: token
                link:
                  linked: true
                  account_id: '123456789'
                  account_name: Office bot
                  account_phone: null
                  account_username: office_helper_bot
                  mode: null
                fields: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /agents/{agent_id}/channels/{platform}/settings:
    parameters:
      - $ref: '#/components/parameters/Profile'
