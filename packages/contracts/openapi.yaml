        provider into the runtime's own configuration and restarts it (ADR 0010); this
        says, in the runtime's terms, whether each step of that landed — the runtime is
        one the hub may write to, the keys are in its environment file, a model is
        selected, and the gateway was recycled since the last write. Every check is
        answered from the files and the process as they are now, not from a snapshot.
      parameters:
        - $ref: '#/components/parameters/Profile'
      x-rt-events: []
      responses:
        '200':
          description: The runtime's state, check by check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeReport'
              example:
                agent: hermes
                mode: managed
                ready: false
                reloaded_at: '2026-09-22T09:14:00Z'
                checks:
                  - id: runtime_writable
                    ok: true
                    detail: null
                  - id: provider_keys
                    ok: true
                    detail: '1 key'
                  - id: model_selected
                    ok: false
                    detail: null
                  - id: gateway_reloaded
                    ok: true
                    detail: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
