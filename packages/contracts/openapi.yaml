        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspace-files/move:
    post:
      operationId: knowledge.moveWorkspaceFile
      tags: [knowledge]
      summary: Rename or move a file or folder (owner and admin)
      description: |
        Rename is a move inside the same folder. The destination must not exist
        (`409 conflict`, `details.reason = exists`) and its folder must (`404`). A folder
        cannot move into itself (`400 validation_failed`, `details.reason = into_itself`); the
        root cannot move (`details.reason = root`). A symlink moves as a link. Recorded in the
        audit log (`workspace_file.moved`).
      parameters:
        - $ref: '#/components/parameters/Profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
