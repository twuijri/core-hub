  /task-columns:
    get:
      operationId: tasks.getColumns
      tags: [tasks]
      summary: The Tasks section in one call — columns with their ordered tasks and counts
      description: >-
        Global, so one board shows every workspace a person may enter (owner decision,
        2026-09-23: "صفحه واحده فيها كل المهام لكل البروفايلات وكل الاجنتات"). Narrow it
        with `profile`, `project_id` or `agent_id`; omit all three and it is everything.
        Which profiles "every" covers is the server's rule — owners and admins every
        profile, a member the ones they are enrolled in — never a list the client sends,
        and each card names its own `profile`. `profiles=all` says the same thing
        explicitly, in the words every list across profiles uses (`sessions.list`,
        `tasks.listTasks`, `schedules.list`; DECISIONS §32); it cannot be combined with
        `profile`. The Tasks board of the clients (ADR 0016) always shows every profile and
        offers no profile filter; `profile` stays for other callers.
      x-scope: global
      parameters:
        - name: profiles
          in: query
          description: >-
            `all`: every profile the caller may enter — what the board shows anyway, said
            explicitly. `400 validation_failed` together with `profile`.
          schema:
            type: string
            enum: [all]
        - name: profile
          in: query
          description: One workspace instead of every workspace the caller may enter.
          schema:
            $ref: '#/components/schemas/ProfileSlug'
        - name: project_id
          in: query
          description: One project instead of all of them.
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: agent_id
          in: query
          description: Only the tasks assigned to this agent.
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      x-rt-events: []
      responses:
        '200':
          description: The columns with their ordered tasks and counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskColumns'
              example:
                project_id: 01J8QK3ZR2W7M5N4P6T8V9X0PJ
