openapi: 3.1.0
info:
  title: Core Hub API
  version: 1.0.0
  summary: The one HTTP contract every Core Hub client renders.
  description: |
    Core Hub is a self-hosted hub for AI agents. This document is the source of
    truth for `/api/v1` (ADR 0003). Clients are generated from it; a hand-typed
    path in a client fails CI. Realtime events are declared next to it in
    `events/*.schema.json` and referenced from each operation's `x-rt-events`.

    Conventions (see `docs/contracts/README.md`):
    * every workspace-scoped operation requires `X-Hub-Profile`;
    * errors are `{ error, code, details? }` with a fixed code list;
    * lists page with `cursor` / `limit` and answer `{ items, next_cursor }`;
    * long work answers `202 { job_id }` and streams on `/rt/jobs`;
    * JSON keys are snake_case, ids are ULIDs, timestamps are ISO-8601 UTC.
  contact:
    name: Core Hub maintainers
    url: https://github.com/twuijri/core-hub
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
    description: The hub the client is signed in to (same origin as the realtime namespaces).
tags:
  - name: meta
    description: Server and contract identity. Global, unauthenticated.
  - name: auth
    description: Users, roles, sessions of people, app tokens, QR pairing, workspaces (profiles) and per-user preferences.
  - name: jobs
    description: The registry of long-running work. Every `202` in this document points here.
  - name: agents
    description: The registry of agents and their adapters — install state, capabilities, settings, skills, MCP servers, memory, channels, plugins and config files.
  - name: sessions
    description: Chat sessions, messages, runs (streamed), tool calls, approvals, categories and attachments.
  - name: rooms
    description: Multi-agent rooms — seats, members, invites, messages, mentions, handoffs and room memory.
  - name: tasks
    description: Tasks (a kanban-style section) and their projects — assignment of tasks to agents, subtasks, dependencies, worktrees and task activity.
  - name: schedules
    description: Scheduled jobs (cron / interval / once), their run history, and workflows (DAGs of runs) with their runs.
  - name: models
    description: Model providers and keys, the model catalogue, defaults and auxiliary roles, ensembles, speech (STT / TTS).
  - name: devices
    description: Phones and computers linked to the hub, the capabilities they expose, push registration and capability requests.
  - name: notify
    description: In-app notices, notification preferences and outgoing webhooks.
  - name: updates
    description: Release channels and update checks for the clients. Global, admin-managed.
  - name: knowledge
    description: "Journal, notes and files, and the profile's working files (`/workspace-files`, owner and admin)."
  - name: audit
    description: Usage and cost, skills usage, logs and performance reports.
  - name: plugins
    description: 'Phase 4 stub: hub plugins (Docker / MCP based). One endpoint reserved.'
  - name: terminal
    description: The owner's web terminal — a shell on the hub's host, off unless `COREHUB_WEB_TERMINAL=1`. Owner only. Sessions run over `/rt/terminal`.
security:
  - bearer: []
paths:
  # ================================================================== meta
  /health:
    get:
      operationId: meta.health
      tags: [meta]
      summary: Liveness probe for load balancers and the drawer's connection dot
      description: Unauthenticated, cheap, no database access. `503` when the server is shutting down.
      security: []
      x-scope: global
      x-rt-events: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                ok: true
                server_version: 0.1.0
                uptime_seconds: 86400
        '503':
          description: Shutting down or a dependency is unavailable (`service_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'الخادم يعيد التشغيل'
                code: service_unavailable
                details:
                  retry_after_ms: 5000
  /meta:
    get:
      operationId: meta.get
      tags: [meta]
      summary: Identify the server and the contract it implements
      description: Unauthenticated. A client compares `contract_version` before signing in.
      security: []
      x-scope: global
      x-rt-events: []
      responses:
        '200':
          description: Server identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
              example:
                name: 'Core Hub'
                server_version: 0.1.0
                contract_version: 1.0.0
                api_versions: [v1]
                realtime_namespaces:
                  [
                    /rt/sessions,
                    /rt/rooms,
                    /rt/tasks,
                    /rt/schedules,
                    /rt/devices,
                    /rt/jobs,
                    /rt/terminal,
                  ]
                locales: [ar, en]
                setup_required: false
                setup_open: false
                setup_open_until: null
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  # ================================================================== jobs
  /jobs:
    get:
      operationId: jobs.list
      tags: [jobs]
      summary: List jobs in the workspace
      description: Sorted by `created_at desc`. Reconnecting clients call it with `status=running` and re-subscribe.
      parameters:
        - $ref: '#/components/parameters/Profile'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/JobKind'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      x-rt-events: []
      responses:
        '200':
          description: A page of jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Job'
              example:
                items:
                  - id: 01J8QK3ZR2W7M5N4P6T8V9X0JB
                    profile: work
                    owner_id: 01J8QK3ZR2W7M5N4P6T8V9X0HM
                    created_at: '2026-09-21T10:15:00Z'
                    updated_at: '2026-09-21T10:15:04Z'
                    kind: run
                    status: running
                    progress:
                      percent: null
                      message: 'يكتب الرد…'
                    resource:
                      kind: run
                      id: 01J8QK3ZR2W7M5N4P6T8V9X0RN
                    result: null
                    error: null
                    started_at: '2026-09-21T10:15:01Z'
                    finished_at: null
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /background:
    get:
      operationId: background.list
      tags: [jobs]
      summary: What is running for the person, and what finished in the last day
      description: |
        The Background panel (contract decision §56): everything working for the caller — their
        chat runs, task runs, schedule runs, workflow runs, jobs (exports, imports, plugin
        installs, channel logins and the rest) and the subagents of their conversations — in one
        list. `running` holds what is queued or running, oldest first; `finished` what ended in
        the last 24 hours, newest first, at most 50. With `profiles=all` it covers every profile
        the caller may enter (the server decides which); each item names its `profile`. An item
        is the caller's own work: a run they started or a schedule of theirs fired, a job they
        asked for, a subagent of their conversation. A subagent that finished before the hub last
        started is not in `finished`.
      parameters:
        - $ref: '#/components/parameters/Profile'
        - name: profiles
          in: query
          description: >-
            `all` covers every profile the caller may enter instead of the one in the header.
          schema:
            type: string
            enum: [all]
      x-rt-events: []
      responses:
        '200':
          description: The caller's background work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundList'
              example:
                running:
                  - id: 'run:01J8QK3ZR2W7M5N4P6T8V9X0RN'
                    kind: chat_run
                    job_kind: null
                    title: 'خطة إطلاق التطبيق'
                    profile: work
                    status: running
                    started_at: '2026-09-21T10:15:01Z'
                    finished_at: null
                    stoppable: true
                    session_id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
                    resource:
                      kind: run
                      id: 01J8QK3ZR2W7M5N4P6T8V9X0RN
                  - id: 'subagent:01J8QK3ZR2W7M5N4P6T8V9X0YA:sa-2-7f3c'
                    kind: subagent
                    job_kind: null
                    title: 'راجع ملفات الاختبارات واذكر ما ينقصها'
                    profile: work
                    status: running
                    started_at: '2026-09-21T10:15:05Z'
                    finished_at: null
                    stoppable: true
                    session_id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
                    resource: null
                finished:
                  - id: 'job:01J8QK3ZR2W7M5N4P6T8V9X0JB'
                    kind: job
                    job_kind: export
                    title: 'تصدير البروفايل work'
                    profile: work
                    status: succeeded
                    started_at: '2026-09-21T09:40:00Z'
                    finished_at: '2026-09-21T09:41:12Z'
                    stoppable: false
                    session_id: null
                    resource:
                      kind: profile
                      id: 01J8QK3ZR2W7M5N4P6T8V9X0PF
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /background/{item_id}/stop:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - name: item_id
        in: path
        required: true
        description: A `BackgroundItem.id`; the header names the item's own `profile`.
        schema:
          type: string
          pattern: '^(run|workflow_run|job|subagent):[A-Za-z0-9._:-]{1,200}$'
    post:
      operationId: background.stop
      tags: [jobs]
      summary: Stop one background item
      description: |
        Stops it the way its own screen would: a run as the chat's Stop does (`run.cancelled`), a
        workflow run as its Cancel does, a job through `jobs.cancel`, a subagent through
        `sessions.interruptSubagent`. The answer is the item after the request — it may still
        read `running` for a moment. `409 state_invalid` when it has finished or cannot be
        stopped (`details.reason = finished | not_stoppable`).
      x-rt-events: [run.cancelled, workflow_run.cancelled, job.cancelled, subagent.completed]
      responses:
        '200':
          description: The item after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundItem'
              example:
                id: 'run:01J8QK3ZR2W7M5N4P6T8V9X0RN'
                kind: task_run
                job_kind: null
                title: 'حدّث صفحة الأسعار'
                profile: work
                status: running
                started_at: '2026-09-21T10:15:01Z'
                finished_at: null
                stoppable: false
                session_id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
                resource:
                  kind: task
                  id: 01J8QK3ZR2W7M5N4P6T8V9X0TK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
    get:
      operationId: jobs.get
      tags: [jobs]
      summary: Read one job
      x-rt-events: []
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                id: 01J8QK3ZR2W7M5N4P6T8V9X0JB
                profile: work
                owner_id: 01J8QK3ZR2W7M5N4P6T8V9X0HM
                created_at: '2026-09-21T10:15:00Z'
                updated_at: '2026-09-21T10:15:30Z'
                kind: install
                status: succeeded
                progress:
                  percent: 100
                  message: 'اكتمل التثبيت'
                resource:
                  kind: agent
                  id: 01J8QK3ZR2W7M5N4P6T8V9X0AG
                result:
                  version: 0.155.1
                error: null
                started_at: '2026-09-21T10:15:01Z'
                finished_at: '2026-09-21T10:15:30Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
    post:
      operationId: jobs.cancel
      tags: [jobs]
      summary: Request cancellation of a job
      description: Ends `cancelled`, or `succeeded` if the job was already past the point of no return. Cancelling a run also emits `run.cancelled` on `/rt/sessions`.
      x-rt-events: [job.cancelled, run.cancelled]
      responses:
        '200':
          description: The job after the request (status may still be `running` for a moment).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                id: 01J8QK3ZR2W7M5N4P6T8V9X0JB
                profile: work
                owner_id: 01J8QK3ZR2W7M5N4P6T8V9X0HM
                created_at: '2026-09-21T10:15:00Z'
                updated_at: '2026-09-21T10:15:09Z'
                kind: run
                status: cancelled
                progress:
                  percent: null
                  message: 'أُوقف بطلب المستخدم'
                resource:
                  kind: run
                  id: 01J8QK3ZR2W7M5N4P6T8V9X0RN
                result: null
                error: null
                started_at: '2026-09-21T10:15:01Z'
                finished_at: '2026-09-21T10:15:09Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ================================================================== auth
  /auth/setup:
    get:
      operationId: auth.getSetup
      tags: [auth]
      summary: Ask whether this hub still needs its owner account created
      description: |
        Unauthenticated, and deliberately says nothing else: `required` is `true` only while no
        user exists at all. It never reveals the setup token, whether a token file is present,
        or how many attempts were made. A client that gets `true` sends the person to its setup
        screen; anything else sends them to sign-in.
      security: []
      x-scope: global
      x-rt-events: []
      responses:
        '200':
          description: Whether first-run setup is still open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
              example:
                required: true
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      operationId: auth.completeSetup
      tags: [auth]
      summary: Create the owner account on a hub that has none (first run)
      description: |
        First run only (ADR 0011, amended by ADR 0019). For a window after the hub process
        starts with no owner — `COREHUB_SETUP_OPEN_MINUTES`, 60 by default — setup is open to
        whoever arrives first: `token` may be omitted and is ignored. `meta.get` says whether the
        window is open (`setup_open`) and until when (`setup_open_until`). A restart opens a
        fresh window. After the window, or always when the variable is `0`, the claim token is
        required: the hub writes it to `<DATA_DIR>/setup-token.txt` (mode 0600) and logs it on
        every boot while no owner exists. On success the owner and the default workspace are
        created, the token file is deleted, and the answer is the same `TokenPair` `auth.login`
        returns, so the client is signed in immediately. Two setups racing are serialized: exactly
        one creates the owner, the other is `409`.

        The token is compared in constant time and failures are throttled per IP by the same
        lockout that protects `auth.login` (`kind: password` in `/auth/lockouts`). Once an owner
        exists the operation is `409 conflict` for good — including a replay of the same token.
        An unattended install that sets `HUB_ADMIN_PASSWORD` never opens this path: the owner
        already exists on first boot and `auth.getSetup` answers `false`.
      security: []
      x-scope: global
      x-rt-events: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
            example:
              token: 9f2c7a41d0b84e5c9a3f61d7e8b02c4a5d6f7081
              username: tariq
              password: '••••••••'
              display_name: 'طارق'
              workspace_name: 'مساحتي'
      responses:
        '200':
          description: The owner was created and is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.e30.access
                refresh_token: hub_rt_3f8c2b1a9d7e4c6b5a0f1e2d3c4b5a69
                expires_in: 900
                user:
                  id: 01J8QK3ZR2W7M5N4P6T8V9X0HM
                  username: tariq
                  display_name: 'طارق'
                  role: owner
                  status: active
                  locale: ar
                  avatar:
                    kind: generated
                    url: null
                    seed: tariq
                  profiles: [default]
                  default_profile: default
                  last_login_at: '2026-09-22T08:00:00Z'
                  created_at: '2026-09-22T08:00:00Z'
                  updated_at: '2026-09-22T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            The window is closed and the setup token is missing (`auth.setup_token_required`),
            wrong, or no longer on disk (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'رمز التهيئة غير صحيح.'
                code: unauthorized
        '409':
          description: An owner account already exists; first-run setup is closed (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'تمت تهيئة هذا المركز بالفعل؛ سجّل الدخول.'
                code: conflict
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      operationId: auth.login
      tags: [auth]
      summary: Sign in with username and password
      description: Returns a short-lived access token and a rotating refresh token. Rate-limited per IP; lockouts appear in `/auth/lockouts`.
      security: []
      x-scope: global
      x-rt-events: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: tariq
              password: '••••••••'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.e30.access
                refresh_token: hub_rt_3f8c2b1a9d7e4c6b5a0f1e2d3c4b5a69
                expires_in: 900
                user:
                  id: 01J8QK3ZR2W7M5N4P6T8V9X0HM
                  username: tariq
                  display_name: 'طارق'
                  role: owner
                  status: active
                  locale: ar
                  avatar:
                    kind: generated
                    url: null
                    seed: tariq
                  profiles: [default, work]
                  default_profile: work
                  last_login_at: '2026-09-21T08:00:00Z'
                  created_at: '2026-09-01T00:00:00Z'
                  updated_at: '2026-09-21T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      operationId: auth.refresh
      tags: [auth]
      summary: Exchange a refresh token (or renew an app token)
      description: |
        With a body: rotates the refresh token and issues a new access token. With no body and an
        app-token bearer: renews the app token's `expires_at` (clients renew when < 7 days remain).
      security:
        - {}
        - bearer: []
      x-scope: global
      x-rt-events: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: hub_rt_3f8c2b1a9d7e4c6b5a0f1e2d3c4b5a69
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.e30.access2
                refresh_token: hub_rt_9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d
                expires_in: 900
                user:
                  id: 01J8QK3ZR2W7M5N4P6T8V9X0HM
                  username: tariq
                  display_name: 'طارق'
                  role: owner
                  status: active
                  locale: ar
                  avatar:
                    kind: generated
                    url: null
                    seed: tariq
                  profiles: [default, work]
                  default_profile: work
                  last_login_at: '2026-09-21T08:00:00Z'
                  created_at: '2026-09-01T00:00:00Z'
                  updated_at: '2026-09-21T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: auth.logout
      tags: [auth]
      summary: Revoke the current refresh token or app token
      x-scope: global
      x-rt-events: [device.updated]
      responses:
        '204':
          description: Revoked. The client discards its tokens.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      operationId: auth.getMe
      tags: [auth]
      summary: Read the signed-in user (also the cheap token check)
      x-scope: global
      x-rt-events: []
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 01J8QK3ZR2W7M5N4P6T8V9X0HM
                username: tariq
                display_name: 'طارق'
                role: owner
                status: active
                locale: ar
                avatar:
                  kind: generated
                  url: null
                  seed: tariq
                profiles: [default, work]
                default_profile: work
                last_login_at: '2026-09-21T08:00:00Z'
                created_at: '2026-09-01T00:00:00Z'
                updated_at: '2026-09-21T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: auth.updateMe
      tags: [auth]
      summary: Change display name, username, locale, avatar or default profile
      description: Changing `username` requires `current_password`.
      x-scope: global
      x-rt-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSelfPatch'
            example:
              display_name: 'طارق العجيري'
              avatar:
                kind: image
                data_url: 'data:image/png;base64,iVBORw0KGgo='
      responses:
