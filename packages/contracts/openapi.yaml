  # ================================================ knowledge: profile files
  /workspace-files:
    get:
      operationId: knowledge.listWorkspaceFiles
      tags: [knowledge]
      summary: One folder of the profile's working files (owner and admin)
      description: |
        The profile's working folder is `${DATA_DIR}/workspaces/<profile>`: the folders a
        conversation or a task works in live under it. This lists one folder of it, folders
        first then by name. Every `path` in this family is relative to that root, written
        with `/`, and `''` is the root itself; an absolute path, a `..` that climbs out, a NUL
        byte, or a symlink that leads outside the root is `400 validation_failed`
        (`details.reason`: `absolute`, `outside_root`, `invalid`, `symlink_outside`). Nothing
        here reaches the hub's keys, Hermes's home or any other profile. Links inside the root
        are listed as what they point at, with `link: true`; a link that leads out is listed
        as `kind: link` and cannot be opened. At most 5000 entries are returned
        (`truncated`). Contract decision §65.
      parameters:
        - $ref: '#/components/parameters/Profile'
        - $ref: '#/components/parameters/WorkspaceFilePath'
      x-roles: [owner, admin]
      x-rt-events: []
      responses:
        '200':
          description: The folder and what is directly in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFolder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: knowledge.deleteWorkspaceFile
      tags: [knowledge]
      summary: Delete a file or a folder with everything in it (owner and admin)
      description: |
        A folder goes with its contents. A symlink is removed as a link; what it points at is
        never touched. The root itself cannot be deleted (`400 validation_failed`,
        `details.reason = root`). Recorded in the audit log (`workspace_file.deleted`).
      parameters:
        - $ref: '#/components/parameters/Profile'
        - $ref: '#/components/parameters/WorkspaceFilePath'
      x-roles: [owner, admin]
      x-rt-events: []
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspace-files/content:
    get:
      operationId: knowledge.downloadWorkspaceFile
      tags: [knowledge]
      summary: The bytes of one file (owner and admin)
      description: |
        Streams the file with its media type and an `ETag`. `disposition=inline` lets a
        client show an image or a PDF; `attachment` (the default) saves it under its name.
        A folder is `400 validation_failed` (`details.reason = not_a_file`); use
        `knowledge.downloadWorkspaceFolder` for a folder.
      parameters:
        - $ref: '#/components/parameters/Profile'
        - $ref: '#/components/parameters/WorkspaceFilePath'
        - name: disposition
          in: query
          required: false
          schema:
            type: string
            enum: [inline, attachment]
            default: attachment
      x-roles: [owner, admin]
      x-rt-events: []
      responses:
        '200':
          description: The whole file.
          headers:
            ETag:
              description: Changes whenever the file's size or modification time does.
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspace-files/archive:
    get:
      operationId: knowledge.downloadWorkspaceFolder
      tags: [knowledge]
      summary: A folder as a zip (owner and admin)
      description: |
        The folder and everything under it, as one zip named after the folder (the root is
        named after the profile). Symlinks are left out, never followed. Capped at
        `WorkspaceFileLimits.max_archive_bytes` of file bytes and
        `max_archive_entries` entries: a bigger folder is `413 payload_too_large` before a
        byte is sent, with `details.max_bytes` / `details.max_entries`.
      parameters:
        - $ref: '#/components/parameters/Profile'
        - $ref: '#/components/parameters/WorkspaceFilePath'
      x-roles: [owner, admin]
      x-rt-events: []
      responses:
        '200':
          description: The zip.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /workspace-files/text:
    get:
      operationId: knowledge.readWorkspaceText
      tags: [knowledge]
      summary: A plain-text file, to edit (owner and admin)
      description: |
        The file as UTF-8 text with the `etag` a save must send back. Larger than
        `WorkspaceFileLimits.max_edit_bytes` is `413 payload_too_large`; a file that is not
        UTF-8 text (a NUL byte, invalid UTF-8) is `415 unsupported_media_type` — download it
        instead.
      parameters:
        - $ref: '#/components/parameters/Profile'
        - $ref: '#/components/parameters/WorkspaceFilePath'
      x-roles: [owner, admin]
      x-rt-events: []
      responses:
        '200':
          description: The text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceText'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    put:
      operationId: knowledge.writeWorkspaceText
      tags: [knowledge]
      summary: Save a plain-text file (owner and admin)
      description: |
        `etag` is the one `readWorkspaceText` (or the previous save) answered: when the file
        changed on disk since — an agent wrote it, another tab saved it — the save is
        `409 conflict` with `details.reason = changed` and the current `details.etag`, and
        nothing is written. `etag: null` creates a new file and is `409`
        (`details.reason = exists`) when one is already there. Content over
        `max_edit_bytes` is `413`. Writing through a symlink is refused. Recorded in the audit
        log (`workspace_file.written`).
      parameters:
        - $ref: '#/components/parameters/Profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceTextWrite'
            example:
              path: notes/plan.md
              content: "# Plan\n\n- ship the files page\n"
              etag: '"9f86d081884c7d65"'
      x-roles: [owner, admin]
      x-rt-events: []
      responses:
        '200':
          description: Saved; the new `etag`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceText'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /workspace-files/upload:
    post:
      operationId: knowledge.uploadWorkspaceFile
      tags: [knowledge]
      summary: Put one file into a folder (owner and admin)
      description: |
        Multipart, one `file` part, into the folder `path` names, which must exist (`404`). At
        most `WorkspaceFileLimits.max_upload_bytes` (`413`). A file of that name already
        there is `409 conflict` (`details.reason = exists`) unless `overwrite=true`; a folder
        or a symlink of that name is never replaced. Recorded in the audit log
        (`workspace_file.uploaded`).
      parameters:
        - $ref: '#/components/parameters/Profile'
        - $ref: '#/components/parameters/WorkspaceFilePath'
        - name: overwrite
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: '*/*'
      x-roles: [owner, admin]
      x-rt-events: []
      responses:
        '201':
          description: The file as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /workspace-files/folders:
    post:
      operationId: knowledge.createWorkspaceFolder
      tags: [knowledge]
      summary: Make a new folder (owner and admin)
      description: |
        Missing parents are made too. Anything already at `path` is `409 conflict`
        (`details.reason = exists`). Recorded in the audit log (`workspace_file.folder_created`).
      parameters:
