    get:
      operationId: agents.getChannelSettings
      tags: [agents]
      summary: A channel's own settings, as Hermes reads them in the selected profile (admin)
      description: >-
        `telegram`, `discord`, `slack`, `matrix`, `mattermost` and `email`: every user-facing
        option Hermes has for the platform, each with the value set in
        the profile (null while unset), the value that applies while it is unset (`default` —
        Hermes's own, or the profile's global display setting it falls back to), and where the
        value is kept (`source`: `config` for the profile's `config.yaml`, `env` for its `.env`,
        null while unset). A `shared` option is not Telegram's alone: it is kept once for the
        profile (speech-to-text, voice replies) and changes WhatsApp and every other channel
        there too. Labels and help text are the client's, keyed by `key` (the same key means
        the same thing on every platform). Any other platform answers `409 state_invalid` with
        `details.reason = settings_not_supported`.
      x-roles: [owner, admin]
      responses:
        '200':
          description: The options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSettings'
              example:
                platform: telegram
                options:
                  - key: show_reasoning
                    section: replies
                    kind: toggle
                    value: true
                    default: false
                    choices: null
                    min: null
                    max: null
                    shared: false
                    source: config
                  - key: tool_progress
                    section: replies
                    kind: select
                    value: null
                    default: 'off'
                    choices: ['off', new, all, verbose]
                    min: null
                    max: null
                    shared: false
                    source: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
