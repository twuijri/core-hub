components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT or app token
      description: |
        `Authorization: Bearer <token>`. A JWT access token identifies a person
        (from `POST /auth/login`); an app token `hub_at_…` identifies a paired
        device or an integration. Socket.IO handshakes pass the same token as
        `auth.token`.
  parameters:
    Profile:
      name: X-Hub-Profile
      in: header
      required: true
      description: |
        Workspace (profile) slug the request is scoped to. `default` always exists. Owners and
        admins may name any profile; a member only one they were explicitly given. Anything
        else is `404 profile_not_found`; for a member who has been given no profile at all,
        `details.reason` is `no_profile_granted`.
      schema:
        $ref: '#/components/schemas/ProfileSlug'
      example: work
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's `next_cursor`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (1–200, default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated ULID. Replaying the same key within 24 h returns the original response.
      schema:
        $ref: '#/components/schemas/Ulid'
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    WorkflowRunId:
      name: workflow_run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    SeatId:
      name: seat_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    McpServerName:
      name: server_name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,60}$'
    PresetId:
      name: preset_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,60}$'
    PairingRequestId:
      name: request_id
      in: path
      required: true
      description: Hermes's id of a pending pairing request (16 hex characters), as `agents.listPairing` lists it.
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{16}$'
        example: 3f9a1c0e7b2d4a55
    PairedUserId:
      name: user_id
      in: path
      required: true
      description: The platform's id of an approved sender, as `agents.listPairing` lists it (URL-encoded).
      schema:
        type: string
        minLength: 1
        maxLength: 200
        example: '966500000002@s.whatsapp.net'
    Platform:
      name: platform
      in: path
      required: true
      description: Messaging platform slug (`telegram`, `discord`, `slack`, `whatsapp`, `matrix`, …) as listed by the channels operation.
      schema:
        type: string
        pattern: '^[a-z0-9_]{2,30}$'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language of human-readable `error` messages and generated titles (`ar` or `en`).
      schema:
        type: string
        enum: [ar, en]
        default: en
    ReportDays:
      name: days
      in: query
      required: false
      description: How many calendar days the report covers, today included. Clients offer 7, 30, 90 and 365.
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    ReportProfiles:
      name: profiles
      in: query
      required: false
      description: >-
        `all` covers every profile the caller may enter instead of the one in the header
        (ADR 0016). Absent, the report is the header's profile alone.
      schema:
        type: string
        enum: [all]
    ReportAgent:
      name: agent_id
      in: query
      required: false
      description: Narrows the report to one agent.
      schema:
        $ref: '#/components/schemas/Ulid'
    UtcOffset:
      name: utc_offset_minutes
      in: query
      required: false
      description: >-
        The caller's offset from UTC in minutes (east positive; Riyadh is `180`). Days are
        counted in that calendar. Absent, days are UTC days.
      schema:
        type: integer
        minimum: -720
        maximum: 840
        default: 0
  headers:
    RateLimitLimit:
      description: Requests allowed in the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    RequestId:
      description: Correlation id echoed in logs and in `details.request_id` of `internal` errors.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request or failed validation (`bad_request`, `validation_failed`, `profile_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'الحقل «title» مطلوب'
            code: validation_failed
            details:
              fields:
                - path: title
                  message: required
    Unauthorized:
      description: Missing, invalid or expired token (`unauthorized`, `token_expired`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'انتهت صلاحية رمز الدخول'
            code: token_expired
    Forbidden:
      description: The principal lacks the role or scope (`forbidden`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'هذا الإجراء للمشرفين فقط'
            code: forbidden
            details:
              required_role: admin
    NotFound:
      description: Unknown id or profile (`not_found`, `profile_not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'الجلسة غير موجودة'
            code: not_found
            details:
              resource: session
              id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
    Conflict:
      description: Duplicate, version mismatch or illegal state transition (`conflict`, `state_invalid`, `already_running`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'لا يمكن نقل المهمة من «done» إلى «in_progress» مباشرة'
            code: state_invalid
            details:
              from: done
              to: in_progress
              allowed: [archived]
    PayloadTooLarge:
      description: The upload exceeds the limit (`payload_too_large`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'حجم الملف يتجاوز الحد المسموح'
            code: payload_too_large
            details:
              max_bytes: 26214400
    AgentUnavailable:
      description: The agent cannot serve the request (`agent_unavailable`, `agent_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'الوكيل Claude Code غير مثبّت على هذا الخادم'
            code: agent_unavailable
            details:
              agent_id: 01J8QK3ZR2W7M5N4P6T8V9X0AG
              status: not_installed
    RateLimited:
      description: Too many requests (`rate_limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'طلبات كثيرة، حاول بعد قليل'
            code: rate_limited
            details:
              retry_after_ms: 4000
    NotImplemented:
      description: Reserved stub of a later phase (`not_implemented`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'هذه الوحدة غير متاحة في هذا الإصدار'
            code: not_implemented
    Internal:
      description: Unexpected server error (`internal`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'حدث خطأ غير متوقع'
            code: internal
            details:
              request_id: req_01J8QK3ZR2W7M5N4P6T8V9X0RQ
    ServiceUnavailable:
      description: A dependency the hub needs for this call is not answering (`service_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'الخدمة غير جاهزة بعد'
            code: service_unavailable
            details:
              reason: hermes_api_unavailable
              message: "Hermes's dashboard API did not become ready in time"
  schemas:
    # ---------------------------------------------------------------- common
    Ulid:
      type: string
      description: 26-character Crockford base32 ULID, sortable by creation time.
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      minLength: 26
      maxLength: 26
      examples: [01J8QK3ZR2W7M5N4P6T8V9X0YA]
    ProfileSlug:
      type: string
      description: Workspace (profile) slug — lowercase letters, digits and dashes.
      pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
      examples: [work]
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC with `Z`.
      examples: ['2026-09-21T10:15:00Z']
    Locale:
      type: string
      enum: [ar, en]
      description: UI language. Content direction is decided per string by the client, never by this value.
    Money:
      type: object
      description: Decimal amount as a string plus ISO-4217 currency.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
        currency:
          type: string
          minLength: 3
          maxLength: 3
      examples:
        - amount: '0.0123'
          currency: USD
    Error:
      type: object
      description: The one error envelope. Clients branch on `code`, show `error` verbatim.
      required: [error, code]
      properties:
        error:
          type: string
          description: Human sentence in the request language (`Accept-Language`).
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          type: object
          description: Code-specific structured details (see `docs/contracts/README.md` §4).
          additionalProperties: true
      examples:
        - error: 'الجلسة غير موجودة'
          code: not_found
          details:
            resource: session
            id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
    ErrorCode:
      type: string
      description: Fixed list. Adding a code is a contract change.
      enum:
        - bad_request
        - validation_failed
        - profile_required
        - unauthorized
        - token_expired
        - forbidden
        - not_found
        - profile_not_found
        - conflict
        - state_invalid
        - already_running
        - payload_too_large
        - unsupported_media_type
        - agent_unavailable
        - agent_error
        - provider_not_configured
        - provider_unauthorized
        - rate_limited
        - internal
        - not_implemented
        - service_unavailable
    Scoped:
      type: object
      description: Fields every row a client can show carries (ARCHITECTURE §Data ownership).
      required: [id, profile, owner_id, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        profile:
          $ref: '#/components/schemas/ProfileSlug'
        owner_id:
          $ref: '#/components/schemas/Ulid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Page:
      type: object
      description: Envelope of every list. `items` is typed per operation.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to fetch the next page; `null` when there is none.
    Avatar:
      type: object
      description: A picture for a person, agent or profile. `generated` avatars are drawn by the client from `seed`.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [image, generated]
        url:
          type: [string, 'null']
          description: Fetchable with the bearer token when `kind = image`.
        seed:
          type: [string, 'null']
          description: Deterministic seed when `kind = generated`.
      examples:
        - kind: generated
          url: null
          seed: work
    AvatarInput:
      type: object
      description: Set an avatar. `image` carries a data URL (≤ 512 KB); `generated` resets to the seed; `null` resets to default.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [image, generated]
        data_url:
          type: string
          description: '`data:image/png;base64,…` when `kind = image`.'
        seed:
          type: string
    LocalizedText:
      type: object
      description: A short text kept in both UI languages (release notes, notices generated by the server).
      required: [ar, en]
      properties:
        ar:
          type: string
        en:
          type: string
      examples:
        - ar: 'إصلاح انقطاع البث عند ضعف الشبكة'
          en: 'Fix streaming drop on weak networks'
    JobAccepted:
      type: object
      description: Body of every `202`. Operations add the ids of resources they created.
      required: [job_id]
      properties:
        job_id:
          $ref: '#/components/schemas/Ulid'
      examples:
        - job_id: 01J8QK3ZR2W7M5N4P6T8V9X0JB
    # ---------------------------------------------------------------- meta
    Health:
      type: object
      required: [ok, server_version, uptime_seconds]
      properties:
        ok:
          type: boolean
        server_version:
          type: string
        uptime_seconds:
          type: integer
    Meta:
      type: object
      required:
        [
          name,
          server_version,
          contract_version,
          api_versions,
          realtime_namespaces,
          locales,
          setup_required,
          setup_open,
          setup_open_until,
        ]
      properties:
        name:
          type: string
          description: Display name the owner set (defaults to "Core Hub").
        server_version:
          type: string
        contract_version:
          type: string
          description: The `info.version` of the OpenAPI document the server implements.
        api_versions:
          type: array
          items:
            type: string
        realtime_namespaces:
          type: array
          items:
            type: string
        locales:
          type: array
          items:
            $ref: '#/components/schemas/Locale'
        setup_required:
          type: boolean
          description: |
            True while the hub has no owner: before first-run setup, and again after
            `COREHUB_RESET_OWNER` disabled the owner (ADR 0019). This is the "needs an owner" bit.
        setup_open:
          type: boolean
          description: |
            True while `auth.completeSetup` needs no token: the hub has no owner and the window
            after this process started (`COREHUB_SETUP_OPEN_MINUTES`) has not ended. False once an
            owner exists, after the window, and always when the window is `0` (token only).
        setup_open_until:
          type: [string, 'null']
          format: date-time
          description: When the open window ends; null whenever `setup_open` is false.
    # ---------------------------------------------------------------- jobs
    JobKind:
      type: string
      enum:
        [
          run,
          install,
          update,
          uninstall,
          restart,
          check_update,
          discover,
          refresh_catalogue,
          worktree,
          webhook_test,
          device_request,
          export,
          schedule_run,
          workflow_run,
          channel_login,
          import,
          plugin_install,
        ]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobProgress:
      type: object
      required: [percent, message]
      properties:
        percent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: '`null` when the work has no measurable progress (a run).'
        message:
          type: [string, 'null']
          description: Human progress line in the requester's language.
    ResourceRef:
      type: object
      description: Reference to the entity a job or event is about.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum:
            [
              agent,
              session,
              run,
              message,
              room,
              seat,
              project,
              task,
              subtask,
              worktree,
              schedule,
              schedule_run,
              workflow,
              workflow_run,
              step,
              provider,
              device,
              device_request,
              webhook,
              approval,
              notice,
              profile,
              attachment,
            ]
        id:
          $ref: '#/components/schemas/Ulid'
    Job:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [kind, status, progress, resource, result, error, started_at, finished_at]
          properties:
            kind:
              $ref: '#/components/schemas/JobKind'
            status:
              $ref: '#/components/schemas/JobStatus'
            progress:
              $ref: '#/components/schemas/JobProgress'
            resource:
              oneOf:
                - $ref: '#/components/schemas/ResourceRef'
                - type: 'null'
              description: The entity the job is about; `null` for work with no single
                subject (a host-wide agent discovery).
            result:
              type: [object, 'null']
              description: >-
                Kind-specific outcome (an install's `version`, an export's `attachment_id`). A
                `channel_login` job also carries its state here while it runs: `{status, qr,
                expires_at}` (`agents.loginChannel`).
              additionalProperties: true
            error:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - type: 'null'
            started_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            finished_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    # ---------------------------------------------------------------- auth
    Role:
      type: string
      enum: [owner, admin, member]
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      required:
        [
          id,
          username,
          display_name,
          role,
          status,
          locale,
          avatar,
          profiles,
          default_profile,
          last_login_at,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        username:
          type: string
          pattern: '^[a-z0-9._-]{2,40}$'
        display_name:
          type: string
          maxLength: 80
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        locale:
          $ref: '#/components/schemas/Locale'
        avatar:
          $ref: '#/components/schemas/Avatar'
        profiles:
          type: array
          description: |
            Slugs the user may enter. Owners and admins enter every profile, so theirs lists all
            of them. A member's is exactly the list an admin gave them — nothing is added
            implicitly, not by a profile created later — and empty means the member may enter no
            profile at all (they can sign in, and every scoped request answers
            `profile_not_found` with `details.reason = no_profile_granted`). With an empty
            list `default_profile` still reads `default`, which that member cannot enter:
            clients decide from `profiles`.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        default_profile:
          $ref: '#/components/schemas/ProfileSlug'
        last_login_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    SetupState:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: |
            `true` while the hub has no user at all, so a client must run first-run setup
            (`auth.completeSetup`) before anyone can sign in. Nothing else is exposed: the
            setup token and the presence of its file are never part of an answer.
    SetupRequest:
      type: object
      required: [username, password]
      properties:
        token:
          type: string
          format: password
          minLength: 8
          maxLength: 256
          description: |
            The token the hub wrote to `<DATA_DIR>/setup-token.txt` and logged on boot. Required
            only once the open window has ended (`Meta.setup_open` is false); ignored inside it.
        username:
          type: string
          pattern: '^[a-z0-9._-]{2,40}$'
          description: The owner's login name.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
          description: Same policy as every other password in `auth` (8 characters or more).
        display_name:
          type: string
          maxLength: 80
        workspace_name:
          type: string
          maxLength: 80
          description: Name of the `default` workspace created with the owner; defaults to "Default".
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT, 15 minutes.
        refresh_token:
          type: [string, 'null']
          description: Rotating; `null` when an app token was renewed instead.
        expires_in:
          type: integer
          description: Seconds until `access_token` expires.
        user:
          $ref: '#/components/schemas/User'
    UserSelfPatch:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        username:
          type: string
          pattern: '^[a-z0-9._-]{2,40}$'
        current_password:
          type: string
          format: password
          description: Required when `username` changes.
        locale:
          $ref: '#/components/schemas/Locale'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
        default_profile:
          $ref: '#/components/schemas/ProfileSlug'
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    UserCreate:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9._-]{2,40}$'
        password:
          type: string
          format: password
          minLength: 8
        display_name:
          type: string
          maxLength: 80
        role:
          type: string
          enum: [admin, member]
        profiles:
          type: array
          description: |
            The profiles a member may enter — an explicit list, never "all". Required with at
            least one slug when `role` is `member` (the server answers `400 validation_failed`
            with `details.field = profiles` otherwise; the rule depends on `role`, so it is
            stated here rather than as `minItems`). Ignored for an admin, who enters every
            profile.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        default_profile:
          $ref: '#/components/schemas/ProfileSlug'
        locale:
          $ref: '#/components/schemas/Locale'
    UserAdminPatch:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 80
        role:
          type: string
          enum: [admin, member]
        status:
          $ref: '#/components/schemas/UserStatus'
        profiles:
          type: array
          description: |
            Replaces the member's explicit list. An empty list withdraws every profile: the
            member can still sign in and enters nothing. Changing `role` from `admin` to
            `member` must carry at least one slug here in the same request (`400
            validation_failed`, `details.field = profiles`, otherwise), because an admin holds
            no list.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        default_profile:
          $ref: '#/components/schemas/ProfileSlug'
        password:
          type: string
          format: password
          minLength: 8
    Preferences:
      type: object
      description: Human-owned settings, global to the user (not per workspace).
      required:
        [
          theme,
          locale,
          text_scale,
          link_target,
          busy_input_mode,
          streaming,
          compact,
          show_reasoning,
          show_tool_calls,
          show_cost,
          inline_diffs,
          sound_on_complete,
          notify_on_complete,
          notify_on_approval,
          reasoning_effort,
          voice,
        ]
      properties:
        theme:
          type: string
          enum: [system, light, dark]
        locale:
          $ref: '#/components/schemas/Locale'
        text_scale:
          type: number
          minimum: 0.85
          maximum: 1.45
        link_target:
          type: string
          enum: [in_app, browser]
        busy_input_mode:
          type: string
          enum: [queue, next, interrupt]
          description: What "send" does while a run is active (maps to `RunCreate.when`).
        streaming:
          type: boolean
        compact:
          type: boolean
        show_reasoning:
          type: boolean
        show_tool_calls:
          type: boolean
        show_cost:
          type: boolean
        inline_diffs:
          type: boolean
        sound_on_complete:
          type: boolean
        notify_on_complete:
          type: boolean
        notify_on_approval:
          type: boolean
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
          description: Default for new sessions; `null` lets the agent decide.
        voice:
          type: object
          required: [input_mode, dictation_language, output_mode, auto_speak]
          properties:
            input_mode:
              type: string
              enum: [device, server]
            dictation_language:
              type: string
              description: '`auto`, `app` (follow the UI locale) or a BCP-47 tag.'
            output_mode:
              type: string
              enum: [device, server]
            auto_speak:
              type: boolean
    Lockout:
      type: object
      required: [ip, kind, failures, locked_until]
      properties:
        ip:
          type: string
        kind:
          type: string
          enum: [password, token, pairing]
        failures:
          type: integer
        locked_until:
          $ref: '#/components/schemas/Timestamp'
    TokenScope:
      type: string
      enum: [read, write, device, admin]
    AppToken:
      type: object
      required: [id, name, scopes, device_id, last_used_at, expires_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/TokenScope'
        device_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AppTokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TokenScope'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    AppTokenCreated:
      allOf:
        - $ref: '#/components/schemas/AppToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Shown exactly once.
    PairingConnection:
      type: string
      enum: [lan, relay]
      description: '`lan` when the device reaches the hub directly; `relay` when it goes through the message relay.'
    PairingCreate:
      type: object
      properties:
        connection:
          $ref: '#/components/schemas/PairingConnection'
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 900
          default: 300
    Pairing:
      type: object
      required: [id, status, code, connection, qr_payload, expires_at, device_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum: [pending, claimed, expired, cancelled]
        code:
          type: string
          description: Human-typeable one-time code.
        connection:
          $ref: '#/components/schemas/PairingConnection'
        qr_payload:
          type: string
          description: 'JSON to encode in the QR: `{ type: "corehub.pairing", hub_url, pairing_id, code, expires_at }`.'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        device_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    PairingClaim:
      type: object
      required: [code, device]
      properties:
        code:
          type: string
        device:
          $ref: '#/components/schemas/DeviceRegistration'
    PairingResult:
      type: object
      required: [app_token, token_id, expires_at, device, user, server]
      properties:
        app_token:
          type: string
        token_id:
          $ref: '#/components/schemas/Ulid'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        device:
          $ref: '#/components/schemas/Device'
        user:
          $ref: '#/components/schemas/User'
        server:
          $ref: '#/components/schemas/Meta'
    # ---------------------------------------------------------------- profiles
    ModelRef:
      type: object
      required: [provider_id, model]
      properties:
        provider_id:
          $ref: '#/components/schemas/Ulid'
        model:
          type: string
    Profile:
      type: object
      required:
        [
          id,
          slug,
          name,
          avatar,
          default_model,
          agent_count,
          session_count,
          owner_id,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        slug:
          $ref: '#/components/schemas/ProfileSlug'
        name:
          type: string
          maxLength: 80
        avatar:
          $ref: '#/components/schemas/Avatar'
        default_model:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        agent_count:
          type: integer
        session_count:
          type: integer
        owner_id:
          $ref: '#/components/schemas/Ulid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ProfileCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          $ref: '#/components/schemas/ProfileSlug'
        name:
          $ref: '#/components/schemas/ProfileName'
        clone_from:
          oneOf:
            - $ref: '#/components/schemas/ProfileSlug'
            - type: 'null'
          description: Copy agent settings, models and defaults from this profile (not sessions).
    ProfilePatch:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/ProfileSlug'
          description: |
            Refused (`409`) for `default`, and for every profile where the hub mirrors Hermes
            (`details.reason = profile_id_fixed`); see `auth.updateProfile`.
        name:
          $ref: '#/components/schemas/ProfileName'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
        default_model:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
    ProfileName:
      type: string
      description: |
        What people call a profile — any language, shown everywhere the profile is named — and
        Hermes's display name for it (decision §44). Trimmed; at most 64 characters, Hermes's
        own limit for a display name. Never the profile's id: that is `slug`.
      minLength: 1
      maxLength: 64
      examples: ['الرئيسي']
    ProfileSettings:
      type: object
      required: [proxy, compression, privacy, appearance]
      properties:
        proxy:
          type: object
          required: [https_proxy, http_proxy, all_proxy, no_proxy]
          properties:
            https_proxy:
              type: [string, 'null']
            http_proxy:
              type: [string, 'null']
            all_proxy:
              type: [string, 'null']
            no_proxy:
              type: [string, 'null']
        compression:
          type: object
          description: Context compression applied to long sessions.
          required: [enabled, threshold, target_ratio, protect_first, protect_last]
          properties:
            enabled:
              type: boolean
            threshold:
              type: number
              minimum: 0
              maximum: 1
            target_ratio:
              type: number
              minimum: 0
              maximum: 1
            protect_first:
              type: integer
              minimum: 0
            protect_last:
              type: integer
              minimum: 0
        privacy:
          type: object
          required: [redact_pii]
          properties:
            redact_pii:
              type: boolean
        appearance:
          type: object
          description: The server-side theme shown on the `Theme` screen.
          required: [font_size, text_color, accent_color, background_attachment_id]
          properties:
            font_size:
              type: integer
              minimum: 12
              maximum: 20
            text_color:
              type: [string, 'null']
              pattern: '^#[0-9a-fA-F]{6}$'
            accent_color:
              type: [string, 'null']
              pattern: '^#[0-9a-fA-F]{6}$'
            background_attachment_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
              description: 'An attachment uploaded with `purpose: background`.'
    ProfileSettingsPatch:
      type: object
      description: Any subset of the sections; each section is merge-patched.
      properties:
        proxy:
          type: object
          additionalProperties: true
        compression:
          type: object
          additionalProperties: true
        privacy:
          type: object
          additionalProperties: true
        appearance:
          type: object
          additionalProperties: true
    ProfileSettingsResult:
      type: object
      required: [settings, restart_job_id]
      properties:
        settings:
          $ref: '#/components/schemas/ProfileSettings'
        restart_job_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    ProfileExport:
      type: object
      description: What an export carries besides the profile itself (decision §37).
      properties:
        providers:
          type: boolean
          default: false
          description: >-
            Carry the profile's providers with their keys in the clear
            (`corehub-providers.json`). The client warns before it asks for this.
    ProfileImport:
      type: object
      required: [attachment_id, slug]
      properties:
        attachment_id:
          $ref: '#/components/schemas/Ulid'
          description: 'The archive, uploaded with `purpose: import`.'
        slug:
          $ref: '#/components/schemas/ProfileSlug'
          description: The new profile's id in the hub and in Hermes; must not be taken.
        name:
          $ref: '#/components/schemas/ProfileName'
          description: Display name of the new workspace; the slug when absent.
    # ---------------------------------------------------------------- sessions
    SessionSource:
      type: string
      description: Where a session came from. `channel` sessions carry the platform in `channel`.
      enum: [chat, global_agent, room, task, schedule, workflow, channel, cli, api]
    SessionStatus:
      type: string
      enum: [idle, running, waiting]
      description: '`waiting` means a run is blocked on an approval or question.'
    ReasoningEffort:
      type: string
      enum: [none, minimal, low, medium, high, max]
    Usage:
      type: object
      required: [input_tokens, output_tokens, cost]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    ContextUsage:
      type: object
      required: [used_tokens, window_tokens]
      properties:
        used_tokens:
          type: integer
          minimum: 0
        window_tokens:
          type: [integer, 'null']
          minimum: 1
          description: "`null` when the model's window is unknown."
    SessionMatch:
      type: object
      description: Present only on search results.
      required: [message_id, snippet]
      properties:
        message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        snippet:
          type: string
    Session:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              agent_id,
              title,
              source,
              origin,
              channel,
              model,
              provider,
              reasoning_effort,
              working_dir,
              pinned,
              archived,
              category_id,
              preview,
              message_count,
              usage,
              context,
              status,
              active_run_id,
              parent_session_id,
              notify,
              last_message_at,
              match,
            ]
          properties:
            agent_id:
              $ref: '#/components/schemas/Ulid'
            title:
              type: [string, 'null']
              maxLength: 200
              description: '`null` until the user or the server names it; clients show "New chat".'
            source:
              $ref: '#/components/schemas/SessionSource'
            origin:
              oneOf:
                - $ref: '#/components/schemas/ResourceRef'
                - type: 'null'
              description: The room, task, schedule or workflow run this session serves.
            channel:
              type: [string, 'null']
              description: Messaging platform slug when `source = channel` (e.g. `telegram`).
            model:
              type: [string, 'null']
            provider:
              type: [string, 'null']
            reasoning_effort:
              oneOf:
                - $ref: '#/components/schemas/ReasoningEffort'
                - type: 'null'
            working_dir:
              type: [string, 'null']
              description: Absolute path on the hub host the agent works in.
            pinned:
              type: boolean
            archived:
              type: boolean
            category_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            preview:
              type: [string, 'null']
              maxLength: 300
            message_count:
              type: integer
              minimum: 0
            usage:
              oneOf:
                - $ref: '#/components/schemas/Usage'
                - type: 'null'
            context:
              oneOf:
                - $ref: '#/components/schemas/ContextUsage'
                - type: 'null'
            status:
              $ref: '#/components/schemas/SessionStatus'
            active_run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            parent_session_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            notify:
              type: boolean
              description: Push a notice to the user's devices when a run in this session finishes.
            last_message_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            match:
              oneOf:
                - $ref: '#/components/schemas/SessionMatch'
                - type: 'null'
    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [runs, pending_approvals]
          properties:
            runs:
              type: array
              description: Active and queued runs, in execution order.
              items:
                $ref: '#/components/schemas/Run'
            pending_approvals:
              type: array
              items:
                $ref: '#/components/schemas/Approval'
    WorkingDir:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          description: The folder's own name, relative to `root`.
        path:
          type: string
          description: Absolute path on the hub; what `SessionCreate.working_dir` carries.
    WorkingDirs:
      type: object
      required: [root, items]
      properties:
        root:
          type: string
          description: |
            The only directory a session may work in, or under. The hub creates it on demand.
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkingDir'
      example:
        root: /var/lib/corehub/workspaces/work
        items:
          - name: corehub
            path: /var/lib/corehub/workspaces/work/corehub
          - name: 01J8QK3ZR2W7M5N4P6T8V9X0YA
            path: /var/lib/corehub/workspaces/work/01J8QK3ZR2W7M5N4P6T8V9X0YA
    SessionCreate:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        title:
          type: [string, 'null']
          maxLength: 200
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        working_dir:
          type: [string, 'null']
        category_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    GlobalAgentOpen:
      type: object
      required: [agent_id]
      description: The agent a first open makes the global agent's conversation with.
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
    SessionPatch:
      type: object
      description: JSON merge-patch; every field optional, `null` clears.
      properties:
        title:
          type: [string, 'null']
          maxLength: 200
          description: |
            A non-empty title is the person's own and the hub never replaces it.
            `null` gives the naming back to the hub: the session is renamed from its
            own first turn, and the new title arrives as `session.updated`
            (contract decision §26).
        pinned:
          type: boolean
        archived:
          type: boolean
        category_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        working_dir:
          type: [string, 'null']
        notify:
          type: boolean
    SessionBulkUpdate:
      type: object
      required: [session_ids, patch]
      properties:
        session_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Ulid'
        patch:
          type: object
          properties:
            pinned:
              type: boolean
            archived:
              type: boolean
            category_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
    SessionForkRequest:
      type: object
      description: |
        Every field is optional and every one of them defaults to the source session's own
        value, so an empty body still means "the same conversation, twice".

        `agent_id` is how a person continues a conversation with a different agent
        (contract decision §26): the transcript is copied, the fork runs on the named agent,
        no run is started, and the original is untouched. Changing only the **model** is not
        a fork — that is `sessions.update`.
      properties:
        at_message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: Copy history up to and including this message; default the whole session.
        title:
          type: [string, 'null']
        agent_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: |
            Run the fork on this agent instead of the source session's. Unknown id -> `404`;
            an agent this hub has not installed -> `422 agent_unavailable`.
        model:
          type: [string, 'null']
          description: Model for the fork; omit to inherit the source session's.
        provider:
          type: [string, 'null']
          description: Provider for the fork; omit to inherit the source session's.
    BulkResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, ok, error]
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              ok:
                type: boolean
              error:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: 'null'
    SessionCategory:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [name, color, position, session_count]
          properties:
            name:
              type: string
              maxLength: 60
            color:
              type: [string, 'null']
              pattern: '^#[0-9a-fA-F]{6}$'
            position:
              type: integer
              minimum: 0
            session_count:
              type: integer
              minimum: 0
    SessionCategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
        position:
          type: integer
          minimum: 0
    # ---------------------------------------------------------------- messages
    Author:
      type: object
      description: Who wrote a message. Agents in rooms are identified by their seat, see `Message.seat_id`.
      required: [kind, id, name, avatar]
      properties:
        kind:
          type: string
          enum: [user, agent, system]
        id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        name:
          type: string
        avatar:
          oneOf:
            - $ref: '#/components/schemas/Avatar'
            - type: 'null'
    ContentBlock:
      description: One block of message content. Attachments are referenced by id; bytes come from `url`.
      oneOf:
        - $ref: '#/components/schemas/TextBlock'
        - $ref: '#/components/schemas/ImageBlock'
        - $ref: '#/components/schemas/FileBlock'
        - $ref: '#/components/schemas/AudioBlock'
        - $ref: '#/components/schemas/LocationBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextBlock'
          image: '#/components/schemas/ImageBlock'
          file: '#/components/schemas/FileBlock'
          audio: '#/components/schemas/AudioBlock'
          location: '#/components/schemas/LocationBlock'
    TextBlock:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
    AttachmentBlockFields:
      type: object
      required: [attachment_id]
      properties:
        attachment_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        mime:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        url:
          type: string
          description: Filled by the server on read; ignored on write.
    ImageBlock:
      allOf:
        - $ref: '#/components/schemas/AttachmentBlockFields'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [image]
    FileBlock:
      allOf:
        - $ref: '#/components/schemas/AttachmentBlockFields'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [file]
    AudioBlock:
      allOf:
        - $ref: '#/components/schemas/AttachmentBlockFields'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [audio]
            duration_ms:
              type: [integer, 'null']
            transcript:
              type: [string, 'null']
              description: Filled when the hub transcribed the note before sending it to the agent.
    LocationBlock:
      type: object
      required: [type, latitude, longitude]
      properties:
        type:
          type: string
          enum: [location]
        latitude:
          type: number
        longitude:
          type: number
        accuracy_m:
          type: [number, 'null']
        captured_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Reasoning:
      type: object
      required: [text, duration_ms]
      properties:
        text:
          type: string
        duration_ms:
          type: [integer, 'null']
    ToolCallStatus:
      type: string
      enum: [running, succeeded, failed, interrupted, awaiting_approval]
    ToolCall:
      type: object
      description: One tool invocation inside an assistant message. Tool output lives here, not in a separate message.
      required:
        [
          id,
          name,
          status,
          preview,
          arguments,
          output,
          output_truncated,
          duration_ms,
          subagent_id,
          started_at,
          finished_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        status:
          $ref: '#/components/schemas/ToolCallStatus'
        preview:
          type: [string, 'null']
          description: One-line summary for the tool card (a command, a path).
        arguments:
          type: [object, 'null']
          additionalProperties: true
        output:
          type: [string, 'null']
          description: Truncated to 16 KB; `output_truncated` says so.
        output_truncated:
          type: boolean
        duration_ms:
          type: [integer, 'null']
        subagent_id:
          type: [string, 'null']
          description: Set when the call was made by a delegated subagent.
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MessageRole:
      type: string
      enum: [user, assistant, system, command]
      description: '`command` is a user message that starts with `/`; there is no `tool` role — tool output lives in `tool_calls`.'
    MessageStatus:
      type: string
      enum: [complete, streaming, failed, interrupted]
    Mention:
      type: object
      required: [kind, seat_id]
      properties:
        kind:
          type: string
          enum: [seat, all]
        seat_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    Handoff:
      type: object
      description: Set on a room message that hands the turn to another seat.
      required: [to_seat_id, chain_id, depth]
      properties:
        to_seat_id:
          $ref: '#/components/schemas/Ulid'
        chain_id:
          $ref: '#/components/schemas/Ulid'
        depth:
          type: integer
          minimum: 1
    Message:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          description: The one message shape for sessions and rooms (see DECISIONS.md).
          required:
            [
              session_id,
              room_id,
              seq,
              role,
              author,
              content,
              reasoning,
              tool_calls,
              run_id,
              status,
              mentions,
              handoff,
              usage,
              reply_to_message_id,
            ]
          properties:
            session_id:
              $ref: '#/components/schemas/Ulid'
            room_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            seat_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
              description: The room seat that wrote an agent message.
            seq:
              type: integer
              minimum: 1
              description: Position in the session; gaps mean deleted messages.
            role:
              $ref: '#/components/schemas/MessageRole'
            author:
              $ref: '#/components/schemas/Author'
            content:
              type: array
              items:
                $ref: '#/components/schemas/ContentBlock'
            reasoning:
              oneOf:
                - $ref: '#/components/schemas/Reasoning'
                - type: 'null'
            tool_calls:
              type: array
              items:
                $ref: '#/components/schemas/ToolCall'
            run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
              description: Stable across the user message, the assistant reply and its tool calls, so clients fold them into one run card.
            status:
              $ref: '#/components/schemas/MessageStatus'
            mentions:
              type: array
              items:
                $ref: '#/components/schemas/Mention'
            handoff:
              oneOf:
                - $ref: '#/components/schemas/Handoff'
                - type: 'null'
            usage:
              oneOf:
                - $ref: '#/components/schemas/Usage'
                - type: 'null'
            reply_to_message_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
    MessagePage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean
          description: Whether messages older than `items[0]` exist.
    # ---------------------------------------------------------------- trajectory
    TrajectoryStepKind:
      type: string
      enum: [input, turn, reasoning, tool]
      description: |
        `input` is something the person sent; `turn` is the model speaking once (before, between
        or after tool calls); `reasoning` is what the model showed of its thinking in that turn;
        `tool` is one tool call.
    TrajectoryLane:
      type: string
      enum: [input, model, tools]
      description: The row of the timeline a step is drawn in. `turn` and `reasoning` share `model`.
    TrajectoryStepStatus:
      type: string
      enum: [running, succeeded, failed, cancelled]
    TrajectoryTiming:
      type: string
      enum: [full, partial, none]
      description: |
        `full` — every turn and tool call carries its times; `partial` — some runs are from before
        the hub recorded model turns, and their turns have no times; `none` — no step can be placed
        on a time axis (an older conversation, or nothing has run yet).
    TrajectoryStep:
      type: object
      required:
        [
          id,
          kind,
          lane,
          exchange,
          run_id,
          message_id,
          status,
          started_at,
          ended_at,
          duration_ms,
          text,
          tool_call_only,
          first_token_ms,
          tool_call,
        ]
      properties:
        id:
          type: string
          description: Stable across reads of the same conversation.
        kind:
          $ref: '#/components/schemas/TrajectoryStepKind'
        lane:
          $ref: '#/components/schemas/TrajectoryLane'
        exchange:
          type: integer
          minimum: 1
          description: 1-based count of the person's inputs up to and including this step's.
        run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        status:
          $ref: '#/components/schemas/TrajectoryStepStatus'
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: '`null` when the hub did not record it (see `Trajectory.timing`).'
        ended_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: '`null` while the step is still running, or when it was not recorded.'
        duration_ms:
          type: [integer, 'null']
          minimum: 0
        text:
          type: [string, 'null']
          description: What the person sent, what the model said in the turn, or its reasoning.
        tool_call_only:
          type: boolean
          description: A turn in which the model said nothing and only called tools.
        first_token_ms:
          type: [integer, 'null']
          minimum: 0
          description: For a turn, how long the model took to send its first word or thought.
        tool_call:
          oneOf:
            - $ref: '#/components/schemas/ToolCall'
            - type: 'null'
          description: The whole call — arguments and result — for a `tool` step.
    TrajectoryMetrics:
      type: object
      description: |
        Only what the hub recorded. A metric it has no data for is `null` and a client does not
        show it: `cache_hit_pct` needs a provider that reports cache reads, the token counts need
        a provider that reports usage, and the times need runs recorded with their turns.
      required:
        [
          exchanges,
          turns,
          steps,
          tool_calls,
          failed_tool_calls,
          model_ms,
          tool_ms,
          avg_first_token_ms,
          output_tokens_per_second,
          cache_hit_pct,
          input_tokens,
          output_tokens,
        ]
      properties:
        exchanges:
          type: integer
          minimum: 0
        turns:
          type: integer
          minimum: 0
          description: Model turns.
        steps:
          type: integer
          minimum: 0
        tool_calls:
          type: integer
          minimum: 0
        failed_tool_calls:
          type: integer
          minimum: 0
        model_ms:
          type: [integer, 'null']
          minimum: 0
          description: Time the model spent in its timed turns.
        tool_ms:
          type: [integer, 'null']
          minimum: 0
          description: Wall-clock time at least one tool was running (parallel calls count once).
        avg_first_token_ms:
          type: [integer, 'null']
          minimum: 0
          description: Mean time from the start of a turn to the model's first word or thought.
        output_tokens_per_second:
          type: [number, 'null']
          minimum: 0
          description: Output tokens over the model time of the runs that report both.
        cache_hit_pct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Prompt tokens read from the provider's cache, of all prompt tokens.
        input_tokens:
          type: [integer, 'null']
          minimum: 0
        output_tokens:
          type: [integer, 'null']
          minimum: 0
    Trajectory:
      type: object
      required: [session_id, generated_at, live, timing, started_at, ended_at, steps, metrics]
      properties:
        session_id:
          $ref: '#/components/schemas/Ulid'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        live:
          type: boolean
          description: A run of the conversation is still going; its last steps may grow.
        timing:
          $ref: '#/components/schemas/TrajectoryTiming'
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: The earliest time of any timed step; the start of the time axis.
        ended_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: The latest end of any timed step; `null` while a step is still running.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TrajectoryStep'
        metrics:
          $ref: '#/components/schemas/TrajectoryMetrics'
    # ---------------------------------------------------------------- runs
    RunStatus:
      type: string
      enum: [queued, running, waiting, succeeded, failed, cancelled]
    RunTrigger:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [user, room, task, schedule, workflow, handoff, api]
        id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The user, seat, task, schedule, workflow run or chain that caused the run.
    Run:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          description: One turn of an agent, executed as a job. Every run belongs to a session.
          required:
            [
              session_id,
              room_id,
              seat_id,
              job_id,
              status,
              queue_position,
              trigger,
              input_message_id,
              output_message_id,
              model,
              provider,
              reasoning_effort,
              interrupted,
              error,
              usage,
              started_at,
              finished_at,
            ]
          properties:
            session_id:
              $ref: '#/components/schemas/Ulid'
            room_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            seat_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            job_id:
              $ref: '#/components/schemas/Ulid'
            status:
              $ref: '#/components/schemas/RunStatus'
            queue_position:
              type: [integer, 'null']
              minimum: 1
              description: 1-based position while `queued`.
            trigger:
              $ref: '#/components/schemas/RunTrigger'
            input_message_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            output_message_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            model:
              type: [string, 'null']
            provider:
              type: [string, 'null']
            reasoning_effort:
              oneOf:
                - $ref: '#/components/schemas/ReasoningEffort'
                - type: 'null'
            interrupted:
              type: boolean
            error:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - type: 'null'
            usage:
              oneOf:
                - $ref: '#/components/schemas/Usage'
                - type: 'null'
            started_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            finished_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    RunCreate:
      type: object
      required: [content]
      properties:
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContentBlock'
        model:
          type: [string, 'null']
          description: One-off override; the session's model is unchanged.
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        when:
          type: string
          enum: [queue, next, interrupt]
          default: queue
          description: What to do if a run is active — append to the queue, jump the queue, or interrupt the active run with this message.
        reply_to_message_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    RunAccepted:
      allOf:
        - $ref: '#/components/schemas/JobAccepted'
        - type: object
          required: [run_id, message_id, queue_position]
          properties:
            run_id:
              $ref: '#/components/schemas/Ulid'
            message_id:
              $ref: '#/components/schemas/Ulid'
              description: The stored user message.
            queue_position:
              type: [integer, 'null']
    # ---------------------------------------------------------------- approvals
    ApprovalKind:
      type: string
      enum: [tool_call, memory_write, skill_write, question, plan, workflow_step]
    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, answered, expired, cancelled]
    ApprovalDecision:
      type: string
      enum: [approve_once, approve_session, approve_always, deny]
    Choice:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
    AgentRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
    Approval:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          description: A decision the agent is waiting for — a tool approval, a write approval, a question, a plan, or a workflow step gate.
          required:
            [
              kind,
              status,
              session_id,
              run_id,
              message_id,
              room_id,
              workflow_run_id,
              node_id,
              agent,
              title,
              description,
              command,
              choices,
              allow_always,
              answer_mode,
              response,
              expires_at,
            ]
          properties:
            kind:
              $ref: '#/components/schemas/ApprovalKind'
            status:
              $ref: '#/components/schemas/ApprovalStatus'
            session_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            message_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            room_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            workflow_run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            node_id:
              type: [string, 'null']
            agent:
              $ref: '#/components/schemas/AgentRef'
            title:
              type: string
            description:
              type: [string, 'null']
            command:
              type: [string, 'null']
              description: The exact command or write the agent wants to perform.
            choices:
              type: array
              items:
                $ref: '#/components/schemas/Choice'
            allow_always:
              type: boolean
            answer_mode:
              type: string
              enum: [choice, text, both]
            response:
              oneOf:
                - $ref: '#/components/schemas/ApprovalResponseRecord'
                - type: 'null'
            expires_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    ApprovalResponse:
      type: object
      description: '`decision` for approvals; `answer` (free text or a choice value) for questions; both allowed.'
      properties:
        decision:
          oneOf:
            - $ref: '#/components/schemas/ApprovalDecision'
            - type: 'null'
        answer:
          type: [string, 'null']
          maxLength: 4000
    ApprovalResponseRecord:
      allOf:
        - $ref: '#/components/schemas/ApprovalResponse'
        - type: object
          required: [responded_by, responded_at]
          properties:
            responded_by:
              $ref: '#/components/schemas/Ulid'
            responded_at:
              $ref: '#/components/schemas/Timestamp'
    # ---------------------------------------------------------------- attachments
    AttachmentPurpose:
      type: string
      enum: [message, avatar, task, import, background, skill, release]
      default: message
    Attachment:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [name, mime, size_bytes, kind, url, purpose, width, height, duration_ms, sha256]
          properties:
            name:
              type: string
            mime:
              type: string
            size_bytes:
              type: integer
              minimum: 0
            kind:
              type: string
              enum: [image, audio, video, file]
            url:
              type: string
              description: Path of the bytes; fetch with the bearer header.
            purpose:
              $ref: '#/components/schemas/AttachmentPurpose'
            width:
              type: [integer, 'null']
            height:
              type: [integer, 'null']
            duration_ms:
              type: [integer, 'null']
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
    UploadStart:
      type: object
      required: [name, mime, size_bytes]
      properties:
        name:
          type: string
          maxLength: 255
        mime:
          type: string
        size_bytes:
          type: integer
          minimum: 1
          maximum: 52428800
        purpose:
          $ref: '#/components/schemas/AttachmentPurpose'
    Upload:
      type: object
      required: [id, name, mime, size_bytes, chunk_bytes, next_offset, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        mime:
          type: string
        size_bytes:
          type: integer
        chunk_bytes:
          type: integer
          description: Maximum bytes per `PUT`.
        next_offset:
          type: integer
          minimum: 0
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    # ---------------------------------------------------------------- agents
    AgentKind:
      type: string
      enum: [hermes, acp, harness, builtin]
      description: Which adapter drives the agent (ADR 0002). `builtin` is the hub's own lightweight agent.
    AgentStatus:
      type: string
      enum: [available, not_installed, installing, updating, error, limited, disabled]
    AgentCapability:
      type: string
      enum:
        [
          streaming,
          tools,
          approvals,
          mcp,
          skills,
          memory,
          channels,
          worktrees,
          resume,
          vision,
          audio,
          plugins,
          presets,
          journey,
          jobs,
          tasks,
        ]
    AgentSection:
      type: string
      description: The rows shown under the agent's card, in order (NAVIGATION §4).
      enum: [jobs, tasks, channels, skills, plugins, presets, mcp, memory, journey, settings]
    AgentInstall:
      type: object
      required:
        [
          source,
          path,
          package,
          command,
          version,
          latest_version,
          update_available,
          auto_update,
          auto_update_supported,
          checked_at,
          error,
        ]
      properties:
        source:
          type: string
          enum: [managed, user_cli, builtin, none]
        path:
          type: [string, 'null']
        package:
          type: [string, 'null']
          description: npm/pip package the hub installs.
        command:
          type: [string, 'null']
        version:
          type: [string, 'null']
        latest_version:
          type: [string, 'null']
        update_available:
          type: boolean
        auto_update:
          type: boolean
        auto_update_supported:
          type: boolean
        checked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        error:
          type: [string, 'null']
    AgentRuntime:
      type: object
      required: [state, url, error]
      properties:
        state:
          type: string
          enum: [running, stopped, starting, error, not_applicable]
        url:
          type: [string, 'null']
        error:
          type: [string, 'null']
        gateways:
          description: >-
            Hermes only, where the hub runs it: every messaging gateway — the default profile's
            and one per named profile with a channel switched on and linked or an active
            scheduled job. `agents.restart` restarts all of them.
          type: array
          items:
            $ref: '#/components/schemas/MessagingGateway'
    Agent:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              slug,
              name,
              vendor,
              kind,
              avatar,
              status,
              enabled,
              install,
              runtime,
              capabilities,
              sections,
              default_model,
              limited,
            ]
          properties:
            slug:
              type: string
              pattern: '^[a-z0-9-]{2,40}$'
            name:
              type: string
            vendor:
              type: [string, 'null']
            kind:
              $ref: '#/components/schemas/AgentKind'
            avatar:
              $ref: '#/components/schemas/Avatar'
            status:
              $ref: '#/components/schemas/AgentStatus'
            enabled:
              type: boolean
            install:
              $ref: '#/components/schemas/AgentInstall'
            runtime:
              $ref: '#/components/schemas/AgentRuntime'
            capabilities:
              type: array
              items:
                $ref: '#/components/schemas/AgentCapability'
            sections:
              type: array
              items:
                $ref: '#/components/schemas/AgentSection'
            default_model:
              oneOf:
                - $ref: '#/components/schemas/ModelRef'
                - type: 'null'
            limited:
              type: boolean
              description: True for the process harness — the UI marks the agent "limited".
    AgentPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
        enabled:
          type: boolean
        auto_update:
          type: boolean
        default_model:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
    SettingsField:
      type: object
      required: [key, label, kind, value, options, min, max, hint]
      properties:
        key:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedText'
        kind:
          type: string
          enum: [text, secret, integer, number, toggle, choice, list, json]
        value: {}
        options:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
        min:
          type: [number, 'null']
        max:
          type: [number, 'null']
        hint:
          type: [string, 'null']
    SettingsSection:
      type: object
      required: [key, title, restart_required, fields]
      properties:
        key:
          type: string
        title:
          $ref: '#/components/schemas/LocalizedText'
        restart_required:
          type: boolean
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SettingsField'
    AgentSettings:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SettingsSection'
    AgentSettingsPatch:
      type: object
      required: [section, values]
      properties:
        section:
          type: string
        values:
          type: object
          additionalProperties: true
    AgentSettingsResult:
      type: object
      required: [section, restart_job_id]
      properties:
        section:
          $ref: '#/components/schemas/SettingsSection'
        restart_job_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    ConfigFile:
      type: object
      required: [key, label, path, language, exists, size_bytes, revision, updated_at, content]
      properties:
        key:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedText'
        path:
          type: string
          description: Display path (may start with `~`); never a hub-internal absolute path.
        language:
          type: string
          enum: [markdown, json, yaml, toml, text]
        exists:
          type: boolean
        size_bytes:
          type: integer
        revision:
          type: [string, 'null']
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        content:
          type: [string, 'null']
    ConfigFileWrite:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 1048576
        revision:
          type: [string, 'null']
    SkillSource:
      type: string
      description: >-
        `builtin`: seeded by the agent from its own bundle (Hermes's `skills/.bundled_manifest`)
        and read-only through the hub; `external`: installed from a pack that names itself;
        `user`: written by a person.
      enum: [builtin, user, external]
    Skill:
      type: object
      required: [key, name, description, enabled, pinned, source, use_count, updated_at, content]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        enabled:
          type: boolean
        pinned:
          type: boolean
        source:
          $ref: '#/components/schemas/SkillSource'
        use_count:
          type: integer
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        content:
          type: [string, 'null']
    SkillCategory:
      type: object
      required: [key, name, description, skills]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
    SkillWrite:
      type: object
      required: [content]
      properties:
        category:
          type: string
        content:
          type: string
          maxLength: 262144
    SkillPatch:
      type: object
      properties:
        enabled:
          type: boolean
        pinned:
          type: boolean
    SkillImport:
      type: object
      required: [attachment_ids]
      properties:
        category:
          type: string
          description: >-
            Not used for placement: an imported skill is installed beside the others, and the
            category it lists under is read from the skill itself (the pack it names), as for
            every other skill. Kept optional so an older client's request is still valid.
        attachment_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Ulid'
    McpTool:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
    McpServer:
      type: object
      required: [name, transport, enabled, connected, tools, error, config, updated_at]
      properties:
        name:
          type: string
        transport:
          type: string
          enum: [stdio, http, sse]
        enabled:
          type: boolean
        connected:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpTool'
        error:
          type: [string, 'null']
        config:
          type: object
          description: Stored verbatim; secret-looking values read as `[stored]`.
          additionalProperties: true
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    McpServerWrite:
      type: object
      required: [name, transport, config]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,60}$'
        transport:
          type: string
          enum: [stdio, http, sse]
        enabled:
          type: boolean
          default: true
        config:
          type: object
          additionalProperties: true
    McpServerPatch:
      type: object
      properties:
        transport:
          type: string
          enum: [stdio, http, sse]
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
    McpTestResult:
      type: object
      required: [ok, tools, error, duration_ms]
      properties:
        ok:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpTool'
        error:
          type: [string, 'null']
        duration_ms:
          type: integer
    MemoryItem:
      type: object
      required: [id, kind, title, content, tags, revision, updated_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [document, entry]
        title:
          type: string
        content:
          type: [string, 'null']
        tags:
          type: array
          items:
            type: string
        revision:
          type: integer
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MemoryItemWrite:
      type: object
      required: [content]
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
          maxLength: 262144
        tags:
          type: array
          items:
            type: string
        revision:
          type: [integer, 'null']
    Journey:
      type: object
      required: [nodes, edges, clusters]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, label, kind, category, use_count, pinned]
            properties:
              id:
                type: string
              label:
                type: string
              kind:
                type: string
                enum: [skill, tool, plugin]
              category:
                type: [string, 'null']
              use_count:
                type: integer
              pinned:
                type: boolean
        edges:
          type: array
          items:
            type: object
            required: [source, target]
            properties:
              source:
                type: string
              target:
                type: string
        clusters:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer
    AgentPlugin:
      type: object
      description: >-
        One plugin as the agent's runtime lists it. For Hermes, `name`, `version`,
        `description` and `status` are Hermes's own; `provides_tools`, `provides_hooks`,
        `requires_env` and `entries` are empty because Hermes's list does not report them, and
        `configured` is always true for the same reason.
      required:
        [
          key,
          name,
          kind,
          source,
          status,
          version,
          description,
          author,
          configured,
          enabled,
          manageable,
          removable,
          provides_tools,
          provides_hooks,
          requires_env,
          entries,
        ]
      properties:
        key:
          type: string
          description: What the plugin is addressed by (Hermes's plugin name).
        name:
          type: string
        kind:
          type: string
          enum: [standalone, bundled, preset]
        source:
          type: string
          description: >-
            `bundled`: ships with the runtime; `user`: installed into this profile (from the
            catalog, Git, or by hand); `external`: registered by an installed Python package.
          enum: [bundled, user, external]
        status:
          type: string
          description: >-
            Hermes's word for it: `enabled` (on its allow list), `disabled` (on its deny list,
            which wins), `not_enabled` (on neither — Hermes plugins are opt-in, so it does
            not load).
          enum: [enabled, disabled, not_enabled]
        version:
          type: [string, 'null']
        description:
          type: [string, 'null']
        author:
          type: [string, 'null']
        configured:
          type: boolean
        enabled:
          type: boolean
          description: '`status == enabled`.'
        manageable:
          type: boolean
          description: Whether `PATCH` may switch it on or off.
        removable:
          type: boolean
          description: Whether `DELETE` may remove it (installed into the profile, not shipped).
        provides_tools:
          type: array
          items:
            type: string
        provides_hooks:
          type: array
          items:
            type: string
        requires_env:
          type: array
          items:
            type: string
        entries:
          type: array
          description: Sub-entries of preset-style plugins; `enabled` may be `conditional`.
          items:
            type: object
            required: [id, title, enabled]
            properties:
              id:
                type: string
              title:
                type: string
              description:
                type: [string, 'null']
              enabled:
                type: string
                enum: ['true', 'false', conditional]
    AgentPreset:
      type: object
      required: [id, name, description, trust, is_default, broken, content]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        trust:
          type: string
          enum: [system, user]
        is_default:
          type: boolean
        broken:
          type: boolean
        content:
          type: [string, 'null']
    ChannelField:
      type: object
      required: [key, label, kind, target, value, hint]
      properties:
        key:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedText'
        kind:
          type: string
          enum: [text, secret, toggle, list]
        target:
          type: string
          enum: [credentials, configuration]
        value: {}
        hint:
          type: [string, 'null']
    Channel:
      type: object
      required:
        [platform, label, enabled, configured, exclusive, status, error, login, link, fields]
      properties:
        platform:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        configured:
          type: boolean
        exclusive:
          type: boolean
          description: One identity may belong to a single workspace.
        status:
          type: string
          enum: [online, offline, error, unknown]
        error:
          type: [string, 'null']
        login:
          type: [string, 'null']
          enum: [qr, token, null]
          description: >-
            How the platform is linked instead of by fields: `qr` pairs interactively via
            `/login` (WhatsApp), `token` takes a bot token via `/link` (Telegram).
        link:
          description: >-
            For a platform that is linked rather than filled in: WhatsApp (whether this profile
            holds a session and whose, read from the profile's session folder) and Telegram
            (whether the profile has a bot token, and which bot). Null for every other platform.
            For both `configured` is `link.linked`.
          oneOf:
            - $ref: '#/components/schemas/ChannelLink'
            - type: 'null'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ChannelField'
    ChannelLink:
      type: object
      required: [linked, account_id, account_name, account_phone, account_username]
      properties:
        linked:
          type: boolean
        account_id:
          type: [string, 'null']
        account_name:
          type: [string, 'null']
        account_phone:
          type: [string, 'null']
          description: Digits only, as WhatsApp names the account. Null for Telegram.
        account_username:
          type: [string, 'null']
          description: >-
            The bot's @username without the @ (Telegram), as Telegram answered when it was
            linked; people open it at `https://t.me/<account_username>`. Null for WhatsApp.
    ChannelGateway:
      type: object
      required: [profile, state, applies, error]
      properties:
        profile:
          type: string
          description: Hermes's profile name (`default` for the default profile).
        state:
          type: string
          enum: [running, starting, stopped, error]
          description: >-
            `stopped` in a named profile means no channel there is switched on and linked, so no
            gateway runs for it.
        applies:
          type: string
          enum: [now, on_restart]
        error:
          type: [string, 'null']
    MessagingGateway:
      type: object
      description: >-
        A named profile has one while it has a channel switched on and linked, or an active
        scheduled job of Hermes's own: Hermes fires a profile's jobs only in a gateway scoped
        to that profile.
      required: [profile, state, pid, restarts, started_at, error, channels, scheduled_jobs]
      properties:
        profile:
          type: string
        state:
          type: string
          enum: [running, starting, stopped, error]
        pid:
          type: [integer, 'null']
        restarts:
          type: integer
          minimum: 0
        started_at:
          type: [string, 'null']
          format: date-time
        error:
          type: [string, 'null']
        channels:
          type: array
          items:
            type: string
        scheduled_jobs:
          type: integer
          minimum: 0
          description: Hermes's scheduled jobs in the profile that are neither paused nor finished.
    PairingRequest:
      type: object
      required: [platform, request_id, user_id, user_name, requested_at]
      properties:
        platform:
          type: string
        request_id:
          type: string
        user_id:
          type: string
        user_name:
          type: [string, 'null']
        requested_at:
          type: string
          format: date-time
    PairedSender:
      type: object
      required: [platform, user_id, user_name, approved_at]
      properties:
        platform:
          type: string
        user_id:
          type: string
        user_name:
          type: [string, 'null']
        approved_at:
          type: [string, 'null']
          format: date-time
    PairingList:
      type: object
      required: [pending, approved]
      properties:
        pending:
          type: array
          items:
            $ref: '#/components/schemas/PairingRequest'
        approved:
          type: array
          items:
            $ref: '#/components/schemas/PairedSender'
    ChannelSettings:
      type: object
      required: [platform, options]
      properties:
        platform:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/ChannelSetting'
    ChannelSetting:
      type: object
      required: [key, section, kind, value, default, choices, min, max, shared, source]
      properties:
        key:
          type: string
          description: Stable name of the option; clients key their label and help text on it.
        section:
          type: string
          enum: [access, replies, groups, media, advanced]
        kind:
          type: string
          enum: [toggle, select, number, text, list]
          description: >-
            `toggle` a boolean, `select` one of `choices`, `number` an integer between `min`
            and `max`, `text` a string, `list` an array of strings.
        value:
          description: What the profile sets; null while unset.
        default:
          description: What applies while `value` is null; null when nothing does.
        choices:
          type: [array, 'null']
          items:
            type: string
        min:
          type: [integer, 'null']
        max:
          type: [integer, 'null']
        shared:
          type: boolean
          description: >-
            Kept once for the profile rather than for this channel: changing it changes
            WhatsApp and every other channel of the profile too.
        source:
          type: [string, 'null']
          enum: [config, env, null]
    ChannelSettingsWrite:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          minProperties: 1
          maxProperties: 50
          description: Option key → new value; null removes it so the default applies.
          additionalProperties: {}
    ChannelTokenLink:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
          writeOnly: true
          description: The bot token @BotFather gave. Stored, never returned.
        allowed_users:
          type: array
          maxItems: 100
          description: >-
            Telegram user ids (digits) who may message the bot without pairing
            (`TELEGRAM_ALLOWED_USERS`). Absent leaves what is set; empty clears it.
          items:
            type: string
            pattern: '^[0-9]{1,20}$'
    ChannelWrite:
      type: object
      properties:
        enabled:
          type: boolean
        credentials:
          type: object
          additionalProperties:
            type: string
        configuration:
          type: object
          additionalProperties: true
    # ---------------------------------------------------------------- rooms
    SummaryPolicy:
      type: object
      required: [every_turns, model, provider]
      properties:
        every_turns:
          type: integer
          minimum: 0
          description: Re-summarize the room every N turns; 0 disables.
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
    HandoffPolicy:
      type: object
      required: [enabled, max_depth]
      properties:
        enabled:
          type: boolean
        max_depth:
          type: [integer, 'null']
          minimum: 1
          description: '`null` = unlimited.'
    SeatStatus:
      type: string
      enum: [idle, queued, thinking, running, waiting_approval, offline]
    SeatExecutor:
      type: object
      description: Where the seat's agent runs — on the hub or on a linked device (Phase 3).
      required: [kind, device_id]
      properties:
        kind:
          type: string
          enum: [server, device]
        device_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    SeatConfig:
      type: object
      description: The editable part of a seat; also the body of a seat preset.
      required: [agent_id, name]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique per room; `all` is reserved.
        description:
          type: [string, 'null']
          maxLength: 300
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        instructions:
          type: [string, 'null']
          maxLength: 8000
          description: Seat-specific system instructions.
        preset_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
    Seat:
      type: object
      required:
        [
          id,
          room_id,
          agent_id,
          name,
          description,
          avatar,
          model,
          provider,
          reasoning_effort,
          instructions,
          preset_id,
          status,
          executor,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        room_id:
          $ref: '#/components/schemas/Ulid'
        agent_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        description:
          type: [string, 'null']
        avatar:
          $ref: '#/components/schemas/Avatar'
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        instructions:
          type: [string, 'null']
        preset_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        status:
          $ref: '#/components/schemas/SeatStatus'
        executor:
          $ref: '#/components/schemas/SeatExecutor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    SeatWrite:
      $ref: '#/components/schemas/SeatConfig'
    SeatPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: [string, 'null']
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        instructions:
          type: [string, 'null']
        preset_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        avatar:
          oneOf:
            - $ref: '#/components/schemas/AvatarInput'
            - type: 'null'
    Member:
      type: object
      required: [id, room_id, user_id, name, avatar, role, online, joined_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        room_id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        avatar:
          $ref: '#/components/schemas/Avatar'
        role:
          type: string
          enum: [owner, manager, member]
        online:
          type: boolean
        joined_at:
          $ref: '#/components/schemas/Timestamp'
    Room:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              name,
              working_dir,
              invite_code,
              can_manage,
              can_mention_all,
              member_count,
              total_tokens,
              summary_policy,
              handoff,
              seats,
              last_active_at,
            ]
          properties:
            name:
              type: string
              maxLength: 120
            working_dir:
              type: [string, 'null']
            invite_code:
              type: [string, 'null']
              description: Only managers see it; others get `null`.
            can_manage:
              type: boolean
              description: Whether the caller may edit the room.
            can_mention_all:
              type: boolean
            member_count:
              type: integer
            total_tokens:
              type: integer
            summary_policy:
              $ref: '#/components/schemas/SummaryPolicy'
            handoff:
              $ref: '#/components/schemas/HandoffPolicy'
            seats:
              type: array
              items:
                $ref: '#/components/schemas/Seat'
            last_active_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    RoomMemory:
      type: object
      required: [summary, status, summarized_turn_count, error, updated_at]
      properties:
        summary:
          type: [string, 'null']
        status:
          type: string
          enum: [idle, summarizing, error]
        summarized_turn_count:
          type: integer
        error:
          type: [string, 'null']
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    HandoffChain:
      type: object
      required:
        [
          id,
          room_id,
          from_seat_id,
          to_seat_id,
          status,
          stop_reason,
          depth,
          max_depth,
          continue_used,
          error,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        room_id:
          $ref: '#/components/schemas/Ulid'
        from_seat_id:
          $ref: '#/components/schemas/Ulid'
        to_seat_id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum: [active, stopped, completed, failed]
        stop_reason:
          type: [string, 'null']
          enum: [max_depth, loop_detected, interrupted, error, null]
        depth:
          type: integer
        max_depth:
          type: [integer, 'null']
        continue_used:
          type: boolean
        error:
          type: [string, 'null']
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TypingIndicator:
      type: object
      required: [member_id, name]
      properties:
        member_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
    RoomDetail:
      allOf:
        - $ref: '#/components/schemas/Room'
        - type: object
          required: [members, runs, pending_approvals, handoff_chains, memory, typing]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/Member'
            runs:
              type: array
              description: Active and queued runs across seats.
              items:
                $ref: '#/components/schemas/Run'
            pending_approvals:
              type: array
              items:
                $ref: '#/components/schemas/Approval'
            handoff_chains:
              type: array
              items:
                $ref: '#/components/schemas/HandoffChain'
            memory:
              $ref: '#/components/schemas/RoomMemory'
            typing:
              type: array
              items:
                $ref: '#/components/schemas/TypingIndicator'
    RoomCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        working_dir:
          type: [string, 'null']
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatConfig'
        summary_policy:
          $ref: '#/components/schemas/SummaryPolicy'
        handoff:
          $ref: '#/components/schemas/HandoffPolicy'
    RoomCreated:
      type: object
      required: [room, seat_results]
      properties:
        room:
          $ref: '#/components/schemas/Room'
        seat_results:
          type: array
          items:
            type: object
            required: [id, ok, error]
            properties:
              id:
                oneOf:
                  - $ref: '#/components/schemas/Ulid'
                  - type: 'null'
              ok:
                type: boolean
              error:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: 'null'
    RoomPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        working_dir:
          type: [string, 'null']
        summary_policy:
          $ref: '#/components/schemas/SummaryPolicy'
        handoff:
          $ref: '#/components/schemas/HandoffPolicy'
    RoomInvite:
      type: object
      required: [invite_code, join_url]
      properties:
