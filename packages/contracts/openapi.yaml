    post:
      operationId: tasks.assignTask
      tags: [tasks]
      summary: Assign the task to an agent and (optionally) start it in its own worktree
      description: |
        With `start: true` the task moves to `running`, a worktree is created if the project has a
        repository, a task session is opened and a run is queued whose progress the assignee reports
        into the project's `report_room_id` when set. Reassigning a running task interrupts the run.
        The session works in the task's worktree. When git refuses to make it the task does not
        start and nothing about it changes: `409 conflict` with `details.reason: worktree_failed`
        and git's own words in `details.message` (also kept on the worktree, `status: error`).
        Without `start`, a task with `auto_start` starts on its own (see `Task.auto_start`).
