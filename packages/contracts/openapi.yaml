      description: >-
        Writes each value where Hermes reads it — the profile's `config.yaml` (edited in place,
        comments kept) or its `.env` when the option is kept there — and answers the options as
        they now read. `null` removes the value, so Hermes's default applies again. An unknown
        key, or a value of the wrong kind, answers `400 validation_failed` with `details.field =
        values.<key>` and nothing is written. The gateway serving the profile follows as
        `agents.listChannels` says in `gateway.applies`: a named profile's restarts now, the
        default profile's at Hermes's Restart.
      x-roles: [owner, admin]
      x-rt-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelSettingsWrite'
            example:
              values:
                show_reasoning: true
                require_mention: true
                allowed_chats: ['-1001234567890']
      responses:
        '200':
          description: Saved; the options as they now read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSettings'
              example:
                platform: telegram
                options:
                  - key: show_reasoning
                    section: replies
                    kind: toggle
                    value: true
                    default: false
                    choices: null
                    min: null
                    max: null
                    shared: false
                    source: config
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
