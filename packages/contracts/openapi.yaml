    put:
      operationId: devices.setPushSender
      tags: [devices]
      summary: Store a sender's credentials or switch it on or off (admin)
      description: |
        FCM takes the Firebase service-account JSON; APNs takes the key id, team id, app bundle id,
        environment and the `.p8` key. Web Push takes only `subject` (the contact a push service
        may use) and `enabled` — its keys are the hub's own. Secrets are stored encrypted and read
        back as `[stored]`; sending `[stored]` keeps the stored value. A sender configured by the
        environment answers `409 conflict`: the environment wins.
      x-scope: global
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSenderUpdate'
            example:
              enabled: true
              key_id: ABC123DEFG
              team_id: DEF123GHIJ
              bundle_id: com.twuijri.corehub
              environment: production
              private_key: "-----BEGIN PRIVATE KEY-----\n…\n-----END PRIVATE KEY-----"
      x-rt-events: []
      responses:
        '200':
          description: The sender.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSender'
              example:
                provider: apns
                state: ready
                source: settings
                missing: []
                details:
                  key_id: ABC123DEFG
                  team_id: DEF123GHIJ
                  bundle_id: com.twuijri.corehub
                  environment: production
                  private_key: '[stored]'
                devices: 0
                last_error: null
                last_sent_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
