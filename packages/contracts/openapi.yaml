      tags: [audit]
      summary: The Skills usage screen — which skills the agents loaded, how often, and which never
      description: |
        One use is a skill an agent loaded in a run: Hermes's `skill_view` tool opening the
        skill itself (a linked file of an already-loaded skill is the same use), counted once
        per run and skill (contract decision §50). Recording started with this version and
        cannot be rebuilt for the past: `counting_since` says from when. Coding agents over ACP
        do not say which skill a tool call loaded, so they are not counted.

        `by_day` has one entry per calendar day of the period with the uses of the six most
        used skills of the period (`top_series`) and the rest as `other`. `never_used` lists
        the enabled skills of the hub's Hermes in the covered profiles that no run loaded in
        the period; `null` when the hub cannot see those skills (an external Hermes).
