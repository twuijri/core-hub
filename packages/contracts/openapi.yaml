    post:
      operationId: schedules.previewTrigger
      tags: [schedules]
      summary: The next times a trigger would fire, without saving anything
      description: >-
        The hub's own calculation — the one that sets `Schedule.next_run_at` — applied to a
        trigger that is not saved, so a form can show "next: …" while a person types
        (DECISIONS §53). `next_runs` are the next `count` times from now (3 when not given,
        at most 10), in UTC; a client shows them in `trigger.timezone`. Fewer come back when
        there are fewer (a `once` has one, a past `once` or an impossible cron none). A trigger
        saving would refuse is refused the same way: `409` with `details.reason`
        (`cron_required`, `cron_invalid` with `details.message`, `timezone_unknown`,
        `interval_required`, `run_at_required`) and `details.field`. A schedule in Hermes's
        scheduler is timed by Hermes, which reads a five-field cron the same way. Nothing is
        written.
