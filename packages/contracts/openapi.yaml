      responses:
        '202':
          description: Removal started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_id: 01J8QK3ZR2W7M5N4P6T8V9X0JW
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ================================================================== schedules
  /schedules:
    get:
      operationId: schedules.list
      tags: [schedules]
      summary: List schedules (an agent's Jobs screen, a workflow's Schedules tab)
      description: >-
        Global, like the Tasks board: one Schedules page shows every workspace a person may
        enter, each schedule carrying its own `profile` (owner decision, 2026-09-23 — a
        workspace for design, another for content). Narrow it with `profile`, `agent_id`,
        `workflow_id` or `enabled`. Every other schedule operation is scoped to the
        schedule's own workspace, so a client acts on a schedule with that schedule's
        `profile` in `X-Hub-Profile`. Which profiles "every" covers is the server's rule
        (owners and admins every profile, a member the ones they are enrolled in), never a
        list the client sends. Newest first (`id desc`); the cursor is one order over every
        profile, so pages neither repeat nor skip. `profiles=all` says "every profile"
        explicitly, in the words every list across profiles uses (DECISIONS §32); it cannot
        be combined with `profile`. The Schedules page of the clients (ADR 0016) always
        shows every profile and offers no profile filter; `profile` stays for other callers.
      x-scope: global
      parameters:
        - name: profiles
          in: query
          description: >-
            `all`: every profile the caller may enter — what the list is anyway, said
            explicitly. `400 validation_failed` together with `profile`.
          schema:
            type: string
            enum: [all]
        - name: profile
          in: query
          description: One workspace instead of every workspace the caller may enter.
          schema:
            $ref: '#/components/schemas/ProfileSlug'
        - name: agent_id
          in: query
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: workflow_id
          in: query
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: enabled
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      x-rt-events: []
      responses:
