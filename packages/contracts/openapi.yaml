    post:
      operationId: devices.createRequest
      tags: [devices]
      summary: Ask a device for a capability (used by adapters, integrations with the `device` scope, and the hub's `devices` tools)
      description: >-
        A job (`device_request`) that ends when the device answers: `succeeded` when it fulfils,
        `failed` when it declines, fails or lets `timeout_ms` pass (the request is then `expired`
        with `timeout`), `cancelled` when the job is cancelled (so is the request). The job
        carries only `{request_id, status}`: what the device sends stays in the request, which
        only its person and the device read. Only the device's own person may ask it — their web
        session, a token of theirs with the `device` scope, or the run token of one of their
        agent runs for `files` and `apps` only (DECISIONS §87; the request then carries the
        run's id) — else `403`; anyone else's device, an admin's included, is `404`. A device
        whose `profiles` leave out the profile asked in is `403` with `details.reason =
        device_not_in_profile`. A device that lacks the capability, or switched it off, is
        answered `denied` with `unavailable` by the hub at once, without being asked; a `files`,
        `apps` or `screen` request to a device with no live `/rt/devices` socket is `failed` with
        `unavailable` ("the device is offline") at once, since nothing would answer it.
      parameters:
        - $ref: '#/components/parameters/Profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequestCreate'
            example:
              device_id: 01J8QK3ZR2W7M5N4P6T8V9X0DV
              capability: location
              purpose: 'لاقتراح المطاعم القريبة'
              params:
                accuracy: coarse
              session_id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
              timeout_ms: 30000
      x-rt-events: [request.created, job.queued]
      responses:
        '202':
          description: The request was sent to the device.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JobAccepted'
                  - type: object
                    required: [request_id]
                    properties:
                      request_id:
                        $ref: '#/components/schemas/Ulid'
              example:
                job_id: 01J8QK3ZR2W7M5N4P6T8V9X0K3
                request_id: 01J8QK3ZR2W7M5N4P6T8V9X0DR
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
