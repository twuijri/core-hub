      description: >-
        Core Hub serves itself to its agents as an MCP server (`agents.hubMcp`), in groups
        (tasks, schedules, conversations, notifications, workflows, files). This is whether
        the profile in `X-Hub-Profile` offers them, which groups are on, whether each group
        may write, and the last calls made. Only for Hermes: another agent answers
        `409 state_invalid` with `details.reason = skills_are_hermes_only`. `available` is
        false (with `unavailable_reason`) where the hub has no Hermes home to write the
