        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /push/relay:
    put:
      operationId: devices.setPushRelay
      tags: [devices]
      summary: Switch the Core Hub push relay on or off, and choose private push (admin)
      description: |
        The relay delivers to the official iOS and Android apps for a hub that has no APNs or FCM
        credentials of its own (DECISIONS §82, ADR 0024). A sender with local credentials always
        uses them. `enabled: false` stops every use of the relay; `COREHUB_PUSH_RELAY=off` in the
        environment does too and wins (`forced_off`). `private_push: true` sends only a generic
        "New notice" and the notice id through the relay; the app reads the rest from the hub.
        The same status is on every `fcm` and `apns` row of `devices.listPushSenders` (`relay`).
