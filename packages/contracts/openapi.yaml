  /agents/{agent_id}/channels/{platform}:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/Platform'
    put:
      operationId: agents.updateChannel
      tags: [agents]
      summary: Enable/disable a channel and write its credentials or configuration (admin)
      description: An empty string clears one value without touching the rest. Writing restarts the agent's runtime — the response is a job.
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelWrite'
            example:
              enabled: true
              credentials:
                token: '123456:ABC-DEF'
              configuration:
                require_mention: false
      x-rt-events: [job.queued, job.completed, job.failed, agent.updated]
      responses:
        '202':
          description: Saved; the restart job follows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_id: 01J8QK3ZR2W7M5N4P6T8V9X0JK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: agents.clearChannel
      tags: [agents]
      summary: Remove a channel's credentials and disable it (admin)
      x-roles: [owner, admin]
      x-rt-events: [job.queued, job.completed, job.failed, agent.updated]
      responses:
        '202':
          description: Cleared; the restart job follows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_id: 01J8QK3ZR2W7M5N4P6T8V9X0JM
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /agents/{agent_id}/channels/{platform}/login:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/Platform'
    post:
      operationId: agents.loginChannel
      tags: [agents]
      summary: Start an interactive login for platforms that pair by QR (admin)
      description: >-
        A `channel_login` job. Today one platform pairs by QR: `whatsapp` (Hermes's own
        onboarding, ADR 0015); any other answers `409 state_invalid` with `details.reason =
        login_not_supported`, and a hub that does not supervise Hermes answers `409` with
        `details.reason = hermes_not_supervised`. While the job runs, every change is a
        `job.progress` whose `progress.message` is a line for the person and whose `result` is
        `{status, qr, expires_at}` — `status` is `installing`, `starting` or `waiting`, `qr` the
        text to draw as a QR code (null until there is one), `expires_at` when Hermes gives the
        code up (ten minutes). The body's `mode` says how the number will be used (see
        `ChannelLoginRequest`); without it the number is linked as `bot`, the mode every link had
        before the choice existed. Paired, the hub enables the channel in the profile's Hermes
        home with that mode (`WHATSAPP_MODE`; for `self-chat` the account's own number is added to
        `WHATSAPP_ALLOWED_USERS`, as Hermes's own onboarding does), then starts or restarts the
        messaging gateway that serves the profile — the default profile's included — so the agent
        answers without a manual Restart; the job succeeds with `{status: connected,
        account_name, account_phone, mode, applies: now}`. An expired code fails the job with
        `state_invalid`, a pairing Hermes reports as failed with `agent_error` — both in
        Hermes's words. `jobs.cancel` stops the pairing in Hermes too.
      x-roles: [owner, admin]
      x-rt-events: [job.queued, job.progress, job.completed, job.failed, agent.updated]
      requestBody:
        required: false
        content:
          application/json:
            schema:
