  /agents/{agent_id}/channels/{platform}/unlink:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/Platform'
    post:
      operationId: agents.unlinkChannel
      tags: [agents]
      summary: Unlink a linked channel (WhatsApp, Telegram, or a platform linked by credentials) from the selected profile (admin)
      description: >-
        Stops the messaging gateway that serves the profile, stops a bridge it left behind,
        deletes the profile's WhatsApp session folder and switches the channel off
        (`platforms.whatsapp.enabled: false`, `WHATSAPP_ENABLED` removed from `.env`); the
        gateway starts again when another channel still needs it. Hermes and its bridge have no
        logout, so the phone keeps listing the device under WhatsApp → Linked devices until it is
        removed there. The bridge port and the approved senders stay. For `telegram` the bot
        token is removed from the profile's `.env` (and from `platforms.telegram.token` if it was
        written there by hand), the hub's note of the bot is deleted and the channel is switched
        off (`platforms.telegram.enabled: false`); the allowed users and the settings stay, and
        the bot itself keeps existing in Telegram (@BotFather deletes it). A platform linked by
        credentials (`Channel.login = credentials`, see `agents.listChannelPlatforms`) loses the
        credential variables it declares from the profile's `.env`, the hub's note of the account,
        and is switched off; its allowed users and settings stay. A platform the hub does not know
        answers `409 state_invalid` with `details.reason = unlink_not_supported`; a profile with
        nothing linked answers `409` with `details.reason = not_linked`.
      x-roles: [owner, admin]
      x-rt-events: []
      responses:
        '200':
          description: Unlinked; the channel as it now reads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
              example:
                platform: whatsapp
                label: whatsapp
                enabled: false
                configured: false
                exclusive: true
                status: offline
                error: null
                restart_needed: false
                login: qr
                link:
                  linked: false
                  account_id: null
                  account_name: null
                  account_phone: null
                  account_username: null
                  mode: null
                fields: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /agents/{agent_id}/channels/{platform}/mode:
