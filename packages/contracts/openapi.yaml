      - $ref: '#/components/parameters/ScheduleId'
    post:
      operationId: schedules.runNow
      tags: [schedules]
      summary: Fire the schedule now (does not change the next scheduled time)
      description: >-
        Starts the same run the schedule's own time would. A schedule the hub fires itself (any
        agent but Hermes, or a workflow) answers with the real ids at once: an `agent_prompt`
        target opens a session of source `schedule` and queues its run (`session_id`, `run_id`;
        `job_id` is that run's job), a `workflow` target starts a workflow run
        (`workflow_run_id`, which is also the `job_id`). A schedule that lives in Hermes's own
        scheduler is asked of Hermes, which runs it on its next tick: those ids are `null` and
        the history entry stays `queued` until Hermes reports. A target that cannot start (an
        agent that is not installed or cannot run, a workflow that is gone or empty) is recorded
        in the history as a failed run and answered `409` with `details.reason =
        target_unavailable`, `details.message` and `details.schedule_run_id`.
      x-rt-events:
        [
          schedule.fired,
          schedule_run.started,
          schedule_run.completed,
          schedule_run.failed,
          job.queued,
          run.queued,
          workflow_run.started,
        ]
      responses:
        '202':
          description: The run is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleRunAccepted'
              example:
                job_id: 01J8QK3ZR2W7M5N4P6T8V9X0JX
                schedule_run_id: 01J8QK3ZR2W7M5N4P6T8V9X0SR
                session_id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
                run_id: 01J8QK3ZR2W7M5N4P6T8V9X0RN
                workflow_run_id: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
