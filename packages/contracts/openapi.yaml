      operationId: auth.getPairing
      tags: [auth]
      summary: Poll a pairing (the web also receives `pairing.claimed` on `/rt/devices`)
      x-scope: global
      x-rt-events: []
      responses:
        '200':
          description: The pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
              example:
                id: 01J8QK3ZR2W7M5N4P6T8V9X0PR
                status: claimed
                code: 7KQ2-M9XW
                connection: lan
                qr_payload: '{"type":"corehub.pairing","hub_url":"https://hub.example","pairing_id":"01J8QK3ZR2W7M5N4P6T8V9X0PR","code":"7KQ2-M9XW","expires_at":"2026-09-21T11:20:00Z"}'
                expires_at: '2026-09-21T11:20:00Z'
                device_id: 01J8QK3ZR2W7M5N4P6T8V9X0DV
                created_at: '2026-09-21T11:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: auth.cancelPairing
      tags: [auth]
      summary: Cancel a pending pairing
      x-scope: global
      x-rt-events: []
      responses:
        '204':
          description: Cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/pairings/{pairing_id}/claim:
    parameters:
      - name: pairing_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
    post:
      operationId: auth.claimPairing
      tags: [auth]
      summary: Claim a pairing from the device (unauthenticated)
      description: |
        The device presents the code plus a description of itself, including a stable `device_key`
        so re-pairing updates the same device row, and the capabilities it can serve. Errors:
        `401 unauthorized` (wrong code), `409 conflict` (already claimed), `404 not_found` (expired
        or unknown), `403 forbidden` (the authorizing user is disabled).
      security: []
      x-scope: global
      x-rt-events: [pairing.claimed, device.linked]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingClaim'
            example:
              code: 7KQ2-M9XW
              device:
                device_key: 3d5b0f2e-9c1a-4e7b-8f6d-2a1b3c4d5e6f
                name: 'هاتف طارق'
                platform: android
                kind: phone
                brand: Google
                model: Pixel 9
                os_version: '15'
                app_version: 1.0.2-test.22
                capabilities: [location, camera, microphone, notifications, clipboard]
      responses:
        '201':
          description: Paired. The device stores `app_token` and the server descriptor.
          content:
            application/json:
              schema:
