                  app_version: 1.0.2-test.22
                  connection: lan
                  online: true
                  last_seen_at: '2026-09-21T11:16:00Z'
                  app_token_id: 01J8QK3ZR2W7M5N4P6T8V9X0AK
                  capabilities:
                    - kind: location
                      enabled: true
                      consent_at: null
                    - kind: camera
