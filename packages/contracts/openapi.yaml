      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/Platform'
    post:
      operationId: agents.linkChannel
      tags: [agents]
      summary: Link a channel that signs in with a bot token (Telegram) in the selected profile (admin)
      description: >-
        Today one platform links by token: `telegram` (a bot the person made with @BotFather;
        the hub never uses Hermes's outside bot-creation service). The hub checks the token's
        shape (`<digits>:<30+ letters, digits, _ or ->`, `400 validation_failed`, `details.reason
        = token_invalid`), then asks Telegram who the bot is (`getMe`): a token Telegram refuses
        is `400 validation_failed` with `details.reason = token_rejected` and Telegram's own
        words in `details.message`; Telegram not answering is `503 service_unavailable`,
        `details.reason = telegram_unreachable`. A bot already linked in another profile is
        `409 conflict`, `details.reason = token_in_use`, `details.profile` — Telegram lets one
        process poll a bot. Accepted, the token is written to the profile's own Hermes `.env`
        (`TELEGRAM_BOT_TOKEN`, mode 0600, never returned — `[stored]`), `allowed_users` (when
        sent) to `TELEGRAM_ALLOWED_USERS`, and the channel is switched on with pairing for
        unknown senders (`platforms.telegram.enabled: true`, `unauthorized_dm_behavior: pair`),
        so a stranger who messages the bot gets a pairing code to approve in
        `agents.listPairing`. The gateway serving the profile follows as `gateway.applies` says:
        a named profile's starts or restarts now, the default profile's at Hermes's Restart.
        Linking again replaces the token. Only `telegram`: any other platform answers `409
        state_invalid`, `details.reason = link_not_supported`; a hub that does not supervise
        Hermes answers `409` with `details.reason = hermes_not_supervised`.
