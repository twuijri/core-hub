  # ------------------------------------------------------- channel conversations
  /channel-conversations:
    get:
      operationId: sessions.listChannelConversations
      tags: [sessions]
      summary: List conversations held on messaging channels (Telegram, WhatsApp…)
      description: |
        Conversations people have with the agent on a messaging channel live in Hermes's own
        session store, not in the hub's: the gateway receives them and Hermes keeps them. This
        reads them, **read-only**, through Hermes's internal server (ADR 0015), in the Hermes
        profile each hub profile is (ADR 0014). A reply is made on the channel itself.

        Up to the 100 most recent live conversations per profile, most recent first; Hermes's
        archived ones are left out. With `profiles=all` every profile the caller may enter is
        read (ADR 0016), each item naming its `profile`, and the whole list is ordered by
        `last_message_at`. The hub keeps what it read for a short while and asks Hermes again
        only when Hermes's store has been written since (contract decision §61); clients poll
        this every 30–60 s while the list is on screen, since Hermes announces nothing.

        Where the hub cannot read them — it does not supervise Hermes, a profile has no Hermes
        profile, or Hermes did not answer — the answer is still `200`: `items` holds what could
        be read and `unavailable` says, per profile, why the rest is missing.
      parameters:
        - $ref: '#/components/parameters/Profile'
        - name: profiles
          in: query
          description: >-
            `all` reads every profile the caller may enter instead of the one in the header.
          schema:
            type: string
            enum: [all]
        - name: channel
          in: query
          description: Only this platform's conversations (`telegram`, `whatsapp`…).
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,31}$'
      x-rt-events: []
      responses:
        '200':
          description: The conversations that could be read, and why any profile could not be.
          content:
            application/json:
              schema:
                type: object
                required: [items, unavailable]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelConversation'
                  unavailable:
                    type: array
                    description: Empty when every profile asked for was read.
                    items:
                      $ref: '#/components/schemas/ChannelConversationsUnavailable'
              example:
                items:
                  - id: 20260925_091500_3f9a1c2b
                    profile: default
                    channel: telegram
                    title: 'موعد التسليم'
                    peer_name: 'أحمد'
                    peer_id: '123456789'
                    chat_type: dm
                    last_message:
                      role: assistant
                      text: 'تم، أرسلت لك الملف.'
                    preview: 'متى موعد التسليم؟'
                    message_count: 6
                    started_at: '2026-09-25T09:15:00Z'
                    last_message_at: '2026-09-25T09:20:41Z'
                unavailable: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /channel-conversations/{conversation_id}/messages:
    get:
      operationId: sessions.listChannelMessages
      tags: [sessions]
      summary: Read one channel conversation (read-only)
      description: |
        The conversation, as Hermes keeps it, in the profile named by `X-Hub-Profile`: what the
        person on the channel wrote and what the agent answered, oldest first — the latest 500
        messages at most. Tool calls, tool results and system text are left out. Only a
        conversation that came from a messaging channel is found here; any other id is
        `404` (`resource: channel_conversation`). `503 service_unavailable` when Hermes cannot
        be asked (`details.reason: hermes_api_unavailable`, or `hermes_not_managed` where the
        hub does not supervise Hermes).
      parameters:
        - $ref: '#/components/parameters/Profile'
        - name: conversation_id
          in: path
          required: true
          description: Hermes's own session id.
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'
      x-rt-events: []
      responses:
        '200':
          description: The conversation and its messages.
          content:
            application/json:
              schema:
                type: object
                required: [conversation, items, has_more]
                properties:
                  conversation:
                    $ref: '#/components/schemas/ChannelConversation'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelMessage'
                  has_more:
                    type: boolean
                    description: Older messages exist that this answer does not carry.
              example:
                conversation:
                  id: 20260925_091500_3f9a1c2b
                  profile: default
                  channel: telegram
                  title: 'موعد التسليم'
                  peer_name: 'أحمد'
                  peer_id: '123456789'
                  chat_type: dm
                  last_message:
