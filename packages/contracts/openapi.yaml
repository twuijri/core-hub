  /profiles/{profile_id}/export:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      operationId: auth.exportProfile
      tags: [auth]
      summary: Export a workspace as an archive (admin)
      description: |
        A job (`kind: export`, `resource: {kind: profile}`) that asks Hermes for its own profile
        archive (`hermes profile export`, a `.tar.gz` with one top-level folder named after the
        profile — ADR 0014 stage 2), then checks it before anyone can download it: every
        `.env` and `auth.json` is left out, and every provider key the hub stores (ADR 0010)
        is overwritten wherever its bytes appear. Hermes itself already leaves the credential
        files out and blanks secret-shaped text.

        The job is recorded in the caller's current profile (`X-Hub-Profile`, `default`
        when absent), so it arrives on that profile's `/rt/jobs` room and `jobs.get` finds it
        there. Its `result` is `{attachment_id, profile, name, size_bytes, expires_at,
        removed, masked}`: `attachment_id` points at the archive (`name` is
        `<profile name>-<YYYYMMDD-HHMMSS>.tar.gz`: the profile's name without what a file name
        cannot carry — path separators, `:*?"<>|`, control and direction marks — or its slug
        when nothing is left; decision §44), downloaded through `/attachments/{id}/content`
        with the bearer header (never a token in a URL) and the same `X-Hub-Profile`; only
        the person who exported it can read that attachment, and it is deleted after
        `expires_at` (24 hours). `removed` lists the paths inside the archive the hub left
        out, `masked` the paths where a stored key was overwritten.

        **With providers** (`providers: true`, decision §37): the archive also carries
        `<profile>/corehub-providers.json` — the profile's own providers and the shared ones it
        uses, each with its models and its key **in the clear**, written as providers of that
        profile alone. Every other file is still checked and masked as above. `result.providers`
        is how many it carries (0 without). Without (the default), the archive holds no key.

        Only where the hub supervises Hermes: anywhere else the answer is `409 state_invalid`
        with `details.reason = hermes_not_supervised`, and no job is created.
      x-scope: global
      x-roles: [owner, admin]
      x-rt-events: [job.queued, job.progress, job.completed, job.failed]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileExport'
            example:
              providers: false
      responses:
        '202':
          description: Export started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_id: 01J8QK3ZR2W7M5N4P6T8V9X0JC
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /profile-imports:
    post:
      operationId: auth.importProfile
      tags: [auth]
      summary: Import a workspace archive (admin)
      description: |
        A job (`kind: import`, `resource: {kind: attachment}`) that hands a Hermes profile
        archive to Hermes (`hermes profile import --name <slug>`) and, when Hermes made the
        profile, adds the workspace `slug` (named `name`, else the slug). The archive is an
        attachment uploaded with `purpose: import` in the caller's current profile
        (`X-Hub-Profile`), where the job is recorded too; it is deleted once the job ends.

        Refused before a job exists: a slug any workspace already uses (`409 conflict`,
        `auth.slug_taken` — pick another), an attachment the caller cannot see (`404`), and
        a hub that does not supervise Hermes (`409 state_invalid`, `details.reason =
        hermes_not_supervised`). The job fails, with Hermes's own sentence where Hermes said no,
        when the file is not a profile archive (one top-level folder of folders and regular
        files, gzip-compressed tar) or Hermes refuses it. The job's `result` is
        `{profile_id, slug, name, providers}`.

        An archive exported **with providers** (decision §37) carries
        `<profile>/corehub-providers.json`: the hub reads it before Hermes sees the archive,
        never hands it to Hermes, and adds every provider in it to the new profile as that
        profile's own (`scope: profile`), with its models and its key. `providers` is how many
        it added.
      x-scope: global
      x-roles: [owner, admin]
      x-rt-events: [job.queued, job.progress, job.completed, job.failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileImport'
            example:
              attachment_id: 01J8QK3ZR2W7M5N4P6T8V9X0AW
              slug: imported
              name: 'المستورد'
      responses:
        '202':
          description: Import started; the job's `result.profile_id` is the new workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_id: 01J8QK3ZR2W7M5N4P6T8V9X0JD
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ================================================================== sessions
  /sessions:
    get:
      operationId: sessions.list
      tags: [sessions]
      summary: List sessions (the chat sidebar, the history page and the search sheet)
      description: |
        Sorted by `last_message_at desc`. Without `archived` only live sessions are returned.
        With `q`, titles and message text are searched and each item carries `match`.

        With `profiles=all` the page holds every profile the caller may enter, not only the
        one in `X-Hub-Profile` (ADR 0016: lists gather every profile, each item says which
        with `profile`). The server decides which profiles those are — owners and admins
        every profile, a member the ones they are enrolled in — and the header must still
        name one of them. The cursor keeps its meaning across profiles: one order
        (`last_message_at desc`, then `id`) over all of them, so pages neither repeat nor
        skip. Opening an item is then an ordinary scoped call with that item's `profile` in
        `X-Hub-Profile`.
