  # ---------------------------------------------------------------- channels (messaging surfaces)
  /agents/{agent_id}/channel-platforms:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: agents.listChannelPlatforms
      tags: [agents]
      summary: The messaging platforms the hub can link for this agent, and what each one takes
      description: >-
        Every platform of the agent's Hermes the hub knows how to link, observed in Hermes's own
        adapters (MIT, the pinned release) and described in the hub's words: how it links
        (`login`), the variables it takes (`credentials`, keyed by the name Hermes reads; the
        labels and setup steps are the client's, keyed by platform and key), whether the hub asks
        the platform before storing them (`validates`), whether a stranger who messages the agent
        gets a pairing code to approve (`pairs`) or is ignored unless listed (`allowlist`),
        whether the channel has its own settings (`settings`), whether Hermes's library for it is
        in the image or downloaded the first time it runs (`packages`), and whether it needs an
        address reachable from the internet (`inbound`) or a program the image does not carry
        (`program`). `support: full` platforms have all of
        it; `generic` ones are stored as given, unchecked, with no settings panel. Hermes
        platforms that are not listed are still read from the profile's `config.yaml` by
        `agents.listChannels`.
      x-rt-events: []
      responses:
        '200':
          description: The platforms, `full` first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPlatformList'
              example:
                items:
                  - platform: discord
                    label: Discord
                    support: full
                    login: credentials
                    credentials:
                      - key: DISCORD_BOT_TOKEN
                        kind: secret
                        required: true
                    allowed_users_key: DISCORD_ALLOWED_USERS
                    validates: true
                    pairs: false
                    allowlist: true
                    settings: true
                    exclusive: true
                    packages: image
                    inbound: false
                    docs_url: 'https://discord.com/developers/applications'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{agent_id}/channels:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: agents.listChannels
      tags: [agents]
      summary: List the messaging channels an agent can answer on, with their fields
      description: The field list per platform is served, not hard-coded. Secrets read as `[stored]`.
      x-rt-events: []
      responses:
        '200':
          description: Channels.
          content:
            application/json:
              schema:
                type: object
                required: [items, gateway]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
                  gateway:
                    description: >-
                      The messaging gateway that serves this profile's channels, when the hub runs
                      Hermes; null otherwise. `applies` says when a channel change takes effect:
                      `now` — the hub starts, restarts or stops the gateway serving the profile
                      itself after every channel change, the default profile's too (held down a
                      moment; it also carries the API server), once a burst of changes has
                      settled (decision §85). `on_restart` is what a hub before 1.1.1 said for
                      the default profile. A channel whose running gateway does not serve it yet
                      says so in `Channel.restart_needed`.
                    oneOf:
                      - $ref: '#/components/schemas/ChannelGateway'
                      - type: 'null'
              example:
                gateway:
                  profile: default
                  state: running
                  applies: now
                  error: null
                items:
                  - platform: telegram
                    label: Telegram
                    enabled: true
                    configured: true
                    exclusive: true
                    status: online
                    error: null
                    restart_needed: false
                    login: null
                    link: null
                    fields:
                      - key: token
                        label:
                          ar: 'رمز البوت'
                          en: Bot token
                        kind: secret
                        target: credentials
                        value: '[stored]'
                        hint: 'من @BotFather'
                      - key: require_mention
                        label:
                          ar: 'يتطلب الإشارة'
                          en: Require mention
                        kind: toggle
                        target: configuration
                        value: true
                        hint: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
