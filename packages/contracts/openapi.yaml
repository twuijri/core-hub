      x-scope: global
      x-rt-events: [pairing.claimed, device.linked]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingClaim'
            example:
              code: 7KQ2-M9XW
              device:
                device_key: 3d5b0f2e-9c1a-4e7b-8f6d-2a1b3c4d5e6f
                name: 'هاتف طارق'
                platform: android
