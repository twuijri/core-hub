  # ---------------------------------------------------------------- skills
  /agents/{agent_id}/skills:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: agents.listSkills
      tags: [agents]
      summary: List an agent's skills by category
      description: >-
        The skills in the Hermes home of the profile in `X-Hub-Profile`, read the way Hermes
        reads them: a folder with a `SKILL.md` directly under `skills/` is a skill of its own
        (grouped by the pack its front matter names, or with the person's own skills), and a
        folder without one is a **category** — every skill below it
        (`skills/<category>/<name>/SKILL.md`, where Hermes keeps its built-in skills) lists
        under that category, whose `description` is the category's `DESCRIPTION.md`. A skill
        Hermes seeded from its own bundle (named in `skills/.bundled_manifest`) is `source:
        builtin` and read-only here: it can be read and pinned, not written, switched or
        deleted (`409 conflict`, `details.reason = skill_bundled`). A skill's `key` is its
        folder's name wherever the folder is.
      x-rt-events: []
      responses:
        '200':
          description: Categories with their skills (content omitted).
          content:
            application/json:
              schema:
                type: object
                required: [categories, home]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillCategory'
                  home:
                    type: [string, 'null']
                    description: >-
                      The folder these skills were read from. Shown by clients so a
                      runtime started with a different home reads as the wrong directory
                      rather than as an agent with no skills. `null` when the hub cannot
                      name one.
              example:
                home: /data/hermes/skills
                categories:
                  - key: research
                    name: 'بحث'
                    description: null
                    skills:
                      - key: web-research
                        name: 'بحث على الويب'
                        description: 'يبحث ويلخّص المصادر'
                        enabled: true
                        pinned: false
                        source: user
                        use_count: 12
                        updated_at: '2026-09-18T00:00:00Z'
                        content: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: agents.importSkills
      tags: [agents]
      summary: Import a skill pack into the profile's skills (admin)
      description: >-
        Installs uploaded skill packs (`sessions.uploadAttachment` with `purpose: skill`) into
        the Hermes home of the profile in `X-Hub-Profile`, as `skills/<name>/`. A pack is one
        `SKILL.md`, or a zip (`.zip`, `.skill`) holding one skill or several: every folder with
        a `SKILL.md` is a skill, and the files beside it (`references/`, `scripts/` …) are
        installed with it. Every file is written byte for byte — the front matter is never
        rewritten. A `SKILL.md` must open with a closed YAML front matter carrying `name` and
        `description`, have a body, and stay under 100,000 characters; the skill's name
        (front matter `name`, else its folder) must match `^[a-z0-9][a-z0-9._-]{0,63}$`.
        All or nothing: a pack with one bad skill, or a skill that already exists, installs
        nothing — `400 bad_request` or `409 conflict` with `details.reason`, `details.skill`,
        `details.file` and `details.message` saying which and why.
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillImport'
            example:
              category: research
              attachment_ids: [01J8QK3ZR2W7M5N4P6T8V9X0AX]
      x-rt-events: [agent.updated]
      responses:
        '201':
          description: The imported skills.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
              example:
                items:
                  - key: summarize-pdf
                    name: 'تلخيص PDF'
                    description: null
                    enabled: true
                    pinned: false
                    source: user
                    use_count: 0
                    updated_at: '2026-09-21T11:40:00Z'
                    content: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
