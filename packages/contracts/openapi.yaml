        Installs uploaded skill packs (`sessions.uploadAttachment` with `purpose: skill`) into
        the Hermes home of the profile in `X-Hub-Profile`, as `skills/<name>/`. A pack is one
        `SKILL.md`, or a zip (`.zip`, `.skill`) holding one skill or several: every folder with
        a `SKILL.md` is a skill, and the files beside it (`references/`, `scripts/` …) are
        installed with it. Every file is written byte for byte — the front matter is never
        rewritten. A `SKILL.md` must open with a closed YAML front matter carrying `name` and
        `description`, have a body, and stay under 100,000 characters; the skill's name
        (front matter `name`, else its folder) must match `^[a-z0-9][a-z0-9._-]{0,63}$`.
        All or nothing: a pack with one bad skill, or a skill that already exists, installs
        nothing — `400 bad_request` or `409 conflict` with `details.reason`, `details.skill`,
        `details.file` and `details.message` saying which and why.
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillImport'
