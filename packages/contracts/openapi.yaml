  # ================================================================== models
  /models/providers:
    get:
      operationId: models.listProviders
      tags: [models]
      summary: List the providers this profile can use (the General Models tab)
      description: >-
        Only configured providers: a fresh hub answers with an empty list and the client
        offers "Add provider" (`models.listProviderPresets`). Two scopes (decision §37):
        the **shared** providers (`scope: all`, every profile's, stored under the `default`
        profile) and this profile's **own** (`scope: profile`). Both are listed, each saying
        which it is; where both have the same slug, the profile's own is the one its agents
        use.
      parameters:
        - $ref: '#/components/parameters/Profile'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/ProviderKind'
      x-rt-events: []
      responses:
        '200':
          description: Providers (not paged).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
              example:
                items:
                  - id: 01J8QK3ZR2W7M5N4P6T8V9X0PV
                    profile: work
                    owner_id: 01J8QK3ZR2W7M5N4P6T8V9X0HM
                    created_at: '2026-09-01T00:00:00Z'
                    updated_at: '2026-09-21T06:00:00Z'
                    slug: anthropic
                    label: Anthropic
                    kind: llm
                    scope: all
                    builtin: true
                    enabled: true
                    api_key: '[stored]'
                    base_url: null
                    api_mode: native
                    auth:
                      kind: api_key
                      signed_in: true
                    catalogue:
                      status: ready
                      refreshed_at: '2026-09-21T06:00:00Z'
                      error: null
                      refreshable: true
                    visibility:
                      mode: all
                      models: []
                    models:
                      - key: anthropic/claude-sonnet-4-5
                        provider_id: 01J8QK3ZR2W7M5N4P6T8V9X0PV
                        provider: anthropic
                        model: claude-sonnet-4-5
                        alias: null
                        kind: chat
                        visible: true
                        custom: false
                        preview: false
                        disabled: false
                        context_window: 256000
                        capabilities: [vision, tools, reasoning]
                        pricing: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: models.createProvider
      tags: [models]
      summary: Add a provider — from a preset, or a custom OpenAI-compatible endpoint (admin)
      description: >-
        The one way a provider row comes into existence: `models.listProviders` returns
        what was added here, not the bundled catalogue. With `preset` the hub also creates
        the sibling rows of the same credential family (OpenAI chat, dictation and speech
        are three rows and one key, ADR 0010). `scope` says who it is for (decision §37):
        `all` (the default) makes it every profile's, `profile` makes it this profile's
        own — its key then goes into this profile's Hermes `.env`, where it wins over a
        shared key of the same name. The same preset twice in one scope is `409 conflict`
        (`provider_exists`); once shared and once as a profile's own is allowed. A provider
        never changes scope: `models.updateProvider` has no `scope`.
      parameters:
        - $ref: '#/components/parameters/Profile'
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreate'
            example:
              preset: openai-compatible
              label: 'خادم محلي'
              kind: llm
              base_url: http://ollama.local:11434/v1
              api_key: null
              api_mode: chat_completions
      x-rt-events: [job.queued]
      responses:
        '201':
          description: The provider; its catalogue refresh runs as a job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
              example:
                id: 01J8QK3ZR2W7M5N4P6T8V9X0PW
                profile: work
                owner_id: 01J8QK3ZR2W7M5N4P6T8V9X0HM
                created_at: '2026-09-21T13:10:00Z'
                updated_at: '2026-09-21T13:10:00Z'
                slug: custom-ollama
                label: 'خادم محلي'
                kind: llm
                scope: all
                builtin: false
                enabled: true
                api_key: null
                base_url: http://ollama.local:11434/v1
                api_mode: chat_completions
                auth:
                  kind: none
                  signed_in: true
                catalogue:
                  status: loading
                  refreshed_at: null
                  error: null
                  refreshable: true
                visibility:
                  mode: all
                  models: []
                models: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
