  /hub-mcp:
    post:
      operationId: agents.hubMcp
      tags: [agents]
      summary: The hub's MCP server (Streamable HTTP, JSON responses)
      description: >-
        What an agent's MCP client talks to — not a client API. One JSON-RPC 2.0 message per
        request (`initialize`, `notifications/initialized`, `ping`, `tools/list`,
        `tools/call`); a notification answers `202` with no body. The bearer is the profile's
        hub-tools key (written into the profile's `.env` as `COREHUB_MCP_TOKEN` by
        `agents.updateHubTools`), not a person's token. `initialize` and `tools/list` need
        only the key; `tools/call` also needs a run of the hub's that is live in that
        profile, and acts as the person who owns it, with that person's permissions in that
        profile only and never an admin's, through the same checks as the REST API. A tool
        refused this way is a JSON-RPC result with `isError: true` and the hub's error code,
        not an HTTP error (contract decision §67). A tool call from Hermes's messaging gateway
        acts for the person who linked the message's sender, or is refused
        (`hub_tools_sender_not_linked`, `hub_tools_sender_no_access`, `hub_tools_group_chat`);
        one from the hub's own process only for one of its runs (contract decision §79).
      security: []
      x-scope: global
      parameters:
        - name: X-Corehub-Origin
          in: header
          required: false
          description: >-
            Which kind of Hermes process made the call: `hub` (the process the hub runs its own
            conversations in, or a coding agent) or `gateway` (a messaging gateway). The block the
            hub writes fills it from `COREHUB_MCP_ORIGIN`, which the hub sets in each process it
            starts; anything else is unknown, and the call may then be any live run's or turn's.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcMessage'
            example:
              jsonrpc: '2.0'
              id: 1
              method: tools/list
      x-rt-events: []
      responses:
        '200':
          description: The JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcMessage'
              example:
                jsonrpc: '2.0'
                id: 1
                result:
                  tools:
                    - name: tasks.create
                      description: Create a task on the profile's board.
                      inputSchema:
                        type: object
                        required: [title]
                        properties:
                          title:
                            type: string
        '202':
          description: A notification was accepted; there is nothing to answer.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hub-mcp/channel-events:
    post:
      operationId: agents.hubChannelEvent
      tags: [agents]
      summary: What Hermes's messaging gateway tells the hub about a channel message
      description: >-
        Not a client API: the hook the hub writes into a profile's Hermes home
        (`hooks/corehub/`, beside its `corehub` MCP block) calls it from Hermes's messaging
        gateway, with the same bearer (the profile's hub-tools key). `turn_started`,
        `turn_step` and `turn_ended` bracket the agent's turn for one sender, so a call to the
        hub's tools from that gateway acts as the person who linked that sender — or is
        refused when nobody did (`hub_tools_sender_not_linked`). `link` carries the argument
        of a `/start` command: a live link code links the sender to its person and the gateway
        answers `message` instead of passing the command on; anything else is `handled:
        false` (contract decision §79).
      security: []
      x-scope: global
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubChannelEvent'
            example:
              event: link
              platform: telegram
              sender_id: '123456789'
              session_id: null
              chat_type: null
              code: corehub_7K3M9QX2AB
      x-rt-events: []
      responses:
        '200':
          description: What the gateway does next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubChannelEventResult'
              example:
                handled: true
                message: 'Linked: this Telegram account now acts as Tariq in Core Hub.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
