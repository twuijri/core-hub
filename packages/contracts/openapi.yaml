        Hands the subagent a note it reads before its next step; the step it is in is never cut
        short. `queued` is not "read": a subagent past its last step never sees it, and the agent
        may say so in its own reply. `rejected` when the agent no longer takes guidance for it.
        Only where `accepting_steer` is true; otherwise `409 state_invalid`
        (`details.reason = not_accepting_steer` or `unsupported`).
      x-rt-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubagentSteer'
            example:
              text: 'ركّز على اختبارات الخادم فقط'
      responses:
        '200':
          description: What the agent did with the note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentSteerResult'
              example:
                status: queued
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{session_id}/subagents/{subagent_id}/tail:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/SubagentId'
    get:
      operationId: sessions.tailSubagent
      tags: [sessions]
      summary: Read the end of a running subagent's own transcript
      description: |
        The last part (up to 16 KB) of what the subagent has written so far, as the agent keeps
        it. `available: false` when the agent has nothing to show — it is starting, it already
        finished, or the agent keeps no such transcript (`support` other than `full`).
      x-rt-events: []
      responses:
        '200':
          description: The end of the subagent's transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubagentTail'
              example:
                available: true
                text: "قرأت tests/unit/status.test.ts\nينقصه اختبار لحالة الخطأ 409"
                truncated: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{session_id}/files:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: sessions.listFiles
      tags: [sessions]
      summary: List the files of a conversation for preview
      description: |
        The conversation's files (contract decision §48): what its agent wrote or edited through
        a tool (the paths in the tool calls' arguments), what is in its working folder, and the
        files attached to its messages — the person's and the ones the agent handed back. One
        entry per file, newest first; a file both in the folder and named by a tool call is one
        entry with both `sources`.

        Only the session's own working folder is listed — for a task's session, the folder its
        run works in, which is the task's git worktree when it has one. The folder is read to a
        bounded depth and count (`truncated` says the cap was hit); hidden folders
        (`.git`, the hub's own run folders) and `node_modules` are skipped unless a tool call
        named a file inside them. Symbolic links are never followed.

        `preview` says how a client shows the file and `preview_max_bytes` how large a file of
        that kind may be to be previewed; a larger one, or `preview: none`, is offered for
        download only. Read the bytes with `sessions.readFile` (`path`) or
        `sessions.downloadAttachment` (`attachment_id`). A client reads the list again as
        `tool.completed` / `tool.failed` / `run.completed` arrive on `/rt/sessions`; a
        changed `modified_at` or `size_bytes` means the file changed.
      x-rt-events: []
      responses:
        '200':
          description: The files of the conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFileList'
              example:
                working_dir: /data/workspaces/default/01J8QK3ZR2W7M5N4P6T8V9X0YA
                truncated: false
                items:
                  - key: 'path:report.html'
                    name: report.html
                    path: report.html
                    attachment_id: null
                    message_id: null
                    mime: text/html
                    preview: html
                    size_bytes: 2048
                    preview_max_bytes: 5242880
                    modified_at: '2026-09-25T10:15:39Z'
                    sources: [tool, working_dir]
                    tool_call_ids: [01J8QK3ZR2W7M5N4P6T8V9X0TC]
                  - key: 'attachment:01J8QK3ZR2W7M5N4P6T8V9X0AT'
                    name: 'ميزانية.xlsx'
                    path: null
                    attachment_id: 01J8QK3ZR2W7M5N4P6T8V9X0AT
                    message_id: 01J8QK3ZR2W7M5N4P6T8V9X0MA
                    mime: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                    preview: xlsx
                    size_bytes: 18200
                    preview_max_bytes: 15728640
                    modified_at: null
                    sources: [attachment]
                    tool_call_ids: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{session_id}/files/content:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: sessions.readFile
      tags: [sessions]
      summary: Read one file of a conversation's working folder, for preview or download
      description: |
        The bytes of one file in the session's working folder (contract decision §48), read-only.
        `path` is relative to the folder (as `sessions.listFiles` gives it) or absolute inside
        it. Refused with `400 validation_failed` (`details.reason`): a path outside the folder
        (`outside_root`), through or to a symbolic link (`symlink`), or not a regular file
        (`not_a_file`). A file that is not there is `404`.

        Without `download` the file is sent for preview (`Content-Disposition: inline`) and
        refused with `413 payload_too_large` above its kind's preview limit (`details.max_bytes`,
        the entry's `preview_max_bytes`); with `download=true` it is sent as a file
        (`Content-Disposition: attachment`) up to the download limit. The type is chosen from
        the name, never sniffed (`X-Content-Type-Options: nosniff`), text is `charset=utf-8`,
        and every answer carries `Content-Security-Policy: sandbox; default-src 'none'` and
        `Cache-Control: no-store`, so an HTML file opened directly runs nothing in the hub's
        origin. A client renders HTML in a sandboxed frame of its own.
      parameters:
        - name: path
          in: query
          required: true
          description: The file, relative to the session's working folder.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
          example: report.html
        - name: download
          in: query
          description: 'Send the file for saving (`Content-Disposition: attachment`).'
          schema:
            type: boolean
            default: false
      x-rt-events: []
      responses:
        '200':
          description: The file.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
