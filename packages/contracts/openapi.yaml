          $ref: '#/components/schemas/Ulid'
    post:
      operationId: auth.claimPairing
      tags: [auth]
      summary: Claim a pairing from the device (unauthenticated)
      description: |
        The device presents the code plus a description of itself, including a stable `device_key`
        so re-pairing updates the same device row, and the capabilities it can serve. Errors:
        `401 unauthorized` (wrong code), `409 conflict` (already claimed), `404 not_found` (expired
        or unknown), `403 forbidden` (the authorizing user is disabled).
