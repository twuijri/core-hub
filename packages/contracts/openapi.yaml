  # ---------------------------------------------------------------- journey
  /agents/{agent_id}/journey:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: agents.getJourney
      tags: [agents]
      summary: Read what the agent has learned in the profile, as a graph (skills and memories)
      description: >-
        Hermes's own learning graph for the profile in `X-Hub-Profile` — what Hermes's
        `hermes journey` and its server's `GET /api/learning/graph` give, read through that
        server (ADR 0015): the profile's skills that the agent made or has used (a skill Hermes
        ships, or one nobody used, is not in it), and each entry of `MEMORY.md` and `USER.md` as
        a node of its own. Links are Hermes's: a skill's declared `related_skills`, and each
        memory to the skills whose names or words it shares. Hermes decides every value; the
        hub only renames the fields. Only where the hub supervises Hermes: otherwise `409
        state_invalid` with `details.reason = hermes_not_supervised`; an agent that is not
        Hermes is `409 state_invalid`, `journey_is_hermes_only`; Hermes's server not answering is
        `503`, `hermes_api_unavailable`.
      x-rt-events: []
      responses:
        '200':
          description: The graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
              example:
                nodes:
                  - id: web-research
                    label: web-research
                    kind: skill
                    category: research
                    use_count: 12
                    pinned: true
                    state: active
                    agent_created: false
                    memory_source: null
                    learned_at: '2026-09-20T10:00:00Z'
                  - id: summarize-pdf
                    label: summarize-pdf
                    kind: skill
                    category: research
                    use_count: 0
                    pinned: false
                    state: active
                    agent_created: true
                    memory_source: null
                    learned_at: '2026-09-25T16:08:51Z'
                  - id: 'memory:memory:0'
                    label: 'يفضّل الشخص البحث بالعربية'
                    kind: memory
                    category: memory
                    use_count: 0
                    pinned: false
                    state: active
                    agent_created: false
                    memory_source: memory
                    learned_at: '2026-09-25T16:08:51Z'
                edges:
                  - source: summarize-pdf
                    target: web-research
                  - source: 'memory:memory:0'
                    target: web-research
                clusters:
                  - category: research
                    count: 2
                  - category: memory
                    count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  # ---------------------------------------------------------------- plugins (agent-local)
  /agents/{agent_id}/plugins:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: agents.listPlugins
      tags: [agents]
      summary: List the plugins the agent's runtime has in the profile
      description: >-
        What Hermes itself lists for the profile in `X-Hub-Profile` — `hermes plugins list`
        run against that profile's home: the plugins it ships (`source: bundled`), the ones
        installed into the profile (`user`), and Python packages that register one
        (`external`), each with Hermes's own `status`. Hermes's dashboard plugin routes act on
        the dashboard's own home only (they take no profile, unlike its MCP, skills and cron
        routes), so the hub runs Hermes's command instead. A plugin Hermes's catalog has
        withdrawn is listed with Hermes's reason in `warnings`; so is a name Hermes lists twice (it
        ships a few under one name in two categories, and its commands take the name to mean the
        first — the one listed). Only where the hub supervises
        Hermes: otherwise `409 state_invalid` with `details.reason = hermes_not_supervised`;
        an agent that is not Hermes is `409 state_invalid`, `plugins_are_hermes_only`.
      x-rt-events: []
      responses:
        '200':
          description: Plugins plus runtime warnings.
          content:
            application/json:
              schema:
                type: object
                required: [items, warnings]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentPlugin'
                  warnings:
                    type: array
                    items:
                      type: string
              example:
                items:
                  - key: disk-cleanup
                    name: disk-cleanup
                    kind: bundled
                    source: bundled
                    status: not_enabled
                    version: 2.0.0
                    description: 'Auto-track and clean up ephemeral files created during Hermes sessions.'
                    author: null
                    configured: true
                    enabled: false
                    manageable: true
                    removable: false
                    provides_tools: []
                    provides_hooks: []
                    requires_env: []
                    entries: []
                warnings: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: agents.installPlugin
      tags: [agents]
      summary: Install a plugin into the profile (admin)
      description: >-
        A job (`kind: plugin_install`, `resource: {kind: agent}`) in which Hermes installs the
        plugin into the Hermes home of the profile in `X-Hub-Profile` — `hermes plugins install
        <identifier> --no-enable`: a name from Hermes's curated catalog (installed at the
        commit the catalog pins), a Git URL, or `owner/repo`. Hermes scans it, refuses what
        its catalog has withdrawn, and installs it **switched off**; switching it on is
        `agents.updatePlugin`, and Hermes loads it in its next session. The job fails with
        Hermes's own sentence when Hermes refuses; its `result` is `{name, output}` when it
        succeeds. Only where the hub supervises Hermes: otherwise `409 state_invalid` with
        `details.reason = hermes_not_supervised`, and no job is created.
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  minLength: 1
                  maxLength: 400
                  pattern: '^[^\s-][^\s]*$'
                  description: A catalog name, a Git URL or `owner/repo`; never an option.
            example:
              identifier: anpicasso/hermes-plugin-chrome-profiles
      x-rt-events: [job.queued, job.progress, job.completed, job.failed]
      responses:
        '202':
          description: Install started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_id: 01J8QK3ZR2W7M5N4P6T8V9X0JH
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /agents/{agent_id}/plugins/{plugin_key}:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AgentId'
      - name: plugin_key
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9._@/-]{1,120}$'
    patch:
      operationId: agents.updatePlugin
      tags: [agents]
      summary: Enable or disable an agent plugin (admin)
      description: >-
        `hermes plugins enable|disable <key>` in the profile's home: Hermes's allow and deny
        lists in that profile's `config.yaml`. Enabling grants no override of built-in tools
        and no capability the plugin declares (Hermes asks for those interactively only, and
        fails closed without a person at its terminal). Hermes applies it in its next
        session. Answers the plugin as Hermes lists it afterwards. Hermes refusing (a plugin
        it does not have) is `409 conflict`, `details.reason = hermes_refused`, with Hermes's
        sentence in `details.message`; `hermes_not_supervised` as for `agents.listPlugins`.
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
            example:
              enabled: true
      x-rt-events: []
      responses:
        '200':
          description: The plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPlugin'
              example:
                key: disk-cleanup
                name: disk-cleanup
                kind: bundled
                source: bundled
                status: enabled
                version: 2.0.0
                description: 'Auto-track and clean up ephemeral files created during Hermes sessions.'
                author: null
                configured: true
                enabled: true
                manageable: true
                removable: false
                provides_tools: []
                provides_hooks: []
                requires_env: []
                entries: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: agents.deletePlugin
      tags: [agents]
      summary: Remove a plugin installed into the profile (admin)
      description: >-
        `hermes plugins remove <key>` in the profile's home: the plugin's folder under the
        profile's `plugins/`. Only a plugin that was installed there (`removable: true`); one
        Hermes ships is switched off instead, never removed (`409 conflict`, `details.reason =
        plugin_bundled`). Hermes refusing is `409 conflict`, `hermes_refused`, with its
        sentence; `hermes_not_supervised` as for `agents.listPlugins`.
      x-roles: [owner, admin]
      x-rt-events: []
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
