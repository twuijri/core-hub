          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelIdentityList'
              example:
                items:
                  - id: 01J9ZT1A2B3C4D5E6F7G8H9J0K
                    user_id: 01J9ZRX1QW3M8K2T6B4N5C7D9E
                    platform: telegram
                    sender_id: '123456789'
                    linked_at: '2026-09-26T08:00:00Z'
                    last_used_at: '2026-09-26T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me/channel-identities/link-codes:
    post:
      operationId: auth.createChannelLinkCode
      tags: [auth]
      summary: Start linking a messaging account — a one-time code to send to the bot
      description: >-
        The code proves the account: send `command` to your agent's bot from the Telegram or
        WhatsApp account you want linked, within ten minutes. The hub's hook in Hermes's
        messaging gateway sees the sender the platform names and links that account to you
        (a Telegram bot link `https://t.me/<bot>?start=<code>` sends the same). A new code
        replaces your previous one; a code works once. The bot must already answer you
        (paired or on its allowlist): Hermes drops strangers before any hook runs.
      x-scope: global
      x-rt-events: []
      responses:
        '201':
          description: The code, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelLinkCode'
              example:
                code: corehub_7K3M9QX2AB
                command: /start corehub_7K3M9QX2AB
                expires_at: '2026-09-26T08:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
