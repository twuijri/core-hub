    patch:
      operationId: auth.updateProfile
      tags: [auth]
      summary: Rename a workspace, change its slug, avatar or default model (admin)
      description: |
        **Renaming** (`name`, decision §44) works for every profile, `default` included, and
        changes only what people see: the slug stays. Where the hub mirrors Hermes profiles
        (ADR 0014) the name is written to Hermes first as the profile's display name — for
        `default`, `hermes profile rename default <name>`, which keeps Hermes's id `default`;
        for a named profile, `display_name` in its `profile.yaml`, the folder unmoved. A name
        equal to the slug clears Hermes's display name. When Hermes refuses, nothing changes
        and the answer is `409` with `details.reason = hermes_refused` and Hermes's words in
        `details.message`.

        **The slug** of `default` never changes (`409`). Where the hub mirrors Hermes, no
        slug changes: it is the Hermes folder that channels, schedules and chats use, so the
        answer is `409` with `details.reason = profile_id_fixed`, before anything is written.
        Without Hermes (the hub's own filter) a named profile's slug may still change.
      x-scope: global
      x-roles: [owner, admin]
      x-rt-events: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            example:
              name: 'العمل الرئيسي'
              default_model:
                provider_id: 01J8QK3ZR2W7M5N4P6T8V9X0PV
                model: claude-opus-4-1
      responses:
        '200':
          description: The updated profile.
          content:
