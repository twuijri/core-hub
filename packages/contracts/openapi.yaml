                totals:
                  input_tokens: 182030
                  output_tokens: 42100
                  cache_read_tokens: 91000
                  cache_write_tokens: null
                  reasoning_tokens: 0
                  total_tokens: 315130
                  cache_hit_rate: 0.3333
                  runs: 48
                  unreported_runs: 0
                  conversations: 12
                  conversations_per_day: 2.4
                  cost: { amount: '0.912000', currency: USD }
                  cost_source: estimated
                by_day:
                  - date: '2026-09-25'
                    input_tokens: 18203
                    output_tokens: 4210
                    cache_read_tokens: 9100
                    cache_write_tokens: 0
                    total_tokens: 31513
                    runs: 5
                    conversations: 2
                    cost: { amount: '0.091200', currency: USD }
                by_model:
                  - model: gpt-5.1
                    input_tokens: 182030
                    output_tokens: 42100
                    cache_read_tokens: 91000
                    cache_write_tokens: 0
                    total_tokens: 315130
                    share: 1
                    runs: 48
                    cost: { amount: '0.912000', currency: USD }
                by_agent:
                  - agent_id: 01J8QK3ZR2W7M5N4P6T8V9X0YA
                    name: Hermes
                    reports_usage: true
                    runs: 48
                    conversations: 12
                    input_tokens: 182030
