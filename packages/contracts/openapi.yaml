      operationId: tasks.deleteWorktree
      tags: [tasks]
      summary: Remove the worktree (the branch is kept)
      description: >-
        `409 conflict` with `details.reason: task_running` while the task's run is working in it —
        stop the task first. A folder already deleted by hand is forgotten by git (`git worktree
        prune`). When git refuses, the job fails with git's message and the worktree reads
        `status: error`.
