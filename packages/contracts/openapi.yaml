      summary: The Usage screen — tokens, cache, estimated cost and conversations by day, model and agent
      description: |
        Aggregated on the hub from the usage ledger (one record per run and model) and the runs
        themselves (contract decision §50). A day is the caller's calendar day
        (`utc_offset_minutes`); `days=7` is today and the six days before it, and `by_day` has
        one entry for every one of them, oldest first, zeros included.

        **Only what was measured is a number.** `cache_read_tokens`, `cache_write_tokens` and
        `cache_hit_rate` are `null` when no record in the period reported the cache (Hermes
        reports none today); `cost` is `null` when no record was priced. An agent that ran but
        reported no usage at all — coding agents over ACP — is in `by_agent` with
        `reports_usage: false` and `null` tokens, never zeros.

        With `profiles=all` the report covers every profile the caller may enter (ADR 0016);
        the header must still name one of them. `agent_id` narrows everything to one agent;
        `agents` still lists every agent active in the period, so a filter can be changed back.
