  /attachments/{attachment_id}/stream:
    parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/AttachmentId'
    post:
      operationId: sessions.createAttachmentStream
      tags: [sessions]
      summary: A short-lived address a media element can play the bytes from
      description: >-
        A `<video>` or `<audio>` element sends no header, so it cannot carry the bearer that
        `sessions.downloadAttachment` wants. This gives a one-attachment, read-only ticket in the
        path instead (DECISIONS §88): valid for one hour, for this attachment only, and it stops
        when the person who asked may no longer read it. It is not the bearer token and grants
        nothing else. Supports `Range` like the download.
      x-rt-events: []
      responses:
        '201':
          description: The address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentStream'
              example:
                url: /api/v1/attachment-streams/7c1b0e5f2a9d4c3b8e6f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d
