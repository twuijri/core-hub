          $ref: '#/components/schemas/StatusCounts'
    # ---------------------------------------------------------------- schedules
    ScheduleTrigger:
      type: object
      description: When to fire. `expression` for `cron` (5 fields), `every_minutes` for `interval`, `run_at` for `once`.
      required: [kind, expression, every_minutes, run_at, timezone]
      properties:
        kind:
          type: string
          enum: [cron, interval, once]
        expression:
          type: [string, 'null']
        every_minutes:
          type: [integer, 'null']
          minimum: 1
        run_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        timezone:
          type: string
          description: IANA zone the expression is evaluated in.
        display:
          type: string
          description: Server-rendered, localized description (read-only).
    ScheduleTarget:
      type: object
      description: What to run — a prompt to an agent, or a workflow.
      required: [kind, agent_id, prompt, model, provider, skills, workflow_id, input]
      properties:
        kind:
          type: string
          enum: [agent_prompt, workflow]
        agent_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        prompt:
          type: [string, 'null']
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        skills:
          type: array
          items:
            type: string
        workflow_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        input:
          type: [string, 'null']
    DeliveryTarget:
      type: object
      description: Where the output goes. `none` keeps it in history only.
      required: [kind, room_id, channel, address]
      properties:
        kind:
          type: string
          enum: [none, notice, room, channel]
        label:
          type: string
          description: Display label (read-only in listings).
        room_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        channel:
          type: [string, 'null']
          description: Messaging platform slug when `kind = channel`.
        address:
          type: [string, 'null']
          description: Chat/channel id on that platform.
    Schedule:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              name,
              trigger,
              target,
              delivery,
              repeat,
              enabled,
              state,
              next_run_at,
              last_run_at,
              last_status,
              last_error,
              last_delivery_error,
              run_if_missed,
              overlap,
            ]
          properties:
            name:
              type: string
              maxLength: 120
            trigger:
              $ref: '#/components/schemas/ScheduleTrigger'
            target:
              $ref: '#/components/schemas/ScheduleTarget'
            delivery:
              $ref: '#/components/schemas/DeliveryTarget'
            repeat:
              type: object
              required: [limit, completed]
              properties:
                limit:
                  type: [integer, 'null']
                  minimum: 1
                  description: '`null` = unlimited.'
                completed:
                  type: integer
            enabled:
              type: boolean
            state:
              type: string
              enum: [scheduled, running, paused, exhausted]
            next_run_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_run_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_status:
              oneOf:
                - $ref: '#/components/schemas/JobStatus'
                - type: 'null'
            last_error:
              type: [string, 'null']
            last_delivery_error:
              type: [string, 'null']
            run_if_missed:
              description: >-
                Whether a time missed while the hub was not running still runs, once, when
                the hub is back within 24 hours of it (DECISIONS §40). `false` skips it and
                records why in the history. A run up to two minutes late is on time and
                runs either way. `null` for a schedule in an agent's own scheduler
                (`external`), which decides this itself.
              type: [boolean, 'null']
            overlap:
              description: >-
                What happens when this schedule's time comes and its previous run is still
                going (DECISIONS §40): `skip` records the time as skipped; `wait` runs it as
                soon as the previous run ends, with at most one time waiting (a further one
                is skipped and recorded); `parallel` starts it alongside, in a session of its
                own; `replace` stops the previous run, then starts. "Run now" always starts
                at once and stops nothing. `null` for a schedule in an agent's own scheduler
                (`external`), which decides this itself.
              oneOf:
                - $ref: '#/components/schemas/ScheduleOverlap'
                - type: 'null'
            external:
              description: >-
                Set when this schedule lives in an agent's own scheduler (today: Hermes's
                cron). That scheduler fires it and is the source of truth: edits are asked
                of it first and it may refuse them, and the next run, last run and state are
                what it reports.
              oneOf:
                - type: object
                  required: [source, id]
                  properties:
                    source:
                      type: string
                      enum: [hermes]
                    id:
                      type: string
                      maxLength: 64
                      description: The job's id in that scheduler.
                - type: 'null'
    ScheduleWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        trigger:
          $ref: '#/components/schemas/ScheduleTrigger'
        target:
          $ref: '#/components/schemas/ScheduleTarget'
        delivery:
          $ref: '#/components/schemas/DeliveryTarget'
        repeat:
          type: object
          properties:
            limit:
              type: [integer, 'null']
              minimum: 1
        enabled:
          type: boolean
        run_if_missed:
          type: boolean
          description: >-
            `Schedule.run_if_missed`; `false` when a new schedule does not say. Refused for a
            schedule in Hermes's scheduler (`409`, `details.reason = hermes_run_options`).
        overlap:
          allOf:
            - $ref: '#/components/schemas/ScheduleOverlap'
          description: >-
            `Schedule.overlap`; `wait` when a new schedule does not say. Refused for a schedule
            in Hermes's scheduler (`409`, `details.reason = hermes_run_options`).
    ScheduleOverlap:
      type: string
      enum: [skip, wait, parallel, replace]
      description: >-
        What a schedule does when its time comes while its previous run is still going. See
        `Schedule.overlap`.
    ScheduleRun:
      type: object
      required:
        [
          id,
          schedule_id,
          job_id,
          run_id,
          session_id,
          workflow_run_id,
          status,
          trigger,
          waiting,
          output_preview,
          output,
          output_size_bytes,
          error,
          delivery_status,
          delivery_error,
          started_at,
          finished_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        schedule_id:
          $ref: '#/components/schemas/Ulid'
        job_id:
          $ref: '#/components/schemas/Ulid'
        run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        workflow_run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        status:
          $ref: '#/components/schemas/JobStatus'
        trigger:
          type: string
          enum: [schedule, manual]
        waiting:
          type: boolean
          description: >-
            `true` while this time waits for the schedule's previous run to end (`overlap:
            wait`); its `status` is `queued`. It starts when that run ends.
        output_preview:
          type: [string, 'null']
        output:
          type: [string, 'null']
          description: Full text; only on the single-run read.
        output_size_bytes:
          type: integer
        error:
          type: [string, 'null']
        delivery_status:
          type: string
          enum: [none, pending, delivered, failed]
        delivery_error:
          type: [string, 'null']
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ScheduleRunAccepted:
      allOf:
        - $ref: '#/components/schemas/JobAccepted'
        - type: object
          required: [schedule_run_id, session_id, run_id, workflow_run_id]
          properties:
            schedule_run_id:
              $ref: '#/components/schemas/Ulid'
            session_id:
              description: The session an `agent_prompt` run talks in; `null` for a workflow or a Hermes schedule.
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            run_id:
              description: The session run of an `agent_prompt` target; `null` otherwise.
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            workflow_run_id:
              description: The workflow run of a `workflow` target; `null` otherwise.
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
    # ---------------------------------------------------------------- workflows
    WorkflowNode:
      type: object
      required:
        [
          id,
          kind,
          title,
          agent_id,
          model,
          provider,
          reasoning_effort,
          skills,
          input,
          approval_required,
          position,
        ]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,40}$'
        kind:
          type: string
          enum: [agent, approval, condition, delay, notify]
        title:
          type: string
        agent_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        model:
          type: [string, 'null']
        provider:
          type: [string, 'null']
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        skills:
          type: array
          items:
            type: string
        input:
          type: [string, 'null']
          description: Prompt template; `{{input}}` and `{{steps.<id>.output}}` are substituted.
        approval_required:
          type: boolean
          description: 'Gate the node behind an approval (`kind: workflow_step`) before it runs.'
        position:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
    WorkflowEdge:
      type: object
      required: [id, from, to, route]
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        route:
          type: string
          enum: [always, success, failure]
    Workflow:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              name,
              description,
              working_dir,
              nodes,
              edges,
              status,
              active_run_id,
              run_count,
              schedule_count,
            ]
          properties:
            name:
              type: string
              maxLength: 120
            description:
              type: [string, 'null']
            working_dir:
              type: [string, 'null']
            nodes:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowNode'
            edges:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowEdge'
            status:
              type: string
              enum: [idle, running, waiting, error]
            active_run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            run_count:
              type: integer
            schedule_count:
              type: integer
              description: Enabled schedules targeting this workflow.
    WorkflowWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
        working_dir:
          type: [string, 'null']
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
    WorkflowStepStatus:
      type: string
      enum:
        [
          pending,
          queued,
          running,
          waiting_approval,
          succeeded,
          failed,
          skipped,
          cancelled,
          rejected,
        ]
    WorkflowStep:
      type: object
      required:
        [node_id, attempt, status, session_id, run_id, approval_id, error, started_at, finished_at]
      properties:
        node_id:
          type: string
        attempt:
          type: integer
        status:
          $ref: '#/components/schemas/WorkflowStepStatus'
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: The session where the step's agent worked; its output is that session's last assistant message.
        run_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        approval_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        error:
          type: [string, 'null']
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    WorkflowRun:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [workflow_id, job_id, status, trigger, input, steps, error, started_at, finished_at]
          properties:
            workflow_id:
              $ref: '#/components/schemas/Ulid'
            job_id:
              $ref: '#/components/schemas/Ulid'
            status:
              type: string
              enum: [queued, running, waiting, succeeded, failed, cancelled]
            trigger:
              $ref: '#/components/schemas/RunTrigger'
            input:
              type: [string, 'null']
            steps:
              type: array
              description: Latest attempt per node, in execution order.
              items:
                $ref: '#/components/schemas/WorkflowStep'
            error:
              type: [string, 'null']
            started_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            finished_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
    WorkflowRunRequest:
      type: object
      properties:
        input:
          type: [string, 'null']
        start_node_ids:
          type: [array, 'null']
          items:
            type: string
        timeout_ms:
          type: [integer, 'null']
    WorkflowRunAccepted:
      allOf:
        - $ref: '#/components/schemas/JobAccepted'
        - type: object
          required: [workflow_run_id]
          properties:
            workflow_run_id:
              $ref: '#/components/schemas/Ulid'
    WorkflowImportPreview:
      type: object
      required: [id, name, node_count, edge_count, warnings, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        node_count:
          type: integer
        edge_count:
          type: integer
        warnings:
          type: array
          items:
            type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    # ---------------------------------------------------------------- models
    ProviderKind:
      type: string
      enum: [llm, stt, tts]
    ModelKind:
      type: string
      enum: [chat, embedding, stt, tts]
    ModelCapability:
      type: string
      enum: [vision, tools, reasoning, audio, streaming]
    ModelPricing:
      type: object
      required: [input_per_million, output_per_million]
      properties:
        input_per_million:
          $ref: '#/components/schemas/Money'
        output_per_million:
          $ref: '#/components/schemas/Money'
    Model:
      type: object
      required:
        [
          key,
          provider_id,
          provider,
          model,
          alias,
          kind,
          visible,
          custom,
          preview,
          disabled,
          context_window,
          capabilities,
          pricing,
        ]
      properties:
        key:
          type: string
          description: '`<provider slug>/<model>` — the value stored in sessions and seats.'
        provider_id:
          $ref: '#/components/schemas/Ulid'
        provider:
          type: string
        model:
          type: string
        alias:
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/ModelKind'
        visible:
          type: boolean
        custom:
          type: boolean
        preview:
          type: boolean
        disabled:
          type: boolean
        context_window:
          type: [integer, 'null']
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ModelCapability'
        pricing:
          oneOf:
            - $ref: '#/components/schemas/ModelPricing'
            - type: 'null'
    ModelPatch:
      type: object
      properties:
        alias:
          type: [string, 'null']
        visible:
          type: boolean
        context_window:
          type: [integer, 'null']
        custom:
          type: boolean
          description: '`true` registers a model the catalogue does not list.'
    Visibility:
      type: object
      required: [mode, models]
      properties:
        mode:
          type: string
          enum: [all, include]
        models:
          type: array
          items:
            type: string
    Provider:
      description: >-
        A provider the hub added, shared (`scope: all`, `profile` is then `default`, where it
        is stored) or one profile's own (`scope: profile`, `profile` is that profile) —
        decision §37.
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              slug,
              label,
              kind,
              scope,
              builtin,
              enabled,
              api_key,
              base_url,
              api_mode,
              auth,
              catalogue,
              visibility,
              models,
            ]
          properties:
            slug:
              type: string
            label:
              type: string
            kind:
              $ref: '#/components/schemas/ProviderKind'
            scope:
              $ref: '#/components/schemas/ProviderScope'
            builtin:
              type: boolean
            enabled:
              type: boolean
            api_key:
              type: [string, 'null']
              enum: ['[stored]', null]
              description: Never the value.
            base_url:
              type: [string, 'null']
            api_mode:
              type: string
              enum: [native, chat_completions, responses]
            auth:
              type: object
              required: [kind, signed_in]
              description: >-
                `kind` is what the provider *requires*: `none` means no key is required —
                it never means a key is refused. Every provider accepts one (a local proxy
                behind a master key is the common case), so a client always offers the
                field, and a missing key is only ever reported by the endpoint itself.
              properties:
                kind:
                  type: string
                  enum: [api_key, oauth, none]
                signed_in:
                  type: boolean
            catalogue:
              type: object
              required: [status, refreshed_at, error, refreshable]
              properties:
                status:
                  type: string
                  enum: [ready, loading, error, unsupported]
                refreshed_at:
                  oneOf:
                    - $ref: '#/components/schemas/Timestamp'
                    - type: 'null'
                error:
                  type: [string, 'null']
                refreshable:
                  type: boolean
            visibility:
              $ref: '#/components/schemas/Visibility'
            models:
              type: array
              items:
                $ref: '#/components/schemas/Model'
    ProviderPreset:
      type: object
      description: One provider *type* a person can add, with everything the dialog prefills.
      required:
        [id, label, kind, api_mode, base_url, base_url_required, key, local, repeatable, keys_url]
      properties:
        id:
          type: string
          description: 'The catalogue id, sent back as `ProviderCreate.preset`.'
        label:
          type: string
        kind:
          $ref: '#/components/schemas/ProviderKind'
        api_mode:
          type: string
          enum: [native, chat_completions, responses]
        base_url:
          type: [string, 'null']
          description: What to prefill; `null` when no default could be right (LiteLLM).
        base_url_required:
          type: boolean
          description: Whether the person must supply one before the provider can be added.
        key:
          type: string
          enum: [required, optional]
          description: >-
            `optional` providers are added and used with no key; one may still be typed,
            because a local proxy is often put behind a master key. There is no value that
            means "a key is refused".
        local:
          type: boolean
          description: Runs on the person's own machine or network (loopback warning applies).
        repeatable:
          type: boolean
          description: 'May be added more than once; the person gives each instance its own name.'
        keys_url:
          type: [string, 'null']
    ProviderHost:
      type: object
      required: [containerized, loopback_alias]
      properties:
        containerized:
          type: boolean
          description: >-
            The hub is running inside a container, so `127.0.0.1` in a base URL is the
            container itself and not the person's machine.
        loopback_alias:
          type: string
          description: 'The host name to suggest instead of loopback (`host.docker.internal`).'
    ProviderProbe:
      type: object
      description: 'Either `preset` or `base_url` must say where to ask; both may be given.'
      properties:
        preset:
          type: [string, 'null']
        base_url:
          type: [string, 'null']
        api_key:
          type: [string, 'null']
          description: 'Sent as typed; never stored by this operation. `null` asks with no key.'
        api_mode:
          type: string
          enum: [native, chat_completions, responses]
        kind:
          $ref: '#/components/schemas/ProviderKind'
    ProviderProbeResult:
      type: object
      required: [ok, message, duration_ms, models]
      properties:
        ok:
          type: boolean
        message:
          type: [string, 'null']
          description: "Why it failed, ending in the endpoint's own words. `null` when it worked."
        duration_ms:
          type: integer
        models:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
    ProviderCreate:
      type: object
      required: [label, kind]
      properties:
        preset:
          type: [string, 'null']
          description: >-
            A `ProviderPreset.id`. With it the slug, protocol, credential family and
            default base URL come from the catalogue and only what the person typed is
            taken from this body. Without it the provider is an OpenAI-compatible endpoint
            described entirely by `base_url` and `api_mode`.
        label:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/ProviderKind'
        base_url:
          type: [string, 'null']
        api_key:
          type: [string, 'null']
        api_mode:
          type: string
          enum: [chat_completions, responses]
          default: chat_completions
        scope:
          $ref: '#/components/schemas/ProviderScope'
    ProviderScope:
      type: string
      enum: [all, profile]
      default: all
      description: >-
        Who a provider is for (decision §37): `all` — every profile (shared, stored under the
        `default` profile); `profile` — only the profile in `X-Hub-Profile`, where it wins over
        a shared provider of the same slug.
    ProviderPatch:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
        enabled:
          type: boolean
        api_key:
          type: [string, 'null']
          description: A value sets the key; `""` or `null` clears it.
        base_url:
          type: [string, 'null']
        api_mode:
          type: string
          enum: [native, chat_completions, responses]
        visibility:
          $ref: '#/components/schemas/Visibility'
    ProviderSignIn:
      type: object
      required: [id, status, user_code, verification_url, accepts_code, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum: [pending, approved, denied, expired]
        user_code:
          type: [string, 'null']
        verification_url:
          type: string
        accepts_code:
          type: boolean
          description: Whether the provider hands the user a code to paste back.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    RuntimeReport:
      type: object
      description: >-
        Whether the agent runtime received what this workspace configured. `ready` is
        every check passing; a client shows the failing ones rather than a single word.
      required: [agent, mode, ready, checks]
      properties:
        agent:
          type: string
          description: The runtime these checks are about (`hermes` today).
        mode:
          type: string
          enum: [managed, external, absent]
          description: >-
            `managed` — the hub started it and owns its files; `external` — somebody
            else's process, which the hub reads and never writes; `absent` — none found.
        ready:
          type: boolean
        reloaded_at:
          type: [string, 'null']
          format: date-time
          description: When the hub last recycled the runtime after writing to it.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeCheck'
    RuntimeCheck:
      type: object
      description: One step of propagation, answered from the runtime as it is now.
      required: [id, ok, detail]
      properties:
        id:
          type: string
          enum:
            [runtime_writable, provider_keys, provider_verified, model_selected, gateway_reloaded]
        ok:
          type: boolean
        detail:
          type: [string, 'null']
          description: >-
            A short fact, never a sentence to render on its own: a count, a provider
            slug, a model id. The wording belongs to the client's own catalogue.
    ModelDefaults:
      type: object
      required: [default, fallbacks, auxiliary]
      properties:
        inherited:
          type: array
          description: >-
            The roles whose value is the `default` profile's, because this profile chose
            none (decision §37): `default` for the chat model (with its fallbacks), else an
            auxiliary task key. Always empty in the `default` profile.
          items:
            type: string
        default:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        fallbacks:
          type: array
          description: Tried in order when the chosen model fails.
          items:
            $ref: '#/components/schemas/ModelRef'
        auxiliary:
          type: object
          required: [tasks, assignments]
          properties:
            tasks:
              type: array
              description: Server-defined roles (title generation, summarization, embeddings…).
              items:
                type: object
                required: [key, label]
                properties:
                  key:
                    type: string
                  label:
                    $ref: '#/components/schemas/LocalizedText'
            assignments:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ModelRef'
    ModelDefaultsWrite:
      type: object
      properties:
        default:
          oneOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        fallbacks:
          type: array
          items:
            $ref: '#/components/schemas/ModelRef'
        assignments:
          type: object
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/ModelRef'
              - type: 'null'
    EnsembleMember:
      allOf:
        - $ref: '#/components/schemas/ModelRef'
        - type: object
          properties:
            reasoning_effort:
              oneOf:
                - $ref: '#/components/schemas/ReasoningEffort'
                - type: 'null'
    Ensemble:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [name, enabled, active, members, aggregator, max_tokens]
          properties:
            name:
              type: string
            enabled:
              type: boolean
            active:
              type: boolean
              description: At most one ensemble is active per workspace.
            members:
              type: array
              items:
                $ref: '#/components/schemas/EnsembleMember'
            aggregator:
              $ref: '#/components/schemas/EnsembleMember'
            max_tokens:
              type: [integer, 'null']
    EnsembleWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        enabled:
          type: boolean
        active:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/EnsembleMember'
        aggregator:
          $ref: '#/components/schemas/EnsembleMember'
        max_tokens:
          type: [integer, 'null']
    SpeechProvider:
      type: object
      required: [id, slug, label, kind, configured, api_key, settings]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        slug:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [stt, tts]
        configured:
          type: boolean
        api_key:
          type: [string, 'null']
          enum: ['[stored]', null]
        settings:
          type: object
          required: [model, language, base_url, voice]
          properties:
            model:
              type: [string, 'null']
            language:
              type: [string, 'null']
            base_url:
              type: [string, 'null']
            voice:
              type: [string, 'null']
    SpeechSide:
      type: object
      required: [active_provider_id, ready, reason, providers]
      properties:
        active_provider_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        ready:
          type: boolean
          description: Whether the hub can serve requests now (the phone's "server dictation possible" check).
        reason:
          type: [string, 'null']
        providers:
          type: array
          items:
            $ref: '#/components/schemas/SpeechProvider'
    SpeechSettings:
      type: object
      required: [stt, tts]
      properties:
        stt:
          $ref: '#/components/schemas/SpeechSide'
        tts:
          $ref: '#/components/schemas/SpeechSide'
    SpeechSettingsPatch:
      type: object
      properties:
        stt_provider_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        tts_provider_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        providers:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              api_key:
                type: [string, 'null']
              settings:
                type: object
                additionalProperties: true
    Voice:
      type: object
      required: [id, name, language, gender]
      properties:
        id:
          type: string
        name:
          type: string
        language:
          type: [string, 'null']
        gender:
          type: [string, 'null']
          enum: [female, male, neutral, null]
    Transcription:
      type: object
      required: [text, language, duration_ms, provider_id, model]
      properties:
        text:
          type: string
        language:
          type: [string, 'null']
          description: Detected or requested language.
        duration_ms:
          type: integer
        provider_id:
          $ref: '#/components/schemas/Ulid'
        model:
          type: [string, 'null']
    SpeechRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        language:
          type: [string, 'null']
        voice:
          type: [string, 'null']
          description: Overrides the provider's default voice for this request.
        provider_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    # ---------------------------------------------------------------- devices
    DevicePlatform:
      type: string
      enum: [android, ios, web, macos, windows, linux]
    DeviceKind:
      type: string
      enum: [phone, tablet, computer, browser]
    CapabilityKind:
      type: string
      description: What a device can do for an agent. Unsupported kinds are simply absent.
      enum:
        [
          location,
          camera,
          microphone,
          notifications,
          clipboard,
          screen,
          files,
          apps,
          calendar,
          reminders,
          health,
        ]
    DeviceCapability:
      type: object
      required: [kind, enabled, consent_at]
      properties:
        kind:
          $ref: '#/components/schemas/CapabilityKind'
        enabled:
          type: boolean
        consent_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the person granted the OS permission, if the device reports it.
    DeviceRegistration:
      type: object
      description: How a device describes itself when pairing.
      required: [device_key, name, platform, kind]
      properties:
        device_key:
          type: string
          description: Stable id the device generates once and keeps, so re-pairing updates the same row.
          maxLength: 128
        name:
          type: string
          maxLength: 80
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        kind:
          $ref: '#/components/schemas/DeviceKind'
        brand:
          type: [string, 'null']
        model:
          type: [string, 'null']
        app_version:
          type: [string, 'null']
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityKind'
    PushStatus:
      type: object
      required: [provider, locale, registered_at]
      properties:
        provider:
          type: string
          enum: [fcm, apns, webpush]
        locale:
          $ref: '#/components/schemas/Locale'
        registered_at:
          $ref: '#/components/schemas/Timestamp'
    PushRegistration:
      type: object
      required: [provider, token]
      properties:
        provider:
          type: string
          enum: [fcm, apns, webpush]
        token:
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
    Device:
      type: object
      required:
        [
          id,
          user_id,
          device_key,
          name,
          platform,
          kind,
          brand,
          model,
          app_version,
          connection,
          online,
          last_seen_at,
          app_token_id,
          capabilities,
          push,
          this_device,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        device_key:
          type: string
        name:
          type: string
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        kind:
          $ref: '#/components/schemas/DeviceKind'
        brand:
          type: [string, 'null']
        model:
          type: [string, 'null']
        app_version:
          type: [string, 'null']
        connection:
          $ref: '#/components/schemas/PairingConnection'
        online:
          type: boolean
          description: Has a live `/rt/devices` socket.
        last_seen_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        app_token_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DeviceCapability'
        push:
          oneOf:
            - $ref: '#/components/schemas/PushStatus'
            - type: 'null'
        this_device:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    DevicePatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        app_version:
          type: [string, 'null']
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DeviceCapability'
    DeviceRequestStatus:
      type: string
      enum: [pending, fulfilled, denied, failed, expired, cancelled]
    DeviceRequest:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required:
            [
              device_id,
              session_id,
              run_id,
              job_id,
              capability,
              purpose,
              params,
              status,
              expires_at,
              result,
              error,
            ]
          properties:
            device_id:
              $ref: '#/components/schemas/Ulid'
            session_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            run_id:
              oneOf:
                - $ref: '#/components/schemas/Ulid'
                - type: 'null'
            job_id:
              $ref: '#/components/schemas/Ulid'
            capability:
              $ref: '#/components/schemas/CapabilityKind'
            purpose:
              type: [string, 'null']
              description: Shown to the person in the consent sheet.
            params:
              type: object
              description: 'Capability-specific: `location` takes `accuracy: coarse | precise`.'
              additionalProperties: true
            status:
              $ref: '#/components/schemas/DeviceRequestStatus'
            expires_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: [object, 'null']
              description: 'Capability-specific: `location` returns `latitude, longitude, accuracy_m, captured_at`.'
              additionalProperties: true
            error:
              oneOf:
                - $ref: '#/components/schemas/DeviceRequestError'
                - type: 'null'
    DeviceRequestError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Fixed list shared by all platforms.
          enum: [permission_denied, unavailable, timeout, cancelled, failed]
        message:
          type: [string, 'null']
    DeviceRequestCreate:
      type: object
      required: [device_id, capability]
      properties:
        device_id:
          $ref: '#/components/schemas/Ulid'
        capability:
          $ref: '#/components/schemas/CapabilityKind'
        purpose:
          type: [string, 'null']
        params:
          type: object
          additionalProperties: true
        session_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
          default: 30000
    DeviceRequestResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [fulfilled, denied, failed]
        result:
          type: [object, 'null']
          additionalProperties: true
        error:
          oneOf:
            - $ref: '#/components/schemas/DeviceRequestError'
            - type: 'null'
    Relay:
      type: object
      required: [enabled, connected, route, relay_url, hub_id, error, connected_at]
      properties:
        enabled:
          type: boolean
        connected:
          type: boolean
        route:
          type: string
          enum: [official, cloudflare]
        relay_url:
          type: [string, 'null']
        hub_id:
          type: [string, 'null']
        error:
          type: [string, 'null']
        connected_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    Peer:
      type: object
      required:
        [id, name, url, version, online, inbound_status, outbound_status, last_seen_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        url:
          type: string
        version:
          type: [string, 'null']
        online:
          type: boolean
        inbound_status:
          type: string
          enum: [pending, approved, rejected, blocked]
        outbound_status:
          type: string
          enum: [none, requested, connected, rejected, error]
        last_seen_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    # ---------------------------------------------------------------- notify
    NoticeKind:
      type: string
      enum:
        [
          run_completed,
          approval_requested,
          room_mention,
          task_moved,
          schedule_failed,
          update_available,
          system,
        ]
    Notice:
      type: object
      required: [id, user_id, profile, kind, title, body, resource, read_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        profile:
          oneOf:
            - $ref: '#/components/schemas/ProfileSlug'
            - type: 'null'
        kind:
          $ref: '#/components/schemas/NoticeKind'
        title:
          type: string
        body:
          type: [string, 'null']
        resource:
          oneOf:
            - $ref: '#/components/schemas/ResourceRef'
            - type: 'null'
          description: What to open when tapped.
        read_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    NotifyPreferences:
      type: object
      required: [events, quiet_hours]
      properties:
        events:
          type: object
          description: Keyed by `NoticeKind`; a missing key means both channels on.
          additionalProperties:
            type: object
            required: [in_app, push]
            properties:
              in_app:
                type: boolean
              push:
                type: boolean
        quiet_hours:
          type: object
          required: [enabled, from, to, timezone]
          properties:
            enabled:
              type: boolean
            from:
              type: string
              pattern: '^[0-2][0-9]:[0-5][0-9]$'
            to:
              type: string
              pattern: '^[0-2][0-9]:[0-5][0-9]$'
            timezone:
              type: string
    Webhook:
      type: object
      required:
        [
          id,
          name,
          url,
          events,
          profiles,
          enabled,
          secret,
          include_content,
          allow_private_network,
          max_retries,
          stats,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        profiles:
          type: array
          description: Empty means every workspace.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        enabled:
          type: boolean
        secret:
          type: [string, 'null']
          enum: ['[stored]', null]
        include_content:
          type: boolean
          description: Include message text in payloads (off = ids only).
        allow_private_network:
          type: boolean
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
        stats:
          type: object
          required: [delivered, failed, last_delivery_at, last_error]
          properties:
            delivered:
              type: integer
            failed:
              type: integer
            last_delivery_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_error:
              type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    WebhookDelivery:
      type: object
      required:
        [id, webhook_id, event, status, attempts, response_status, error, created_at, delivered_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        webhook_id:
          $ref: '#/components/schemas/Ulid'
        event:
          type: string
          description: The event name sent, e.g. `webhook.test`.
        status:
          type: string
          enum: [queued, delivered, failed, dead]
          description: '`dead` = retries exhausted.'
        attempts:
          type: integer
          minimum: 0
        response_status:
          type: [integer, 'null']
          description: The HTTP status the endpoint answered; null when it could not be reached.
        error:
          type: [string, 'null']
        created_at:
          $ref: '#/components/schemas/Timestamp'
        delivered_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    WebhookWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSlug'
        enabled:
          type: boolean
        secret:
          type: [string, 'null']
        include_content:
          type: boolean
        allow_private_network:
          type: boolean
        max_retries:
          type: integer
          minimum: 0
          maximum: 10
    # ---------------------------------------------------------------- updates
    ClientPlatform:
      type: string
      enum: [android, ios, macos, windows, linux]
    ReleaseChannel:
      type: string
      enum: [stable, test]
    Release:
      type: object
      required:
        [
          id,
          platform,
          channel,
          version,
          build,
          notes,
          size_bytes,
          sha256,
          mandatory,
          download_url,
          published_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        channel:
          $ref: '#/components/schemas/ReleaseChannel'
        version:
          type: string
          description: Release segment, e.g. `1.0.3`. Clients compare release then `build`.
        build:
          type: integer
        notes:
          $ref: '#/components/schemas/LocalizedText'
        size_bytes:
          type: integer
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        mandatory:
          type: boolean
        download_url:
          type: string
          description: Path on this hub; never a third-party URL.
        published_at:
          $ref: '#/components/schemas/Timestamp'
    ReleaseCreate:
      type: object
      required: [platform, channel, version, build, notes]
      properties:
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        channel:
          $ref: '#/components/schemas/ReleaseChannel'
        version:
          type: string
        build:
          type: integer
        notes:
          $ref: '#/components/schemas/LocalizedText'
        attachment_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
          description: 'Uploaded with `purpose: release`.'
        source_url:
          type: [string, 'null']
          description: Fetched server-side with the configured source token; the phone never sees it.
        mandatory:
          type: boolean
          default: false
    UpdateCheck:
      type: object
      required: [available, reason, release]
      properties:
        available:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [not_configured, up_to_date, null]
        release:
          oneOf:
            - $ref: '#/components/schemas/Release'
            - type: 'null'
    UpdateSettings:
      type: object
      required: [default_channel, source, auto_publish]
      properties:
        default_channel:
          $ref: '#/components/schemas/ReleaseChannel'
        source:
          type: object
          required: [kind, repo, token]
          properties:
            kind:
              type: string
              enum: [manual, github_release]
            repo:
              type: [string, 'null']
            token:
              type: [string, 'null']
              enum: ['[stored]', null]
        auto_publish:
          type: boolean
          description: Publish new source releases automatically to the `test` channel.
    UpdateSettingsWrite:
      type: object
      properties:
        default_channel:
          $ref: '#/components/schemas/ReleaseChannel'
        source:
          type: object
          properties:
            kind:
              type: string
              enum: [manual, github_release]
            repo:
              type: [string, 'null']
            token:
              type: [string, 'null']
        auto_publish:
          type: boolean
    # ---------------------------------------------------------------- stubs
    KnowledgeItem:
      allOf:
        - $ref: '#/components/schemas/Scoped'
        - type: object
          required: [kind, title, content, date, mood, tags, attachment_ids]
          properties:
            kind:
              type: string
              enum: [journal, note, file]
            title:
              type: [string, 'null']
            content:
              type: [string, 'null']
            date:
              type: [string, 'null']
              format: date
            mood:
              type: [string, 'null']
            tags:
              type: array
              items:
                type: string
            attachment_ids:
              type: array
              items:
                $ref: '#/components/schemas/Ulid'
    AuditReport:
      type: object
      required: [kind, period, generated_at, data]
      properties:
        kind:
          type: string
          enum: [logs, usage, performance, skills]
        period:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          description: Kind-specific; fixed in Phase 4 (usage totals and breakdowns, runtime processes, skill counts, log entries with ISO timestamps and byte sizes).
          additionalProperties: true
    ReportPeriod:
      type: object
      description: The calendar days a report covers, both ends included, in the caller's calendar.
      required: [from, to, days]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
          minimum: 1
    ActiveAgent:
      type: object
      description: An agent active in the period, and whether it reports what it used.
      required: [agent_id, name, reports_usage]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: [string, 'null']
          description: The agent's name, or `null` for an agent since removed.
        reports_usage:
          type: boolean
          description: False when none of its runs in the period reported tokens (coding agents over ACP).
    UsageReport:
      type: object
      required: [period, generated_at, profiles, agents, totals, by_day, by_model, by_agent]
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        profiles:
          type: array
          description: The profiles the report covers.
          items:
            $ref: '#/components/schemas/ProfileSlug'
        agents:
          type: array
          description: Every agent with a run in the period, whatever `agent_id` narrows to.
          items:
            $ref: '#/components/schemas/ActiveAgent'
        totals:
          type: object
          required:
            [
              input_tokens,
              output_tokens,
              cache_read_tokens,
              cache_write_tokens,
              reasoning_tokens,
              total_tokens,
              cache_hit_rate,
              runs,
              unreported_runs,
              conversations,
              conversations_per_day,
              cost,
              cost_source,
            ]
          properties:
            input_tokens:
              type: integer
              description: Input tokens not read from the cache.
            output_tokens:
              type: integer
            cache_read_tokens:
              type: [integer, 'null']
              description: '`null` when no record in the period reported cache reads.'
            cache_write_tokens:
              type: [integer, 'null']
              description: '`null` when no record in the period reported cache writes.'
            reasoning_tokens:
              type: integer
            total_tokens:
              type: integer
              description: Input + output + cache reads + cache writes.
            cache_hit_rate:
              type: [number, 'null']
              minimum: 0
              maximum: 1
              description: Cache reads over all input read (fresh input + cache reads); `null` when cache reads are unknown.
            runs:
              type: integer
              description: Runs started in the period.
            unreported_runs:
              type: integer
              description: Runs in the period that reported no usage (every run of a coding agent over ACP; any run of another agent that ended before reporting).
            conversations:
              type: integer
              description: Conversations with at least one run in the period.
            conversations_per_day:
              type: number
              description: The average, over the period's days, of the conversations active that day.
            cost:
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
              description: The hub's price-based estimate (or the provider's figure); `null` when nothing was priced.
            cost_source:
              type: string
              enum: [provider, estimated, unknown]
        by_day:
          type: array
          items:
            $ref: '#/components/schemas/UsageDay'
        by_model:
          type: array
          description: Most tokens first.
          items:
            $ref: '#/components/schemas/UsageModelShare'
        by_agent:
          type: array
          description: Most tokens first; agents that report no usage last.
          items:
            $ref: '#/components/schemas/UsageAgentShare'
    UsageDay:
      type: object
      required:
        [
          date,
          input_tokens,
          output_tokens,
          cache_read_tokens,
          cache_write_tokens,
          total_tokens,
          runs,
          conversations,
          cost,
        ]
      properties:
        date:
          type: string
          format: date
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
        total_tokens:
          type: integer
        runs:
          type: integer
        conversations:
          type: integer
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    UsageModelShare:
      type: object
      required:
        [
          model,
          input_tokens,
          output_tokens,
          cache_read_tokens,
          cache_write_tokens,
          total_tokens,
          share,
          runs,
          cost,
        ]
      properties:
        model:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_tokens:
          type: integer
        cache_write_tokens:
          type: integer
        total_tokens:
          type: integer
        share:
          type: number
          minimum: 0
          maximum: 1
          description: This model's part of all tokens in the report.
        runs:
          type: integer
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    UsageAgentShare:
      type: object
      required:
        [
          agent_id,
          name,
          reports_usage,
          runs,
          conversations,
          input_tokens,
          output_tokens,
          total_tokens,
          share,
          cost,
        ]
      properties:
        agent_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: [string, 'null']
        reports_usage:
          type: boolean
        runs:
          type: integer
        conversations:
          type: integer
        input_tokens:
          type: [integer, 'null']
          description: '`null` when the agent reported no usage — not zero.'
        output_tokens:
          type: [integer, 'null']
        total_tokens:
          type: [integer, 'null']
        share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        cost:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    SkillUsageReport:
      type: object
      required:
        [
          period,
          generated_at,
          profiles,
          counting_since,
          agents,
          totals,
          top_series,
          by_day,
          top_skills,
          never_used,
        ]
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSlug'
        counting_since:
          type: [string, 'null']
          format: date-time
          description: When this hub started recording skill use; earlier use was never recorded.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ActiveAgent'
        totals:
          type: object
          required: [uses, distinct_skills, top_skill, never_used_count]
          properties:
            uses:
              type: integer
            distinct_skills:
              type: integer
            top_skill:
              oneOf:
                - type: object
                  required: [skill, uses]
                  properties:
                    skill:
                      type: string
                    uses:
                      type: integer
                - type: 'null'
            never_used_count:
              type: [integer, 'null']
              description: '`null` when the hub cannot see the installed skills.'
        top_series:
          type: array
          maxItems: 6
          description: The six most used skills of the period, most used first; the series of `by_day`.
          items:
            type: string
        by_day:
          type: array
          items:
            type: object
            required: [date, uses, skills, other]
            properties:
              date:
                type: string
                format: date
              uses:
                type: integer
              skills:
                type: object
                description: Uses that day of each skill in `top_series` (absent means none).
                additionalProperties:
                  type: integer
              other:
                type: integer
                description: Uses that day of every other skill.
        top_skills:
          type: array
          description: Every skill used in the period, most used first.
          items:
            type: object
            required: [skill, uses, share, last_used_at]
            properties:
              skill:
                type: string
              uses:
                type: integer
              share:
                type: number
                minimum: 0
                maximum: 1
              last_used_at:
                $ref: '#/components/schemas/Timestamp'
        never_used:
          type: [array, 'null']
          description: Enabled skills no run loaded in the period, by name; `null` when unknown.
          items:
            type: string
    HubPlugin:
      type: object
      required: [id, slug, name, version, kind, status, url, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        slug:
          type: string
        name:
          type: string
        version:
          type: string
        kind:
          type: string
          enum: [docker, mcp]
        status:
          type: string
          enum: [running, stopped, error]
        url:
          type: [string, 'null']
