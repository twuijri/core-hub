# openapi-generator config for the Kotlin client (Android).
generatorName: kotlin
packageName: hub.core.client
apiPackage: hub.core.client.api
modelPackage: hub.core.client.model
artifactId: corehub-client
groupId: hub.core
additionalProperties:
  library: jvm-okhttp4
  serializationLibrary: kotlinx_serialization
  dateLibrary: java8
  enumPropertyNaming: UPPERCASE
  omitGradleWrapper: true
  useCoroutines: true
# A free-form value (`{}` / `additionalProperties: true`) is kept as the JSON it is: kotlinx
# has no serializer for `kotlin.Any`, and the hub sends tool arguments and settings this way.
typeMappings:
  AnyType: JsonElement
importMappings:
  JsonElement: kotlinx.serialization.json.JsonElement
