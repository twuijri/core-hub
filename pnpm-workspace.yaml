packages:
  - packages/*
  - apps/*

# pnpm >= 10 blocks dependency install scripts unless listed here.
# better-sqlite3 needs its native binding; esbuild only validates its binary.
# openapi-generator-cli downloads its jar lazily on first run, no install script needed.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  argon2: true
  '@openapitools/openapi-generator-cli': false
